<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7fe0"><title>IUT Tycoon Reims</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== css/base.css ===== */
/*
 * Base : jetons de couleur, typographie, remise à zéro et boutons.
 * Style « jouet » : contours épais couleur encre et ombres pleines décalées vers le bas.
 * Thème unique assumé : c'est le monde du jeu, il ne suit pas le mode sombre du système.
 */
:root {
  --ink: #1c2541;
  --ink-soft: #56607f;
  --paper: #ffffff;
  --paper-2: #eef3fa;
  --line: #cfd8e6;
  --coin: #ffc233;
  --coin-dk: #c98a00;
  --go: #35c46b;
  --go-dk: #1f8a47;
  --blue: #2f7fe0;
  --hot: #ff6a3d;
  --sky: #a6dcff;
  --off: #c9d1de;
  --off-ink: #6b7590;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

html, body { height: 100%; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 700;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#app { position: fixed; inset: 0; overflow: hidden; }

#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#world.drag { cursor: grabbing; }
#world.hot { cursor: pointer; }

@keyframes pulse { 50% { transform: scale(1.05); } }
@keyframes pop { from { transform: scale(.92); opacity: .4; } }

/* ---------- Textes utilitaires ---------- */
.eyebrow { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.kind { margin: 3px 0 0; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.small { font-size: 13.5px !important; color: var(--ink-soft); }
.sec { margin: 16px 0 8px; }

/* ---------- Barre de progression ---------- */
.bar { height: 12px; border-radius: 99px; background: var(--paper-2); border: 2px solid var(--ink); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(180deg, #7ee39f, var(--go)); border-radius: 99px; transition: width .25s; }
.bar.thin { height: 7px; border-width: 1.5px; margin-top: 8px; }

/* ---------- Boutons ---------- */
.btn {
  font: inherit; font-weight: 900; font-size: 15px;
  border: 3px solid var(--ink); border-radius: 14px; padding: 9px 14px;
  cursor: pointer; background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s, background .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.1;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.btn.go { background: var(--go); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.btn.blue { background: var(--blue); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.btn.coin { background: var(--coin); color: var(--ink); }
.btn.hot { background: var(--hot); color: #fff; }
.btn:disabled { background: var(--off); color: var(--off-ink); cursor: not-allowed; text-shadow: none; }
.btn.big { width: 100%; flex-direction: column; gap: 3px; padding: 10px 14px; margin-top: 10px; }
.btn.big .l1 { font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .3px; }
.btn.big .l2 { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.btn.sm { font-size: 13px; padding: 6px 10px; border-radius: 11px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.coin-i { width: 18px; height: 18px; display: inline-block; flex: none; }
.m-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }

/* ---------- Sélecteur segmenté (×1 / ×10 / Max, onglets) ---------- */
.seg { display: flex; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; font: inherit; font-weight: 900; font-size: 13px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-soft); padding: 6px 4px; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--blue); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== css/hud.css ===== */
/* HUD : bandeau du haut (argent, étudiants, diplômés, boutons), objectif, saison, choix du site, bouton musique. */
.hud {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 5;
}
.hud > * { pointer-events: auto; }

.chip {
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  padding: 5px 12px 5px 7px; min-height: 48px; box-sizing: border-box;
}
.brand { padding: 5px 14px 5px 8px; }
.brand .name { font-family: var(--f-display); font-size: 21px; line-height: 1; letter-spacing: .3px; }
.brand small { display: block; font-weight: 800; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 3px; }
.ico { width: 30px; height: 30px; flex: none; display: block; }
.stat .val { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .sub { display: block; font-size: 11.5px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; margin-top: 2px; font-variant-numeric: tabular-nums; }
.money { min-width: 150px; }
.actions { margin-left: auto; display: flex; gap: 8px; }
.ibtn { min-height: 48px; padding: 6px 12px; }
.ibtn svg { width: 22px; height: 22px; }

[data-tip] { cursor: help; }
[data-tip]:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Bandeaux temporaires : événement en cours et Journée portes ouvertes */
.hud-sub {
  position: absolute; top: calc(76px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 5; pointer-events: none;
}
.hud-sub > * { pointer-events: auto; }
.boost { background: var(--coin); font-family: var(--f-display); font-size: 17px; padding: 5px 12px; animation: pulse 1s ease-in-out infinite; }
.boost b { font-weight: 400; font-variant-numeric: tabular-nums; }
.evt { background: #dff3ff; font-family: var(--f-display); font-size: 15px; padding: 5px 12px; }
.evt.bad { background: #ffe3da; }
.evt b { font-weight: 400; font-variant-numeric: tabular-nums; }

/* Carte d'objectif */
.obj {
  position: absolute; left: 16px; top: calc(76px + env(safe-area-inset-top, 0px));
  width: 300px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink);
  padding: 10px 14px 12px; z-index: 4;
}
.obj-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.obj-rew { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.obj p { margin: 4px 0 8px; font-size: 14.5px; font-weight: 800; line-height: 1.3; text-wrap: balance; }
.obj .prog { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* Saison, sites, musique (bas de l'écran) */
.season {
  position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(28, 37, 65, .78); color: #fff; font-size: 12.5px; font-weight: 800;
  padding: 6px 12px; border-radius: 99px; z-index: 3;
}
.sites {
  position: absolute; left: 16px; bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 3px 0 var(--ink); padding: 3px; z-index: 4;
}
.site-b { font: inherit; font-weight: 900; font-size: 12.5px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.site-b.on { background: var(--ink); color: #fff; }
.site-b.lock { color: var(--off-ink); }
.site-b:focus-visible { outline: 2px solid var(--blue); }
.fab { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; padding: 0; border-radius: 50%; z-index: 5; }
.fab svg { width: 24px; height: 24px; }
.fab.off { background: var(--paper-2); color: var(--off-ink); }

/* Bouton Boutique (avec le nombre de pépites) et bouton des colis */
.shop-b span { font-family: var(--f-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; display: inline !important; }
.shop-b { background: #e7f7ff; }
.chest-fab { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--coin); animation: pulse 1.4s ease-in-out infinite; }
.chest-fab svg { width: 30px; height: 30px; }
.badge {
  position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 99px;
  background: var(--hot); color: #fff; border: 2.5px solid var(--ink); font-family: var(--f-display); font-size: 13px; line-height: 17px; text-align: center;
}
.site-b.done::after { content: " ✓"; color: var(--go-dk); }
.site-b.on.done::after { color: #9ff0b8; }

/* ===== css/sheets.css ===== */
/* Fiches latérales : bâtiment, campus, palmarès, diplômes. */
.sheet {
  position: absolute; right: 16px; top: calc(76px + env(safe-area-inset-top, 0px));
  width: 352px; max-height: calc(100% - 96px - env(safe-area-inset-top, 0px)); overflow: auto; box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
  padding: 14px 16px 18px; z-index: 6; animation: pop .22s cubic-bezier(.2, 1.4, .4, 1);
}

/* En-têtes */
.sh-head { display: flex; gap: 10px; align-items: center; }
.sh-title { flex: 1; min-width: 0; }
.sh-title h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.05; text-wrap: balance; }
.campus-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.campus-head h2 { flex: 1; margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.tag {
  --c: #2f7fe0; flex: none; display: inline-grid; place-items: center; min-width: 52px; height: 52px; padding: 0 6px; box-sizing: border-box;
  border-radius: 14px; border: 3px solid var(--ink); background: var(--c); color: #fff;
  font-family: var(--f-display); font-size: 15px; letter-spacing: .3px; text-shadow: 0 2px 0 rgba(0, 0, 0, .25);
}
.tag.sm { min-width: 44px; height: 36px; font-size: 12px; border-radius: 10px; border-width: 2px; }
.x { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper-2); cursor: pointer; display: grid; place-items: center; color: var(--ink); padding: 0; }
.x svg { width: 16px; height: 16px; }
.x:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Fiche bâtiment */
.desc { margin: 10px 0 12px; font-size: 14px; line-height: 1.45; color: var(--ink-soft); font-weight: 700; }
.rec-note { margin: -4px 0 12px; background: #fff3cf; border: 2px solid var(--coin); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 800; line-height: 1.35; }
.lvl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.lvl { font-family: var(--f-display); font-size: 19px; }
.lvl b { font-weight: 400; font-variant-numeric: tabular-nums; }
.mile { font-size: 12.5px; font-weight: 900; color: var(--go-dk); text-align: right; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 10px; }
.stats div { background: var(--paper-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stats .wide { grid-column: 1 / -1; }
.stats dt { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stats dd { margin: 2px 0 0; font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.gain { margin: 8px 0 0; text-align: center; font-size: 13px; font-weight: 900; color: var(--go-dk); min-height: 1.2em; font-variant-numeric: tabular-nums; }
.mgr { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 2px dashed var(--line); }
.avatar { --c: #2f7fe0; flex: none; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); overflow: hidden; }
.avatar svg { width: 100%; height: 100%; display: block; }
.mgr-t { flex: 1; min-width: 0; }
.mgr-t b { display: block; font-size: 15px; font-weight: 900; }
.mgr-t small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.3; }
.mgr .btn { font-size: 13px; padding: 8px 10px; white-space: nowrap; }
.talent { color: var(--blue) !important; font-weight: 800 !important; margin-top: 3px; }
.build-box p { font-size: 14px; line-height: 1.45; margin: 0; }
.need { margin-top: 8px !important; text-align: center; font-weight: 900; color: var(--hot); font-size: 13px !important; min-height: 1.2em; font-variant-numeric: tabular-nums; }

/* Listes (campus, conseil pédagogique, défis) */
.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 12px; }
.row-main:hover { background: var(--paper-2); }
.row-main:focus-visible { outline: 2px solid var(--blue); }
.row.locked .tag { filter: grayscale(1) opacity(.55); }
.row.rec .tag { box-shadow: 0 0 0 3px var(--coin); }
.rn { min-width: 0; }
.rn b { display: block; font-size: 14px; font-weight: 900; line-height: 1.15; hyphens: auto; overflow-wrap: anywhere; }
.rn small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 800; font-variant-numeric: tabular-nums; }
.camp-pal { margin: 0 0 10px; font-size: 12.5px; font-weight: 900; color: var(--go-dk); line-height: 1.35; }
.auto-row:empty { display: none; }
.auto-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; background: var(--paper-2); border-radius: 12px; padding: 6px 8px 6px 12px; margin-bottom: 10px; font-size: 12.5px; font-weight: 800; }
.deco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.deco-b { flex-direction: column; align-items: flex-start; text-align: left; box-shadow: 0 3px 0 var(--ink); }
.deco-b small { font-weight: 800; font-size: 11.5px; opacity: .85; font-variant-numeric: tabular-nums; }
.node { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper-2); }
.node .rn { flex: 1; }
.node .rn small { line-height: 1.3; }
.node .lv { font-family: var(--f-display); font-weight: 400; color: var(--blue); font-size: 13px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.node.maxed { background: #e9f8ee; border-color: var(--go); }
.br { margin: 14px 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 16px; color: var(--ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; background: var(--paper-2); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
.kv b { font-family: var(--f-display); font-weight: 400; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }

/* Palmarès : onglets, succès, cartes, graphique, classement */
.tabs { margin-bottom: 4px; flex-wrap: wrap; }
.tabs button { flex: 1 0 auto; }
.tabs button span { font-variant-numeric: tabular-nums; opacity: .8; }
.ach-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper-2); }
.ach .medal { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--off); display: grid; place-items: center; }
.ach .medal svg { width: 22px; height: 22px; }
.ach div { min-width: 0; }
.ach b { display: block; font-size: 14px; font-weight: 900; line-height: 1.2; }
.ach small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.3; }
.ach.locked b { color: var(--off-ink); }
.ach.locked .medal svg { opacity: .45; }
.ach.got { background: #fff7dc; border-color: var(--ink); }
.ach.got .medal { background: var(--coin); }
.cards { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper-2); }
.card.r2 { border-color: #7fb6ff; background: #eef5ff; }
.card.r3 { border-color: var(--coin); background: #fff6d9; }
.card.locked { opacity: .6; }
.card .av { --c: #9aa3b8; flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-size: 16px; text-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.card div { min-width: 0; }
.card b { display: block; font-size: 14px; font-weight: 900; }
.card small { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.3; }
.card .cb { color: var(--go-dk); font-weight: 900; }
.new { font-size: 10px; background: var(--hot); color: #fff; border-radius: 99px; padding: 1px 6px; vertical-align: middle; }
.chart { width: 100%; height: auto; display: block; background: var(--paper-2); border-radius: 12px; }
.pseudo { margin: 12px 0; }
.pseudo label { display: block; font-size: 12px; font-weight: 900; color: var(--ink-soft); margin-bottom: 5px; }
.pseudo-row { display: flex; gap: 8px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper-2); }
.lb-row.me { border-color: var(--ink); background: #fff7dc; }
.lb-rank { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-family: var(--f-display); font-size: 14px; }
.lb-row:nth-child(1) .lb-rank { background: var(--coin); color: var(--ink); }
.lb-who { flex: 1; min-width: 0; }
.lb-who b { display: block; font-size: 14px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-who small { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
.lb-val { font-family: var(--f-display); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lb-note { margin: 10px 0 0 !important; }

/* Label d'excellence, ville terminée, branches verrouillées */
.goal { background: #eef6ff; border: 2px solid var(--blue); border-radius: 14px; padding: 10px 12px; margin: 0 0 12px; }
.goal b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.goal p { margin: 3px 0 6px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); line-height: 1.35; }
.goal.done { background: #e9f8ee; border-color: var(--go); }
.frozen { margin: 0 0 12px; background: #fff3cf; border: 2px solid var(--coin); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 800; line-height: 1.35; }
.br small { font-family: var(--f-body); font-weight: 800; font-size: 12px; color: var(--hot); margin-left: 6px; }
.list.locked { opacity: .5; pointer-events: none; }
.palmes { background: #fff6d9; border: 2px solid var(--coin); }

/* Boutique */
.gems-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #e7f7ff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; }
.gems-row b { font-family: var(--f-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.shop-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper-2); }
.shop-item .rn { flex: 1; }
.shop-item .rn small { line-height: 1.3; }
.shop-item.sold { background: #e9f8ee; border-color: var(--go); }
.gem-i { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; }

/* Ouverture d'un colis */
.loot { text-align: center; }
.loot .loot-box { width: 96px; height: 96px; margin: 0 auto 6px; animation: shake .6s ease-in-out 1, pop .4s .6s cubic-bezier(.2, 1.4, .4, 1) 1; }
.loot b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; margin-top: 4px; }
.loot p { font-size: 15px; font-weight: 800; }
@keyframes shake { 20%, 60% { transform: rotate(-8deg); } 40%, 80% { transform: rotate(8deg); } }

/* ===== css/overlays.css ===== */
/* Superpositions : notifications, fenêtre modale, infobulles, champs de formulaire. */
.toasts {
  position: absolute; left: 50%; transform: translateX(-50%); top: calc(132px + env(safe-area-inset-top, 0px));
  display: grid; gap: 8px; justify-items: center; z-index: 8; pointer-events: none; width: min(420px, calc(100% - 32px));
}
.toast { background: var(--ink); color: #fff; border-radius: 14px; padding: 9px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); animation: tin .3s cubic-bezier(.2, 1.4, .4, 1); text-align: center; line-height: 1.3; }
.toast.gold { background: var(--coin); color: var(--ink); border: 3px solid var(--ink); }
.toast.out { transition: opacity .4s, transform .4s; opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { transform: translateY(-12px) scale(.9); opacity: 0; } }

.modal { position: absolute; inset: 0; background: rgba(18, 26, 52, .55); display: grid; place-items: center; z-index: 20; padding: 16px; box-sizing: border-box; }
.modal-card { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); width: min(460px, 100%); max-height: calc(100% - 24px); overflow: auto; padding: 22px 22px 20px; box-sizing: border-box; animation: pop .25s cubic-bezier(.2, 1.4, .4, 1); }
.modal-card h2 { margin: 0 0 10px; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.05; text-wrap: balance; }
.modal-card p { margin: 0 0 10px; line-height: 1.5; font-size: 15px; }
.modal-card ul { margin: 0 0 10px; padding-left: 20px; line-height: 1.5; font-size: 14.5px; }
.modal-card li { margin-bottom: 5px; }
.m-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.big-num { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--f-display); font-size: 34px; margin: 10px 0 14px; font-variant-numeric: tabular-nums; }
.big-num svg { width: 38px; height: 38px; }
.opt { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 15px; margin: 6px 0 12px; cursor: pointer; }
.opt input { width: 22px; height: 22px; accent-color: var(--go); }
/* curseurs de volume (musique, bruitages) */
.opt.vol span { flex: 0 0 118px; }
.opt.vol input { flex: 1; width: auto; height: 22px; min-width: 0; }
.opt.vol b { flex: 0 0 52px; text-align: right; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.pseudo input, .modal textarea {
  flex: 1; min-width: 0; font: inherit; font-weight: 800; font-size: 14px;
  border: 2px solid var(--ink); border-radius: 11px; padding: 7px 10px; background: var(--paper); color: var(--ink); box-sizing: border-box;
}
.modal textarea { width: 100%; font-size: 12px; font-weight: 700; font-family: ui-monospace, Consolas, monospace; resize: vertical; margin: 6px 0 8px; user-select: text; -webkit-user-select: text; }
.pseudo input:focus-visible, .modal textarea:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }

.tip { position: fixed; z-index: 40; max-width: 280px; box-sizing: border-box; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 12px; font-size: 12.5px; font-weight: 700; line-height: 1.4; box-shadow: 0 6px 18px rgba(18, 26, 52, .35); pointer-events: none; }
.tip .tt { display: block; font-family: var(--f-display); font-weight: 400; font-size: 16px; margin-bottom: 4px; color: var(--coin); }
.tip .tr { display: flex; justify-content: space-between; gap: 14px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.tip .tr span { color: #c9d2ea; }
.tip .tr b { font-weight: 900; white-space: nowrap; }
.tip .tr.tot { border-top: 1px solid rgba(255, 255, 255, .2); margin-top: 4px; padding-top: 5px; }
.tip .te { display: block; color: #fff; font-weight: 800; }
.tip .tn { display: block; margin-top: 6px; color: #aeb8d6; font-size: 12px; }

/* ===== css/stack.css ===== */
/* Pile du bas de l'écran : pose de décoration, décision à prendre, conseils de Plume. */
.stack {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(470px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 10px; z-index: 7; pointer-events: none;
}
.stack > * { pointer-events: auto; }

.placing { display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 13.5px; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.placing span { flex: 1; min-width: 0; }

.decision { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 12px 14px; animation: pop .25s cubic-bezier(.2, 1.4, .4, 1); }
.dec-top { display: flex; justify-content: space-between; align-items: center; }
.dec-t { font-family: var(--f-display); font-size: 15px; color: var(--hot); font-variant-numeric: tabular-nums; }
.decision h3 { margin: 2px 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.decision p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.4; }
.dec-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dec-opt { flex-direction: column; align-items: flex-start; text-align: left; padding: 8px 10px; font-size: 14px; min-width: 0; }
.dec-opt small { font-weight: 700; font-size: 11.5px; line-height: 1.3; opacity: .92; white-space: normal; }
.decision .dec-def { margin: 6px 0 0; font-size: 11.5px; }

.mascot { display: flex; align-items: flex-end; gap: 6px; animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }
.owl { flex: none; width: 84px; height: 96px; margin-bottom: -6px; filter: drop-shadow(0 3px 0 rgba(28, 37, 65, .25)); }
.owl svg { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; }
.owl .eyes { transform-origin: 40px 43px; animation: blink 5s infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 10px 14px 12px; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 22px; width: 16px; height: 16px; background: var(--paper); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
.bubble b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.15; margin: 2px 0 4px; }
.bubble p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; font-weight: 700; }

/* Mission chronométrée */
.mission { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 8px 10px 8px 12px; animation: pop .25s cubic-bezier(.2, 1.4, .4, 1); }
.mission .m-body { flex: 1; min-width: 0; }
.mission .m-who { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.mission .m-text { margin: 1px 0 4px; font-size: 14px; font-weight: 900; line-height: 1.25; }
.mission .m-prog { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.mission .bar { margin-top: 3px; }
.mission .x { width: 30px; height: 30px; border-width: 2px; border-radius: 9px; }
.mission .x svg { width: 12px; height: 12px; }

/* Barre des capacités */
.abilities { display: flex; justify-content: center; gap: 10px; }
.abilities:empty { display: none; }
.ab {
  --p: 0; position: relative; flex: 0 1 196px; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 6px 10px 6px 6px; border-radius: 16px; font-size: 13px; line-height: 1.15;
}
.ab .ab-ico {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center;
  background: conic-gradient(rgba(28, 37, 65, .55) calc(var(--p) * 1turn), var(--coin) 0);
  font-family: var(--f-display); font-weight: 400; font-size: 13px; color: var(--ink);
}
.ab .ab-ico svg { width: 20px; height: 20px; }
.ab .ab-t { min-width: 0; }
.ab b { display: block; font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab small { display: block; font-size: 11px; font-weight: 800; opacity: .85; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ab.ready { background: #fff3cf; animation: pulse 1.6s ease-in-out infinite; }
.ab.ready .ab-ico { background: var(--coin); }
.ab.active { background: var(--go); color: #fff; }
.ab.locked { opacity: .55; }
.dec-wait { color: var(--hot); } .dec-opt:disabled .dec-wait { color: var(--hot); } .dec-wait:empty { display: none; }

/* ===== css/tutorial.css ===== */
/*
 * Tutoriel guidé (ui/tutorial.js) : tout est verrouillé sauf la cible, entourée d'un halo doré,
 * le reste de l'écran assombri ; la carte de Plume se place à côté sans la cacher.
 */
#app.tuto-lock * { pointer-events: none !important; }
#app.tuto-lock .tuto-target, #app.tuto-lock .tuto-target * { pointer-events: auto !important; }
#app.tuto-lock.tuto-canvas #world { pointer-events: auto !important; }
#app.tuto-lock #bMusic { pointer-events: auto !important; }

#tuto { position: fixed; inset: 0; z-index: 9000; pointer-events: none; }
#tuto.closing { opacity: 0; transition: opacity .35s; }

.tuto-dim { position: absolute; inset: 0; background: rgba(8,12,30,.55); opacity: 0; transition: opacity .35s; }
/* quatre panneaux sombres autour de la cible */
.tuto-shade { position: absolute; left: 0; top: 0; width: 0; height: 0; background: rgba(8,12,30,.58); opacity: 0; transition: opacity .3s; }
#tuto.has-ring .tuto-shade { opacity: 1; }
#tuto.dim-all .tuto-dim { opacity: 1; }

/* halo autour de la cible : son ombre géante assombrit tout le reste */
.tuto-ring { position: absolute; left: 0; top: 0; border: 3px solid #ffc233; border-radius: 16px; opacity: 0;
  box-shadow: 0 0 0 6px rgba(255,194,51,.35), 0 0 28px 6px rgba(255,194,51,.55); transition: opacity .3s; }
#tuto.has-ring .tuto-ring { opacity: 1; animation: tutoGlow 1.4s ease-in-out infinite; }
.tuto-hand { position: absolute; left: 0; top: 0; width: 40px; height: 40px; opacity: 0; transition: opacity .3s; }
.tuto-hand svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); animation: tutoPoint .9s ease-in-out infinite; }
.tuto-hand.up svg { rotate: 180deg; }
#tuto.has-ring .tuto-hand { opacity: 1; }
#tuto.enter .tuto-ring { animation: tutoRingIn .45s cubic-bezier(.2,1.3,.4,1), tutoGlow 1.4s .45s ease-in-out infinite; }

/* geste à faire sur la carte : un doigt qui glisse, ou deux qui s'écartent */
.tuto-gesture { position: absolute; left: 50%; top: 46%; width: 0; height: 0; display: none; }
.tuto-gesture[data-g="drag"], .tuto-gesture[data-g="zoom"] { display: block; }
.g-dot { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.85);
  border: 3px solid var(--ink); box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 6px 14px rgba(0,0,0,.25); }
.g-dot.b { display: none; }
.tuto-gesture[data-g="drag"] .g-dot { animation: tutoDrag 1.8s ease-in-out infinite; }
.tuto-gesture[data-g="zoom"] .g-dot { animation: tutoPinchA 1.6s ease-in-out infinite; }
.tuto-gesture[data-g="zoom"] .g-dot.b { display: block; animation-name: tutoPinchB; }

/* carte de Plume */
.tuto-card { position: absolute; left: 0; top: 0; box-sizing: border-box; width: min(430px, calc(100vw - 24px)); display: flex; gap: 12px; align-items: flex-start;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink), 0 18px 40px rgba(0,0,0,.3);
  padding: 14px 16px 14px 12px; pointer-events: auto; transition: transform .25s cubic-bezier(.3,1.2,.4,1), border-color .3s; }
#tuto.enter .tuto-card .tuto-body { animation: tutoText .4s ease-out; }
.tuto-owl { flex: none; width: 64px; animation: tutoBob 2.4s ease-in-out infinite; }
.tuto-owl svg { width: 100%; height: auto; display: block; }
.tuto-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tuto-step { color: var(--blue); }
.tuto-title { font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.1; }
.tuto-text { margin: 0; font-size: 14.5px; line-height: 1.42; color: var(--ink-soft); }
.tuto-bar { height: 7px; margin-top: 6px; border-radius: 99px; background: var(--paper-2); border: 2px solid var(--ink); overflow: hidden; }
.tuto-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--go), #7fe0a0); transition: width .5s; }
.tuto-btn { align-self: flex-end; margin-top: 8px; }
.tuto-card.success { border-color: var(--go-dk); }
.tuto-card.success .tuto-title { color: var(--go-dk); }
.tuto-card.success .tuto-owl { animation: tutoHop .5s ease-out; }

@keyframes tutoGlow { 0%, 100% { box-shadow: 0 0 0 6px rgba(255,194,51,.3), 0 0 22px 4px rgba(255,194,51,.45); }
  50% { box-shadow: 0 0 0 10px rgba(255,194,51,.15), 0 0 38px 10px rgba(255,194,51,.75); } }
@keyframes tutoRingIn { from { scale: 1.35; opacity: 0; } to { scale: 1; opacity: 1; } }
@keyframes tutoPoint { 0%, 100% { translate: 0 0; } 50% { translate: 0 9px; } }
@keyframes tutoDrag { 0% { transform: translate(-70px, 0) scale(1); opacity: 0; } 15% { opacity: 1; transform: translate(-70px, 0) scale(.85); }
  70% { transform: translate(70px, 0) scale(.85); opacity: 1; } 100% { transform: translate(70px, 0) scale(1); opacity: 0; } }
@keyframes tutoPinchA { 0%, 100% { transform: translate(-14px, 14px); } 50% { transform: translate(-60px, 60px); } }
@keyframes tutoPinchB { 0%, 100% { transform: translate(14px, -14px); } 50% { transform: translate(60px, -60px); } }
@keyframes tutoText { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes tutoBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes tutoHop { 0% { transform: translateY(0); } 40% { transform: translateY(-12px) rotate(-6deg); } 100% { transform: none; } }

@media (max-width: 640px) {
  .tuto-owl { width: 48px; }
  .tuto-title { font-size: 18.5px; }
  .tuto-text { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .tuto-ring, .tuto-hand svg, .tuto-owl, .g-dot { animation: none !important; }
}

/* ===== css/cinematic.css ===== */
/*
 * Cinématique d'introduction (ui/cinematic.js) : écran de départ, bandes « cinéma », étalonnage par plan,
 * légendes animées, passage au noir, logo final.
 */
#app.cine-mode > :not(canvas) { display: none !important; }

#cine { position: fixed; inset: 0; z-index: 10000; overflow: hidden; color: #fff; pointer-events: none; transition: opacity .6s; }
#cine.closing { opacity: 0; }
#cine button { pointer-events: auto; }

/* étalonnage : une couleur par ambiance, fondue dans l'image */
.cine-grade, .cine-flare, .cine-vignette, .cine-fade, .cine-flash { position: absolute; inset: 0; }
.cine-grade { mix-blend-mode: soft-light; opacity: .85; }
#cine[data-grade="dawn"] .cine-grade { background: linear-gradient(180deg, #e8804a 0%, #c99a6a 45%, #5a4cc0 100%); opacity: .5; }
#cine[data-grade="day"] .cine-grade { background: linear-gradient(180deg, #f5dfa0 0%, transparent 55%, #6fb4ef 100%); opacity: .35; }
#cine[data-grade="gold"] .cine-grade { background: linear-gradient(160deg, #e6a043 0%, #d27a33 55%, #a8552b 100%); opacity: .5; }
#cine[data-grade="dusk"] .cine-grade { background: linear-gradient(180deg, #d9603c 0%, #a8407a 50%, #2f1f6a 100%); opacity: .45; }
#cine[data-grade="night"] .cine-grade { background: linear-gradient(180deg, #24357d 0%, #101a44 100%); opacity: .5; }
/* soleil bas dans un coin pour les plans de jour */
.cine-flare { opacity: 0; mix-blend-mode: screen; transition: opacity .4s;
  background: radial-gradient(circle at 88% 8%, rgba(255,244,200,.7) 0, rgba(255,214,120,.3) 9%, rgba(255,180,90,.08) 26%, transparent 46%); }
#cine[data-grade="dawn"] .cine-flare, #cine[data-grade="gold"] .cine-flare, #cine[data-grade="dusk"] .cine-flare { opacity: 1; }
#cine[data-grade="dusk"] .cine-flare { background: radial-gradient(circle at 12% 14%, rgba(255,210,170,.9) 0, rgba(255,120,90,.35) 12%, transparent 40%); }
.cine-vignette { background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(8,10,28,.5) 100%); }

/* bandes noires du format cinéma */
.cine-bar { position: absolute; left: 0; right: 0; height: 0; background: #05060f; transition: height 1.2s cubic-bezier(.7,0,.2,1); }
.cine-bar.top { top: 0; } .cine-bar.bottom { bottom: 0; }
#cine.playing .cine-bar { height: 11vh; }
#cine.logo-on .cine-bar { height: 0; }

.cine-fade { background: #05060f; opacity: 0; }
.cine-flash { background: #fffbe8; opacity: 0; }

/* légendes : surtitre doré et titre dont les mots montent un par un */
.cine-cap { position: absolute; left: max(6vw, 20px); right: 20px; bottom: calc(11vh + 5vh); text-shadow: 0 3px 18px rgba(0,0,0,.55); }
.cine-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-weight: 900; font-size: clamp(12px, 1.6vw, 16px);
  letter-spacing: .28em; text-transform: uppercase; color: #ffd35c; opacity: 0; transform: translateX(-16px); transition: opacity .5s, transform .7s; }
.cine-eyebrow::before { content: ""; width: 42px; height: 3px; border-radius: 2px; background: currentColor; }
.cine-title { margin: 8px 0 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6.4vw, 84px); line-height: 1.02; letter-spacing: .5px; }
.cine-title > span { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .08em; }
.cine-title i { display: inline-block; font-style: normal; transform: translateY(110%) rotate(6deg); transition: transform .75s cubic-bezier(.2,.9,.25,1.15); transition-delay: calc(var(--i) * 90ms + 120ms); }
.cine-cap.show .cine-eyebrow { opacity: 1; transform: none; }
.cine-cap.show .cine-title i { transform: none; }
.cine-cap.out .cine-title i { transition-duration: .35s; transition-delay: 0s; transform: translateY(-110%); }
.cine-cap.out .cine-eyebrow { transition-duration: .3s; opacity: 0; }

/* écran de départ */
.cine-start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 24px; text-align: center; pointer-events: auto;
  background: radial-gradient(ellipse at 50% 40%, rgba(28,37,65,.45) 0%, rgba(6,8,22,.92) 75%); transition: opacity .7s, visibility .7s; }
#cine.playing .cine-start { opacity: 0; visibility: hidden; }
.cine-kicker { margin: 0; font-weight: 900; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: #ffd35c; animation: cineRise .9s .1s both; }
.cine-ask { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 7vw, 76px); line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,.5); animation: cineRise .9s .25s both; }
.cine-pitch { margin: 0 0 18px; max-width: 520px; font-size: clamp(15px, 2vw, 19px); color: #dfe6ff; animation: cineRise .9s .4s both; }
.cine-play { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px 16px 22px; border: 3px solid var(--ink); border-radius: 999px;
  background: linear-gradient(180deg, #ffd65a, #ffb21f); color: var(--ink); font: 400 24px var(--f-display); cursor: pointer;
  box-shadow: 0 6px 0 var(--ink), 0 0 40px rgba(255,194,51,.45); animation: cineRise .9s .55s both; }
.cine-play svg { width: 30px; height: 30px; }
.cine-play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.cine-play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.cine-ring { position: absolute; inset: -10px; border-radius: inherit; border: 3px solid rgba(255,214,90,.7); animation: cinePulse 1.8s ease-out infinite; pointer-events: none; }
.cine-hint { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 14px; color: #aab6dc; animation: cineRise .9s .7s both; }
.cine-hint svg { width: 18px; height: 18px; }

.cine-skip { position: absolute; right: 18px; top: max(8px, calc((11vh - 36px) / 2)); padding: 8px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.45);
  background: rgba(5,6,15,.45); color: #fff; font: 800 13px var(--f-body); letter-spacing: .04em; cursor: pointer; opacity: .8; transition: opacity .3s; }
.cine-skip:hover, .cine-skip:focus-visible { opacity: 1; }
#cine:not(.playing) .cine-skip { top: 18px; }
#cine.logo-on .cine-skip { opacity: 0; visibility: hidden; }

/* logo final */
.cine-logo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
  background: radial-gradient(ellipse at 50% 48%, rgba(10,14,40,.18) 0%, rgba(6,8,22,.72) 80%); opacity: 0; visibility: hidden; transition: opacity .5s; }
#cine.logo-on .cine-logo { opacity: 1; visibility: visible; }
.cine-crest { width: clamp(84px, 13vw, 132px); filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
.cine-crest svg { width: 100%; height: auto; display: block; }
.cine-word { position: relative; z-index: 0; margin: -6px 0 0; display: flex; flex-direction: column; align-items: center; line-height: .86; font-family: var(--f-display); font-weight: 400; }
.cine-iut { font-size: clamp(30px, 5.4vw, 64px); letter-spacing: .3em; padding-left: .3em; color: #fff; text-shadow: 0 4px 0 var(--ink), 0 8px 24px rgba(0,0,0,.5); }
.cine-ty { position: relative; display: inline-block; font-size: clamp(76px, 15vw, 190px); letter-spacing: 1px; }
/* deux couches : contour épais et ombre derrière, dégradé doré devant (avec un reflet qui passe) */
.ty-back { position: absolute; inset: 0; color: var(--ink); -webkit-text-stroke: 14px var(--ink); text-shadow: 0 10px 0 var(--ink), 0 22px 40px rgba(0,0,0,.55); }
.ty-front { position: relative; color: transparent; background: linear-gradient(100deg, #ffe07a 0%, #ffb21f 38%, #fff7cf 48%, #ffb21f 58%, #ff9124 100%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; animation: cineShine 3.6s 1.4s ease-in-out infinite; }
.cine-sub { margin: 14px 0 0; font-weight: 900; font-size: clamp(12px, 1.7vw, 16px); letter-spacing: .22em; text-transform: uppercase; color: #ffd35c; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.cine-tag { margin: 8px 0 0; max-width: 560px; font-size: clamp(15px, 2.1vw, 20px); color: #f1f4ff; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
#cine .cine-go { width: auto; margin-top: 26px; padding: 14px 34px; font: 400 24px var(--f-display); box-shadow: 0 6px 0 var(--ink), 0 0 36px rgba(53,196,107,.5); }
/* entrée du logo, au moment de l'impact musical */
#cine.logo-on .cine-crest { animation: cineDrop .9s .05s cubic-bezier(.2,1.4,.4,1) both; }
#cine.logo-on .cine-iut { animation: cineRise .7s .15s both; }
#cine.logo-on .cine-ty { animation: cineSlam .8s .05s cubic-bezier(.15,1.5,.35,1) both; }
#cine.logo-on .cine-sub { animation: cineRise .8s .9s both; }
#cine.logo-on .cine-tag { animation: cineRise .8s 1.15s both; }
#cine.logo-on .cine-go { animation: cineRise .8s 1.6s both, cineGlow 2s 2.4s ease-in-out infinite; }

@keyframes cineRise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes cineDrop { from { opacity: 0; transform: translateY(-60px) scale(.6); } to { opacity: 1; transform: none; } }
@keyframes cineSlam { 0% { opacity: 0; transform: scale(2.4); filter: blur(10px); } 60% { opacity: 1; filter: blur(0); } 100% { transform: scale(1); } }
@keyframes cineShine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes cinePulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
@keyframes cineGlow { 0%, 100% { box-shadow: 0 6px 0 var(--ink), 0 0 26px rgba(53,196,107,.35); } 50% { box-shadow: 0 6px 0 var(--ink), 0 0 50px rgba(53,196,107,.8); } }

/* écran de fin de l'aventure (ui/ending.js) : la mise en scène du logo, avec le bilan de la partie */
.end-card { overflow-y: auto; justify-content: safe center; }
#cine.logo-on .end-card { pointer-events: auto; }
.end-word .cine-iut { font-size: clamp(22px, 3.6vw, 44px); }
.end-word .cine-ty { font-size: clamp(52px, 11vw, 150px); }
.end-kicker { margin: 6px 0 12px; }
.end-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(700px, 100%); margin: 20px 0 0; }
.end-stats div { padding: 10px 8px; border-radius: 14px; background: rgba(10,14,40,.6); border: 2px solid rgba(255,214,90,.5); box-shadow: 0 4px 0 rgba(5,6,15,.55); }
.end-stats dt { font-weight: 900; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #ffd35c; }
.end-stats dd { margin: 4px 0 0; font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 26px); color: #fff; font-variant-numeric: tabular-nums; }
#cine.logo-on .end-kicker { animation: cineRise .7s .2s both; }
#cine.logo-on .end-stats { animation: cineRise .8s 1.3s both; }
#cine.logo-on .end-card .cine-tag { animation-delay: 1.6s; }
#cine.logo-on .end-card .cine-go { animation: cineRise .8s 2s both, cineGlow 2s 2.8s ease-in-out infinite; }
.end-note { margin: 0 0 8px; padding: 10px 12px; border-radius: 12px; background: #fff4cf; border: 2px solid #ffc233; font-weight: 800; font-size: 13px; color: var(--ink); }

@media (max-width: 640px) {
  .end-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
  .end-word .ty-back { -webkit-text-stroke-width: 7px; }
  #cine.playing .cine-bar { height: 8vh; }

  .cine-cap { bottom: calc(8vh + 7vh); }
  .cine-skip { top: max(6px, calc((8vh - 34px) / 2)); }

}
@media (prefers-reduced-motion: reduce) {

  .cine-ring { animation: none; }
}

<script>
(() => {
'use strict';
/* ===== js/util/dom.js ===== */
/** Aides DOM. */

/** Raccourci pour getElementById. */
const $ = id => document.getElementById(id);

/** Couleur [r, g, b] en chaîne CSS. */
const colCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;


/* ===== js/util/format.js ===== */
/** Mise en forme des nombres, montants et durées (à la française). */

const SUFFIXES = ['', ' k', ' M', ' Md', ' Bn', ' Bd', ' Tn', ' Td', ' Qn', ' Qd', ' Sx', ' Sd'];

/** Nombre abrégé : 1 234 → « 1,23 k », 5e9 → « 5,00 Md ». */
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (n < 10 && n % 1 > 0.05) ? n.toFixed(1).replace('.', ',') : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUFFIXES.length) return n.toExponential(2).replace('.', ',');
  const v = n / Math.pow(10, 3 * e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)).replace('.', ',') + SUFFIXES[e];
}

/** Montant en euros. */
const eur = n => fmt(n) + ' €';

/** Multiplicateur : 1.25 → « 1,25 ». */
const fmtMult = m => (m < 1000 ? m.toFixed(2).replace('.', ',') : fmt(m));

/** Pourcentage déjà multiplié par 100 : 12.5 → « 12 % », 0.5 → « 0,5 % ». */
function fmtPct(v) {
  if (v > 0 && v < 0.1) return '< 0,1 %';
  return (v < 10 ? v.toFixed(1).replace('.', ',').replace(',0', '') : fmt(v)) + ' %';
}

/** Effet d'un multiplicateur en pourcentage signé : 1.25 → « +25 % », 0.7 → « −30 % ». */
const multStr = m => (m >= 1 ? '+' + fmtPct((m - 1) * 100) : '−' + fmtPct((1 - m) * 100));

/** Durée lisible : « 2 h 05 min », « 7 min », « 12 s ». */
function fmtDur(seconds) {
  const s = Math.floor(seconds), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h} h ${String(m).padStart(2, '0')} min`;
  return m ? `${m} min` : `${s} s`;
}

/* ===== js/util/math.js ===== */
/** Petits outils mathématiques et aléatoires. */

/** Borne une valeur entre a et b. */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/** Générateur pseudo-aléatoire déterministe (mulberry32), utile pour un décor identique à chaque partie. */
function mulberry32(seed) {
  let a = seed;
  return function next() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Bruit déterministe dans [0, 1[ à partir de trois entiers. */
function hash(a, b, c) {
  const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
  return x - Math.floor(x);
}

/** Empreinte FNV-1a d'une chaîne (32 bits). */
function hashStr(s) {
  let h = 2166136261;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/** Élément tiré au hasard dans un tableau. */
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/** Clé du jour local, par exemple « 2026-09-30 ». */
function dayKey(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/** Clé de la semaine (date du lundi), par exemple « S2026-09-28 ». */
function weekKey(d = new Date()) {
  const monday = new Date(d);
  monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return 'S' + dayKey(monday);
}

/** Construit la définition d'un bâtiment d'une autre ville à partir de son modèle rémois. */
function deriveForSite(model, site) {
  const d = {
    ...model, id: site.pre + model.id, site: site.id, style: model.id, g: model.g + (model.kind === 'dept' ? site.dg : 0),
    unlock: (model.unlock || 10) * site.cf, base: model.base * site.cf,
    mgr: model.mgr ? model.mgr * site.cf : undefined, rate: model.rate ? model.rate * site.rf : undefined,
  };
  if (model.kind === 'dept') {
    const [, short, name, but, col, boss, desc] = OTHER_SITE_DEPTS[site.id].find(r => r[0] === model.id);
    Object.assign(d, {short, name, but, col, boss, desc, talent: `+10 % de revenus sur le site de ${site.name}.`});
  }
  Object.assign(d, SIGNATURE_BUILDINGS[site.id]?.[model.id]);
  return d;
}

/* ===== js/game/world.js ===== */
/**
 * Temps du monde : horloge d'animation, cycle jour/nuit, saisons (cycle de SEASON_LENGTH) et météo.
 * `world` est partagé en lecture par tout le jeu ; seul ce module le fait avancer.
 */

/** Durée d'une journée complète sur le campus, en secondes. */
const DAY_LENGTH = 300;

const SEASON_NAME = { hiver: 'Hiver', printemps: 'Printemps', ete: 'Été', automne: 'Automne' };
const WEATHER_NAME = { clair: 'Ciel dégagé', nuages: 'Nuageux', pluie: 'Pluie', neige: 'Neige' };

/**
 * Saisons : un cycle court calé sur l'horloge réelle (il continue quand le jeu est fermé),
 * pour que chaque joueur voie passer les quatre saisons en une session.
 */
const SEASON_LENGTH = 20 * 60;
const SEASONS = ['printemps', 'ete', 'automne', 'hiver'];
const seasonSlot = () => Math.floor(Date.now() / 1000 / SEASON_LENGTH);
/** Saison imposée par le mode admin, jusqu'au prochain changement naturel. */
let forcedSeason = null, forcedSlot = -1;
const currentSeason = () => (forcedSeason && seasonSlot() === forcedSlot ? forcedSeason : SEASONS[seasonSlot() % SEASONS.length]);
/** Secondes avant la saison suivante. */
const seasonTimeLeft = () => SEASON_LENGTH - (Date.now() / 1000) % SEASON_LENGTH;

const initialSeason = currentSeason();

const world = {
  /** Temps écoulé depuis le lancement (secondes, sert aux animations). */
  t: 0,
  /** Intensité de la nuit, de 0 (plein jour) à 0,85. */
  night: 0,
  season: initialSeason,
  weather: initialSeason === 'hiver' ? 'neige' : 'clair',
  /** Épaisseur de neige au sol, de 0 à 0,85. */
  snow: 0,
};

let weatherTimer = 90 + Math.random() * 90;
let weatherLock = 0;
const weatherListeners = [];

/** Appelé à chaque changement de météo (pour mettre à jour l'affichage). */
function onWeatherChange(fn) { weatherListeners.push(fn); }
const notifyWeather = () => weatherListeners.forEach(fn => fn(world.weather));

/** Force une météo pendant `lock` secondes (ex. l'événement « neige »). */
function setWeather(weather, lock = 0) {
  world.weather = weather;
  weatherLock = lock;
  notifyWeather();
}

function randomWeather() {
  const r = Math.random();
  if (world.season === 'hiver') return r < 0.4 ? 'neige' : r < 0.7 ? 'nuages' : 'clair';
  if (world.season === 'ete') return r < 0.1 ? 'pluie' : r < 0.3 ? 'nuages' : 'clair';
  return r < 0.3 ? 'pluie' : r < 0.55 ? 'nuages' : 'clair';
}

/** Fait avancer le temps, le cycle jour/nuit et la météo. */
function updateWorld(dt) {
  world.t += dt;
  const season = currentSeason();
  if (season !== world.season) { // nouvelle saison : une météo de saison
    world.season = season;
    if (weatherLock <= 0) world.weather = season === 'hiver' ? 'neige' : 'clair';
    notifyWeather();
  }
  const phase = (world.t / DAY_LENGTH) % 1;
  world.night = clamp((-Math.sin(phase * Math.PI * 2) - 0.25) / 0.5, 0, 1) * 0.85;

  if (weatherLock > 0) {
    weatherLock -= dt;
    if (weatherLock <= 0) { world.weather = world.season === 'hiver' ? 'nuages' : 'clair'; notifyWeather(); }
  }
  weatherTimer -= dt;
  if (weatherTimer <= 0) {
    weatherTimer = 120 + Math.random() * 180;
    if (weatherLock <= 0) { world.weather = randomWeather(); notifyWeather(); }
  }
  const targetSnow = Math.min(0.85, (world.season === 'hiver' ? 0.45 : 0) + (world.weather === 'neige' ? 0.4 : 0));
  world.snow += (targetSnow - world.snow) * Math.min(1, dt * 0.4);
}

/** Ambiance musicale correspondant au moment. */
function currentMood() {
  if (world.night > 0.45) return 'nuit';
  if (world.season === 'hiver') return 'hiver';
  return world.season === 'ete' ? 'ete' : 'jour';
}

/** Saute au milieu du jour ou de la nuit (mode admin, pour vérifier l'éclairage et les effets de nuit). */
function skipToTimeOfDay(night) {
  world.t = (Math.floor(world.t / DAY_LENGTH) + 1) * DAY_LENGTH + (night ? 0.75 : 0.25) * DAY_LENGTH;
}

/** Impose une saison (mode admin) jusqu'au prochain changement naturel. */
function setSeason(season) {
  forcedSeason = season;
  forcedSlot = seasonSlot();
}


/* ===== js/game/economy.js ===== */
/**
 * Économie : niveaux, revenus, multiplicateurs, prix et versement des gains.
 *
 * Seule la ville active (state.city) produit de l'argent ; les villes terminées restent visibles,
 * figées, et multiplient les revenus (bonus de ville).
 * Revenu d'un département = revenu de base × multiplicateur de la ville × multiplicateur global.
 *  - base : rate × niveau × facteur^(paliers atteints) × responsable × carte d'ancien élève
 *  - ville : lieux de vie (additifs), paliers du campus, décorations, talents, mécanique de la ville
 *  - global : rayonnement, diplômés, succès, conseil pédagogique, anciens élèves, villes terminées,
 *             palmes, mécène, puis les effets temporaires (événement, JPO, capacité, café double)
 */

/* ----- Lecture de l'état ----- */

const level = id => state.b[id].lvl;
const hasManager = id => !!(state.b[id] && state.b[id].mgr);
const treeLevel = id => (state.tree && state.tree[id]) || 0;
const treePointsSpent = () => TREE.reduce((sum, n) => sum + treeLevel(n.id), 0);
const currentDefs = () => SITE_DEFS[state.site];

/* ----- Villes ----- */

/** Ville active (celle qui produit) et son rang. */
const activeCity = () => SITE_BY[state.city];
const activeCityIndex = () => cityIndex(state.city);
/** Une ville est visitable si on l'a atteinte. */
const isSiteOpen = id => cityIndex(id) <= activeCityIndex();
/** Ville déjà terminée (figée, visible en vitrine). */
const isCityDone = id => cityIndex(id) < activeCityIndex();
/** Identifiant, dans la ville active, du bâtiment construit sur le modèle rémois `model`. */
const cityBuildingId = model => activeCity().pre + model;
const cityLevel = model => level(cityBuildingId(model));
const isBuilt = model => cityLevel(model) > 0;
/** Un bâtiment peut être acheté ou amélioré seulement dans la ville active. */
const isEditable = d => d.site === state.city;

/** Label d'excellence de la ville active : tout construire, puis les 7 départements au niveau `goal`. */
function cityGoalProgress(site = state.city) {
  const defs = SITE_DEFS[site], goal = SITE_BY[site].goal;
  const built = defs.filter(d => level(d.id) > 0).length;
  const ready = SITE_DEPTS[site].filter(d => level(d.id) >= goal).length;
  return { built, total: defs.length, ready, depts: SITE_DEPTS[site].length, goal, done: built === defs.length && ready === SITE_DEPTS[site].length };
}
const cityGoalReached = () => cityGoalProgress().done;
const nextCity = () => SITES[activeCityIndex() + 1] || null;

/** Multiplicateur d'une ville terminée (×3, plus avec le Jumelage). */
const cityBonusFactor = () => 3 + 0.5 * treeLevel('twin');
const cityBonusMult = () => Math.pow(cityBonusFactor(), activeCityIndex());

/** Branche du conseil pédagogique accessible. */
function isBranchOpen(branchId) {
  const need = BRANCHES.find(b => b.id === branchId).need;
  return state.promos >= (need.promos || 0) && activeCityIndex() >= (need.city || 0);
}

/* ----- Événement en cours ----- */

const eventActive = id => !!state.evt && state.evt.id === id && state.evt.t > 0;
function eventMult() {
  if (!state.evt || state.evt.t <= 0) return 1;
  const e = eventById(state.evt.id);
  if (!e) return 1;
  if (e.id === 'neige' && isBuilt('resid')) return 0.9;
  return e.m;
}

/* ----- Anciens élèves et décorations ----- */

/** Bonus cumulé des cartes d'un type donné (ex. « all », « svc », « dept:info »). */
function cardBonus(type) {
  let b = 0;
  for (const c of CARDS) if (c.t === type) b += c.b * Math.min(CARD_MAX, (state.cards && state.cards[c.id]) || 0);
  return b;
}
const decoList = (site = state.site) => (state.deco && state.deco[site]) || [];
const decoById = id => DECOS.find(dc => dc.id === id);
/** Prix en euros d'une décoration classique (triple à chaque pose) ; les exclusives coûtent des pépites. */
const decoCost = (dc, site = state.site) => (dc.gems ? 0 : dc.cost * SITE_BY[site].cf * Math.pow(3, decoList(site).filter(x => !decoById(x.t).gems).length));

/* ----- Revenus de base ----- */

/** Facteur de chaque palier de département (2, plus avec l'Excellence académique). */
const milestoneFactor = () => 2 + 0.1 * treeLevel('mile');
const rateAtLevel = (d, l) => (l ? d.rate * l * Math.pow(milestoneFactor(), milestonesReached(l)) : 0);
const managerFactor = d => (state.b[d.id].mgr ? 2 : 1);
/** La panne de wifi coupe l'informatique et le labo de la ville. */
const outageFactor = d => (eventActive('wifi') && (d.style === 'info' || d.style === 'labo') ? 0 : 1);
const cardFactor = d => 1 + cardBonus('dept:' + d.style);
const baseRate = d => rateAtLevel(d, level(d.id)) * managerFactor(d) * outageFactor(d) * cardFactor(d);

/* ----- Multiplicateurs de la ville ----- */

/** Bonus additif des lieux de vie d'une ville (0,35 = +35 %). */
function serviceBonus(site = state.site) {
  let b = 0;
  for (const d of SITE_SVCS[site]) {
    const l = level(d.id);
    if (l) b += d.bonus * l * (d.style === 'bu' && eventActive('partiels') ? 3 : 1);
  }
  return b * (1 + 0.1 * treeLevel('svc')) * (1 + cardBonus('svc'));
}
const serviceMult = (site = state.site) => 1 + serviceBonus(site);
/** Bonus d'un lieu de vie au niveau l, en pourcentage. */
const servicePercent = (d, l) => d.bonus * l * (1 + 0.1 * treeLevel('svc')) * 100;

const minDeptLevel = (site = state.site) => Math.min(...SITE_DEPTS[site].map(d => level(d.id)));
const campusStepMult = (site = state.site) => Math.pow(2, CAMPUS_STEPS.filter(q => minDeptLevel(site) >= q).length);
const nextCampusStep = (site = state.site) => nextOf(CAMPUS_STEPS, minDeptLevel(site));
const decoMult = (site = state.site) => 1 + decoList(site).reduce((sum, x) => sum + decoBonus(decoById(x.t)), 0);
/** Châlons et Charleville : chaque responsable ajoute +10 % aux revenus de la ville. */
const siteTalentMult = site => (site === 'reims' ? 1 : Math.pow(1.1, SITE_DEPTS[site].filter(d => state.b[d.id].mgr).length));
/** Charleville : les marionnettes animent le campus la nuit. */
const NIGHT_BONUS = 1.3;
const perkMult = site => (SITE_BY[site].perk === 'marionnettes' && world.night > 0.45 ? NIGHT_BONUS : 1);

const siteFactors = (site = state.site) => [
  ['Lieux de vie', serviceMult(site)],
  ['Paliers du campus', campusStepMult(site)],
  ['Décorations', decoMult(site)],
  ['Talents des responsables', siteTalentMult(site)],
  ['Marionnettes de nuit', perkMult(site)],
];
const siteMult = (site = state.site) => siteFactors(site).reduce((m, f) => m * f[1], 1);

/* ----- Multiplicateurs globaux ----- */

/** Rayonnement : chaque niveau de département (toutes villes) ajoute +0,1 % partout. */
const RADIANCE_PER_LEVEL = 0.001;
const totalDeptLevels = () => ALL_DEPTS.reduce((sum, d) => sum + level(d.id), 0);
const radianceMult = () => 1 + RADIANCE_PER_LEVEL * totalDeptLevels();
const achievementCount = () => Object.keys(state.ach).length;
/** Bonus de chaque succès (le talent de Dr Réactif le double). */
const achievementBonus = () => (hasManager('chimie') ? 0.02 : 0.01);
/** Chaque palme académique : +50 % de revenus. */
const palmesMult = () => 1 + 0.5 * state.palmes;
const maecenasMult = () => Math.pow(2, (state.shop && state.shop.mecene) || 0);

const globalFactors = () => [
  ['Rayonnement des départements', radianceMult()],
  ['Diplômés', 1 + state.dip * 0.02],
  ['Succès', 1 + achievementCount() * achievementBonus()],
  ['Conseil pédagogique', (1 + 0.25 * treeLevel('rev')) * (1 + 0.05 * treeLevel('fund'))],
  ['Talent de Prof. Octet', hasManager('info') ? 1.1 : 1],
  ['Anciens élèves', 1 + cardBonus('all')],
  ['Villes terminées', cityBonusMult()],
  ['Palmes académiques', palmesMult()],
  ['Mécène', maecenasMult()],
];
const permanentMult = () => globalFactors().reduce((m, f) => m * f[1], 1);
const jpoMult = () => (hasManager('geii') ? 4 : 3);
const jpoDuration = () => 30 + 15 * treeLevel('jpo') + cardBonus('jpo');
const RUSH_MULT = 5, COFFEE_MULT = 2;
/** Effets temporaires : [nom, multiplicateur] (seulement ceux qui sont actifs). */
function temporaryFactors() {
  const f = [];
  if (eventMult() !== 1) f.push(['Événement en cours', eventMult()]);
  if (state.boost > 0) f.push(['Journée portes ouvertes', jpoMult()]);
  if (state.rush > 0) f.push(['Semaine intensive', RUSH_MULT]);
  if (state.coffee > 0) f.push(['Café double', COFFEE_MULT]);
  return f;
}
const globalMult = () => temporaryFactors().reduce((m, f) => m * f[1], permanentMult());

/* ----- Revenus ----- */

const multFor = d => siteMult(d.site) * globalMult();
/** Multiplicateur total de la ville affichée. */
const currentSiteMult = () => siteMult(state.site) * globalMult();
/** Revenus d'un département (0 dans une ville terminée). */
const rateOf = d => (d.site === state.city ? baseRate(d) * multFor(d) : 0);
/** Revenus que produirait une ville (seule la ville active produit réellement). */
function siteRate(site) {
  let r = 0;
  for (const d of SITE_DEPTS[site]) r += baseRate(d);
  return r * siteMult(site) * globalMult();
}
const totalRate = () => siteRate(state.city);
const students = () => ALL_DEPTS.reduce((n, d) => n + level(d.id) * d.spl, 0);
const siteStudents = (site = state.site) => SITE_DEPTS[site].reduce((n, d) => n + level(d.id) * d.spl, 0);
const reimsManagerCount = () => SITE_DEPTS.reims.filter(d => state.b[d.id].mgr).length;

/* ----- Prix ----- */

const upgradeCostMult = () => (1 - 0.04 * treeLevel('cost')) * (hasManager('tc') ? 0.95 : 1);
const managerCost = d => d.mgr * (1 - 0.25 * treeLevel('mgr'));

/** Prix de n niveaux supplémentaires (somme géométrique). */
function upgradeCost(d, n) {
  const first = d.base * Math.pow(d.g, level(d.id) - 1) * upgradeCostMult();
  return first * (Math.pow(d.g, n) - 1) / (d.g - 1);
}
/** Nombre de niveaux achetables avec l'argent actuel. */
function maxAffordable(d) {
  const first = d.base * Math.pow(d.g, level(d.id) - 1) * upgradeCostMult();
  return Math.max(0, Math.floor(Math.log(state.money * (d.g - 1) / first + 1) / Math.log(d.g)));
}
/** Nombre de niveaux achetés par un clic selon le mode ×1 / ×10 / Max. */
const buyAmount = d => (state.buy === 'max' ? Math.max(1, maxAffordable(d)) : state.buy);

/* ----- Argent ----- */

function earn(amount) {
  state.money += amount;
  state.run += amount;
  state.total += amount;
}

/** Durée maximale comptée pour les revenus hors ligne, en secondes. */
const offlineCap = () => (8 + 4 * treeLevel('off') + 0.5 * cityLevel('resid')) * 3600;

/** Gains accumulés pendant une absence (sans effet temporaire). */
function offlineGain(seconds) {
  const site = state.city;
  let base = 0;
  for (const d of SITE_DEPTS[site]) base += rateAtLevel(d, level(d.id)) * managerFactor(d) * cardFactor(d);
  return base * siteMult(site) * permanentMult() * (hasManager('gea') ? 1.5 : 1) * seconds;
}

/* ----- Diplômes et accréditation ----- */

/** Argent à gagner dans l'année (à l'échelle de la ville) pour pouvoir organiser une cérémonie. */
const prestigeMin = () => 1e9 * activeCity().cf;
/**
 * Diplômés d'une cérémonie : croissent avec l'ordre de grandeur de l'argent gagné dans l'année (logarithme).
 * Un bonus de revenus ×2 n'ajoute donc que quelques diplômés : les bonus ne font pas boule de neige d'une cérémonie à l'autre.
 */
const GRADUATE_BASE = 8, GRADUATE_POWER = 2.5;
const graduatesGain = () => (state.run < prestigeMin() ? 0 : Math.floor(GRADUATE_BASE * Math.pow(1 + Math.log10(state.run / prestigeMin()), GRADUATE_POWER)
  * (1 + 0.1 * treeLevel('dip')) * (hasManager('labo') ? 1.1 : 1) * (1 + 0.1 * state.palmes)));
/** Crédits ECTS d'une cérémonie : beaucoup moins que les diplômés, pour que le conseil se remplisse lentement. */
const ectsGain = graduates => (graduates > 0 ? Math.round(2 * Math.sqrt(graduates)) : 0);
/** Accréditation nationale : possible une fois Charleville labellisée. */
const canAccredit = () => !nextCity() && cityGoalReached();
/** Tous les diplômés formés depuis la dernière accréditation (ville active et villes terminées). */
const totalGraduates = () => state.dip + state.dipDone;
const palmesGain = () => Math.max(1, Math.floor(Math.cbrt(totalGraduates() / 10)));

/* ----- Versement des revenus ----- */

let tickAccumulator = 0;

/**
 * Verse les revenus une fois par seconde (ou en rattrapage après une pause) et fait s'écouler les effets temporaires.
 * Retourne les versements de la ville affichée, pour les petits « +X € » au-dessus des bâtiments.
 * @returns {{payouts: Array<{d: object, amount: number}>, total: number}}
 */
function tickEconomy(dt) {
  tickAccumulator += dt;
  if (tickAccumulator < 1) return null;
  const seconds = Math.floor(tickAccumulator);
  tickAccumulator -= seconds;
  const site = state.city, mult = siteMult(site) * globalMult(), payouts = [];
  let total = 0;
  for (const d of SITE_DEPTS[site]) {
    if (!level(d.id)) continue;
    const amount = baseRate(d) * mult * seconds;
    total += amount;
    if (seconds === 1 && site === state.site) payouts.push({ d, amount });
  }
  earn(total);
  for (const k of ['boost', 'rush', 'coffee']) if (state[k] > 0) state[k] = Math.max(0, state[k] - seconds);
  return { payouts, total };
}

/**

 * `state` est le seul objet sauvegardé ; seul ce module peut le remplacer (setState).

/** Nouvelle partie. */
function freshState() {
  const buildings = {};
  for (const d of DEFS) buildings[d.id] = { lvl: d.id === 'info' ? 1 : 0, mgr: false };
  return {
    v: SAVE_VERSION,
    money: 0, run: 0, total: 0, best: 0, bestGain: 0,
    dip: 0, dipDone: 0, promos: 0, ects: 0, tree: {},
    city: 'reims', site: 'reims', palmes: 0, accreds: 0,
    b: buildings, obj: 0, boost: 0, evt: null, buy: 1,
    rush: 0, coffee: 0, cd: {}, mission: null, chests: 0, gems: 0, shop: {},
    muted: false, music: true, musicVol: 0.7, sfxVol: 0.8, intro: false, cine: false, ended: false, tutoStep: 0, pseudo: '',
    ach: {}, jpo: 0, seen: {},
    deco: {}, cards: {},
    daily: null, weekly: null, hist: [], rec: {},
    tips: {}, tipsOff: false, autoOn: true, eco: false,
    runStart: Date.now(), cityStart: Date.now(), campusDone: false, t: Date.now(),
  };
}

/** Fonctions utilisées pendant la validation. */
const isNum = v => typeof v === 'number' && isFinite(v);
const isObj = v => !!v && typeof v === 'object';

/** Anciens prix du conseil pédagogique (avant la v5) : le niveau l coûtait base × (l + 1). */
const OLD_TREE_BASE = { rev: 3, dip: 6, svc: 5, start: 5, open: 8, cost: 4, mgr: 5, auto: 10, off: 3, jpo: 4, evt: 6 };

/** Crédits ECTS dépensés dans l'ancien conseil, rendus lors du passage à la v5 (plafonnés). */
const MAX_ECTS_REFUND = 50;
function oldTreeRefund(tree) {
  let ects = 0;
  if (isObj(tree)) for (const [id, base] of Object.entries(OLD_TREE_BASE)) {
    const l = Math.max(0, Math.floor(+tree[id] || 0));
    ects += base * l * (l + 1) / 2;
  }
  return ects;
}

/**
 * Reconstruit un état propre à partir d'une sauvegarde quelconque (localStorage, code importé…).
 * Tout champ absent ou invalide reprend sa valeur par défaut.
 */
function sanitize(o) {
  const f = freshState();
  if (!isObj(o)) return f;
  for (const k of ['money', 'run', 'total', 'best', 'bestGain', 'dip', 'promos', 'ects', 'obj', 'boost', 'jpo', 't', 'runStart', 'cityStart',
    'palmes', 'accreds', 'rush', 'coffee', 'chests', 'gems', 'dipDone']) if (isNum(o[k])) f[k] = Math.max(0, o[k]);
  for (const k of ['muted', 'music', 'intro', 'cine', 'ended', 'tipsOff', 'autoOn', 'campusDone', 'eco']) if (typeof o[k] === 'boolean') f[k] = o[k];
  if (typeof o.cine !== 'boolean') f.cine = f.intro; // parties d'avant la cinématique : déjà vue
  if (isNum(o.tutoStep)) f.tutoStep = Math.max(0, Math.floor(o.tutoStep));
  for (const k of ['musicVol', 'sfxVol']) if (isNum(o[k])) f[k] = clamp(o[k], 0.05, 1);
  if (typeof o.pseudo === 'string') f.pseudo = o.pseudo.slice(0, 24);
  if (o.buy === 1 || o.buy === 10 || o.buy === 'max') f.buy = o.buy;
  if (isObj(o.ach)) for (const k in o.ach) if (isNum(o.ach[k])) f.ach[k] = o.ach[k];
  if (isObj(o.seen)) for (const e of EVENTS) if (o.seen[e.id]) f.seen[e.id] = 1;
  if (isObj(o.tree)) for (const n of TREE) if (isNum(o.tree[n.id])) f.tree[n.id] = clamp(Math.floor(o.tree[n.id]), 0, n.max);
  if (isObj(o.evt) && eventById(o.evt.id) && isNum(o.evt.t)) f.evt = { id: o.evt.id, t: o.evt.t };
  if (isObj(o.b)) for (const d of DEFS) { const s = o.b[d.id]; if (isObj(s)) f.b[d.id] = { lvl: Math.max(0, Math.floor(+s.lvl || 0)), mgr: !!s.mgr }; }
  if (isObj(o.cards)) for (const c of CARDS) if (isNum(o.cards[c.id])) f.cards[c.id] = clamp(Math.floor(o.cards[c.id]), 0, CARD_MAX);
  if (isObj(o.deco)) for (const s of SITES) if (Array.isArray(o.deco[s.id])) {
    f.deco[s.id] = o.deco[s.id]
      .filter(x => isObj(x) && DECOS.some(dc => dc.id === x.t) && Number.isInteger(x.i) && Number.isInteger(x.j))
      .slice(0, DECO_MAX).map(x => ({ i: x.i, j: x.j, t: x.t }));
  }
  for (const k of ['daily', 'weekly']) {
    const c = o[k];
    if (isObj(c) && typeof c.key === 'string') {
      f[k] = { key: c.key, ids: Array.isArray(c.ids) ? c.ids.slice(0, 3).map(String) : [], prog: { ...c.prog }, got: { ...c.got }, base: +c.base || 0, all: !!c.all };
    }
  }
  if (Array.isArray(o.hist)) f.hist = o.hist.filter(p => Array.isArray(p) && p.length === 2 && isNum(p[0]) && isNum(p[1])).slice(-360);
  if (isObj(o.rec)) for (const k in o.rec) if (isNum(o.rec[k])) f.rec[k] = o.rec[k];
  if (isObj(o.tips)) { for (const k in o.tips) if (o.tips[k]) f.tips[k] = 1; }
  else if (o.intro) for (const k of ['hello', 'up1', 'tc', 'mile', 'svc', 'mgr']) f.tips[k] = 1; // anciens joueurs : on saute les bases
  if (isObj(o.cd)) for (const a of ABILITIES) if (isNum(o.cd[a.id])) f.cd[a.id] = clamp(o.cd[a.id], 0, a.cd);
  if (isObj(o.shop)) for (const item of SHOP_ITEMS) if (item.max && isNum(o.shop[item.id])) f.shop[item.id] = clamp(Math.floor(o.shop[item.id]), 0, item.max);
  if (isObj(o.mission) && typeof o.mission.id === 'string' && isNum(o.mission.t)) f.mission = { ...o.mission };
  if (typeof o.city === 'string' && SITE_BY[o.city]) f.city = o.city;
  const cityRank = SITES.findIndex(s => s.id === f.city);
  if (typeof o.site === 'string' && SITE_BY[o.site] && SITES.findIndex(s => s.id === o.site) <= cityRank) f.site = o.site;
  else f.site = f.city;
  const firstDept = SITE_BY[f.city].pre + 'info';
  if (f.b[firstDept].lvl < 1) f.b[firstDept].lvl = 1;

  // Avant la v3 : ancienne économie, on garde les succès et le total, l'année repart de zéro.
  if (!(o.v >= 3)) {
    const kept = { ach: f.ach, total: f.total, muted: f.muted, music: f.music, intro: f.intro, cine: f.cine, jpo: f.jpo, buy: f.buy, tips: f.tips };
    return { ...freshState(), ...kept, migrated: 'v3' };
  }
  // v3 et v4 : les villes deviennent successives et le conseil pédagogique est refondu.
  // Les anciens diplômés passent au palmarès (classement, accréditation) sans booster Reims, qui serait trop facile ;
  // on garde les cartes, les succès et les réglages ; les ECTS dépensés sont rendus (au plus MAX_ECTS_REFUND) ; l'année repart de zéro.
  if (o.v < 5) {
    const kept = {
      dipDone: f.dip, promos: f.promos, ects: Math.min(MAX_ECTS_REFUND, f.ects + oldTreeRefund(o.tree)), total: f.total, best: f.best, bestGain: f.bestGain,
      ach: f.ach, cards: f.cards, jpo: f.jpo, seen: f.seen, deco: { reims: f.deco.reims || [] }, daily: f.daily, weekly: f.weekly,
      hist: f.hist, rec: f.rec, tips: f.tips, tipsOff: f.tipsOff, muted: f.muted, music: f.music, musicVol: f.musicVol, sfxVol: f.sfxVol, intro: f.intro, cine: f.cine, pseudo: f.pseudo,
      buy: f.buy, obj: 0, autoOn: f.autoOn, eco: f.eco,
    };
    return { ...freshState(), ...kept, migrated: 'v5' };
  }
  return f;
}

/** État courant de la partie. */
let state = freshState();

/** Remplace l'état courant (chargement, remise des diplômes, nouvelle partie, import). */
function setState(next) { state = next; }

/* ----- Persistance ----- */

/** Sauvegarde suspendue (cinématique : l'état affiché est une vitrine, pas la partie). */
let saveLocked = false;
function lockSave(on) { saveLocked = on; }

function save() {
  if (saveLocked) return;
  state.t = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible : on continue sans */ }
}

function loadSaved() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

/** Code d'export de la sauvegarde (texte à copier). */
const encodeSave = () => SAVE_CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify({ ...state, t: Date.now() }))));

/** Lit un code d'export ; lève une erreur s'il est invalide. */
function decodeSave(code) {
  const c = String(code || '').trim();
  if (!c.startsWith(SAVE_CODE_PREFIX)) throw new Error('format');
  return JSON.parse(decodeURIComponent(escape(atob(c.slice(SAVE_CODE_PREFIX.length)))));
}

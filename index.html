/* ===== js/ui/panel.js ===== */
/** Fiche d'un bâtiment : construction, niveau, revenus, amélioration et responsable. */

const panel = sheetEl('panel');
/** Structure actuellement affichée : « id:l » (chantier) ou « id:o » (ouvert). */
let panelLayout = '';

const layoutOf = d => d.id + (state.b[d.id].lvl ? ':o' : ':l') + (isEditable(d) ? '' : ':f');

const ADVICE_LABEL = { hire: 'recruter le responsable', build: 'construire ce bâtiment', up: 'améliorer ce bâtiment' };

function buildPanel() {
  const d = highlight.selected;
  if (!d) return;
  const s = state.b[d.id];
  panelLayout = layoutOf(d);
  let h = `<div class="sh-head"><span class="tag" style="--c:${colCss(d.col)}">${d.short}</span><div class="sh-title"><h2>${d.name}</h2><p class="kind">${d.kind === 'dept' ? 'Département · ' + d.but : 'Vie du campus'}</p></div><button class="x" type="button" data-close aria-label="Fermer">${ICON.close}</button></div><p class="desc">${d.desc}</p><p class="rec-note" id="pRec" hidden></p>`;
  if (!isEditable(d)) h += `<p class="frozen">Ville terminée : ce bâtiment reste en vitrine, tel que tu l’as laissé. Seule la ville active peut évoluer.</p>`;
  if (!s.lvl && !isEditable(d)) h += '<p class="desc">Ce bâtiment n’a pas été construit.</p>';
  else if (!s.lvl) {
    const pitch = d.kind === 'dept'
      ? `Rapporte <b id="pPreview"></b> dès le niveau 1 et accueille ${d.spl} étudiants par niveau. Chaque niveau ajoute aussi +0,1 % de revenus à tout le campus.`
      : `Ajoute <b>+${Math.round(servicePercent(d, 1))} %</b> de revenus à tous les départements par niveau. Les bonus des lieux de vie s’additionnent.`;
    h += `<div class="build-box"><p>${pitch}</p>
      <button class="btn go big" type="button" id="pBuild"><span class="l1">Construire</span><span class="l2">${ICON.coin}<span>${eur(d.unlock)}</span></span></button><p class="need" id="pNeed"></p></div>`;
  } else {
    h += `<div class="lvl-row"><span class="lvl">Niveau <b id="pLvl"></b></span><span class="mile" id="pMile"></span></div><div class="bar"><i id="pBar"></i></div>`;
    h += d.kind === 'dept'
      ? `<dl class="stats"><div><dt>Revenus</dt><dd id="pRate"></dd></div><div><dt>Étudiants</dt><dd id="pStu"></dd></div><div class="wide"><dt>Rayonnement sur tout le campus</dt><dd id="pRay"></dd></div></dl>`
      : `<dl class="stats"><div><dt>Bonus actuel</dt><dd id="pBonus"></dd></div><div><dt>Par niveau</dt><dd>+${fmtPct(servicePercent(d, 1))}</dd></div></dl>`;
    if (isEditable(d)) h += buyModeHtml() + `<button class="btn go big" type="button" id="pUp"><span class="l1">Améliorer <span id="pUpN"></span></span><span class="l2">${ICON.coin}<span id="pUpCost"></span></span></button><p class="gain" id="pGain"></p>`;
    if (isEditable(d) && d.kind === 'dept') h += `<div class="mgr"><div class="avatar" style="--c:${colCss(d.col)}">${ICON.face}</div><div class="mgr-t"><b>${d.boss}</b><small id="pMgrState"></small><small class="talent">Talent : ${d.talent}</small></div><button class="btn blue" type="button" id="pHire"></button></div>`;
  }
  panel.innerHTML = h;
  updatePanel();
}

/** Progression vers le prochain palier (barre et libellé). */
function paintProgress(steps, level, doneLabel, nextLabel) {
  const next = nextOf(steps, level), prev = prevOf(steps, level);
  $('pMile').textContent = next ? nextLabel(next) : doneLabel;
  $('pBar').style.width = next ? ((level - prev) / (next - prev) * 100).toFixed(1) + '%' : '100%';
}

function updatePanel() {
  const d = highlight.selected;
  if (!d || !isSheetOpen('panel')) return;
  if (panelLayout !== layoutOf(d)) { buildPanel(); return; }
  const s = state.b[d.id];
  const note = $('pRec');
  note.hidden = advice.id !== d.id;
  if (advice.id === d.id) note.textContent = `Conseil de Plume : ${ADVICE_LABEL[advice.act]} est l’achat le plus rentable du moment.`;

  if (!s.lvl && !isEditable(d)) return;
  if (!s.lvl) {
    const affordable = state.money >= d.unlock;
    $('pBuild').disabled = !affordable;
    $('pNeed').textContent = affordable ? '' : `Il manque ${eur(d.unlock - state.money)}`;
    if ($('pPreview')) $('pPreview').textContent = eur(rateAtLevel(d, 1) * currentSiteMult()) + '/s';
    return;
  }
  $('pLvl').textContent = s.lvl;
  if (d.kind === 'dept') {
    paintProgress(MILESTONES, s.lvl, 'Tous les paliers atteints', n => `Niv. ${n} : revenus ×${fmt(milestoneFactor())}`);
    $('pRate').textContent = isEditable(d) ? eur(rateOf(d)) + '/s' : 'En vitrine';
    $('pStu').textContent = fmt(s.lvl * d.spl);
    $('pRay').textContent = '+' + fmtPct(s.lvl * RADIANCE_PER_LEVEL * 100) + ' de revenus';
    if (!isEditable(d)) return;
    $('pMgrState').textContent = s.mgr ? 'En poste : revenus du département ×2 et talent actif.' : 'Double les revenus de ce département et apporte son talent.';
    const hireBtn = $('pHire');
    hireBtn.hidden = s.mgr;
    hireBtn.textContent = 'Recruter · ' + eur(managerCost(d));
    hireBtn.disabled = state.money < managerCost(d);
  } else {
    paintProgress(tiersFor(d), s.lvl, 'Bâtiment au maximum', n => `Agrandissement au niv. ${n}`);
    $('pBonus').textContent = '+' + fmtPct(servicePercent(d, s.lvl));
    if (!isEditable(d)) return;
  }
  const n = buyAmount(d), cost = upgradeCost(d, n);
  $('pUpN').textContent = '×' + n;
  $('pUpCost').textContent = eur(cost);
  $('pUp').disabled = state.money < cost;
  if (d.kind === 'dept') {
    const own = (rateAtLevel(d, s.lvl + n) - rateAtLevel(d, s.lvl)) * managerFactor(d) * outageFactor(d) * currentSiteMult();
    const radiance = totalRate() * RADIANCE_PER_LEVEL * n / radianceMult();
    $('pGain').textContent = `+${eur(own + radiance)}/s après amélioration (rayonnement compris)`;
  } else {
    $('pGain').textContent = `Bonus +${fmtPct(servicePercent(d, s.lvl))} → +${fmtPct(servicePercent(d, s.lvl + n))}`;
  }
  paintBuyMode(panel);
}

/** Ouvre la fiche d'un bâtiment. */
function selectBuilding(d) {
  openSheet('panel');
  highlight.selected = d;
  buildPanel();
}

function initPanel() {
  panel.addEventListener('click', e => {
    const b = e.target.closest('button'), d = highlight.selected;
    if (!b || !d) return;
    if (b.hasAttribute('data-close')) closeSheets();
    else if (handleBuyModeClick(b)) updatePanel();
    else if (b.id === 'pUp') upgrade(d);
    else if (b.id === 'pBuild') build(d);
    else if (b.id === 'pHire') hire(d);
    updatePanel();
  });
}


/* ===== js/ui/tutorial.js ===== */
/**
 * Tutoriel guidé du premier lancement : Plume montre une chose à la fois et il faut la faire pour continuer.
 *
 * Le reste de l'interface est verrouillé (#app.tuto-lock) ; seule la cible de l'étape (.tuto-target) répond,
 * et sur la carte seuls le glisser, le zoom et le bâtiment demandé sont permis (tutorialAllowsClick, input/pointer.js).
 * L'avancement est sauvegardé (state.tutoStep) : un rechargement reprend à la même étape.
 * Plume prête l'argent nécessaire aux achats demandés, pour que le tutoriel ne bloque jamais.
 * À la fin, state.intro passe à vrai : les conseils de Plume, décisions, missions et surprises prennent le relais.
 */

const TOUCH = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
/** Délai entre une action réussie et l'étape suivante (s), le temps de voir le « Bravo ». */
const SUCCESS_PAUSE = 0.9;
/** Sans cible visible pendant ce temps, un bouton « Continuer » évite tout blocage (s). */
const FAILSAFE_AFTER = 5;

/** Premier et deuxième département de la ville active (Informatique et TC à Reims). */
const firstDept = () => SITE_DEPTS[state.city][0];
const secondDept = () => SITE_DEPTS[state.city][1];
const panelOn = d => isSheetOpen('panel') && highlight.selected === d;
const inPanel = selector => (isSheetOpen('panel') ? sheetEl('panel').querySelector(selector) : null);

/** Glisse jusqu'à un bâtiment et le centre à l'écran (focusOn laisse la place à la fiche, inutile ici). */
function centerOn(d) {
  const [i0, j0, w, dd] = d.plot, [x, y] = iso(i0 + w / 2, j0 + dd / 2, 30);
  camera.tx = x;
  camera.ty = y;
}

/** Prête à Plume de quoi payer `cost` si besoin (une annonce par étape). */
function ensureMoney(cost) {
  if (!(state.money < cost)) return;
  const gift = Math.ceil(cost - state.money);
  state.money += gift;
  if (!tuto.gifted) { tuto.gifted = true; notify.toast(`Plume t’offre ${eur(gift)} pour cet achat.`, 'gold'); }
}

/**
 * Étapes. target : 'center' (carte au milieu), 'canvas' (la carte entière), {el} ou {building}.
 * done() : l'action est faite ; button : étape d'information validée par un bouton.
 * requires()/fallback : si la condition se perd (fiche fermée), retour à l'étape indiquée.
 */
const TUTO_STEPS = [
  { id: 'hello', target: () => 'center', button: 'C’est parti !',
    title: 'Bienvenue à l’IUT de Reims !',

/** Conseils de Plume déjà couverts par le tutoriel. */
const TIPS_COVERED = ['hello', 'up1', 'tc', 'mile', 'abil'];

let tuto = null;

/* ----- Interface ----- */

const HAND = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 36 7 20h8V5h10v15h8z" fill="#ffc233" stroke="#1c2541" stroke-width="3" stroke-linejoin="round"/></svg>';

function tutoHtml(owl) {
  return `<div class="tuto-dim"></div><div class="tuto-shade"></div><div class="tuto-shade"></div><div class="tuto-shade"></div><div class="tuto-shade"></div><div class="tuto-ring"></div><div class="tuto-hand">${HAND}</div>
  <div class="tuto-gesture"><span class="g-dot"></span><span class="g-dot b"></span></div>
  <div class="tuto-card" role="dialog" aria-live="polite" aria-label="Tutoriel">
    <div class="tuto-owl">${owl}</div>
    <div class="tuto-body">
      <span class="eyebrow tuto-step"></span>
      <b class="tuto-title"></b>
      <p class="tuto-text"></p>
      <div class="tuto-bar"><i></i></div>
      <button type="button" class="btn go sm tuto-btn"></button>
    </div>
  </div>`;
}

function paintCard() {
  const step = tuto.step, el = tuto.el;
  el.querySelector('.tuto-step').textContent = `Tutoriel · étape ${tuto.index + 1} / ${TUTO_STEPS.length}`;
  el.querySelector('.tuto-title').textContent = tuto.success ? 'Bravo !' : step.title;
  el.querySelector('.tuto-text').textContent = step.text();
  el.querySelector('.tuto-bar i').style.width = ((tuto.index + (tuto.success ? 1 : 0)) / TUTO_STEPS.length * 100).toFixed(1) + '%';
  const btn = el.querySelector('.tuto-btn'), label = step.button || (tuto.stuck ? 'Continuer' : '');
  btn.hidden = !label || tuto.success;
  btn.textContent = label;
  el.classList.toggle('success', tuto.success);
}

/** Rectangle écran (pixels CSS) d'un bâtiment, toit compris. */
function buildingRect(d) {
  const [i0, j0, w, dd] = d.plot, r = canvas.getBoundingClientRect();
  const pts = [iso(i0, j0, 0), iso(i0 + w, j0, 0), iso(i0, j0 + dd, 0), iso(i0 + w, j0 + dd, 0), iso(i0 + w / 2, j0 + dd / 2, d.top || 60)];
  const xs = pts.map(p => (p[0] - camera.x) * camera.z + view.w / 2 + r.left), ys = pts.map(p => (p[1] - camera.y) * camera.z + view.h / 2 + r.top);
  return { left: Math.min(...xs), top: Math.min(...ys), right: Math.max(...xs), bottom: Math.max(...ys) };
}

/** Marque l'élément cible (seul cliquable) et retourne son rectangle, ou null. */
function currentTarget() {
  const t = tuto.step.target();
  if (tuto.marked && (!t || t.el !== tuto.marked)) { tuto.marked.classList.remove('tuto-target'); tuto.marked = null; }
  if (t === 'center' || t === 'canvas') return t;
  if (t && t.el) {
    if (!t.el.isConnected || t.el.offsetParent === null) return null;
    if (tuto.marked !== t.el) {
      t.el.classList.add('tuto-target');
      tuto.marked = t.el;
      if (t.el.closest('.sheet')) t.el.scrollIntoView({ block: 'nearest' }); // bouton en bas d'une fiche (mobile)
    }
    const r = t.el.getBoundingClientRect();
    return { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
  }
  if (t && t.building) return buildingRect(t.building);
  return null;
}

const overlaps = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;

/** Place la carte de Plume là où elle ne cache pas la cible. */
function placeCard(rect) {
  const card = tuto.el.querySelector('.tuto-card'), W = window.innerWidth, H = window.innerHeight, m = 12;
  const cw = card.offsetWidth, ch = card.offsetHeight;
  const at = (x, y) => ({ left: Math.max(m, Math.min(W - cw - m, x)), top: Math.max(m, Math.min(H - ch - m, y)) });
  let pos;
  if (rect === 'center' || !rect) pos = at((W - cw) / 2, (H - ch) / 2);
  else if (rect === 'canvas') pos = at((W - cw) / 2, H - ch - (W < 640 ? 24 : 40));
  else {
    const cx = (rect.left + rect.right) / 2 - cw / 2, cy = (rect.top + rect.bottom) / 2 - ch / 2, gap = 26;
    const options = [at(cx, rect.bottom + gap), at(cx, rect.top - ch - gap), at(rect.right + gap, cy), at(rect.left - cw - gap, cy), at(m, H - ch - m), at(m, m)];
    const pad = { left: rect.left - 8, right: rect.right + 8, top: rect.top - 8, bottom: rect.bottom + 8 };
    pos = options.find(o => !overlaps({ left: o.left, top: o.top, right: o.left + cw, bottom: o.top + ch }, pad)) || options[0];
  }
  card.style.transform = `translate(${Math.round(pos.left)}px, ${Math.round(pos.top)}px)`;
}

function layout() {
  const rect = currentTarget(), el = tuto.el, ring = el.querySelector('.tuto-ring'), hand = el.querySelector('.tuto-hand');
  const box = rect && typeof rect === 'object';
  el.classList.toggle('dim-all', rect === 'center');
  el.classList.toggle('has-ring', box);
  el.querySelector('.tuto-gesture').dataset.g = rect === 'canvas' && !tuto.success ? tuto.step.gesture : '';
  $('app').classList.toggle('tuto-canvas', rect === 'canvas' || !!tuto.step.click);
  if (box) {
    const p = 8, x = rect.left - p, y = rect.top - p, w = rect.right - rect.left + 2 * p, h = rect.bottom - rect.top + 2 * p;
    Object.assign(ring.style, { transform: `translate(${Math.round(x)}px, ${Math.round(y)}px)`, width: Math.round(w) + 'px', height: Math.round(h) + 'px' });
    const W = window.innerWidth, H = window.innerHeight, x1 = Math.max(0, x), y1 = Math.max(0, y), x2 = Math.min(W, x + w), y2 = Math.min(H, y + h);
    [[0, 0, W, y1], [0, y2, W, H - y2], [0, y1, x1, y2 - y1], [x2, y1, W - x2, y2 - y1]].forEach(([sx, sy, sw, sh], k) => {
      Object.assign(tuto.shades[k].style, { transform: `translate(${Math.round(sx)}px, ${Math.round(sy)}px)`, width: Math.max(0, Math.round(sw)) + 'px', height: Math.max(0, Math.round(sh)) + 'px' });
    });
    const below = y < 90; // la main pointe vers la cible, par-dessus ou par-dessous
    hand.classList.toggle('up', below);
    hand.style.transform = `translate(${Math.round(x + w / 2 - 20)}px, ${Math.round(below ? y + h + 6 : y - 46)}px)`;
  }
  tuto.missing = rect ? 0 : tuto.missing;
  placeCard(rect);
}

/* ----- Déroulé ----- */

function enterStep(index) {
  if (tuto.step && tuto.step.end) tuto.step.end();
  while (index < TUTO_STEPS.length && TUTO_STEPS[index].skip && TUTO_STEPS[index].skip()) index++;
  if (index >= TUTO_STEPS.length) { finishTutorial(); return; }
  Object.assign(tuto, { index, step: TUTO_STEPS[index], success: false, advanceIn: 0, gifted: false, stuck: false, missing: 0, textTimer: 0 });
  state.tutoStep = index;
  save();
  if (tuto.step.begin) tuto.step.begin();
  tuto.el.classList.remove('enter'); void tuto.el.offsetWidth; tuto.el.classList.add('enter');
  paintCard();
}

const stepIndex = id => TUTO_STEPS.findIndex(s => s.id === id);

function succeed() {
  tuto.success = true;
  tuto.advanceIn = SUCCESS_PAUSE;
  playSound('up');
  paintCard();
}

function onButton() {
  if (!tuto || tuto.success) return;
  playSound('click');
  if (tuto.step.id === 'end') { finishTutorial(); return; }
  enterStep(tuto.index + 1);
}

/** À chaque image pendant le tutoriel. */
function updateTutorial(dt) {
  if (!tuto) return;
  const step = tuto.step;
  if (tuto.success) {
    tuto.advanceIn -= dt;
    if (tuto.advanceIn <= 0) enterStep(tuto.index + 1);
    else layout();
    return;
  }
  if (step.requires && !step.requires()) { enterStep(stepIndex(step.fallback)); return; }
  if (!step.button && step.done()) { succeed(); layout(); return; }
  if (step.tick) step.tick();
  tuto.textTimer -= dt;
  if (tuto.textTimer <= 0) { tuto.textTimer = 0.25; paintCard(); }
  layout();
  if (!step.button && !currentTarget()) {
    tuto.missing += dt;
    if (tuto.missing > FAILSAFE_AFTER && !tuto.stuck) { tuto.stuck = true; paintCard(); }
  }
}

/** Touches : Échap et la navigation au clavier ne doivent pas contourner l'étape en cours. */
function guardKeys(e) {
  if (!tuto) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest?.('.tuto-target, #tuto')) { e.preventDefault(); e.stopPropagation(); }
}

const tutorialActive = () => !!tuto;
/** Étape en cours (null hors tutoriel). */
const tutorialStepId = () => (tuto ? tuto.step.id : null);

/** Sur la carte, pendant le tutoriel, seul le bâtiment demandé répond au clic. */
function tutorialAllowsClick(hit) {
  if (!tuto) return true;
  const want = tuto.step.click && tuto.step.click();
  return !!want && !!hit && hit.type === 'building' && hit.d === want;
}

/** Lance (ou reprend) le tutoriel ; `restart` repart de la première étape. */
function startTutorial({ restart = false } = {}) {
  if (tuto) return;
  if (restart) state.tutoStep = 0;
  const el = document.createElement('div');
  el.id = 'tuto';
  el.innerHTML = tutoHtml(document.querySelector('#mascot .owl')?.innerHTML || '');
  document.body.appendChild(el);
  el.querySelector('.tuto-btn').onclick = onButton;
  tuto = { el, shades: [...el.querySelectorAll('.tuto-shade')], index: 0, step: null, marked: null, base: 0, goal: 0 };
  $('app').classList.add('tuto-lock');
  $('mascot').hidden = true;
  window.addEventListener('keydown', guardKeys, true);
  enterStep(Math.min(state.tutoStep, TUTO_STEPS.length - 1));
}

function finishTutorial() {
  if (!tuto) return;
  if (tuto.step && tuto.step.end) tuto.step.end();
  if (tuto.marked) tuto.marked.classList.remove('tuto-target');
  tuto.el.classList.add('closing');
  const el = tuto.el;
  setTimeout(() => el.remove(), 400);
  tuto = null;
  window.removeEventListener('keydown', guardKeys, true);
  $('app').classList.remove('tuto-lock', 'tuto-canvas');
  state.intro = true;
  state.tutoStep = TUTO_STEPS.length;
  for (const id of TIPS_COVERED) state.tips[id] = 1;
  celebrate();
  playSound('boost');
  save();
}


/* ===== js/ui/tooltip.js ===== */
/**
 * Infobulles : détail des revenus, des étudiants, des diplômés, de l'événement, de la saison, de l'objectif
 * et des bâtiments. Survol à la souris, appui au doigt, focus au clavier.
 * Clés : 'money', 'stu', 'dip', 'evt', 'jpo', 'season', 'obj', 'jpow' (visiteur), 'b:<id>' (bâtiment).
 */

const tipEl = $('tip');
let tipKey = null, tipAnchor = null, tipPointer = null;

/** Ligne « libellé … valeur » ; cls = 'tot' pour une ligne de total. */
const tipRow = (label, value, cls = '') => `<span class="tr${cls ? ' ' + cls : ''}"><span>${label}</span><b>${value}</b></span>`;
const tipTitle = text => `<span class="tt">${text}</span>`;
const tipNote = text => `<span class="tn">${text}</span>`;

function eventEffect(e) {
  if (e.id === 'neige') return level('resid') ? 'Revenus −10 % (la Résidence Crous limite les dégâts)' : 'Revenus −30 % (−10 % avec la Résidence Crous)';
  if (e.id === 'partiels') return 'Revenus −20 %, mais le bonus de la BU compte triple';
  if (e.id === 'wifi') return 'Informatique et le labo ne rapportent plus rien';
  if (e.lump) return `+${e.lump / 60} min de revenus versés immédiatement`;
  if (e.jpo) return `${e.jpo} visiteurs de la JPO arrivent : clique sur les étoiles`;
  return `Tous les revenus ×${fmtMult(e.m).replace(/,00$/, '')}`;
}

const SEASON_TEXT = {
  hiver: 'Les arbres sont nus et la neige tombe souvent : l’événement « Neige sur Reims » est 3 fois plus fréquent.',
  printemps: 'Les arbres sont en fleurs et il pleut de temps en temps.',
  ete: 'Tout est vert. Le « Grand soleil sur Reims » (revenus ×1,25) peut tomber.',
  automne: 'Les feuilles jaunissent et la pluie est fréquente. Le « Grand soleil » reste possible.',
};

/** Effet d'un multiplicateur : « +25 % » pour les petits, « ×9 » au-delà de ×2. */
const factorStr = m => (m >= 2 ? '×' + fmtMult(m).replace(/,00$/, '') : multStr(m));

function moneyTip() {
  const city = state.city;
  let h = tipTitle(eur(totalRate()) + '/s');
  const base = SITE_DEPTS[city].reduce((sum, d) => sum + baseRate(d), 0);
  h += tipRow(`Départements de ${SITE_BY[city].name} (base)`, eur(base) + '/s');
  for (const [name, m] of siteFactors(city)) if (m !== 1) h += tipRow(name, factorStr(m));
  for (const [name, m] of globalFactors()) if (m !== 1) h += tipRow(name, factorStr(m));
  for (const [name, m] of temporaryFactors()) h += tipRow(name, factorStr(m));
  return h + tipRow('Multiplicateur total', '×' + fmtMult(siteMult(city) * globalMult()), 'tot')
    + tipNote(`Seule la ville active (${SITE_BY[city].name}) produit ; l’argent est versé automatiquement chaque seconde.`);
}

function studentsTip() {
  let h = tipTitle(`${fmt(students())} étudiants`);
  for (const d of SITE_DEPTS[state.site]) if (level(d.id)) h += tipRow(d.name, fmt(level(d.id) * d.spl));
  for (const s of SITES) if (s.id !== state.site && siteStudents(s.id)) h += tipRow('Site de ' + s.name, fmt(siteStudents(s.id)));
  return h + tipNote('Chaque niveau de département accueille de nouveaux étudiants.');
}

function buildingTip(d) {
  const s = state.b[d.id];
  if (!s.lvl) {
    return tipTitle(d.name) + tipRow('Construction', eur(d.unlock))
      + (d.kind === 'dept' ? tipRow('Revenus au niveau 1', eur(rateAtLevel(d, 1) * currentSiteMult()) + '/s') : tipRow('Bonus par niveau', '+' + fmtPct(servicePercent(d, 1))))
      + tipNote(state.money >= d.unlock ? 'Tu peux le construire : clique pour ouvrir la fiche.' : 'Clique pour ouvrir la fiche.');
  }
  if (!isEditable(d)) return tipTitle(d.name) + tipRow('Niveau', s.lvl) + tipNote('Ville terminée : bâtiment en vitrine.');
  let h = tipTitle(d.name) + tipRow('Niveau', s.lvl);
  if (d.kind === 'dept') {
    const total = totalRate(), share = total > 0 ? rateOf(d) / total * 100 : 0, next = nextOf(MILESTONES, s.lvl);
    h += tipRow('Revenus', eur(rateOf(d)) + '/s') + tipRow('Part des revenus', fmtPct(share)) + tipRow('Rayonnement', '+' + fmtPct(s.lvl * RADIANCE_PER_LEVEL * 100))
      + (next ? tipRow('Prochain ×' + fmt(milestoneFactor()), 'niv. ' + next) : '') + tipRow('Responsable', s.mgr ? 'en poste' : eur(managerCost(d)));
  } else {
    const next = nextOf(tiersFor(d), s.lvl);
    h += tipRow('Bonus', '+' + fmtPct(servicePercent(d, s.lvl))) + (next ? tipRow('Agrandissement', 'niv. ' + next) : '');
  }
  return h + tipNote(state.money >= upgradeCost(d, 1) ? 'Amélioration disponible : clique pour ouvrir.' : 'Clique pour ouvrir la fiche.');
}

function abilityTip(a) {
  if (!a) return null;
  const left = cooldownLeft(a.id);
  return tipTitle(a.n) + a.d + tipRow('Recharge', Math.round(abilityCooldown(a)) + ' s') + (left > 0 ? tipRow('Prête dans', Math.ceil(left) + ' s', 'tot') : tipRow('État', 'prête', 'tot'));
}

/** Contenu HTML d'une infobulle, ou null si elle n'a plus lieu d'être. */
function tipHtml(key) {
  if (key === 'money') return moneyTip();
  if (key === 'stu') return studentsTip();
  if (key === 'dip') {
    const next = state.run >= prestigeMin() ? `+${fmt(graduatesGain())} (+${fmt(ectsGain(graduatesGain()))} ECTS)` : 'dès ' + eur(prestigeMin());
    return tipTitle(`${fmt(state.dip)} diplômés à ${SITE_BY[state.city].name}`) + tipRow('Bonus permanent', '+' + fmt(state.dip * 2) + ' %') + tipRow('Crédits ECTS', fmt(state.ects))
      + tipRow('Prochaine cérémonie', next) + tipNote('Ouvre « Diplômes » pour organiser la cérémonie ou dépenser tes ECTS.');
  }
  if (key === 'evt') {
    const e = state.evt && eventById(state.evt.id);
    if (!e) return null;
    return tipTitle(e.n) + `<span class="te">${e.good ? 'Effet' : 'Malus'} : ${eventEffect(e)}</span>` + tipRow('Temps restant', Math.ceil(state.evt.t) + ' s', 'tot');
  }
  if (key === 'jpo') {
    if (state.boost <= 0) return null;
    return tipTitle('Journée portes ouvertes') + tipRow('Effet', 'revenus ×' + jpoMult()) + tipRow('Temps restant', Math.ceil(state.boost) + ' s')
      + tipNote('Un visiteur à l’étoile dorée passe de temps en temps : clique dessus.');
  }
  if (key === 'season') {
    return tipTitle(`${SEASON_NAME[world.season]} · ${WEATHER_NAME[world.weather]}`) + SEASON_TEXT[world.season]
      + tipRow('Saison suivante', 'dans ' + fmtDur(seasonTimeLeft()))
      + tipNote('Chaque saison dure 20 min. La météo est décorative : seuls les événements changent les revenus.');
  }
  if (key === 'obj') {
    const o = currentObjective();
    if (!o) return null;
    return tipTitle(`Objectif ${state.obj + 1}/${OBJECTIVES.length}`) + o[0] + tipRow('Récompense', eur(objectiveReward()))
      + tipNote('La récompense vaut 1 min de revenus et se verse toute seule.');
  }
  if (key === 'jpow') return tipTitle('Visiteur de la JPO') + `Clique dessus : tous les revenus ×${jpoMult()} pendant ${Math.round(jpoDuration())} s.`;
  if (key === 'coffee') return state.coffee > 0 ? tipTitle('Café double') + tipRow('Effet', 'revenus ×2') + tipRow('Temps restant', Math.ceil(state.coffee / 60) + ' min') : null;
  if (key.startsWith('ab:')) return abilityTip(abilityById(key.slice(3)));
  if (key.startsWith('c:')) return tipTitle(key.slice(2)) + tipNote('Clique dessus avant qu’il ne reparte !');
  if (key.startsWith('b:')) return buildingTip(BY[key.slice(2)]);
  return null;
}

/** Recalcule et replace l'infobulle ouverte (appelé régulièrement). */
function renderTooltip() {
  if (!tipKey) return;
  const h = tipHtml(tipKey);
  if (!h) { hideTooltip(); return; }
  if (tipEl.innerHTML !== h) tipEl.innerHTML = h;
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  let x, y;
  if (tipPointer) {
    x = tipPointer.x + 16; y = tipPointer.y + 18;
    if (y + r.height > innerHeight - 8) y = tipPointer.y - r.height - 12;
  } else {
    const a = tipAnchor.getBoundingClientRect();
    x = a.left; y = a.bottom + 8;
    if (y + r.height > innerHeight - 8) y = a.top - r.height - 8;
  }
  tipEl.style.left = clamp(x, 8, innerWidth - r.width - 8) + 'px';
  tipEl.style.top = clamp(y, 8, innerHeight - r.height - 8) + 'px';
}

/** Affiche une infobulle sous un élément (`anchor`) ou près du pointeur (`pointer` = {x, y}). */
function showTooltip(key, anchor = null, pointer = null) {
  tipKey = key; tipAnchor = anchor; tipPointer = pointer;
  renderTooltip();
}
function hideTooltip() {
  tipKey = null; tipAnchor = null; tipPointer = null;
  tipEl.hidden = true;
}
const isTooltipOpen = () => !!tipKey;
/** Infobulle qui suit le pointeur sur la carte (bâtiment, visiteur). */
const isPointerTooltip = () => !!tipPointer;

/** Branche les infobulles des éléments marqués data-tip. */
function initTooltips() {
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTooltip(el.dataset.tip, el); });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && tipAnchor === el) hideTooltip(); });
    el.addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse') return;
      if (tipAnchor === el) hideTooltip(); else showTooltip(el.dataset.tip, el);
    });
    el.addEventListener('focus', () => showTooltip(el.dataset.tip, el));
    el.addEventListener('blur', () => { if (tipAnchor === el) hideTooltip(); });
  });
  document.addEventListener('pointerdown', e => { if (tipKey && !tipPointer && !e.target.closest('[data-tip]')) hideTooltip(); });
}


/* ===== js/input/pointer.js ===== */
/**
 * Souris et tactile sur la carte : glisser pour se déplacer, molette ou pincement pour zoomer,
 * clic sur un bâtiment, un visiteur de la JPO ou une case (pose de décoration), survol pour les infobulles.
 */

/** Au-delà de ce déplacement (pixels), l'appui devient un glissement et non un clic. */
const DRAG_THRESHOLD = 7;

const pointers = new Map();
let drag = null, pinch = null, moved = false;

const localPoint = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function pinchInfo() {
  const [a, b] = [...pointers.values()];
  return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}

/** Ce qui se trouve sous un point écran : surprise, visiteur de la JPO, grappe à récolter ou bâtiment. */
function hitAt(sx, sy) {
  const [wx, wy] = screenToWorld(sx, sy);
  const critter = critterAt(wx, wy);
  if (critter) return { type: 'critter', critter };
  const visitor = visitorAt(wx, wy);
  if (visitor) return { type: 'visitor', visitor };
  const tile = screenToTile(sx, sy);
  if (tile && hasGrapes(tile[0], tile[1])) return { type: 'grape', tile };
  const [d, alt] = buildingChoices(wx, wy);
  return d ? { type: 'building', d, alt } : null;
}

function clickAt(sx, sy) {
  if (placing) {
    const tile = screenToTile(sx, sy);
    if (tile) placeDecoAt(tile[0], tile[1]);
    return;
  }
  let hit = hitAt(sx, sy);
  // deux bâtiments l'un derrière l'autre : un second clic au même endroit passe à l'autre (et le tutoriel accepte les deux)
  if (hit && hit.alt && (hit.d === highlight.selected || !tutorialAllowsClick(hit))) hit = { ...hit, d: hit.alt, alt: hit.d };
  if (!tutorialAllowsClick(hit)) return;
  if (!hit) { if (highlight.selected) closeSheets(); return; }
  if (hit.type === 'visitor') { welcomeVisitor(hit.visitor, iso(hit.visitor.x, hit.visitor.y, 30)); return; }
  if (hit.type === 'critter') {
    const [x, y] = catchCritter(hit.critter), label = rewardCritter(hit.critter.type);
    burstAt(x, y, 18);
    floatAt(x, y - 12, label, '#ffc233');
    return;
  }
  if (hit.type === 'grape') {
    const [i, j] = hit.tile, label = harvestGrape(i, j), [x, y] = iso(i + 0.5, j + 0.5, 14);
    if (label) { burstAt(x, y, 10, '#b05bd0'); floatAt(x, y - 8, label, '#e7b8ff', 0.85); }
    return;
  }
  selectBuilding(hit.d);
  playSound('click');
}

/** Survol sans bouton appuyé : case visée en mode pose, sinon curseur et infobulle. */
function hover(e, p) {
  if (placing) { highlight.hover = null; setHoverTile(screenToTile(p.x, p.y)); canvas.classList.add('hot'); return; }
  const hit = hitAt(p.x, p.y);
  highlight.hover = hit && hit.type === 'building' && e.pointerType === 'mouse' ? hit.d : null;
  canvas.classList.toggle('hot', !!hit);
  if (e.pointerType !== 'mouse') return;
  const key = !hit ? null : hit.type === 'visitor' ? 'jpow' : hit.type === 'critter' ? 'c:' + hit.critter.type.n : hit.type === 'grape' ? 'c:Grappe mûre' : 'b:' + hit.d.id;
  if (key) showTooltip(key, null, { x: e.clientX, y: e.clientY });
  else if (isPointerTooltip()) hideTooltip();
}

function onPointerDown(e) {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* navigateur ancien */ }
  const p = localPoint(e);
  pointers.set(e.pointerId, p);
  highlight.hover = null;
  if (pointers.size === 1) { drag = { x: p.x, y: p.y, cx: camera.x, cy: camera.y }; moved = false; }
  else if (pointers.size === 2) { pinch = { ...pinchInfo(), z: camera.z }; moved = true; }
  stopCameraGlide();
  if (isPointerTooltip()) hideTooltip();
}

function onPointerMove(e) {
  const p = localPoint(e);
  if (!pointers.has(e.pointerId)) { hover(e, p); return; }
  pointers.set(e.pointerId, p);
  if (pinch && pointers.size >= 2) {
    const now = pinchInfo();
    zoomAt(now.mx, now.my, pinch.z * now.dist / pinch.dist);
    panBy(now.mx - pinch.mx, now.my - pinch.my);
    pinch.mx = now.mx; pinch.my = now.my;
  } else if (drag) {
    const dx = p.x - drag.x, dy = p.y - drag.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) { moved = true; canvas.classList.add('drag'); }
    if (moved) { camera.x = drag.cx - dx / camera.z; camera.y = drag.cy - dy / camera.z; clampCamera(); }
  }
}

function onPointerEnd(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = localPoint(e);
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (!moved && e.type === 'pointerup') clickAt(p.x, p.y);
    drag = null; pinch = null;
    canvas.classList.remove('drag');
  } else if (pointers.size === 1) { // un doigt levé pendant un pincement : on reprend le glissement
    pinch = null;
    const q = [...pointers.values()][0];
    drag = { x: q.x, y: q.y, cx: camera.x, cy: camera.y };
  }
}

function initPointer() {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerEnd);
  canvas.addEventListener('pointercancel', onPointerEnd);
  canvas.addEventListener('pointerleave', () => { if (isPointerTooltip()) hideTooltip(); canvas.classList.remove('hot'); highlight.hover = null; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const p = localPoint(e);
    zoomAt(p.x, p.y, camera.z * Math.exp(-e.deltaY * 0.0015));
    stopCameraGlide();
  }, { passive: false });
}


/* ===== js/ui/toast.js ===== */
/** Messages temporaires en haut de l'écran (3 au maximum). */

const MAX_TOASTS = 3, DURATION = 3800;

/** kind = 'gold' pour une bonne nouvelle. */
function showToast(message, kind = '') {
  const box = $('toasts'), el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  box.appendChild(el);
  while (box.children.length > MAX_TOASTS) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, DURATION);
}

function updateCampus() {
  if (!campusBuilt || !isSheetOpen('campus')) return;
  const site = state.site, active = site === state.city;
  $('campStu').textContent = `${fmt(siteStudents())} étudiants${active ? ` · ${eur(siteRate(site))}/s` : ''} · lieux de vie +${fmtPct(serviceBonus() * 100)} · rayonnement +${fmtPct((radianceMult() - 1) * 100)}`;

    ? `Prochain palier du campus : les 7 départements au niveau ${step} → revenus de la ville ×2 (${ready}/7 prêts)`

  paintGoal();
  paintAutoBuy();
  for (const d of currentDefs()) paintBuildingRow(d);
  if (active) {
    const list = decoList(), bonus = list.reduce((sum, x) => sum + decoBonus(decoById(x.t)), 0);
    $('decoN').textContent = `${list.length}/${DECO_MAX} · +${Math.round(bonus * 100)} %`;
    for (const dc of EURO_DECOS) {
      const cost = decoCost(dc);
      $('dc-' + dc.id).textContent = eur(cost);
      $('db-' + dc.id).disabled = state.money < cost || list.length >= DECO_MAX;
    }
    paintBuyMode(campus);
  }
}

function toggleCampus() { if (toggleSheet('campus', buildCampus)) playSound('click'); }

function initCampus() {
  $('bCampus').onclick = toggleCampus;
  campus.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-close')) { closeSheets(); return; }
    if (handleBuyModeClick(b)) { updateCampus(); return; }
    if (b.dataset.auto) { state.autoOn = !state.autoOn; save(); updateCampus(); return; }
    if (b.dataset.deco) { closeSheets(); startPlacing(b.dataset.deco); return; }
    if (b.dataset.go) { const d = BY[b.dataset.go]; focusOn(d); selectBuilding(d); return; }
    if (b.dataset.act) {
      const d = BY[b.dataset.act];
      if (state.b[d.id].lvl) upgrade(d);
      else if (build(d)) focusOn(d);
      updateCampus();
    }
  });
}

/* ===== js/ui/leaderboard.js ===== */
/**
 * Classement partagé entre joueurs, via la base de données de l'artifact claude.ai.
 * Hors de claude.ai (version web ou .exe), le classement est simplement indisponible.
 */

const PUSH_INTERVAL = 60000;
const board = { db: null, user: null, uid: null, rows: [], ready: false, canWrite: true, lastPush: 0, lastSignature: '' };
let onRowsChange = () => {};

async function initLeaderboard(onChange) {
  onRowsChange = onChange;
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) return;
    board.db = db; board.user = user;
    board.uid = user ? await user.id() : null;
    board.ready = true;
    db.collection('scores').orderBy('total', 'desc').limit(25).onSnapshot(
      snap => { board.rows = snap.docs.map(x => ({ id: x.id, ...x.data() })); onRowsChange(); },
      () => { board.ready = false; onRowsChange(); },
    );
    pushScore(true);
  } catch (e) { /* classement indisponible */ }
}

/** Envoie le score (au plus une fois par minute, sauf `force`). */
async function pushScore(force = false) {
  if (!board.db || !board.uid || !board.canWrite) return;
  const now = Date.now();
  if (!force && now - board.lastPush < PUSH_INTERVAL) return;
  const doc = {
    pseudo: state.pseudo || '', total: Math.floor(state.total), dip: totalGraduates(), promos: state.promos,
    ach: achievementCount(), best: Math.floor(Math.max(state.best, state.run)),
  };
  const signature = JSON.stringify(doc);
  if (signature === board.lastSignature) return;
  board.lastPush = now; board.lastSignature = signature;
  try { await board.db.doc('scores/' + board.uid).set({ ...doc, updated: now }); }
  catch (e) { if (e && e.code === 'invalid_argument') { board.canWrite = false; onRowsChange(); } }
}

/** Formulaire du pseudo et emplacement du classement (onglet du palmarès). */
const leaderboardTabHtml = () => `<div class="pseudo"><label for="lbPseudo">Nom affiché dans le classement</label><div class="pseudo-row"><input id="lbPseudo" maxlength="24" autocomplete="off" placeholder="Ton nom de direction"><button type="button" class="btn blue sm" id="lbSave">Enregistrer</button></div></div><div id="lbBox"></div>`;

const note = text => { const p = document.createElement('p'); p.className = 'small lb-note'; p.textContent = text; return p; };

/** Remplit la boîte du classement. Les noms viennent d'autres joueurs : textContent uniquement. */
async function renderLeaderboard() {
  const box = $('lbBox');
  if (!box) return;
  if (!board.ready) { box.replaceChildren(note('Le classement partagé s’affiche quand le jeu est ouvert depuis son lien claude.ai.')); return; }
  let profiles = {};
  try { if (board.user && board.rows.length) profiles = await board.user.profiles(board.rows.map(r => r.id)); } catch (e) { /* profils indisponibles */ }
  const list = document.createElement('ol');
  list.className = 'lb';
  board.rows.forEach((r, k) => {
    const li = document.createElement('li'); li.className = 'lb-row' + (r.id === board.uid ? ' me' : '');
    const rank = document.createElement('span'); rank.className = 'lb-rank'; rank.textContent = k + 1;
    const who = document.createElement('span'); who.className = 'lb-who';
    const name = document.createElement('b');
    name.textContent = (typeof r.pseudo === 'string' && r.pseudo) || (profiles[r.id] && profiles[r.id].name) || 'Direction anonyme';
    const sub = document.createElement('small'); sub.textContent = `${fmt(+r.dip || 0)} diplômés · ${+r.ach || 0} succès · ${+r.promos || 0} promos`;
    who.append(name, sub);
    const value = document.createElement('span'); value.className = 'lb-val'; value.textContent = eur(+r.total || 0);
    li.append(rank, who, value);
    list.appendChild(li);
  });
  box.replaceChildren();
  if (!board.rows.length) box.appendChild(note('Personne n’est encore classé. Ton score apparaîtra ici dans une minute.'));
  box.appendChild(list);
  box.appendChild(note(!board.uid ? 'Connecte-toi à claude.ai pour apparaître dans le classement.'
    : !board.canWrite ? 'Ton accès à cette page ne permet pas d’enregistrer ton score.'
    : 'Classé par total gagné depuis le début. Mis à jour toutes les minutes.'));
}

/** Fiche Palmarès : succès, défis, anciens élèves, statistiques et classement. */

const sheet = sheetEl('ach');
const TABS = [['ach', 'Succès'], ['dfi', 'Défis'], ['cards', 'Anciens'], ['stats', 'Stats'], ['lb', 'Classement']];
let currentTab = 'ach';

/** Courbe des revenus (échelle logarithmique), un point par minute de jeu. */
function incomeChartSvg() {
  const h = state.hist.slice(-240);
  if (h.length < 2) return '<p class="small">La courbe apparaît après quelques minutes de jeu (un point par minute).</p>';
  const W = 320, H = 150, padL = 42, padB = 22, padT = 10, padR = 8;
  const ys = h.map(p => Math.log10(Math.max(1, p[1]))), y0 = Math.floor(Math.min(...ys)), y1 = Math.max(y0 + 1, Math.ceil(Math.max(...ys)));
  const t0 = h[0][0], t1 = h[h.length - 1][0];
  const X = t => padL + (W - padL - padR) * (t1 > t0 ? (t - t0) / (t1 - t0) : 0), Y = v => H - padB - (H - padB - padT) * (v - y0) / (y1 - y0);
  const step = Math.max(1, Math.ceil((y1 - y0) / 4));
  let grid = '';
  for (let v = y0; v <= y1; v += step) grid += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d7deea" stroke-width="1"/><text x="${padL - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="#56607f">${fmt(Math.pow(10, v))}</text>`;
  const points = h.map((p, k) => `${X(p[0]).toFixed(1)},${Y(ys[k]).toFixed(1)}`).join(' ');
  const last = h[h.length - 1], span = (t1 - t0) / 1000;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus par seconde sur ${fmtDur(span)}">${grid}
    <polygon points="${padL},${H - padB} ${points} ${X(t1)},${H - padB}" fill="rgba(47,127,224,.12)"/><polyline points="${points}" fill="none" stroke="#2f7fe0" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(ys[ys.length - 1])}" r="4" fill="#ffc233" stroke="#1c2541" stroke-width="1.5"/>
    <text x="${padL}" y="${H - 5}" font-size="10" fill="#56607f">il y a ${fmtDur(span)}</text><text x="${W - padR}" y="${H - 5}" font-size="10" fill="#56607f" text-anchor="end">maintenant</text></svg>
    <p class="small" style="margin-top:4px">Revenus en €/s, échelle logarithmique (chaque ligne = ×${fmt(Math.pow(10, step))}).</p>`;
}

function challengeRow(c, set, weekly) {
  const goal = challengeGoal(c, set), value = Math.min(goal, set.prog[c.k] || 0), done = !!set.got[c.id];
  return `<li class="node ${done ? 'maxed' : ''}"><div class="rn"><b>${c.n}</b><small>${done ? 'Réussi !' : `${fmt(value)} / ${fmt(goal)}`} · ${weekly ? c.r : DAILY_REWARD} ECTS</small><div class="bar thin"><i style="width:${(value / goal * 100).toFixed(1)}%"></i></div></div></li>`;
}

const TAB_CONTENT = {
  ach: () => `<p class="kind" style="margin:10px 0 0">Chaque succès augmente tous tes revenus de ${Math.round(achievementBonus() * 100)} %, même après une remise des diplômes.</p>
      <ul class="ach-list">${ACHIEVEMENTS.map(a => `<li class="ach" id="ach-${a.id}"><span class="medal">${ICON.trophy}</span><div><b>${a.n}</b><small>${a.d}</small></div></li>`).join('')}</ul>`,
  dfi: () => {
    refreshChallenges();
    const now = new Date(), midnight = new Date(now);
    midnight.setHours(24, 0, 0, 0);
    return `<h3 class="eyebrow sec">Défis du jour · encore ${fmtDur((midnight - now) / 1000)}</h3><ul class="list">${state.daily.ids.map(id => challengeRow(DAILY_POOL.find(c => c.id === id), state.daily, false)).join('')}</ul>
      <p class="small">Réussis les 3 pour gagner ${DAILY_BONUS} ECTS de bonus${state.daily.all ? ' : c’est fait !' : '.'}</p>
      <h3 class="eyebrow sec">Défi de la semaine</h3><ul class="list">${state.weekly.ids.map(id => challengeRow(WEEKLY_POOL.find(c => c.id === id), state.weekly, true)).join('')}</ul>
      <p class="small">Les défis sont les mêmes pour tous les joueurs ce jour-là. Les crédits ECTS se dépensent dans Diplômes.</p>`;
  },
  cards: () => {
    const met = CARDS.filter(c => state.cards[c.id] > 0).length;
    return `<p class="kind" style="margin:10px 0 0">${met}/${CARDS.length} anciens élèves rencontrés. À chaque remise des diplômes, 1 à 4 anciens élèves reviennent te voir : chacun donne un bonus permanent, et les doublons le renforcent (jusqu’à ×${CARD_MAX}).</p>
      <ul class="cards">${CARDS.slice().sort((a, b) => b.r - a.r).map(collectionCardHtml).join('')}</ul>`;
  },
  stats: () => {
    const r = state.rec;
    return `<h3 class="eyebrow sec">Revenus (dernières heures de jeu)</h3>${incomeChartSvg()}
      <h3 class="eyebrow sec">Records</h3><div class="kv">
      <span>Meilleurs revenus</span><b>${eur(r.maxRate || 0)}/s</b>
      <span>Campus de Reims complet le plus vite</span><b>${r.fastCampus ? fmtDur(r.fastCampus) : '—'}</b>
      <span>Plus grosse promo</span><b>${fmt(state.bestGain || 0)} diplômés</b>
      <span>Meilleure année</span><b>${eur(r.bestRun || 0)}</b>
      <span>Total gagné</span><b>${eur(state.total)}</b>
      <span>Temps de jeu</span><b>${fmtDur(r.play || 0)}</b>
      <span>Événements vécus</span><b>${fmt(r.evts || 0)}</b>
      <span>Décisions prises</span><b>${fmt(r.decs || 0)}</b>
      <span>Remises des diplômes</span><b>${state.promos}</b></div>`;
  },
  lb: leaderboardTabHtml,
};

function buildPalmares() {
  sheet.innerHTML = `${sheetHeader('Palmarès', ICON.close)}
    <div class="seg tabs" role="tablist">${TABS.map(([id, name]) => `<button type="button" role="tab" aria-selected="${currentTab === id}" data-tab="${id}" class="${currentTab === id ? 'on' : ''}">${name}${id === 'ach' ? ' <span id="achCount"></span>' : ''}</button>`).join('')}</div>
    <div id="tabBody">${TAB_CONTENT[currentTab]()}</div>`;
  if ($('lbPseudo')) $('lbPseudo').value = state.pseudo || '';
  updatePalmares();
  if (currentTab === 'lb') renderLeaderboard();
}

function updatePalmares() {
  if (!isSheetOpen('ach') || !$('achCount')) return;
  $('achCount').textContent = `${achievementCount()}/${ACHIEVEMENTS.length}`;
  if (currentTab !== 'ach') return;
  for (const a of ACHIEVEMENTS) {
    const el = $('ach-' + a.id);
    if (!el) continue;
    el.classList.toggle('got', !!state.ach[a.id]);
    el.classList.toggle('locked', !state.ach[a.id]);
  }
}

/** Nouvelles lignes du classement reçues. */
function refreshLeaderboardTab() { if (isSheetOpen('ach') && currentTab === 'lb') renderLeaderboard(); }

function initPalmares() {
  $('bAch').onclick = () => { if (toggleSheet('ach', buildPalmares)) playSound('click'); };
  sheet.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-close')) closeSheets();
    else if (b.dataset.tab) { currentTab = b.dataset.tab; buildPalmares(); }
    else if (b.id === 'lbSave') {
      state.pseudo = $('lbPseudo').value.trim().slice(0, 24);
      save();
      pushScore(true);
      notify.toast('Nom enregistré.');
      renderLeaderboard();
    }
  });
}


/* ===== js/ui/graduation.js ===== */
/**
 * Fiche Diplômes : remise des diplômes, passage à la ville suivante, accréditation nationale
 * et conseil pédagogique (dépense des ECTS, branches débloquées au fil de la partie).
 */

const gradSheet = sheetEl('grad');
/** Bouton armé (premier clic) en attente de confirmation : 'gDo', 'gMove' ou 'gAcc'. */
let armedButton = null;

const treeNodeHtml = n => `<li class="node" id="tn-${n.id}"><div class="rn"><b>${n.n} <span class="lv" id="tl-${n.id}"></span></b><small id="td-${n.id}"></small></div><button type="button" class="btn blue sm" data-tree="${n.id}" id="tb-${n.id}"></button></li>`;

function branchLock(branch) {
  const need = branch.need;
  if (need.promos) return `s’ouvre après ${need.promos} remises des diplômes`;
  if (need.city) return `s’ouvre à ${SITES[need.city].name}`;
  return '';
}

function buildGraduation() {
  armedButton = null;
  const next = nextCity();
  const citySection = next
    ? `<h3 class="eyebrow sec">Ville suivante : ${next.full}</h3><p class="kind" id="gCityText"></p>
       <button class="btn go big" type="button" id="gMove"><span class="l1" id="gMoveL"></span><span class="l2" id="gMoveS"></span></button>`
    : `<h3 class="eyebrow sec">Accréditation nationale</h3>
       <div class="kv palmes"><span>Palmes académiques</span><b id="gPalmes"></b><span>À la prochaine accréditation</span><b id="gPalmesGain"></b></div>
       ${state.ended ? '<p class="end-note">Aventure terminée : les trois villes ont leur label d’excellence. Tu peux continuer à jouer ici aussi longtemps que tu veux.</p>' : ''}
       <p class="kind">Facultatif, pour rejouer : une fois Charleville labellisée, l’accréditation fait tout recommencer depuis Reims. Diplômés, ECTS et conseil pédagogique repartent de zéro, mais chaque palme donne +50 % de revenus et +10 % de diplômés pour toujours. Succès, anciens élèves, pépites et boutique sont conservés.</p>
       <button class="btn coin big" type="button" id="gAcc"><span class="l1" id="gAccL"></span><span class="l2" id="gAccS"></span></button>`;
  gradSheet.innerHTML = `${sheetHeader('Diplômes', ICON.close)}
    <p class="kind" style="margin:0 0 10px">À la cérémonie, l’année repart de zéro <b>dans la ville actuelle</b> (argent, bâtiments, responsables). En échange, chaque diplômé ajoute <b>+2 % à tous les revenus</b> pour toujours, et la promo rapporte des crédits ECTS pour le conseil pédagogique.</p>
    <div class="kv"><span>Diplômés</span><b id="gDip"></b><span>Crédits ECTS</span><b id="gEcts"></b><span>Gagnés cette année</span><b id="gRun"></b><span>À la prochaine cérémonie</span><b id="gGain"></b></div>
    <button class="btn coin big" type="button" id="gDo"><span class="l1" id="gDoL"></span><span class="l2" id="gDoS"></span></button>
    ${citySection}
    <h3 class="eyebrow sec">Conseil pédagogique</h3>
    ${BRANCHES.map(b => `<h4 class="br">${b.n}<small id="bl-${b.id}"></small></h4><ul class="list" id="bu-${b.id}">${TREE.filter(n => n.br === b.id).map(treeNodeHtml).join('')}</ul>`).join('')}`;
  updateGraduation();
}

/** Bouton à double clic : libellé normal, puis libellé de confirmation une fois armé. */
function paintArmed(id, ready, label, confirmLabel, sub, confirmSub) {
  const armed = armedButton === id;
  $(id).disabled = !ready;
  $(id).classList.toggle('hot', armed);
  $(id + 'L').textContent = armed ? confirmLabel : label;
  $(id + 'S').textContent = armed ? confirmSub : sub;
}

function updateGraduation() {
  if (!isSheetOpen('grad') || !$('gDip')) return;
  const gain = graduatesGain(), ready = state.run >= prestigeMin() && gain >= 1;
  $('gDip').textContent = `${fmt(state.dip)} · +${fmt(state.dip * 2)} %`;
  $('gEcts').textContent = fmt(state.ects);
  $('gRun').textContent = eur(state.run);
  $('gGain').textContent = ready ? `+${fmt(gain)} diplômés · +${fmt(ectsGain(gain))} ECTS` : '—';
  paintArmed('gDo', ready, 'Organiser la cérémonie', 'Confirmer : recommencer l’année',
    ready ? 'Plus tu attends, plus la promo est nombreuse' : `Gagne ${eur(prestigeMin())} dans l’année pour y accéder`,
    'Argent et bâtiments de la ville remis à zéro');

  const next = nextCity(), g = cityGoalProgress();
  if (next) {
    $('gCityText').textContent = g.done
      ? `Label d’excellence obtenu ! Une cérémonie de clôture a lieu (+${fmt(gain)} diplômés), puis tu t’installes à ${next.name}, qui formera ses propres diplômés. ${SITE_BY[state.city].name} reste visible et multiplie tous tes revenus par ${String(cityBonusFactor()).replace('.', ',')}.`
      : `Obtiens le label d’excellence : ${g.built}/${g.total} bâtiments construits, ${g.ready}/${g.depts} départements au niveau ${g.goal}.`;
    paintArmed('gMove', g.done, `S’installer à ${next.name}`, `Confirmer : partir pour ${next.name}`,
      g.done ? `+10 pépites et revenus ×${String(cityBonusFactor()).replace('.', ',')}` : 'Label d’excellence nécessaire', 'On repart de zéro dans la nouvelle ville');
  } else {
    $('gPalmes').textContent = `${state.palmes} · +${state.palmes * 50} %`;
    $('gPalmesGain').textContent = canAccredit() ? `+${palmesGain()}` : '—';
    paintArmed('gAcc', canAccredit(), 'Demander l’accréditation', 'Confirmer : tout recommencer depuis Reims',
      canAccredit() ? `+${palmesGain()} palmes et +15 pépites` : 'Label d’excellence de Charleville nécessaire', 'Diplômés, ECTS et conseil remis à zéro');
  }

  for (const b of BRANCHES) {
    const open = isBranchOpen(b.id);
    $('bl-' + b.id).textContent = open ? '' : ' · ' + branchLock(b);
    $('bu-' + b.id).classList.toggle('locked', !open);
  }
  for (const n of TREE) {
    const l = treeLevel(n.id), maxed = l >= n.max, cost = n.cost(l);
    $('tl-' + n.id).textContent = `${l}/${n.max}`;
    $('td-' + n.id).textContent = n.d(l);
    const b = $('tb-' + n.id);
    b.textContent = maxed ? 'Complet' : `${cost} ECTS`;
    b.disabled = maxed || state.ects < cost || !isBranchOpen(n.br);
    $('tn-' + n.id).classList.toggle('maxed', maxed);
  }
}

/** Fenêtre de fin de cérémonie (remise des diplômes ou changement de ville). */
function showCeremony(title, intro, result) {
  const alumni = result.alumni.length
    ? `<h3 class="eyebrow sec">Des anciens élèves reviennent te voir</h3><ul class="cards">${result.alumni.map(drawnCardHtml).join('')}</ul>` : '';
  openModal(title, `<p>${intro}</p><p>+${fmt(result.graduates)} diplômés (+${fmt(result.graduates * 2)} % de revenus pour toujours) et +${fmt(result.ects)} crédits ECTS.</p>${alumni}`,
    [{ label: 'C’est parti', cls: 'go', onClick: closeModal }]);
}

function holdCeremonyClicked() {
  const result = graduate();
  if (!result) return;
  closeSheets();
  pushScore(true);
  showCeremony(`Promotion n° ${state.promos} diplômée !`, 'Une nouvelle année commence.', result);
}

function moveClicked() {
  const result = moveToNextCity();
  if (!result) return;
  closeSheets();
  pushScore(true);
  showCeremony(`Bienvenue à ${result.city.name} !`, `Le label d’excellence est à toi. ${result.city.full} ouvre ses portes : nouvelle ville, nouvelle économie, et +10 pépites pour fêter ça.`, result);
}

function accreditClicked() {
  const result = accredit();
  if (!result) return;
  closeSheets();
  pushScore(true);
  openModal('Accréditation nationale !', `<p>L’IUT reçoit ${result.palmes} palme${result.palmes > 1 ? 's' : ''} académique${result.palmes > 1 ? 's' : ''} : +${result.palmes * 50} % de revenus pour toujours. Tout recommence depuis Reims, en beaucoup plus rapide.</p>`,
    [{ label: 'Nouvelle aventure', cls: 'go', onClick: closeModal }]);
}

const CONFIRMED_ACTIONS = { gDo: holdCeremonyClicked, gMove: moveClicked, gAcc: accreditClicked };

function initGraduation() {
  $('bGrad').onclick = () => { if (toggleSheet('grad', buildGraduation)) playSound('click'); };
  gradSheet.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-close')) closeSheets();
    else if (b.dataset.tree) { buyTreeNode(b.dataset.tree); updateGraduation(); }
    else if (CONFIRMED_ACTIONS[b.id]) {
      if (armedButton === b.id) { armedButton = null; CONFIRMED_ACTIONS[b.id](); }
      else { armedButton = b.id; updateGraduation(); }
    }
  });
}

/* ===== js/ui/mascot.js ===== */
/** Plume, la chouette tutoriel : affiche le premier conseil dont la condition est remplie. */

let currentTip = null, waitBeforeNext = 1.5;

function showPlumeTip(tip) {
  currentTip = tip;
  highlight.focus = tip.focus || null;
  $('plumeT').textContent = tip.title;
  $('plumeX').textContent = tip.text;
  $('mascot').hidden = false;
  const d = tip.focus && BY[tip.focus];
  if (d && d.site === state.site) focusOn(d);
}

/** Ferme la bulle sans marquer le conseil comme lu (conseils coupés dans les options). */
function hideMascot() {
  currentTip = null;
  highlight.focus = null;
  $('mascot').hidden = true;
}

function dismissTip() {
  if (currentTip) {
    state.tips[currentTip.id] = 1;
    if (currentTip.id === 'hello') state.intro = true;
  }
  hideMascot();
  waitBeforeNext = 4;
  save();
}

function updateMascot(dt) {
  if (currentTip || state.tipsOff || isModalOpen() || tutorialActive()) return;
  waitBeforeNext -= dt;
  if (waitBeforeNext > 0) return;
  const tip = TIPS.find(t => {
    if (state.tips[t.id]) return false;
    try { return t.when(); } catch (e) { return false; }
  });
  if (tip) showPlumeTip(tip); else waitBeforeNext = 1;
}

function initMascot() {
  $('plumeOk').onclick = () => { dismissTip(); playSound('click'); };
  $('plumeOff').onclick = () => {
    state.tipsOff = true;
    dismissTip();
    notify.toast('Conseils coupés. Tu peux les réactiver dans Options.');
  };
}

  const e = state.evt && eventById(state.evt.id);
  const money = eur(state.money), rate = eur(totalRate()) + '/s', stu = fmt(students()), dip = fmt(state.dip);
  const key = [money, rate, stu, dip, state.ects, state.gems, Math.ceil(state.boost), e ? e.id + Math.ceil(state.evt.t) : '', Math.ceil(state.rush), Math.ceil(state.coffee)].join('|');
  if (key === lastHudKey) return;
  lastHudKey = key;
  $('hMoney').textContent = money;
  $('hRate').textContent = rate;
  $('hStu').textContent = stu;
  $('hDip').textContent = dip;
  $('hDipSub').textContent = `diplômés · ${fmt(state.ects)} ECTS`;
  $('hGems').textContent = fmt(state.gems);

  $('hBoostT').textContent = Math.ceil(state.boost) + ' s';

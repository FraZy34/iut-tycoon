/* ===== js/audio/cine-score.js ===== */
/**
 * Bande-son de la cinématique d'introduction, synthétisée en direct et calée sur ses plans (120 bpm : 1 temps = 0,5 s,
 * 1 mesure = 2 s). Intro en nappes (la mineur), construction en arpèges, thème complet, montée, puis impact en do majeur
 * à l'apparition du logo (SCORE_LOGO_AT) et nappe qui tient pendant l'écran titre.
 * Le film de fin (ui/ending.js) joue un second morceau sur la même grille : cadence de victoire et feux d'artifice.
 * Les notes sont programmées au fil de l'eau (fenêtre de LOOKAHEAD s), comme la musique du jeu.
 */

/** Instant (s) de l'impact du logo ; les plans de la cinématique sont calés sur la même grille. */
const SCORE_LOGO_AT = 30;
/** Apparition des bâtiments de Reims (une croche chacun), pour le « pop ». */
const POP_START = 7, POP_STEP = 0.25, POP_COUNT = 16;

// Tout le reste vit dans une fermeture : le build réunit les modules dans une seule portée.
const cineScore = (() => {
  const BEAT = 0.5, BAR = 4 * BEAT;

  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // accords mesure par mesure : la m, fa, do, la m, fa, do, sol, la m, fa, do, sol, la m, fa, sol, sol → do majeur au logo
  const AM = [57, 60, 64], F = [53, 57, 60], C = [48, 52, 55], G = [55, 59, 62];
  const LEAD = [ // [mesure, temps, note, durée en temps] sur le thème (mesures 7 à 12)
    [7,0,76,1.5],[7,1.5,81,0.5],[7,2,84,1],[7,3,83,1],
    [8,0,81,2],[8,2,79,1],[8,3,77,1],
    [9,0,76,1.5],[9,1.5,79,0.5],[9,2,84,1],[9,3,88,1],
    [10,0,86,2],[10,2,83,1],[10,3,79,1],
    [11,0,84,1.5],[11,1.5,83,0.5],[11,2,81,1],[11,3,76,1],
    [12,0,77,1],[12,1,81,1],[12,2,84,1],[12,3,89,1],
  ];
  // fin de l'aventure : do, sol, la m, fa en boucle (cadence de victoire), thème lumineux en do majeur
  const LEAD_END = [
    [7,0,77,1],[7,1,81,1],[7,2,84,1.5],[7,3.5,81,0.5],
    [8,0,79,2],[8,2,76,1],[8,3,79,1],
    [9,0,79,1.5],[9,1.5,81,0.5],[9,2,83,1],[9,3,86,1],
    [10,0,84,2],[10,2,83,1],[10,3,81,1],
    [11,0,81,1],[11,1,84,1],[11,2,89,1],[11,3,88,1],
    [12,0,84,3],[12,3,79,1],
  ];
  /** Morceaux : accords par mesure, mélodie, coupes entre plans (souffle), pops de construction, feux d'artifice. */
  const pieces = () => ({
    intro: { bars: [AM, F, C, AM, F, C, G, AM, F, C, G, AM, F, G, G], lead: LEAD, cuts: [6, 14, 18, 22, 26], pops: true, sparks: [] },
    ending: { bars: [C, G, AM, F, C, G, AM, F, C, G, AM, F, C, G, G], lead: LEAD_END, cuts: [6, 12, 18, 24], pops: false, sparks: END_SPARKS },
  });
  const POP_NOTES = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96, 98, 100, 103, 105, 108];

  const LOOKAHEAD = 0.6;
  let ac = null, out = null, wet = null, noiseBuf = null, events = [], cursor = 0, t0 = 0, timer = null;

  /* ----- Instruments ----- */

  function voice(type, freq, t, dur, vol, { attack = 0.01, cutoff = 0, send = 0, detune = 0, slideTo = 0 } = {}) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
    let node = o;
    if (cutoff) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); node = f; }
    node.connect(g); g.connect(out);
    if (send) { const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(wet); }
    o.start(t); o.stop(t + attack + dur + 0.05);
  }
  function noise(t, dur, vol, { type = 'highpass', freq = 6000, sweepTo = 0, attack = 0.002, q = 0.7 } = {}) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + attack + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + attack + dur + 0.05);
  }
  const kick = (t, vol = 0.5, len = 0.22) => voice('sine', 150, t, len, vol, { attack: 0.004, slideTo: 38 });
  const snare = (t, vol = 0.12) => { noise(t, 0.16, vol, { type: 'bandpass', freq: 1900, q: 0.8 }); voice('triangle', 190, t, 0.08, vol * 0.8, { attack: 0.002 }); };
  const hat = (t, vol = 0.035) => noise(t, 0.04, vol, { freq: 8500 });
  function pad(chord, t, dur, vol, cutoff) {
    for (const m of chord) for (const d of [-7, 7]) voice('sawtooth', hz(m), t, dur, vol, { attack: 0.5, cutoff, detune: d, send: 0.15 });
  }
  const bell = (m, t, vol = 0.05) => { voice('sine', hz(m), t, 1.6, vol, { send: 0.5 }); voice('sine', hz(m) * 2.01, t, 0.6, vol * 0.3, { send: 0.5 }); };
  const whoosh = t => noise(t - 0.35, 0.55, 0.16, { type: 'bandpass', freq: 300, sweepTo: 3200, attack: 0.3, q: 1.4 });

  /* ----- Partition ----- */

  function compose(name) {
    const piece = pieces()[name] || pieces().intro;
    const ev = [], at = (t, fn) => ev.push([t, fn]);
    piece.bars.forEach((chord, bar) => {
      const t = bar * BAR;
      // nappes : sombres et filtrées au début, plus ouvertes ensuite
      const cutoff = bar < 3 ? 500 + bar * 350 : bar < 7 ? 1500 : 2200;
      at(t, s => pad(chord, s, BAR * 0.98, bar < 3 ? 0.022 : 0.016, cutoff));
      if (bar < 3) for (const [beat, m] of [[1, chord[2] + 24], [2.5, chord[1] + 24], [3.5, chord[0] + 36]]) at(t + beat * BEAT, s => bell(m, s, 0.035));
      if (bar >= 3 && bar < 13) { // arpèges en croches
        const notes = [chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[0] + 24];
        for (let k = 0; k < 8; k++) at(t + k * BEAT / 2, s => voice('triangle', hz(notes[k % 4]), s, 0.22, 0.05, { send: 0.3 }));
      }
      if (bar >= 3 && bar < 13) for (let b = 0; b < 4; b++) at(t + b * BEAT, s => kick(s, bar < 7 ? 0.35 : 0.5));
      if (bar >= 5 && bar < 13) for (let k = 0; k < 8; k++) at(t + k * BEAT / 2, s => voice('sawtooth', hz(chord[0] - 12 + (k % 2 ? 12 : 0)), s, 0.2, 0.07, { cutoff: 420 }));
      if (bar >= 7 && bar < 13) {
        for (const b of [1, 3]) at(t + b * BEAT, s => snare(s));
        for (let k = 0; k < 8; k++) at(t + k * BEAT / 2, s => hat(s, k % 2 ? 0.025 : 0.04));
      }
    });
    for (const [bar, beat, m, len] of piece.lead) at(bar * BAR + beat * BEAT, s => {
      voice('square', hz(m), s, len * BEAT * 0.95, 0.03, { cutoff: 3200, send: 0.35 });
      voice('triangle', hz(m), s, len * BEAT, 0.05, { send: 0.35 });
    });
    // montée : souffle qui s'ouvre, roulement de caisse claire, accords frappés
    const rise = 13 * BAR;
    at(rise, s => noise(s, 2 * BAR, 0.12, { freq: 200, sweepTo: 7000, attack: 2 * BAR - 0.1 }));
    for (let k = 0; k < 24; k++) {
      const t = rise + (k < 8 ? k * BEAT / 2 : k < 16 ? 4 * BEAT + (k - 8) * BEAT / 4 : 6 * BEAT + (k - 16) * BEAT / 4);
      at(t, s => snare(s, 0.05 + k * 0.005));
    }
    for (let b = 0; b < 8; b++) at(rise + b * BEAT, s => { kick(s, 0.4); for (const m of G) voice('sawtooth', hz(m), s, 0.25, 0.02 + b * 0.004, { cutoff: 1800 }); });
    // impact du logo : boum, cymbale, grand accord de do majeur, étincelles
    const hit = SCORE_LOGO_AT;
    at(hit, s => {
      kick(s, 0.9, 1.1);
      noise(s, 2.8, 0.14, { freq: 3500 });
      for (const m of [36, 43, 48, 55, 60, 64, 67, 72, 76]) voice('sawtooth', hz(m), s, 5.5, 0.022, { attack: 0.02, cutoff: 2600, detune: (m % 3 - 1) * 8, send: 0.3 });
    });
    [84, 88, 91, 96, 100].forEach((m, k) => at(hit + 0.15 + k * 0.12, s => bell(m, s, 0.05)));
    // nappe de l'écran titre (do, la m, fa, sol), qui s'éteint doucement
    [[48, 52, 55], AM, F, G, [48, 52, 55], AM].forEach((chord, k) => at(hit + 4 + k * BAR, s => pad(chord, s, BAR, 0.014 * (1 - k * 0.12), 1400)));
    for (const c of piece.cuts) at(c - 0.4, s => whoosh(s + 0.4));
    // feux d'artifice : sifflement qui monte, détonation sourde, crépitement
    for (const t of piece.sparks) {
      at(t - 0.55, s => voice('sine', 900, s, 0.5, 0.012, { attack: 0.05, slideTo: 2600 }));
      at(t, s => { voice('sine', 110, s, 0.5, 0.18, { attack: 0.004, slideTo: 40 }); noise(s, 0.25, 0.08, { type: 'lowpass', freq: 900 }); });
      at(t + 0.12, s => noise(s, 0.9, 0.045, { type: 'bandpass', freq: 4200, q: 0.5 }));
    }
    if (piece.pops) for (let k = 0; k < POP_COUNT; k++) at(POP_START + k * POP_STEP, s => {
      voice('sine', hz(POP_NOTES[k]), s, 0.12, 0.09, { attack: 0.003, slideTo: hz(POP_NOTES[k] + 7) });
      voice('triangle', hz(POP_NOTES[k] - 12), s, 0.08, 0.05, { attack: 0.003 });
    });
    return ev.sort((a, b) => a[0] - b[0]);
  }

  function pump() {
    const now = ac.currentTime - t0;
    try {
      while (cursor < events.length && events[cursor][0] < now + LOOKAHEAD) {
        const [t, fn] = events[cursor++];
        fn(t0 + Math.max(t, now));
      }
    } catch (e) { /* contexte audio fermé : la cinématique continue sans le son */ }
  }

  function start(from, name = 'intro') {
    stop(0);
    ac = audioCtx();
    if (!ac || !state.music) return false;
    out = ac.createGain();
    out.gain.value = 0.9 * state.musicVol;
    out.connect(ac.destination);
    // écho (croche pointée) pour donner de l'espace
    wet = ac.createGain(); wet.gain.value = 0.22;
    const delay = ac.createDelay(1), back = ac.createGain();
    delay.delayTime.value = BEAT * 0.75; back.gain.value = 0.32;
    wet.connect(delay); delay.connect(back); back.connect(delay); delay.connect(out);
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    events = compose(name);
    t0 = ac.currentTime + 0.05 - from;
    cursor = events.findIndex(e => e[0] >= from);
    if (cursor < 0) cursor = events.length;
    pump();
    timer = setInterval(pump, 100);
    return true;
  }

  const time = () => (timer && ac ? ac.currentTime - t0 : null);

  function stop(fade) {
    if (timer) { clearInterval(timer); timer = null; }
    if (out && ac) {
      const g = out, now = ac.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(0, now + Math.max(0.01, fade));
      setTimeout(() => { try { g.disconnect(); } catch (e) { /* déjà déconnecté */ } }, fade * 1000 + 100);
    }
    out = null;
  }

  return { start, time, stop };
})();

/** Lance la bande-son (`piece` : 'intro' ou 'ending') à partir de l'instant `from` (s). Retourne false sans son (contexte bloqué, musique coupée). */
const startScore = (from = 0, piece = 'intro') => cineScore.start(from, piece);
/** Temps écoulé dans la bande-son (s), ou null si elle ne joue pas. */
const scoreTime = () => cineScore.time();
/** Coupe la bande-son en fondu (s). */
const stopScore = (fade = 0.8) => cineScore.stop(fade);


/* ===== js/ui/cinematic.js ===== */
/**
 * Cinématique d'introduction (premier lancement, ou Options → Revoir l'introduction).
 *
 * Elle filme le vrai moteur du jeu : la partie est mise de côté (sauvegarde suspendue) et remplacée par une vitrine
 * où tout est construit, puis six plans traversent les trois villes (aube, plein jour, coucher de soleil, nuit)
 * avant le logo. Les plans sont calés sur la bande-son (audio/cine-score.js) : son horloge fait foi quand elle joue.
 * Un écran de départ précède le film : le clic qu'il demande autorise le son dans le navigateur.
 *
 * Le moteur joue un « film » : plans, écrans (HTML), décor (état affiché), morceau de la bande-son.
 * L'introduction est le film par défaut ; le film de fin de l'aventure est dans ui/ending.js.
 */

/**
 * Plans : début (s), ville, nuit (0 à 0,85), saison, étalonnage (CSS), caméra [x, y, zoom relatif] de début et de fin,
 * légende, et ce qui s'y passe. Le zoom est relatif à celui qui cadre le campus sur cet écran.
 */
const CINE_SHOTS = [
  { at: 0, site: 'reims', night: 0.1, season: 'printemps', grade: 'dawn', from: [760, 40, 1.25], to: [470, 150, 1.25], empty: true,
    cap: ['Champagne-Ardenne', 'Trois villes. Un seul rêve.'] },
  { at: 6, site: 'reims', night: 0, season: 'printemps', grade: 'day', from: [0, 410, 1], to: [0, 395, 1.12], empty: true, pops: true,
    cap: ['Reims · Moulin de la Housse', 'Bâtis ton IUT'] },
  { at: 14, site: 'reims', night: 0, season: 'ete', grade: 'gold', from: [-330, 330, 1.85], to: [40, 430, 1.85], money: true,
    cap: ['Départements · BU · Cafét’ · Crous', 'Fais-le prospérer'] },
  { at: 18, site: 'chalons', night: 0.15, season: 'automne', grade: 'dusk', from: [-500, 150, 1.4], to: [-130, 190, 1.4], bubbles: true,
    cap: ['Châlons-en-Champagne', 'Fais pétiller le champagne'] },
  { at: 22, site: 'charle', night: 0.85, season: 'ete', grade: 'night', from: [-140, 520, 1.3], to: [250, 330, 1.3], puppets: true,
    cap: ['Charleville-Mézières', 'Fais vivre la nuit'] },
  { at: 26, site: 'reims', night: 0, season: 'printemps', grade: 'day', from: [0, 430, 1.22], to: [0, 405, 1.38], graduation: true,
    cap: ['Remise des diplômes', 'Forme des générations'] },
  { at: SCORE_LOGO_AT, site: 'reims', night: 0.2, season: 'ete', grade: 'gold', from: [0, 380, 0.95], to: [0, 420, 1.15], logo: true, dur: 16 },
];
/** Demi-durée du passage au noir entre deux plans (s). */
const CUT_FADE = 0.3;
/** Niveaux de la vitrine : bâtiments à leur plus grande taille, étoiles de prestige. */
const SHOW_DEPT_LEVEL = 420, SHOW_SVC_LEVEL = 170;

let cine = null;

const showLevel = d => (d.kind === 'dept' ? SHOW_DEPT_LEVEL : SHOW_SVC_LEVEL);
const cineEase = p => p * p * (3 - 2 * p);
const cineLerp = (a, b, p) => a + (b - a) * p;
const fitZoom = () => clamp(Math.min(view.w / 1100, view.h / 720), 0.5, 1.2);

function showcaseState(real) {
  const s = freshState();
  for (const d of DEFS) s.b[d.id] = { lvl: showLevel(d), mgr: true };
  for (const k of ['music', 'muted', 'musicVol', 'sfxVol', 'eco']) s[k] = real[k];
  return s;
}

/**
 * Film d'introduction. Un film : plans (liste, ou fonction de l'état réel), html(owl, real), stage(real) = état affiché,
 * piece = morceau de la bande-son, sparks = feux d'artifice (s), real = garder les niveaux de l'état affiché,
 * skipToLogo = « Passer » mène à l'écran final au lieu de fermer.
 */
const introFilm = () => ({ shots: CINE_SHOTS, html: owl => cineHtml(owl), stage: showcaseState, piece: 'intro', sparks: [], real: false, skipToLogo: false });

/* ----- Interface ----- */

const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
const SOUND_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/** Calques communs à tous les films : étalonnage, reflet, vignette, bandes noires, légende. */
const CINE_LAYERS = `<div class="cine-grade"></div><div class="cine-flare"></div><div class="cine-vignette"></div>
  <div class="cine-bar top"></div><div class="cine-bar bottom"></div>
  <div class="cine-cap" aria-live="polite"><span class="cine-eyebrow"></span><h2 class="cine-title"></h2></div>`;

function cineHtml(owl) {
  return `${CINE_LAYERS}
  <div class="cine-logo" aria-hidden="true">
    <div class="cine-crest">${owl}</div>
    <h1 class="cine-word"><span class="cine-iut">IUT</span><span class="cine-ty"><span class="ty-back">Tycoon</span><span class="ty-front">Tycoon</span></span></h1>
    <p class="cine-sub">Reims · Châlons-en-Champagne · Charleville-Mézières</p>
    <p class="cine-tag">Deviens le directeur d’IUT le plus légendaire de la région.</p>
    <button type="button" class="btn go big cine-go" id="cineGo">Commencer l’aventure</button>
  </div>
  <div class="cine-fade"></div><div class="cine-flash"></div>
  <div class="cine-start" id="cineStart">
    <p class="cine-kicker">Champagne-Ardenne</p>
    <h1 class="cine-ask">Prêt à diriger un IUT&nbsp;?</h1>
    <p class="cine-pitch">Trois villes, des milliers d’étudiants, un seul directeur : toi.</p>
    <button type="button" class="cine-play" id="cinePlay"><span class="cine-ring"></span>${PLAY_ICON}<b>Lancer l’aventure</b></button>
    <p class="cine-hint">${SOUND_ICON} Monte le son</p>
  </div>
  <button type="button" class="cine-skip" id="cineSkip">Passer l’intro <span aria-hidden="true">›</span></button>`;
}

/** Légende : chaque mot glisse à son tour. */
function showCaption([eyebrow, title]) {
  const cap = cine.el.querySelector('.cine-cap');
  cap.querySelector('.cine-eyebrow').textContent = eyebrow;
  cap.querySelector('.cine-title').innerHTML = title.split(' ').map((w, k) => `<span style="--i:${k}"><i>${w}</i></span>`).join(' ');
  cap.classList.remove('show', 'out');
  void cap.offsetWidth; // relance l'animation : les mots partent d'en bas
  cap.classList.add('show');
}
function hideCaption() {
  const cap = cine.el.querySelector('.cine-cap');
  if (cap.classList.contains('show')) cap.classList.replace('show', 'out');
}

/* ----- Plans ----- */

function enterShot(index) {
  const shot = cine.shots[index];
  cine.shot = index;
  state.site = state.city = shot.site;
  world.night = shot.night; world.season = shot.season; world.weather = 'clair'; world.snow = 0;
  for (const d of SITE_DEFS[shot.site]) { if (!cine.film.real) state.b[d.id].lvl = shot.empty ? 0 : showLevel(d); d.anim = -99; }
  clearCritters(); clearEffects(); resetWalkers(shot.empty ? 6 : 48); resetBackdropTiles();
  if (shot.puppets) { const puppet = CRITTERS.find(c => c.id === 'puppet'); for (let k = 0; k < 5; k++) spawnCritter(puppet); }
  cine.el.dataset.grade = shot.grade;
  cine.pops = 0; cine.nextFx = shot.at + 0.5;
  if (shot.pops) cine.popOrder = [...SITE_DEFS.reims].sort((a, b) => plotDistance(a) - plotDistance(b));
  if (shot.cap) setTimeout(() => cine && cine.shot === index && showCaption(shot.cap), 450);
  else hideCaption();
  cine.el.classList.toggle('logo-on', !!shot.logo);
}

/** Distance d'un bâtiment au centre du campus : ils apparaissent du centre vers l'extérieur. */
const plotDistance = d => Math.hypot(d.plot[0] + d.plot[2] / 2 - N / 2, d.plot[1] + d.plot[3] / 2 - N / 2);

function popBuilding(d) {
  state.b[d.id].lvl = showLevel(d);
  d.anim = world.t;
  dustOn(d);
  const [x, y] = buildingAnchor(d);
  burstAt(x, y + 30, 10);
  floatAt(x, y, d.short, '#ffffff', 0.9);
}

/** Couleurs des feux d'artifice (lumineuses : elles s'additionnent sur la nuit). */
const FIREWORK_COLORS = ['#ffd35c', '#ff6a3d', '#ec5496', '#7fd8ff', '#8dff9e', '#c99bff'];

/** Feu d'artifice dans le ciel, quelque part dans le haut de l'image : deux couronnes d'étincelles qui retombent lentement. */
function fireworkBurst() {
  const s = 1 / camera.z, x = camera.x + (Math.random() - 0.5) * 0.7 * view.w * s, y = camera.y - (0.14 + Math.random() * 0.24) * view.h * s;
  const color = pick(FIREWORK_COLORS), n = REDUCED_MOTION ? 8 : 60;
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2 + Math.random() * 0.1, ring = k % 3 ? 1 : 0.55, v = 205 * s * ring * (0.9 + Math.random() * 0.2);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 70 * s, life: 1.3 + Math.random() * 0.6, max: 1.9,
      color, r: (ring < 1 ? 2.6 : 3.6) * (1 + Math.random() * 0.5) * s, glow: true });
  }
}

/** Effets du plan en cours, au fil du temps `t`. */
function shotEffects(shot, t) {
  const sparks = cine.film.sparks;
  while (cine.spark < sparks.length && t >= sparks[cine.spark]) { cine.spark++; fireworkBurst(); }
  if (shot.pops) {
    while (cine.pops < POP_COUNT && cine.pops < cine.popOrder.length && t >= POP_START + cine.pops * POP_STEP) popBuilding(cine.popOrder[cine.pops++]);
    return;
  }
  if (t < cine.nextFx) return;
  if (shot.money) {
    cine.nextFx = t + 0.32;
    const d = pick(SITE_DEFS.reims.filter(x => x.kind === 'dept')), [x, y] = buildingAnchor(d);
    floatAt(x + (Math.random() - 0.5) * 30, y, '+' + eur(Math.pow(10, 3 + Math.random() * 6)), '#ffc233', 0.9);
  } else if (shot.bubbles) {
    cine.nextFx = t + 0.18;
    const i = Math.random() < 0.5 ? Math.random() * 2 : 16 + Math.random() * 8, j = i < 2 ? 3 + Math.random() * 7 : Math.random() * 2;
    if (isVine(Math.floor(i), Math.floor(j))) { const [x, y] = iso(i, j, 10); burstAt(x, y, 4, '#fff1b8'); }
  } else if (shot.graduation) {
    cine.nextFx = t + 99;
    celebrate();
    const [x, y] = iso(N / 2, N / 2, 60);
    floatAt(x, y, shot.gradText || '+1 280 diplômés', '#ffc233', 1.8);
    for (const d of SITE_DEFS.reims.filter(x => x.kind === 'dept')) { const [bx, by] = buildingAnchor(d); burstAt(bx, by, 12); }
  }
}

function placeCamera(shot, t) {
  const next = cine.shots[cine.shot + 1], dur = next ? next.at - shot.at : shot.dur;
  const p = cineEase(clamp((t - shot.at) / dur, 0, 1)), z = fitZoom();
  camera.x = cineLerp(shot.from[0], shot.to[0], p);
  camera.y = cineLerp(shot.from[1], shot.to[1], p);
  camera.z = z * cineLerp(shot.from[2], shot.to[2], p);
  stopCameraGlide();
  clampCamera();
}

/** Noir entre les plans, ouverture au début, éclair blanc au logo. */
function paintFades(t) {
  let black = t < 1.2 ? 1 - t / 1.2 : 0;
  for (const s of cine.shots.slice(1, -1)) black = Math.max(black, 1 - Math.abs(t - s.at) / CUT_FADE);
  cine.fade.style.opacity = clamp(black, 0, 1).toFixed(3);
  cine.flash.style.opacity = clamp(t < SCORE_LOGO_AT ? 1 - (SCORE_LOGO_AT - t) / 0.12 : 1 - (t - SCORE_LOGO_AT) / 0.7, 0, 1).toFixed(3);
}

/* ----- Déroulé ----- */

/** Horloge du film : celle de la bande-son quand elle joue, sinon le temps réel. */
function cineClock() {
  const s = scoreTime();
  return s != null && cine.withScore ? s : (performance.now() - cine.startedAt) / 1000;
}

function playCinematic() {
  if (cine.playing) return;
  openAudioContext();
  cine.playing = true;
  cine.el.classList.add('playing');
  cine.startedAt = performance.now();
  cine.withScore = startScore(0, cine.film.piece);
  cine.lastShown = -1;
}

/** « Passer » d'un film qui se termine par un écran à lire (la fin) : saute juste avant l'écran final. */
function skipToLogo() {
  if (!cine || !cine.playing) return;
  const at = SCORE_LOGO_AT - 0.4;
  if (cineClock() >= at) return;
  cine.withScore = startScore(at, cine.film.piece);
  cine.startedAt = performance.now() - at * 1000;
  const next = cine.film.sparks.findIndex(s => s >= at);
  cine.spark = next < 0 ? cine.film.sparks.length : next;
  hideCaption();
}

/** À chaque image tant que la cinématique est ouverte (la partie est en pause). */
function updateCinematic(dt) {
  if (!cine) return;
  world.t += dt;
  updateWalkers(dt);
  updateCritters(dt);
  updateEffects(dt);
  if (!cine.playing) { // écran de départ : le premier plan défile doucement derrière
    cine.idle += dt;
    const shot = cine.shots[0], p = (Math.sin(cine.idle * 0.15) + 1) / 2;
    camera.x = cineLerp(shot.from[0], shot.to[0], p * 0.4); camera.y = cineLerp(shot.from[1], shot.to[1], p * 0.4); camera.z = fitZoom() * shot.from[2];
    clampCamera();
    return;
  }
  const t = cineClock();
  let index = 0;
  while (index + 1 < cine.shots.length && t >= cine.shots[index + 1].at) index++;
  if (index !== cine.shot) enterShot(index);
  const shot = cine.shots[index], next = cine.shots[index + 1];
  if (next && !next.logo && t > next.at - 0.55) hideCaption();
  placeCamera(shot, t);
  shotEffects(shot, t);
  paintFades(t);
}

const cinematicActive = () => !!cine;

/**
 * Ouvre la cinématique. `immediate` : sans écran de départ (le joueur vient de cliquer, le son est déjà autorisé).
 * `onDone` est appelé à la fin, la partie remise en place. `film` : l'introduction par défaut (voir introFilm).
 */
function startCinematic({ immediate = false, onDone = null, film = introFilm() } = {}) {
  if (cine) return;
  const real = state, el = document.createElement('div');
  el.id = 'cine';
  el.innerHTML = film.html(document.querySelector('#mascot .owl')?.innerHTML || '', real);
  document.body.appendChild(el);
  $('app').classList.add('cine-mode');
  cine = {
    el, fade: el.querySelector('.cine-fade'), flash: el.querySelector('.cine-flash'), onDone, real, film,
    shots: typeof film.shots === 'function' ? film.shots(real) : film.shots,
    saved: { night: world.night, season: world.season, weather: world.weather, snow: world.snow },
    shot: -1, playing: false, idle: 0, pops: 0, nextFx: 0, spark: 0, withScore: false, startedAt: 0,
  };
  highlight.hover = null;
  for (const d of DEFS) d.ghost = 0;
  save();
  lockSave(true);
  holdMusic(true);
  setState(film.stage(real));
  enterShot(0);
  cine.shot = -1; // le premier plan sera « entré » de nouveau au lancement (légende)
  const play = el.querySelector('#cinePlay');
  if (play) play.onclick = playCinematic;
  el.querySelector('#cineSkip').onclick = film.skipToLogo ? skipToLogo : endCinematic;
  el.querySelector('#cineGo').onclick = endCinematic;
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); film.skipToLogo ? skipToLogo() : endCinematic(); }
  });
  if (immediate || !play) playCinematic();
  else play.focus();
}

/** Ferme la cinématique et rend la partie. */
function endCinematic() {
  if (!cine) return;
  const { el, real, saved, onDone } = cine;
  cine = null;
  stopScore(0.9);
  setState(real);
  lockSave(false);
  for (const d of DEFS) d.anim = -99;
  Object.assign(world, { night: saved.night, season: saved.season, weather: saved.weather, snow: saved.snow });
  clearCritters(); clearEffects(); resetBackdropTiles();
  resetWalkers(24);
  fitCamera();
  state.cine = true;
  save();
  $('app').classList.remove('cine-mode');
  el.classList.add('closing');
  setTimeout(() => el.remove(), 600);
  setTimeout(() => holdMusic(false), 700);
  if (onDone) onDone();
}


/* ===== js/ui/ending.js ===== */
/**
 * Fin de l'aventure : dès que Charleville obtient son label d'excellence (les trois villes terminées), un film de fin
 * survole les vrais campus du joueur (feu d'artifice, champagne, remise des diplômes), puis l'écran « Aventure terminée »
 * avec le bilan de la partie. Rien n'est remis à zéro : on continue à jouer ensuite, l'accréditation reste facultative.
 * Le film utilise le moteur de la cinématique (ui/cinematic.js) et le morceau « ending » de la bande-son.
 * Il ne se déclenche qu'une fois (state.ended) ; Options → Revoir la fin le rejoue.
 */

/** Feux d'artifice (s), calés sur la bande-son : à Charleville, au dernier plan, puis derrière l'écran de fin. */
const END_SPARKS = [0.7, 1.5, 2.2, 2.9, 3.6, 4.3, 5.0, 24.8, 26.0, 27.2, 31.0, 31.8, 32.9, 33.6, 34.8, 35.7, 37.2, 38.4, 40.1, 41.5, 43.4, 45.0];
/** Délai entre le label de Charleville et le début du film (s) : le temps de voir les confettis. */
const ENDING_DELAY = 2.6;

/** Plans du film de fin (même grille que l'introduction : la musique éclate à SCORE_LOGO_AT sur l'écran final). */
function endingShots(real) {
  return [
    { at: 0, site: 'charle', night: 0.85, season: 'ete', grade: 'night', from: [-140, 520, 1.3], to: [250, 330, 1.3], puppets: true,
      cap: ['Charleville-Mézières', 'Le dernier label est à toi'] },
    { at: 6, site: 'chalons', night: 0.15, season: 'automne', grade: 'dusk', from: [-500, 150, 1.4], to: [-130, 190, 1.4], bubbles: true,
      cap: ['Châlons-en-Champagne', 'Le champagne coule à flots'] },
    { at: 12, site: 'reims', night: 0, season: 'ete', grade: 'gold', from: [-330, 330, 1.85], to: [40, 430, 1.85], money: true,
      cap: ['Reims · Moulin de la Housse', 'Là où tout a commencé'] },
    { at: 18, site: 'reims', night: 0, season: 'printemps', grade: 'day', from: [0, 430, 1.22], to: [0, 405, 1.38], graduation: true,
      gradText: `${fmt(real.dipDone + real.dip)} diplômés`, cap: ['Remise des diplômes', 'Des générations formées'] },
    { at: 24, site: 'reims', night: 0.45, season: 'ete', grade: 'dusk', from: [0, 400, 1.05], to: [0, 390, 0.8],
      cap: ['Champagne-Ardenne', 'Trois villes. Un rêve accompli.'] },
    { at: SCORE_LOGO_AT, site: 'reims', night: 0.6, season: 'ete', grade: 'night', from: [0, 380, 0.95], to: [0, 420, 1.15], logo: true, dur: 16 },
  ];
}

/** Bilan affiché sur l'écran de fin. */
function endingStats(real) {
  const left = SITES.slice(0, -1).reduce((sum, s) => sum + (real.rec['city_' + s.id] || 0), 0);
  const played = left + Math.max(0, (Date.now() - real.cityStart) / 1000);
  const unlocked = ACHIEVEMENTS.filter(a => real.ach[a.id]).length;
  return [
    ['Temps de jeu', fmtDur(played)],
    ['Argent gagné', eur(real.total)],
    ['Diplômés', fmt(real.dipDone + real.dip)],
    ['Succès', `${unlocked} / ${ACHIEVEMENTS.length}`],
  ];
}

function endingHtml(owl, real) {
  const stats = endingStats(real).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  return `${CINE_LAYERS}
  <div class="cine-logo end-card" role="dialog" aria-label="Fin de l’aventure">
    <div class="cine-crest">${owl}</div>
    <p class="cine-sub end-kicker">Félicitations, directeur !</p>
    <h1 class="cine-word end-word"><span class="cine-iut">AVENTURE</span><span class="cine-ty"><span class="ty-back">Terminée !</span><span class="ty-front">Terminée !</span></span></h1>
    <p class="cine-sub">Reims · Châlons-en-Champagne · Charleville-Mézières : trois labels d’excellence</p>
    <dl class="end-stats">${stats}</dl>
    <p class="cine-tag">Merci d’avoir joué ! Ton IUT continue de tourner : tu peux continuer à faire grandir tes campus.</p>
    <button type="button" class="btn go big cine-go" id="cineGo">Continuer à jouer</button>
  </div>
  <div class="cine-fade"></div><div class="cine-flash"></div>
  <button type="button" class="cine-skip" id="cineSkip">Passer <span aria-hidden="true">›</span></button>`;
}

/** Film de fin : les vrais campus du joueur (copie de la partie), tels qu'il les a construits. */
const endingFilm = () => ({ shots: endingShots, html: endingHtml, stage: endingStage, piece: 'ending', sparks: END_SPARKS, real: true, skipToLogo: true });

/** Décor du film : une copie de la partie, sans argent (pas de flèches d'amélioration à l'image). */
const endingStage = real => ({ ...structuredClone(real), money: 0, tipsOff: true });

function playEnding({ replay = false } = {}) {
  if (cinematicActive()) return;
  closeModal();
  closeSheets();
  hideMascot();
  state.ended = true;
  startCinematic({
    immediate: true, film: endingFilm(),
    onDone: () => { if (!replay) notify.toast('Mode libre : tes campus continuent de tourner. Bonne continuation, directeur !', 'gold'); },
  });
}

let endingTimer = null;

/** Deux fois par seconde : la fin se déclenche une seule fois, quand les trois villes sont labellisées. */
function checkEnding() {
  if (state.ended || endingTimer || !canAccredit() || tutorialActive() || cinematicActive()) return;
  closeSheets();
  celebrate();
  playSound('boost');
  notify.toast('Label d’excellence de Charleville : les trois villes sont terminées !', 'gold');
  endingTimer = setTimeout(() => { endingTimer = null; playEnding(); }, ENDING_DELAY * 1000);
}


/* ===== js/ui/options.js ===== */
/** Fenêtre Options : son, musique, conseils, mode économie, export/import de la sauvegarde, nouvelle partie. */

/** Position d'un curseur de volume : 0 si le son est coupé. */
const volumePercent = (on, volume) => (on ? Math.round(volume * 100) : 0);

/** Bouton à double clic : le premier arme (texte de confirmation), le second exécute. */
function confirmButton(button, confirmLabel, action, onArm = () => {}) {
  let armed = false;
  button.onclick = () => {
    if (armed) { action(); return; }
    armed = true;
    button.textContent = confirmLabel;
    button.classList.add('hot');
    onArm();
  };
}

function bindSaveCode() {
  const box = $('oIO'), code = $('oCode'), msg = $('oMsg'), load = $('oLoad');
  $('oExport').onclick = () => {
    box.hidden = false;
    $('oLbl').textContent = 'Ton code de sauvegarde (garde-le précieusement) :';
    code.value = encodeSave();
    $('oCopy').hidden = false; load.hidden = true; msg.textContent = '';
    code.select();
  };
  $('oImport').onclick = () => {
    box.hidden = false;
    $('oLbl').textContent = 'Colle ici un code de sauvegarde :';
    code.value = '';
    $('oCopy').hidden = true; load.hidden = false; msg.textContent = '';
    load.textContent = 'Charger ce code'; load.classList.remove('hot');
    bindLoad();
    code.focus();
  };
  $('oCopy').onclick = () => {
    const fallback = () => { code.select(); msg.textContent = 'Sélectionné : copie-le avec Ctrl+C.'; };
    try { navigator.clipboard.writeText(code.value).then(() => { msg.textContent = 'Code copié.'; }, fallback); } catch (e) { fallback(); }
  };
  const bindLoad = () => {
    let armed = false;
    load.onclick = () => {
      let data;
      try { data = decodeSave(code.value); } catch (e) {
        msg.textContent = `Ce code n’est pas valide. Vérifie qu’il commence par ${SAVE_CODE_PREFIX} et qu’il est complet.`;

      }

        load.textContent = 'Confirmer : remplacer ma partie';
        load.classList.add('hot');
        msg.textContent = 'Ta partie actuelle sera remplacée.';

      closeSheets();
      closeModal();
    };
  };
}

/** Carte de décision : deux options, un compte à rebours, et le temps d'attente si l'option n'est pas encore payable. */

function optionHtml(option, index) {
  const cost = optionCost(option);
  return `<button type="button" class="btn ${index ? '' : 'blue'} dec-opt" data-dec="${index}"><b>${option.l}</b><small>${option.txt}${cost ? ' · ' + eur(cost) : ''}</small><small class="dec-wait" id="decWait${index}"></small></button>`;

function renderDecision() {
  const el = $('decision');
  if (!decision) { el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = `<div class="dec-top"><span class="eyebrow">Décision à prendre</span><span class="dec-t" id="decT"></span></div><h3>${decision.n}</h3><p>${decision.d}</p><div class="dec-opts">${optionHtml(decision.a, 0)}${optionHtml(decision.b, 1)}</div><div class="bar thin"><i id="decBar"></i></div><p class="dec-def">Sans réponse, « ${decision.b.l} » sera choisi.</p>`;
  el.hidden = false;
  updateDecisionCard();
}

/** Compte à rebours, boutons payables et temps d'attente (appelé à chaque image). */
function updateDecisionCard() {
  if (!decision) return;
  const timer = $('decT'), bar = $('decBar');
  if (timer) timer.textContent = Math.ceil(decision.t) + ' s';
  if (bar) bar.style.width = (decision.t / decision.max * 100).toFixed(1) + '%';
  $('decision').querySelectorAll('[data-dec]').forEach(b => {
    const index = +b.dataset.dec, missing = optionCost(index ? decision.b : decision.a) - state.money, rate = totalRate();
    b.disabled = missing > 0;
    $('decWait' + index).textContent = missing > 0 ? `Encore ${rate > 0 ? Math.ceil(missing / rate) : '?'} s d’économies` : '';
  });
}

function initDecisionCard() {
  onDecisionChange(renderDecision);

/* ===== js/game/shop.js ===== */
/** Boutique : dépense des pépites (monnaie premium gagnée en jouant). */

const shopItemById = id => SHOP_ITEMS.find(x => x.id === id);
/** Nombre d'achats déjà faits pour un article limité. */
const boughtCount = id => (state.shop && state.shop[id]) || 0;
const isSoldOut = item => !!item.max && boughtCount(item.id) >= item.max;
const itemPrice = item => item.cost(boughtCount(item.id));

function buyItem(id) {
  const item = shopItemById(id);
  if (!item || isSoldOut(item)) return false;
  const price = itemPrice(item);
  if (state.gems < price) { notify.toast(`Il te manque ${price - state.gems} pépite${price - state.gems > 1 ? 's' : ''}.`); return false; }
  state.gems -= price;
  if (id === 'coffee') { state.coffee += COFFEE_DURATION; notify.toast('Café double : revenus ×2 pendant 15 min !', 'gold'); }
  else if (id === 'warp1' || id === 'warp8') {
    const gain = totalRate() * 3600 * (id === 'warp8' ? 8 : 1);
    earn(gain);
    notify.toast(`${item.n} : +${eur(gain)}`, 'gold');
  } else if (id === 'chest') addChests(1);
  else if (id === 'reload') { reloadAbilities(); notify.toast('Toutes les capacités sont prêtes !', 'gold'); }
  state.rec.shopBuys = (state.rec.shopBuys || 0) + 1;
  if (item.max) {
    state.shop[id] = boughtCount(id) + 1;
    if (id === 'mecene') notify.toast(`Un mécène soutient l’IUT : revenus ×2 pour toujours (×${Math.pow(2, state.shop[id])} au total) !`, 'gold');
  }
  notify.sound('boost');
  save();
  return true;
}

/* ===== js/main.js ===== */
/**
 * Point d'entrée : chargement de la partie, branchement de l'interface et boucle principale.
 */

/** Temps maximal rattrapé d'un coup par l'économie (onglet en arrière-plan), en secondes. */
const MAX_CATCH_UP = 43200;
const AUTOSAVE_INTERVAL = 5000;
/** Serveur local de développement : console de débogage et mode admin. */

/* ----- Retours de la logique vers l'interface ----- */

setNotifier('toast', showToast);
setNotifier('sound', playSound);
setNotifier('celebrate', celebrate);

/** Petits « +X € » au-dessus des départements du site affiché, une fois par seconde. */
function showPayouts(payouts) {
  for (const { d, amount } of payouts) {
    const [i0, j0, w, dd] = d.plot, [x, y] = iso(i0 + w / 2, j0 + dd / 2, d.top + 4);
    floatAt(x + (Math.random() - 0.5) * 16, y, '+' + eur(amount), '#ffc233', 0.8, d.id);
  }
}

/* ----- Boutons généraux ----- */

function initControls() {
  $('bMusic').onclick = () => { setMusicEnabled(!state.music); paintMusicButton(); save(); };
  $('bOpts').onclick = openOptions;
  $('sites').addEventListener('click', e => {
    const b = e.target.closest('[data-site]');
    if (!b || !switchSite(b.dataset.site)) return;
    closeSheets(); stopPlacing(); hideTooltip(); clearCritters(); updateAdvice(); renderSites();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (isModalOpen()) closeModal();
    else if (placing) stopPlacing();
    else closeSheets();
  });
  onWeatherChange(paintSeasonChip);
}

/* ----- Boucle ----- */

let lastFrame = performance.now(), uiTimer = 0, slowTimer = 0, sitesKey = '', musicKey = null;
/** Vitesse du jeu (1 en temps normal ; réglable seulement par le mode admin en développement). */
let gameSpeed = 1;

/** Mises à jour peu urgentes (deux fois par seconde). */
function slowUpdate() {
  updateObjectives();
  updateObjectiveCard();
  checkAchievements();
  updatePalmares();
  pushScore(false);
  updateAdvice();
  refreshChallenges();
  setMusicMood(currentMood());
  checkEnding();
  const key = [state.site, state.city, state.promos, state.accreds].join('|'); // la partie a pu changer (diplômes, ville, import…)
  if (key !== sitesKey) { sitesKey = key; renderSites(); clearCritters(); }
  if (state.music !== musicKey) { musicKey = state.music; paintMusicButton(); }
}

function frame(now) {
  const real = Math.max(0, (now - lastFrame) / 1000), dt = Math.min(0.1, real), game = dt * gameSpeed;
  lastFrame = now;
  if (cinematicActive()) { // la partie est en pause pendant la cinématique
    updateCinematic(dt);
    if (shouldRender(real)) renderFrame();
    requestAnimationFrame(frame);
    return;
  }
  const paid = tickEconomy(Math.min(real * gameSpeed, MAX_CATCH_UP));
  if (paid) { showPayouts(paid.payouts); trackStat('earn', paid.total); }

  updateWorld(game);
  updateCamera(dt);
  updateGhosts(dt);
  updateWalkers(dt);
  updateEffects(dt);
  updateEvents(game);
  updateDecisions(game);
  updateMascot(dt);
  updateAutoBuy(game);
  updateRecords(game);
  updateAbilities(game);
  updateMissions(game);
  updateCritters(game);
  updateHarvest(game);

  if (shouldRender(real)) renderFrame();
  updateHud();
  updateTutorial(dt);
  updateDecisionCard();
  uiTimer += dt;
  if (uiTimer > 0.15) {
    uiTimer = 0;
    updatePanel(); updateCampus(); updateGraduation(); updateShop();
    updateAbilitiesBar(); updateMissionCard(); updateChestButton();
    if (isTooltipOpen()) renderTooltip();
  }
  slowTimer += dt;
  if (slowTimer > 0.5) { slowTimer = 0; slowUpdate(); }
  requestAnimationFrame(frame);
}

/* ----- Démarrage ----- */

/** `hot` = données conservées par le rechargement à chaud de claude.ai (partie et caméra). */
function start(hot = {}) {
  let restored = false;
  if (hot.save) { try { setState(sanitize(JSON.parse(hot.save))); restored = true; } catch (e) { /* on repart de la sauvegarde locale */ } }
  if (!restored) setState(sanitize(loadSaved()));

  resizeCanvas();
  initQuality();
  if (hot.cam) { Object.assign(camera, hot.cam); clampCamera(); } else fitCamera();
  resetWalkers(24);

  if (!restored) {
    if (state.migrated) { const version = state.migrated; delete state.migrated; save(); showMigrationNotice(version); }
    else if (state.intro) welcomeBack();
  }
  refreshChallenges();
  if (!state.hist.length) state.hist.push([Date.now(), totalRate()]);

  initAudio(); initPointer(); initControls(); initTooltips();
  initPanel(); initCampus(); initPalmares(); initGraduation(); initMascot(); initDecisionCard(); initPlacingBar();
  initAbilitiesBar(); initMissionCard(); initChestButton(); initShop();
  initLeaderboard(refreshLeaderboardTab);

  updateAdvice(); updateObjectiveCard(); updateHud(); paintSeasonChip(); paintMusicButton(); updateChestButton();
  sitesKey = [state.site, state.city, state.promos, state.accreds].join('|'); musicKey = state.music; renderSites();

  if (document.fonts && document.fonts.load) document.fonts.load('16px "Lilita One"').catch(() => {});
  window.addEventListener('resize', () => { resizeCanvas(); clampCamera(); });
  setInterval(save, AUTOSAVE_INTERVAL);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  // Développement uniquement (serveur local) : accès à l'état depuis la console et mode admin.
  // Ces lignes sont retirées des versions publiées par tools/build.ps1 (marque build:dev-only).
  window.claude?.hot?.snapshot?.(() => ({ save: JSON.stringify({ ...state, t: Date.now() }), cam: { x: camera.x, y: camera.y, z: camera.z } }));

  // premier lancement : cinématique, puis tutoriel guidé (repris à son étape après un rechargement)
  if (!state.intro) {
    if (!state.cine) startCinematic({ onDone: () => startTutorial() });
    else startTutorial();
  }

  lastFrame = performance.now();
  requestAnimationFrame(frame);
}

if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

})();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>

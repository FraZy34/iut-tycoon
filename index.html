<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7fe0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="IUT Tycoon"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style></head><body><title>IUT Tycoon Reims</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout : plein écran. Diorama isométrique sur canvas, HUD et fiches façon « jouet » (contours épais, ombres pleines) par-dessus. Thème unique assumé : c'est le monde du jeu. */
:root{
  --ink:#1c2541; --ink-soft:#56607f; --paper:#ffffff; --paper-2:#eef3fa; --line:#cfd8e6;
  --coin:#ffc233; --coin-dk:#c98a00; --go:#35c46b; --go-dk:#1f8a47; --blue:#2f7fe0;
  --hot:#ff6a3d; --sky:#a6dcff; --off:#c9d1de; --off-ink:#6b7590;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world.drag{cursor:grabbing}
#world.hot{cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:5px 12px 5px 7px;min-height:48px;box-sizing:border-box}
.brand{padding:5px 14px 5px 8px}
.brand .name{font-family:var(--f-display);font-size:21px;line-height:1;letter-spacing:.3px}
.brand small{display:block;font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.ico{width:30px;height:30px;flex:none;display:block}
.stat .val{display:block;font-family:var(--f-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .sub{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap;margin-top:2px;font-variant-numeric:tabular-nums}
.money{min-width:150px}
.boost{background:var(--coin);font-family:var(--f-display);font-size:17px;padding:5px 12px;animation:pulse 1s ease-in-out infinite}
.boost b{font-weight:400;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{transform:scale(1.05)}}
.actions{margin-left:auto;display:flex;gap:8px}

/* ---------- Boutons ---------- */
.btn{font:inherit;font-weight:900;font-size:15px;border:3px solid var(--ink);border-radius:14px;padding:9px 14px;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.go{background:var(--go);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.coin{background:var(--coin);color:var(--ink)}
.btn.hot{background:var(--hot);color:#fff}
.btn:disabled{background:var(--off);color:var(--off-ink);cursor:not-allowed;text-shadow:none}
.btn.big{width:100%;flex-direction:column;gap:3px;padding:10px 14px;margin-top:10px}
.btn.big .l1{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.3px}
.btn.big .l2{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-variant-numeric:tabular-nums}
.btn.sm{font-size:13px;padding:6px 10px;border-radius:11px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.ibtn{min-height:48px;padding:6px 12px}
.ibtn svg{width:22px;height:22px}
.coin-i{width:18px;height:18px;display:inline-block;flex:none}

/* ---------- Objectif ---------- */
.obj{position:absolute;left:16px;top:calc(76px + env(safe-area-inset-top,0px));width:300px;max-width:calc(100% - 32px);box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 14px 12px;z-index:4}
.obj.done{background:#fff7dc;animation:pulse 1.2s ease-in-out infinite}
.obj-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.obj-rew{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
.obj p{margin:4px 0 8px;font-size:14.5px;font-weight:800;line-height:1.3;text-wrap:balance}
.bar{height:12px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(180deg,#7ee39f,var(--go));border-radius:99px;transition:width .25s}
.obj .btn{width:100%;margin-top:10px}
.obj .prog{font-size:12px;font-weight:800;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums}

/* ---------- Fiches ---------- */
.sheet{position:absolute;right:16px;top:calc(76px + env(safe-area-inset-top,0px));width:352px;max-height:calc(100% - 96px - env(safe-area-inset-top,0px));overflow:auto;box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px 16px 18px;z-index:6;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.4}}
.sh-head{display:flex;gap:10px;align-items:center}
.sh-title{flex:1;min-width:0}
.sh-title h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.05;text-wrap:balance}
.kind{margin:3px 0 0;font-size:12px;font-weight:800;color:var(--ink-soft)}
.tag{--c:#2f7fe0;flex:none;display:inline-grid;place-items:center;min-width:52px;height:52px;padding:0 6px;box-sizing:border-box;border-radius:14px;border:3px solid var(--ink);background:var(--c);color:#fff;font-family:var(--f-display);font-size:15px;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tag.sm{min-width:44px;height:36px;font-size:12px;border-radius:10px;border-width:2px}
.x{flex:none;width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:var(--paper-2);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.x svg{width:16px;height:16px}
.x:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.desc{margin:10px 0 12px;font-size:14px;line-height:1.45;color:var(--ink-soft);font-weight:700}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.lvl{font-family:var(--f-display);font-size:19px}
.lvl b{font-weight:400;font-variant-numeric:tabular-nums}
.mile{font-size:12.5px;font-weight:900;color:var(--go-dk);text-align:right}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
.stats div{background:var(--paper-2);border-radius:12px;padding:8px 10px;min-width:0}
.stats dt{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.seg{display:flex;background:var(--paper-2);border:2px solid var(--ink);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-weight:900;font-size:13px;border:0;border-radius:9px;background:transparent;color:var(--ink-soft);padding:6px 4px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--blue)}
.gain{margin:8px 0 0;text-align:center;font-size:13px;font-weight:900;color:var(--go-dk);min-height:1.2em;font-variant-numeric:tabular-nums}
.mgr{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.avatar{--c:#2f7fe0;flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--c);overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
.mgr-t{flex:1;min-width:0}
.mgr-t b{display:block;font-size:15px;font-weight:900}
.mgr-t small{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.mgr .btn{font-size:13px;padding:8px 10px;white-space:nowrap}
.build-box p{font-size:14px;line-height:1.45;margin:0}
.need{margin-top:8px!important;text-align:center;font-weight:900;color:var(--hot);font-size:13px!important;min-height:1.2em;font-variant-numeric:tabular-nums}
.sec{margin:16px 0 8px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:12px}
.row-main:hover{background:var(--paper-2)}
.row-main:focus-visible{outline:2px solid var(--blue)}
.rn{min-width:0}
.rn b{display:block;font-size:14px;font-weight:900;line-height:1.15}
.rn small{display:block;font-size:12px;color:var(--ink-soft);font-weight:800;font-variant-numeric:tabular-nums}
.row.locked .tag{filter:grayscale(1) opacity(.55)}
.campus-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.campus-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}

/* ---------- Toasts / modale / aide ---------- */
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(132px + env(safe-area-inset-top,0px));display:grid;gap:8px;justify-items:center;z-index:8;pointer-events:none;width:min(420px,calc(100% - 32px))}
.hud-sub{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:tin .3s cubic-bezier(.2,1.4,.4,1);text-align:center;line-height:1.3}
.toast.gold{background:var(--coin);color:var(--ink);border:3px solid var(--ink)}
.toast.out{transition:opacity .4s,transform .4s;opacity:0;transform:translateY(-8px)}
@keyframes tin{from{transform:translateY(-12px) scale(.9);opacity:0}}
.modal{position:absolute;inset:0;background:rgba(18,26,52,.55);display:grid;place-items:center;z-index:20;padding:16px;box-sizing:border-box}
.modal-card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);width:min(460px,100%);max-height:calc(100% - 24px);overflow:auto;padding:22px 22px 20px;box-sizing:border-box;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.modal-card h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;text-wrap:balance}
.modal-card p{margin:0 0 10px;line-height:1.5;font-size:15px}
.modal-card ul{margin:0 0 10px;padding-left:20px;line-height:1.5;font-size:14.5px}
.modal-card li{margin-bottom:5px}
.m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.big-num{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:34px;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.big-num svg{width:38px;height:38px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--paper-2);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.kv b{font-family:var(--f-display);font-weight:400;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;margin:6px 0 12px;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--go)}
.small{font-size:13.5px!important;color:var(--ink-soft)}
.ach-count{font-family:var(--f-display);font-size:15px;background:var(--coin);border:2px solid var(--ink);border-radius:99px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ach-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.ach{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--paper-2)}
.ach .medal{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:var(--off);display:grid;place-items:center}
.ach .medal svg{width:22px;height:22px}
.ach div{min-width:0}
.ach b{display:block;font-size:14px;font-weight:900;line-height:1.2}
.ach small{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.ach.locked b{color:var(--off-ink)}
.ach.locked .medal svg{opacity:.45}
.ach.got{background:#fff7dc;border-color:var(--ink)}
.ach.got .medal{background:var(--coin)}
.talent{color:var(--blue)!important;font-weight:800!important;margin-top:3px}
.tabs{margin-bottom:4px}
.tabs button span{font-variant-numeric:tabular-nums;opacity:.8}
.pseudo{margin:12px 0}
.pseudo label{display:block;font-size:12px;font-weight:900;color:var(--ink-soft);margin-bottom:5px}
.pseudo-row{display:flex;gap:8px}
.pseudo input,.modal textarea{flex:1;min-width:0;font:inherit;font-weight:800;font-size:14px;border:2px solid var(--ink);border-radius:11px;padding:7px 10px;background:var(--paper);color:var(--ink);box-sizing:border-box}
.modal textarea{width:100%;font-size:12px;font-weight:700;font-family:ui-monospace,Consolas,monospace;resize:vertical;margin:6px 0 8px;user-select:text;-webkit-user-select:text}
.pseudo input:focus-visible,.modal textarea:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--paper-2)}
.lb-row.me{border-color:var(--ink);background:#fff7dc}
.lb-rank{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:var(--f-display);font-size:14px}
.lb-row:nth-child(1) .lb-rank{background:var(--coin);color:var(--ink)}
.lb-who{flex:1;min-width:0}
.lb-who b{display:block;font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-who small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700}
.lb-val{font-family:var(--f-display);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lb-note{margin:10px 0 0!important}
.br{margin:14px 0 6px;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--ink)}
.node{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--paper-2)}
.node .rn{flex:1}
.node .rn small{line-height:1.3}
.node .lv{font-family:var(--f-display);font-weight:400;color:var(--blue);font-size:13px;margin-left:4px;font-variant-numeric:tabular-nums}
.node.maxed{background:#e9f8ee;border-color:var(--go)}
.m-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.evt{background:#dff3ff;font-family:var(--f-display);font-size:15px;padding:5px 12px}
.evt.bad{background:#ffe3da}
.evt b{font-weight:400;font-variant-numeric:tabular-nums}
.season{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(28,37,65,.78);color:#fff;font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:99px;pointer-events:none;z-index:3}
@media (max-width:640px){ .evt,.boost{font-size:13px;min-height:38px} #app.sheet-open .season,#app.sheet-open .hud-sub{display:none} }
[data-tip]{cursor:help}
[data-tip]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hud-sub>*{pointer-events:auto}
.season{pointer-events:auto!important}
.stats .wide{grid-column:1/-1}
.camp-pal{margin:0 0 10px;font-size:12.5px;font-weight:900;color:var(--go-dk);line-height:1.35}
.tip{position:fixed;z-index:40;max-width:280px;box-sizing:border-box;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.4;box-shadow:0 6px 18px rgba(18,26,52,.35);pointer-events:none}
.tip .tt{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;margin-bottom:4px;color:var(--coin)}
.tip .tr{display:flex;justify-content:space-between;gap:14px;padding:1px 0;font-variant-numeric:tabular-nums}
.tip .tr span{color:#c9d2ea}
.tip .tr b{font-weight:900;white-space:nowrap}
.tip .tr.tot{border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:5px}
.tip .te{display:block;color:#fff;font-weight:800}
.tip .tn{display:block;margin-top:6px;color:#aeb8d6;font-size:12px}
/* sites, pile du bas (décision, mascotte, pose de décoration) */
.sites{position:absolute;left:16px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:3px;z-index:4}
.site-b{font:inherit;font-weight:900;font-size:12.5px;border:0;border-radius:10px;background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer;white-space:nowrap}
.site-b.on{background:var(--ink);color:#fff}
.site-b.lock{color:var(--off-ink)}
.site-b:focus-visible{outline:2px solid var(--blue)}
.stack{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(470px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px;z-index:7;pointer-events:none}
.stack>*{pointer-events:auto}
.placing{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;font-size:13.5px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.placing span{flex:1;min-width:0}
.decision{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.dec-top{display:flex;justify-content:space-between;align-items:center}
.dec-t{font-family:var(--f-display);font-size:15px;color:var(--hot);font-variant-numeric:tabular-nums}
.decision h3{margin:2px 0 2px;font-family:var(--f-display);font-weight:400;font-size:20px}
.decision p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.dec-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dec-opt{flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;font-size:14px;min-width:0}
.dec-opt small{font-weight:700;font-size:11.5px;line-height:1.3;opacity:.92;white-space:normal}
.bar.thin{height:7px;border-width:1.5px;margin-top:8px}
.dec-def{margin:6px 0 0!important;font-size:11.5px!important}
.mascot{display:flex;align-items:flex-end;gap:6px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.owl{flex:none;width:84px;height:96px;margin-bottom:-6px;filter:drop-shadow(0 3px 0 rgba(28,37,65,.25))}
.owl svg{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
.owl .eyes{transform-origin:40px 43px;animation:blink 5s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 14px 12px}
.bubble::before{content:"";position:absolute;left:-11px;bottom:22px;width:16px;height:16px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.15;margin:2px 0 4px}
.bubble p{margin:0 0 8px;font-size:13.5px;line-height:1.45;font-weight:700}
/* fiches : décorations, assistant, conseil, cartes, graphique */
.deco-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.deco-b{flex-direction:column;align-items:flex-start;text-align:left;box-shadow:0 3px 0 var(--ink)}
.deco-b small{font-weight:800;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.auto-row:empty{display:none}
.auto-row{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--paper-2);border-radius:12px;padding:6px 8px 6px 12px;margin-bottom:10px;font-size:12.5px;font-weight:800}
.rec-note{margin:-4px 0 12px;background:#fff3cf;border:2px solid var(--coin);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;line-height:1.35}
.row.rec .tag{box-shadow:0 0 0 3px var(--coin)}
.cards{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.card{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--paper-2)}
.card.r2{border-color:#7fb6ff;background:#eef5ff}
.card.r3{border-color:var(--coin);background:#fff6d9}
.card.locked{opacity:.6}
.card .av{--c:#9aa3b8;flex:none;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.card div{min-width:0}
.card b{display:block;font-size:14px;font-weight:900}
.card small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;line-height:1.3}
.card .cb{color:var(--go-dk);font-weight:900}
.new{font-size:10px;background:var(--hot);color:#fff;border-radius:99px;padding:1px 6px;vertical-align:middle}
.chart{width:100%;height:auto;display:block;background:var(--paper-2);border-radius:12px}
.tabs{flex-wrap:wrap}
.tabs button{flex:1 0 auto}
@media (max-width:640px){
  .stack{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
  #app.sheet-open .stack,#app.sheet-open .sites{display:none}
  .owl{width:62px;height:72px}
  .bubble p{font-size:12.5px}
  .dec-opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .owl svg,.owl .eyes,.decision,.mascot{animation:none} }
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;padding:0;border-radius:50%;z-index:5}
.fab svg{width:24px;height:24px}
.fab.off{background:var(--paper-2);color:var(--off-ink)}
.hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(28,37,65,.82);color:#fff;font-size:13px;font-weight:800;padding:8px 14px;border-radius:99px;pointer-events:none;transition:opacity .6s;white-space:nowrap;z-index:3}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const hash = (a,b,c) => { const x = Math.sin(a*127.1 + b*311.7 + c*74.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const cl = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;

const SUF = ['', ' k', ' M', ' Md', ' Bn', ' Bd', ' Tn', ' Td', ' Qn', ' Qd', ' Sx', ' Sd'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (n < 10 && n % 1 > 0.05) ? n.toFixed(1).replace('.', ',') : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUF.length) return n.toExponential(2).replace('.', ',');
  const v = n / Math.pow(10, 3*e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)).replace('.', ',') + SUF[e];
}
const eur = n => fmt(n) + ' €';
const pct = x => Math.round(x*100) + ' %';
const fmtMult = m => m < 1000 ? m.toFixed(2).replace('.', ',') : fmt(m);
function fmtDur(s){ s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h} h ${String(m).padStart(2,'0')} min` : m ? `${m} min` : `${s} s`; }

/* =========================================================
   Carte
   ========================================================= */
const T_GRASS = 0, T_PATH = 1, T_AVE = 2, T_PLAZA = 3;
const tile = new Uint8Array(N*N), blocked = new Uint8Array(N*N);
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  let t = T_GRASS;
  if (i >= 2 && i <= 23 && j >= 2 && j <= 23) {
    if (i >= 11 && i <= 14 && j >= 11 && j <= 14) t = T_PLAZA;
    else if (i === 2 || i === 23 || j === 2 || j === 23) t = T_PATH;
    else if ((i >= 11 && i <= 14) || (j >= 11 && j <= 14)) t = T_AVE;
    else if (i === 6 || i === 18 || j === 6 || j === 18) t = T_PATH;
  }
  tile[i*N + j] = t;
}
[[12,12],[12,13],[13,12],[13,13],[14,11]].forEach(([i,j]) => blocked[i*N+j] = 1);
const walkable = (i,j) => i >= 0 && j >= 0 && i < N && j < N && tile[i*N+j] !== T_GRASS && !blocked[i*N+j];

function sanitize(o){
  const f = freshState();
  if (!o || typeof o !== 'object') return f;
  const old = !(o.v >= 3);
  for (const k of ['money','run','total','best','bestGain','dip','promos','ects','obj','boost','jpo','t','runStart']) if (typeof o[k] === 'number' && isFinite(o[k])) f[k] = o[k];
  for (const k of ['muted','music','intro','tipsOff','autoOn','campusDone']) if (typeof o[k] === 'boolean') f[k] = o[k];
  if (typeof o.pseudo === 'string') f.pseudo = o.pseudo.slice(0, 24);
  if (o.buy === 1 || o.buy === 10 || o.buy === 'max') f.buy = o.buy;
  if (o.ach && typeof o.ach === 'object') for (const k in o.ach) if (typeof o.ach[k] === 'number') f.ach[k] = o.ach[k];
  if (o.seen && typeof o.seen === 'object') for (const e of EVENTS) if (o.seen[e.id]) f.seen[e.id] = 1;
  if (o.tree && typeof o.tree === 'object') for (const n of TREE) if (typeof o.tree[n.id] === 'number') f.tree[n.id] = clamp(Math.floor(o.tree[n.id]), 0, n.max);
  if (o.evt && typeof o.evt === 'object' && EV(o.evt.id) && typeof o.evt.t === 'number') f.evt = {id:o.evt.id, t:o.evt.t};
  if (o.b) DEFS.forEach(d => { const s = o.b[d.id]; if (s) f.b[d.id] = {lvl: Math.max(0, Math.floor(+s.lvl || 0)), mgr: !!s.mgr}; });
  if (f.b.info.lvl < 1) f.b.info.lvl = 1;
  if (o.cards && typeof o.cards === 'object') for (const c of CARDS) if (typeof o.cards[c.id] === 'number') f.cards[c.id] = clamp(Math.floor(o.cards[c.id]), 0, CARD_MAX);
  if (o.deco && typeof o.deco === 'object') for (const s of SITES) if (Array.isArray(o.deco[s.id]))
    f.deco[s.id] = o.deco[s.id].filter(x => x && DECOS.some(dc => dc.id === x.t) && Number.isInteger(x.i) && Number.isInteger(x.j)).slice(0, DECO_MAX).map(x => ({i:x.i, j:x.j, t:x.t}));
  for (const k of ['daily','weekly']) if (o[k] && typeof o[k] === 'object' && typeof o[k].key === 'string') f[k] = {key:o[k].key, ids:Array.isArray(o[k].ids) ? o[k].ids.slice(0,3).map(String) : [], prog:Object.assign({}, o[k].prog), got:Object.assign({}, o[k].got), base:+o[k].base || 0, all:!!o[k].all};
  if (Array.isArray(o.hist)) f.hist = o.hist.filter(p => Array.isArray(p) && p.length === 2 && isFinite(p[0]) && isFinite(p[1])).slice(-360);
  if (o.rec && typeof o.rec === 'object') for (const k in o.rec) if (typeof o.rec[k] === 'number' && isFinite(o.rec[k])) f.rec[k] = o.rec[k];
  if (o.tips && typeof o.tips === 'object') { for (const k in o.tips) if (o.tips[k]) f.tips[k] = 1; }
  else if (o.intro) ['hello','up1','tc','mile','svc','mgr'].forEach(k => f.tips[k] = 1); // anciens joueurs : on saute les bases
  if (typeof o.site === 'string' && SITE_BY[o.site] && f.promos >= SITE_BY[o.site].need) f.site = o.site;
  if (old) { // ancienne économie : on garde les succès et le total, on repart sur une année neuve

    return Object.assign(freshState(), keep, {migrated:true});
  }
  return f;
}

const deptLevels = () => ALL_DEPTS.reduce((a,d) => a + L(d.id), 0);
const rayMult = () => 1 + RAY*deptLevels();
/* Paliers du campus : quand les 7 départements d'un site atteignent tous un niveau, les revenus du site doublent. */
const CPAL = [25,50,100,150,200,300,400,500];
const minDeptLvl = (site = S.site) => Math.min(...SITE_DEPTS[site].map(d => L(d.id)));
const campusPal = (site = S.site) => { const mn = minDeptLvl(site); let n = 0; for (const q of CPAL) if (mn >= q) n++; return Math.pow(2, n); };
const nextCampusPal = (site = S.site) => nextOf(CPAL, minDeptLvl(site));
const decoMult = (site = S.site) => 1 + 0.01*decoList(site).length;
const siteTal = site => site === 'reims' ? 1 : Math.pow(1.1, SITE_DEPTS[site].filter(d => S.b[d.id].mgr).length);
const SITE_FACTORS = (site = S.site) => [
  ['Lieux de vie', svcMult(site)], ['Paliers du campus', campusPal(site)], ['Décorations', decoMult(site)], ['Talents des responsables', siteTal(site)],
];
const siteMult = (site = S.site) => SITE_FACTORS(site).reduce((a,f) => a*f[1], 1);
const GLOBAL_FACTORS = () => [
  ['Rayonnement des départements', rayMult()], ['Diplômés', 1 + S.dip*0.02], ['Succès', 1 + achCount()*achRate()],
  ['Conseil pédagogique', 1 + 0.25*TR('rev')], ['Talent de Prof. Octet', hasMgr('info') ? 1.1 : 1], ['Anciens élèves', 1 + cardBonus('all')],
];
const permMult = () => GLOBAL_FACTORS().reduce((a,f) => a*f[1], 1);
const boostX = () => hasMgr('geii') ? 4 : 3;
const boostDur = () => 30 + 15*TR('jpo') + cardBonus('jpo');
const globalMult = () => permMult() * (S.boost > 0 ? boostX() : 1) * evtMult();
const multFor = d => siteMult(d.site) * globalMult();
const mult = () => siteMult(S.site) * globalMult(); // multiplicateur du site affiché
const rateOf = d => baseRate(d) * multFor(d);
function siteRate(site){ let r = 0; for (const d of SITE_DEPTS[site]) r += baseRate(d); return r * siteMult(site) * globalMult(); }
function totalRate(){ let r = 0; for (const s of SITES) r += siteRate(s.id); return r; }
function students(){ let n = 0; for (const d of ALL_DEPTS) n += L(d.id) * d.spl; return n; }
function siteStudents(site = S.site){ let n = 0; for (const d of SITE_DEPTS[site]) n += L(d.id) * d.spl; return n; }
const mgrCount = () => DEPTS.filter(d => S.b[d.id].mgr).length;
const costMult = () => (1 - 0.04*TR('cost')) * (hasMgr('tc') ? 0.95 : 1);
const mgrCost = d => d.mgr * (1 - 0.25*TR('mgr'));
function costN(d,n){ const l = L(d.id), c0 = d.base * Math.pow(d.g, l-1) * costMult(); return c0 * (Math.pow(d.g, n) - 1) / (d.g - 1); }
function maxN(d){ const l = L(d.id), c0 = d.base * Math.pow(d.g, l-1) * costMult(); return Math.max(0, Math.floor(Math.log(S.money*(d.g-1)/c0 + 1) / Math.log(d.g))); }
const buyCount = d => S.buy === 'max' ? Math.max(1, maxN(d)) : S.buy;
function earn(x){ S.money += x; S.run += x; S.total += x; }
const offlineCap = () => (8 + 4*TR('off') + 0.5*L('resid')) * 3600;

/* Revenus automatiques : chaque département verse ses gains toutes les secondes. */
let tickAcc = 0;
function econ(dt){
  tickAcc += dt;
  if (tickAcc < 1) return;
  const n = Math.floor(tickAcc); tickAcc -= n;
  const gm = globalMult(); let tot = 0;
  for (const s of SITES) {
    const sm = siteMult(s.id) * gm;
    for (const d of SITE_DEPTS[s.id]) {
      if (!L(d.id)) continue;
      const g = baseRate(d) * sm * n; tot += g;
      if (n === 1 && s.id === S.site) { const [i0,j0,w,dd] = d.plot; const [x,y] = pt(i0+w/2, j0+dd/2, d.top + 4); floatText(x + (Math.random()-0.5)*16, y, '+' + eur(g), '#ffc233', 0.8, d.id); }
    }
  }
  earn(tot); stat('earn', tot);
  if (S.boost > 0) S.boost = Math.max(0, S.boost - n);
}

/* ----- Événements ----- */
let evtTimer = 100 + Math.random()*60;
function startEvent(e){
  const dur = e.dur * (e.good && hasMgr('gmp') ? 1.5 : 1);
  if (e.lump) earn(totalRate()*e.lump);
  S.evt = {id:e.id, t:dur}; S.seen = S.seen || {}; S.seen[e.id] = 1; stat('evt'); S.rec.evts = (S.rec.evts || 0) + 1;
  if (e.jpo) for (let k = 0; k < e.jpo; k++) spawnWalker(true);
  if (e.snow) weatherSet('neige', dur);
  if (e.id === 'rentree') for (let k = 0; k < 10; k++) spawnWalker(false);
  if (e.id === 'gala') party();
  toast(`${e.n} : ${e.d}`, e.good ? 'gold' : '');
  sfx(e.good ? 'boost' : 'click');
}
function updEvents(dt){
  if (S.evt) { S.evt.t -= dt; if (S.evt.t <= 0) S.evt = null; return; }
  evtTimer -= dt;
  if (evtTimer > 0) return;
  evtTimer = 150 + Math.random()*120;
  const pool = EVENTS.filter(e => e.w > 0 && (!e.cond || e.cond()));
  const wOf = e => e.w * (e.good ? 1 + 0.25*TR('evt') : 1) * (e.id === 'neige' && SEASON === 'hiver' ? 3 : 1);
  let r = Math.random() * pool.reduce((a,e) => a + wOf(e), 0);
  for (const e of pool) { r -= wOf(e); if (r <= 0) { startEvent(e); break; } }
}

let DEC = null, decTimer = 180 + Math.random()*120;
const decCost = o => o.pay ? totalRate()*o.pay : 0;
function updDecisions(dt){
  if (DEC) { DEC.t -= dt; if (DEC.t <= 0) resolveDec(1); else paintDecTimer(); return; }
  if (S.evt || !S.intro) return;
  decTimer -= dt; if (decTimer > 0) return;
  decTimer = 240 + Math.random()*180;
  const pool = DECISIONS.filter(x => !x.cond || x.cond()); if (!pool.length) return;
  DEC = Object.assign({}, pick(pool), {t:30, max:30}); renderDec(); sfx('click');
}
function renderDec(){
  const el = $('decision'); if (!DEC) { el.hidden = true; el.innerHTML = ''; return; }
  const opt = (o,k) => { const c = decCost(o); return `<button type="button" class="btn ${k ? '' : 'blue'} dec-opt" data-dec="${k}" ${c > S.money ? 'disabled' : ''}><b>${o.l}</b><small>${o.txt}${c ? ' · ' + eur(c) : ''}</small></button>`; };
  el.innerHTML = `<div class="dec-top"><span class="eyebrow">Décision à prendre</span><span class="dec-t" id="decT"></span></div><h3>${DEC.n}</h3><p>${DEC.d}</p><div class="dec-opts">${opt(DEC.a,0)}${opt(DEC.b,1)}</div><div class="bar thin"><i id="decBar"></i></div><p class="dec-def">Sans réponse, « ${DEC.b.l} » sera choisi.</p>`;
  el.hidden = false; paintDecTimer();

function paintDecTimer(){ const t = $('decT'), b = $('decBar'); if (t) t.textContent = Math.ceil(DEC.t) + ' s'; if (b) b.style.width = (DEC.t/DEC.max*100).toFixed(1) + '%'; }
function resolveDec(k){
  if (!DEC) return;
  let o = k ? DEC.b : DEC.a; if (decCost(o) > S.money) o = DEC.b;
  S.money -= decCost(o);
  if (o.gain) earn(totalRate()*o.gain);
  let msg = `${DEC.n} : « ${o.l} ».`;
  if (o.ev) { if (o.gamble && Math.random() > o.gamble) msg += ' Défaite en finale, pas de chance cette fois.'; else startEvent(EV(o.ev)); }
  if (o.jpo) for (let n = 0; n < o.jpo; n++) spawnWalker(true);
  stat('dec'); S.rec.decs = (S.rec.decs || 0) + 1;
  toast(msg); DEC = null; renderDec(); save();
}

/* ----- Défis du jour et de la semaine (les mêmes pour tout le monde, tirés à partir de la date) ----- */
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const weekKey = (d = new Date()) => { const m = new Date(d); m.setDate(d.getDate() - ((d.getDay()+6) % 7)); return 'S' + dayKey(m); };
const hashStr = s => { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return h >>> 0; };
const DAILY_POOL = [
  {id:'lv', n:'Achète 100 niveaux', k:'lvl', goal:100}, {id:'jpo', n:'Accueille 2 visiteurs de la JPO', k:'jpo', goal:2},
  {id:'evt', n:'Vis 3 événements', k:'evt', goal:3}, {id:'dec', n:'Prends 2 décisions', k:'dec', goal:2},
  {id:'mgr', n:'Recrute 2 responsables', k:'mgr', goal:2}, {id:'bld', n:'Construis 3 bâtiments', k:'bld', goal:3},
  {id:'deco', n:'Pose une décoration', k:'deco', goal:1}, {id:'earn', n:'Gagne l’équivalent de 2 h de revenus', k:'earn', goal:'2h'},
];
const WEEKLY_POOL = [
  {id:'grad', n:'Organise une remise des diplômes', k:'grad', goal:1, r:25}, {id:'lv', n:'Achète 1 000 niveaux', k:'lvl', goal:1000, r:20},
  {id:'evt', n:'Vis 20 événements', k:'evt', goal:20, r:20}, {id:'dec', n:'Prends 10 décisions', k:'dec', goal:10, r:20},
  {id:'ach', n:'Débloque 5 succès', k:'ach', goal:5, r:20}, {id:'deco', n:'Pose 5 décorations', k:'deco', goal:5, r:20},
];
function pickSet(pool, key, n){ const rnd = mulberry32(hashStr(key)), a = pool.slice(), out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(rnd()*a.length), 1)[0].id); return out; }
function refreshChallenges(){
  const dk = dayKey(), wk = weekKey();
  if (!S.daily || S.daily.key !== dk) S.daily = {key:dk, ids:pickSet(DAILY_POOL, dk, 3), prog:{}, got:{}, base:Math.max(1e4, totalRate()*7200), all:false};
  if (!S.weekly || S.weekly.key !== wk) S.weekly = {key:wk, ids:pickSet(WEEKLY_POOL, wk, 1), prog:{}, got:{}, base:0, all:false};
}
const chGoal = (c, set) => c.goal === '2h' ? set.base : c.goal;
function stat(k, n = 1){
  if (!S.daily || !S.weekly) return;
  for (const [set, pool, weekly] of [[S.daily, DAILY_POOL, false], [S.weekly, WEEKLY_POOL, true]]) {
    set.prog[k] = (set.prog[k] || 0) + n;
    for (const id of set.ids) {
      const c = pool.find(x => x.id === id); if (!c || c.k !== k || set.got[id]) continue;
      if (set.prog[k] >= chGoal(c, set)) { set.got[id] = 1; const r = weekly ? c.r : 3; S.ects += r; toast(`Défi ${weekly ? 'de la semaine' : 'du jour'} réussi : ${c.n} (+${r} ECTS)`, 'gold'); sfx('boost'); }
    }
    if (!weekly && !set.all && set.ids.length && set.ids.every(id => set.got[id])) { set.all = true; S.ects += 5; toast('Les 3 défis du jour sont réussis : +5 ECTS de bonus !', 'gold'); party(); }
  }
}

/* ----- Saisons (date réelle) et météo ----- */
function seasonOf(dt){ const m = dt.getMonth(); return m === 11 || m <= 1 ? 'hiver' : m <= 4 ? 'printemps' : m <= 7 ? 'ete' : 'automne'; }
let SEASON = seasonOf(new Date());
const SEASON_NAME = {hiver:'Hiver', printemps:'Printemps', ete:'Été', automne:'Automne'};
const WEATHER_NAME = {clair:'Ciel dégagé', nuages:'Nuageux', pluie:'Pluie', neige:'Neige'};
let WEATHER = SEASON === 'hiver' ? 'neige' : 'clair', weatherT = 90 + Math.random()*90, weatherLock = 0, SNOWK = 0;
function weatherSet(w, lock){ WEATHER = w; weatherLock = lock || 0; updSeasonChip(); }
function updWeather(dt){
  if (weatherLock > 0) { weatherLock -= dt; if (weatherLock <= 0) { WEATHER = SEASON === 'hiver' ? 'nuages' : 'clair'; updSeasonChip(); } }
  weatherT -= dt;
  if (weatherT <= 0) {
    weatherT = 120 + Math.random()*180;
    if (weatherLock <= 0) {
      const r = Math.random();
      if (SEASON === 'hiver') WEATHER = r < 0.4 ? 'neige' : r < 0.7 ? 'nuages' : 'clair';
      else if (SEASON === 'ete') WEATHER = r < 0.1 ? 'pluie' : r < 0.3 ? 'nuages' : 'clair';
      else WEATHER = r < 0.3 ? 'pluie' : r < 0.55 ? 'nuages' : 'clair';
      updSeasonChip();
    }
  }
  const target = Math.min(0.85, (SEASON === 'hiver' ? 0.45 : 0) + (WEATHER === 'neige' ? 0.4 : 0));
  SNOWK += (target - SNOWK) * Math.min(1, dt*0.4);
}
function updSeasonChip(){ const el = document.getElementById('season'); if (el) el.textContent = `${SEASON_NAME[SEASON]} · ${WEATHER_NAME[WEATHER]}`; }

/* =========================================================
   Couleurs (jour / nuit)
   ========================================================= */
let NIGHT = 0, T = 0;
function tint(c,k=1){ const n = NIGHT; return [c[0]*k*(1-0.56*n)+14*n, c[1]*k*(1-0.52*n)+18*n, c[2]*k*(1-0.34*n)+48*n]; }
const css = (a,al) => al == null ? `rgb(${cl(a[0])},${cl(a[1])},${cl(a[2])})` : `rgba(${cl(a[0])},${cl(a[1])},${cl(a[2])},${al})`;
const rgb = (c,k=1,al) => css(tint(c,k), al);
const mixA = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const winC = (c,on,k=1) => { const t = tint(c,k); return on && NIGHT > 0.02 ? css(mixA(t,[255,210,118],NIGHT*0.95)) : css(t); };
const lit = c => css(mixA(tint(c), c, NIGHT));

const INK = '#1c2541';
const GRASS1=[130,198,96], GRASS2=[121,189,89], LAWN=[142,208,104], SOIL=[150,104,72], PATHC=[234,220,190], AVEC=[222,215,205],
      PLAZAC=[238,229,210], DIRT=[204,170,126], CURB=[196,182,158], CONCRETE=[214,212,204], GLASS=[118,178,232], GLASS_D=[64,98,146],
      DARK=[56,64,86], WHITE=[248,248,250], ROOF=[176,184,196], WOOD=[150,104,64], WATER=[86,172,222];

/* =========================================================
   Primitives de dessin isométrique
   ========================================================= */
const pt = (i,j,z=0) => [(i-j)*HW, (i+j)*HH - z];
function path(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.closePath(); }
function fillPoly(pts, fill, stroke, lw=1){ path(pts); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); ctx.fill(); }
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function diamond(i,j,w=1,d=1,z=0){ const a=pt(i,j,z), b=pt(i+w,j,z), c=pt(i+w,j+d,z), e=pt(i,j+d,z); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(e[0],e[1]); ctx.closePath(); }

function box(i,j,w,d,z,h,c,o={}){
  const s = o.line === false ? null : rgb(c, 0.62);
  fillPoly([pt(i+w,j,z),pt(i+w,j+d,z),pt(i+w,j+d,z+h),pt(i+w,j,z+h)], rgb(c, o.kr ?? 0.8), s);
  fillPoly([pt(i,j+d,z),pt(i+w,j+d,z),pt(i+w,j+d,z+h),pt(i,j+d,z+h)], rgb(c, o.kl ?? 0.93), s);
  fillPoly([pt(i,j,z+h),pt(i+w,j,z+h),pt(i+w,j+d,z+h),pt(i,j+d,z+h)], rgb(c, o.kt ?? 1.06), s);
}
function cyl(ci,cj,r,z,h,c){
  const [x,yb] = pt(ci,cj,z), yt = yb - h, rx = r*HW*1.414, ry = r*HH*1.414;
  const g = ctx.createLinearGradient(x-rx,0,x+rx,0);
  g.addColorStop(0, rgb(c,1.02)); g.addColorStop(0.55, rgb(c,0.86)); g.addColorStop(1, rgb(c,0.7));
  ctx.beginPath(); ctx.moveTo(x-rx,yt); ctx.lineTo(x-rx,yb); ctx.ellipse(x,yb,rx,ry,0,Math.PI,0,true); ctx.lineTo(x+rx,yt); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = rgb(c,0.6); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = rgb(c,1.1); ctx.beginPath(); ctx.ellipse(x,yt,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
}
function wins(face,f,a0,a1,z0,rows,rh,cols,glass,seed,skip){
  const span = (a1-a0)/cols;
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 0.8;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (skip && r === 0 && skip(c, cols)) continue;
    const ua = a0 + span*(c+0.16), ub = a0 + span*(c+0.84), za = z0 + r*rh + rh*0.26, zb = z0 + r*rh + rh*0.72;
    const on = hash(seed, r, c) < 0.62;
    const q = face === 'i' ? [pt(f,ua,za),pt(f,ub,za),pt(f,ub,zb),pt(f,ua,zb)] : [pt(ua,f,za),pt(ub,f,za),pt(ub,f,zb),pt(ua,f,zb)];
    path(q); ctx.fillStyle = winC(glass, on, face === 'i' ? 0.82 : 0.97); ctx.fill(); ctx.stroke();
  }
}
function faceQuad(face,f,a0,a1,z0,z1){ return face === 'i' ? [pt(f,a0,z0),pt(f,a1,z0),pt(f,a1,z1),pt(f,a0,z1)] : [pt(a0,f,z0),pt(a1,f,z0),pt(a1,f,z1),pt(a0,f,z1)]; }
function faceText(face,i,j,z,text,size,fg,bg){
  const [x,y] = pt(i,j,z);
  ctx.save(); ctx.translate(x,y); ctx.transform(1, face === 'i' ? -0.5 : 0.5, 0, 1, 0, 0);
  ctx.font = `${size}px ${FONT}`;
  const tw = ctx.measureText(text).width, pad = size*0.45, h = size*1.25;
  if (bg) { rr(-tw/2-pad, -h, tw+pad*2, h, 3); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(20,24,50,.45)'; ctx.stroke(); }
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, -h/2 + size*0.06);
  ctx.restore();
}
function door(face,bi,bj,bw,bd,z0,acc){
  const hw = 0.27, h = 14;
  if (face === 'i') {
    const f = bi+bw+0.005, c = bj+bd/2;
    fillPoly(faceQuad('i',f,c-hw,c+hw,z0,z0+h), winC(GLASS_D,true,0.9), rgb(DARK));
    ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1; const a = pt(f,c,z0), b = pt(f,c,z0+h); line(a[0],a[1],b[0],b[1]);
    box(f, c-hw-0.12, 0.3, (hw+0.12)*2, z0+h, 3, acc);
  } else {
    const f = bj+bd+0.005, c = bi+bw/2;
    fillPoly(faceQuad('j',f,c-hw,c+hw,z0,z0+h), winC(GLASS_D,true,1), rgb(DARK));
    ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1; const a = pt(c,f,z0), b = pt(c,f,z0+h); line(a[0],a[1],b[0],b[1]);
    box(c-hw-0.12, f, (hw+0.12)*2, 0.3, z0+h, 3, acc);
  }
}
function roofSign(d,g,text,bg,fg,size=13){
  const fgc = fg || lit(WHITE), bgc = lit(bg);
  if (d.door === 'i') faceText('i', g.bi+g.bw-0.1, g.bj+g.bd/2, g.zt+1, text, size, fgc, bgc);
  else faceText('j', g.bi+g.bw/2, g.bj+g.bd-0.1, g.zt+1, text, size, fgc, bgc);
}
function antenna(i,j,z,h){
  const [x,y] = pt(i,j,z); ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1.6; line(x,y,x,y-h); line(x-4,y-h*0.6,x+4,y-h*0.6-2);
  ctx.fillStyle = (Math.sin(T*3) > 0) ? '#ff4d4d' : rgb([150,40,40]); circle(x,y-h,2.2);
}
function acUnit(i,j,z){ box(i,j,0.42,0.32,z,7,[204,208,216]); const [x,y] = pt(i+0.21,j+0.16,z+7); ctx.fillStyle = rgb([120,126,140]); ellipse(x,y,5,2.5); }
function solar(i,j,w,d,z){
  const q = [pt(i,j,z+7),pt(i+w,j,z+7),pt(i+w,j+d,z+2),pt(i,j+d,z+2)];
  fillPoly(q, rgb([44,74,150]), rgb([200,215,240]), 0.8);
  ctx.strokeStyle = rgb([120,150,210],1,0.8); ctx.lineWidth = 0.6;
  for (let k = 1; k < 4; k++) { const a = pt(i+w*k/4,j,z+7), b = pt(i+w*k/4,j+d,z+2); line(a[0],a[1],b[0],b[1]); }
  const a = pt(i,j+d/2,z+4.5), b = pt(i+w,j+d/2,z+4.5); line(a[0],a[1],b[0],b[1]);
}
function dish(i,j,z){
  const [x,y] = pt(i,j,z); ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1.5; line(x,y,x,y-8);
  ctx.save(); ctx.translate(x,y-12); ctx.rotate(-0.5); ctx.fillStyle = rgb(WHITE,0.95); ellipse(0,0,8,4.5); ctx.strokeStyle = rgb([150,156,170]); ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}
function flag(i,j,z,h,c){
  const [x,y] = pt(i,j,z); ctx.strokeStyle = rgb([90,96,110]); ctx.lineWidth = 1.4; line(x,y,x,y-h);
  const w = RM ? 0 : Math.sin(T*5 + i)*2;
  ctx.fillStyle = rgb(c); ctx.beginPath(); ctx.moveTo(x,y-h); ctx.quadraticCurveTo(x+7,y-h-2+w,x+14,y-h+1+w); ctx.lineTo(x+14,y-h+9+w); ctx.quadraticCurveTo(x+7,y-h+6+w,x,y-h+8); ctx.closePath(); ctx.fill();
}
function smoke(i,j,z,c,rate=1){
  const [x,y] = pt(i,j,z);
  for (let k = 0; k < 5; k++) {
    const p = ((T*0.3*rate) + k/5) % 1;
    ctx.fillStyle = rgb(c, 1, 0.5*(1-p));
    circle(x + Math.sin(p*5+k)*3 + p*12, y - p*42, 3 + p*8);
  }
}
function turbine(i,j,z,h,ph){
  const [x,y] = pt(i,j,z);
  ctx.fillStyle = rgb(WHITE,0.92); ctx.beginPath(); ctx.moveTo(x-2.2,y); ctx.lineTo(x-0.9,y-h); ctx.lineTo(x+0.9,y-h); ctx.lineTo(x+2.2,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgb([170,176,190]); ctx.lineWidth = 0.8; ctx.stroke();
  const a0 = (RM ? 0 : T*2.4) + ph;
  ctx.strokeStyle = rgb(WHITE); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) { const a = a0 + k*Math.PI*2/3; line(x, y-h, x + Math.cos(a)*14, y-h + Math.sin(a)*14); }
  ctx.lineCap = 'butt';
  ctx.fillStyle = rgb([200,206,216]); circle(x,y-h,2.4);
  if (NIGHT > 0.2 && Math.sin(T*4+ph) > 0) { ctx.fillStyle = '#ff5050'; circle(x,y-h-3,1.6); }
}
function roofPyramid(i,j,w,d,z,h,c){
  const ap = pt(i+w/2,j+d/2,z+h);
  fillPoly([pt(i,j,z),pt(i+w,j,z),ap], winC(c,true,0.8), rgb(c,0.6));
  fillPoly([pt(i,j,z),pt(i,j+d,z),ap], winC(c,true,0.9), rgb(c,0.6));
  fillPoly([pt(i+w,j,z),pt(i+w,j+d,z),ap], winC(c,true,0.78), rgb(c,0.6));
  fillPoly([pt(i,j+d,z),pt(i+w,j+d,z),ap], winC(c,true,1.05), rgb(c,0.6));
}
function roofI(i,j,w,d,z,h,c,gc){ const jm = j+d/2, s = rgb(c,0.6);
  fillPoly([pt(i,j,z),pt(i+w,j,z),pt(i+w,jm,z+h),pt(i,jm,z+h)], rgb(c,0.78), s);
  fillPoly([pt(i+w,j,z),pt(i+w,j+d,z),pt(i+w,jm,z+h)], rgb(gc,0.8), rgb(gc,0.62));
  fillPoly([pt(i,jm,z+h),pt(i+w,jm,z+h),pt(i+w,j+d,z),pt(i,j+d,z)], rgb(c,1.02), s);
}
function roofJ(i,j,w,d,z,h,c,gc){ const im = i+w/2, s = rgb(c,0.6);
  fillPoly([pt(i,j,z),pt(i,j+d,z),pt(im,j+d,z+h),pt(im,j,z+h)], rgb(c,0.9), s);
  fillPoly([pt(im,j,z+h),pt(im,j+d,z+h),pt(i+w,j+d,z),pt(i+w,j,z)], rgb(c,0.76), s);
  fillPoly([pt(i,j+d,z),pt(i+w,j+d,z),pt(im,j+d,z+h)], rgb(gc,0.93), rgb(gc,0.62));
}
function billboard(i,j,w,z,text,bg){
  box(i+0.08,j,0.06,0.06,z,9,DARK); box(i+w-0.14,j,0.06,0.06,z,9,DARK);
  box(i,j,w,0.07,z+9,15,bg);
  faceText('j', i+w/2, j+0.075, z+10.5, text, 8, lit([28,37,65]), null);
}
function drawStar(x,y,R,r){ ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI/2 + k*Math.PI/5, rad = k%2 ? r : R; ctx.lineTo(x+Math.cos(a)*rad, y+Math.sin(a)*rad); } ctx.closePath(); }

/* =========================================================
   Bâtiments : dessins
   ========================================================= */
function modern(d,t,o){
  const [i0,j0,w,dd] = d.plot, m = 0.4;
  const bi = i0+m, bj = j0+m, bw = w-2*m, bd = dd-2*m, z0 = 4;
  const F = o.fb + Math.min(t, o.fm), H = F*FH, zt = z0+H;
  box(bi-0.16, bj-0.16, bw+0.32, bd+0.32, 0, z0, CONCRETE);
  box(bi, bj, bw, bd, z0, H, o.wall);
  const glass = o.glass || GLASS, seed = d.id.charCodeAt(0) + d.id.length;
  const skipDoor = face => (c, n) => d.door === face && !o.noDoor && Math.abs(c - (n-1)/2) < 0.8;
  const ci = Math.max(2, Math.round(bd*1.8)), cj = Math.max(2, Math.round(bw*1.8));
  wins('i', bi+bw+0.004, bj+0.12, bj+bd-0.12, z0, F, FH, ci, glass, seed, o.shop ? null : skipDoor('i'));
  wins('j', bj+bd+0.004, bi+0.12, bi+bw-0.12, z0, F, FH, cj, glass, seed+3, o.shop ? null : skipDoor('j'));
  if (o.shop) {
    fillPoly(faceQuad('i', bi+bw+0.006, bj+0.1, bj+bd-0.1, z0+2, z0+16), winC(glass,true,0.8), lit([255,255,255]), 1.2);
    fillPoly(faceQuad('j', bj+bd+0.006, bi+0.1, bi+bw-0.1, z0+2, z0+16), winC(glass,true,0.95), lit([255,255,255]), 1.2);
  }
  // pilier d'angle coloré
  box(bi+bw-0.2, bj+bd-0.2, 0.22, 0.22, z0, H, o.accent);
  box(bi-0.03, bj-0.03, bw+0.06, bd+0.06, zt-5, 5, o.accent);
  fillPoly([pt(bi+0.12,bj+0.12,zt),pt(bi+bw-0.12,bj+0.12,zt),pt(bi+bw-0.12,bj+bd-0.12,zt),pt(bi+0.12,bj+bd-0.12,zt)], rgb(o.roof || ROOF));
  if (!o.noDoor) door(d.door, bi, bj, bw, bd, z0, o.accent);
  d.top = zt + 16;
  return {bi, bj, bw, bd, z0, zt, F, H};
}

const DRAW = {
  info(d,s,t){
    const g = modern(d,t,{fb:2, fm:4, wall:[236,241,248], accent:d.col, glass:[112,176,236]});
    const {bi,bj,bw,bd,zt} = g;
    if (t >= 3) solar(bi+0.2, bj+0.2, 1.2, 0.7, zt);
    if (t >= 1) { acUnit(bi+0.2, bj+bd-0.75, zt); acUnit(bi+0.75, bj+bd-0.75, zt); }
    if (t >= 2) dish(bi+bw-0.6, bj+0.45, zt);
    antenna(bi+0.3, bj+0.35, zt, 20 + t*3);
    if (t >= 4) for (let k = 0; k < 5; k++) { const [x,y] = pt(bi+0.3+k*0.4, bj+bd-0.15, zt+1); ctx.fillStyle = Math.sin(T*6+k*1.7) > 0 ? '#57ff9a' : rgb([30,80,60]); circle(x,y,1.3); }
    roofSign(d,g,d.short,d.col);
  },
  tc(d,s,t){
    const g = modern(d,t,{fb:1, fm:3, wall:[252,242,230], accent:d.col, glass:[120,184,232], shop:true});
    const {bi,bj,bw,bd,zt} = g;
    flag(bi+0.25, bj+0.3, zt, 24, d.col);
    if (t >= 1) billboard(bi+bw*0.3, bj+0.3, bw*0.5, zt, 'PROMO -50 %', [255,214,70]);
    if (t >= 2) acUnit(bi+0.3, bj+bd-0.7, zt);
    if (t >= 3) acUnit(bi+0.85, bj+bd-0.7, zt);
    roofSign(d,g,d.short,d.col);
  },
  gea(d,s,t){
    const g = modern(d,t,{fb:2, fm:3, wall:[233,244,237], accent:d.col, glass:[124,186,226]});
    const {bi,bj,bw,bd,zt} = g;
    if (t >= 2) for (let k = 0; k < 3; k++) { box(bi+0.2+k*0.55, bj+0.2, 0.42, 0.42, zt, 4, WOOD); const [x,y] = pt(bi+0.41+k*0.55, bj+0.41, zt+4); ctx.fillStyle = rgb([70,160,80]); circle(x,y-3,5); ctx.fillStyle = rgb([100,190,90]); circle(x-1.5,y-5,3); }
    if (t >= 1) acUnit(bi+bw-0.7, bj+0.3, zt);
    flag(bi+bw-0.3, bj+0.3, zt, 22, [255,194,51]);
    roofSign(d,g,d.short,d.col);
  },
  geii(d,s,t){
    const g = modern(d,t,{fb:1, fm:3, wall:[243,243,236], accent:d.col, glass:[132,188,230]});
    const {bi,bj,bw,bd,zt} = g;
    if (t >= 1) solar(bi+bw-1.4, bj+0.2, 1.15, 0.75, zt);
    if (t >= 3) solar(bi+bw-1.4, bj+1.1, 1.15, 0.75, zt);
    turbine(bi+0.4, bj+0.4, zt, 34, 0);
    if (t >= 2) turbine(bi+0.4, bj+1.5, zt, 30, 1.3);
    if (t >= 4) turbine(bi+1.5, bj+0.4, zt, 38, 2.1);
    roofSign(d,g,d.short,d.col,lit([28,37,65]));
  },
  gmp(d,s,t){
    const [i0,j0,w,dd] = d.plot, m = 0.38;
    const bi = i0+m, bj = j0+m, bw = w-2*m, bd = dd-2*m, z0 = 4;
    const F = 1 + Math.min(t,2), H = F*22, zt = z0+H, red = d.col;
    box(bi-0.16, bj-0.16, bw+0.32, bd+0.32, 0, z0, CONCRETE);
    if (t >= 1) { box(bi+0.1, bj+bd+0.02, 0.3, 0.22, z0, 6, WOOD); box(bi+0.45, bj+bd+0.02, 0.3, 0.22, z0, 6, WOOD); box(bi+0.25, bj+bd+0.02, 0.3, 0.22, z0+6, 6, WOOD); }
    box(bi, bj, bw, bd, z0, H, [206,212,222]);
    wins('i', bi+bw+0.004, bj+0.1, bj+bd-0.1, z0, F, 22, Math.round(bd*2.4), [150,196,230], 3, (c,n) => Math.abs(c-(n-1)/2) < 0.8);
    wins('j', bj+bd+0.004, bi+0.1, bi+bw-0.1, z0, F, 22, Math.round(bw*2.4), [150,196,230], 4);
    // grande porte de chargement
    fillPoly(faceQuad('j', bj+bd+0.006, bi+bw-1.2, bi+bw-0.45, z0, z0+17), rgb([150,156,168]), rgb(DARK));
    ctx.strokeStyle = rgb([120,126,138]); ctx.lineWidth = 0.8;
    for (let k = 1; k < 6; k++) { const a = pt(bi+bw-1.2, bj+bd+0.006, z0+k*2.8), b = pt(bi+bw-0.45, bj+bd+0.006, z0+k*2.8); line(a[0],a[1],b[0],b[1]); }
    box(bi-0.02, bj-0.02, bw+0.04, bd+0.04, zt-4, 4, red);
    door('i', bi, bj, bw, bd, z0, red);
    // toiture en sheds
    const n = Math.max(3, Math.round(bw/0.8)), tw = bw/n, rh = 12;
    for (let k = 0; k < n; k++) {
      const a = bi + k*tw, b = a + tw;
      fillPoly([pt(a,bj,zt),pt(a,bj+bd,zt),pt(b,bj+bd,zt+rh),pt(b,bj,zt+rh)], rgb([160,168,180],1.05), rgb([120,126,140]));
      fillPoly([pt(a,bj+bd,zt),pt(b,bj+bd,zt),pt(b,bj+bd,zt+rh)], rgb([206,212,222],0.93), rgb([150,156,168]));
      fillPoly([pt(b,bj,zt),pt(b,bj+bd,zt),pt(b,bj+bd,zt+rh),pt(b,bj,zt+rh)], winC([150,196,230],true,0.8), rgb([120,126,140]));
    }
    cyl(bi+0.3, bj+0.3, 0.17, zt, 34+t*4, [196,196,202]);
    const [cx,cy] = pt(bi+0.3, bj+0.3, zt+22+t*3); ctx.fillStyle = rgb(red); ctx.fillRect(cx-7.6, cy-3, 15.2, 5);

function isoSort(arr){
  const n = arr.length;
  for (const a of arr) { a._b = []; a._v = 0; a._x0 = (a.minI - a.maxJ)*HW - 14; a._x1 = (a.maxI - a.minJ)*HW + 14; }
  for (let p = 0; p < n; p++) { const a = arr[p];
    for (let q = p+1; q < n; q++) { const b = arr[q];
      if (a._x1 <= b._x0 || b._x1 <= a._x0) continue;
      if (a.maxI <= b.minI || a.maxJ <= b.minJ) b._b.push(a);
      else if (b.maxI <= a.minI || b.maxJ <= a.minJ) a._b.push(b);
      else if (a.minI+a.maxI+a.minJ+a.maxJ < b.minI+b.maxI+b.minJ+b.maxJ) b._b.push(a); else a._b.push(b);
    } }
  const out = [];
  const visit = a => { if (a._v) return; a._v = 1; for (const b of a._b) visit(b); out.push(a); };
  for (const a of arr) visit(a);
  return out;
}

/* ----- Conseil de Plume : l'achat qui rembourse le plus vite ----- */
let REC = {id:null, act:null, cost:0};
function gainOf(d, act){
  const tot = totalRate(), rayG = tot*RAY/rayMult(), sm = siteMult(d.site)*globalMult();
  if (d.kind === 'dept') {
    const l = L(d.id);
    if (act === 'hire') return rateOf(d);
    const nl = act === 'build' ? 1 : l + 1;
    return (rateAt(d, nl) - rateAt(d, l)) * mgrF(d) * evtF(d) * deptCard(d) * sm + rayG;
  }
  return siteRate(d.site) * d.bonus*(1 + 0.1*TR('svc'))*(1 + cardBonus('svc')) / svcMult(d.site);
}
function bestOption(sites, affordableOnly, noBuild){
  let best = null, bs = Infinity;
  for (const site of sites) for (const d of SITE_DEFS[site]) {
    const l = L(d.id), opts = [];
    if (!l) { if (!noBuild) opts.push(['build', d.unlock]); }
    else { opts.push(['up', costN(d,1)]); if (d.kind === 'dept' && !S.b[d.id].mgr) opts.push(['hire', mgrCost(d)]); }
    for (const [act, cost] of opts) {
      if (affordableOnly && cost > S.money) continue;
      const g = gainOf(d, act); if (!(g > 0)) continue;
      const sc = cost / g; if (sc < bs) { bs = sc; best = {id:d.id, act, cost}; }
    }
  }
  return best;
}
function updRec(){ REC = bestOption([S.site], false, false) || {id:null, act:null, cost:0}; }
let autoAcc = 0;
function autoTick(dt){
  const lv = TR('auto'); if (!lv || !S.autoOn) return;
  autoAcc += dt; if (autoAcc < AUTO_INT[lv]) return; autoAcc = 0;
  const b = bestOption(SITES.filter(s => siteOpen(s.id)).map(s => s.id), true, true); if (!b) return;
  const d = BY[b.id];
  if (b.act === 'hire') hire(d, true); else upgrade(d, 1, true);
}

   Entrées (souris, tactile, molette)
   ========================================================= */

    const h = hitAt(p.x,p.y); cvs.classList.toggle('hot', !!h);
    if (e.pointerType === 'mouse') { if (h) showTip(h.type === 'jpo' ? 'jpow' : 'b:' + h.d.id, null, {x:e.clientX, y:e.clientY}); else if (tipPos) hideTip(); }

  } else if (drag) {

    if (!moved && Math.abs(dx) + Math.abs(dy) > 7) { moved = true; cvs.classList.add('drag'); }

const LB = {db:null, user:null, uid:null, rows:[], ready:false, canWrite:true, lastPush:0, lastSig:''};
async function initLB(){

    if (!window.claude || typeof window.claude.use !== 'function') return;

}

  walkers.length = 0; closeSheets(); DEFS.forEach(d => d.anim = T); DEC = null; renderDec();
  party(); sfx('boost'); updateObj(); save(); pushScore(true);
  const cardsHtml = got.map(({c, isNew}) => `<li class="card r${c.r}"><span class="av" style="--c:${colCss(c.t.startsWith('dept:') ? BY[c.t.slice(5)].col : [255,194,51])}">${initials(c.n)}</span><div><b>${c.n}${isNew ? ' <span class="new">Nouveau</span>' : ''}</b><small>${c.m} · ${RARITY[c.r]}</small><small class="cb">${cardDesc(c)}</small></div></li>`).join('');
  openModal(`Promotion n° ${S.promos} diplômée !`, `<p>+${fmt(g)} diplômés (+${fmt(g*2)} % de revenus pour toujours) et +${fmt(g)} crédits ECTS à dépenser au conseil pédagogique.</p>
    ${opened.length ? `<p><b>Nouveau site débloqué : ${opened.map(s => s.full).join(', ')} !</b> Change de site avec les boutons en bas à gauche.</p>` : ''}
    <h3 class="eyebrow sec">Des anciens élèves reviennent te voir</h3><ul class="cards">${cardsHtml}</ul>`, [{label:'Commencer la nouvelle année', cls:'go', fn:closeModal}]);
}
$('bGrad').onclick = () => { if (!gradSheet.hidden) { closeSheets(); return; } openSheet('grad'); buildGrad(); sfx('click'); };

/* ----- Options, export et import de la sauvegarde ----- */
const encodeSave = () => 'IUTR1:' + btoa(unescape(encodeURIComponent(JSON.stringify({...S, t:Date.now()}))));
function decodeSave(code){
  const c = String(code || '').trim(); if (!c.startsWith('IUTR1:')) throw new Error('format');
  return JSON.parse(decodeURIComponent(escape(atob(c.slice(6)))));
}
$('bOpts').onclick = () => {
  openModal('Options', `
    <label class="opt"><input type="checkbox" id="oMusic" ${S.music ? 'checked' : ''}> Musique</label>
    <label class="opt"><input type="checkbox" id="oSound" ${S.muted ? '' : 'checked'}> Effets sonores</label>
    <label class="opt"><input type="checkbox" id="oTips" ${S.tipsOff ? "" : "checked"}> Conseils de Plume</label>
    <p class="small">Morceau en cours : ${Music.title()} (il change selon le jour, la nuit et la saison).</p>
    <button type="button" class="btn sm" id="oReplay">Revoir tous les conseils de Plume</button>
    <p class="small">Glisse pour te déplacer, molette ou pincement pour zoomer. La partie est sauvegardée automatiquement dans ce navigateur. Saison actuelle : ${SEASON_NAME[SEASON].toLowerCase()} (selon la vraie date).</p>
    <p class="small">Total gagné depuis le début : <b>${eur(S.total)}</b></p>
    <h3 class="eyebrow sec">Sauvegarde</h3>
    <div class="m-row"><button type="button" class="btn sm" id="oExport">Exporter ma partie</button><button type="button" class="btn sm" id="oImport">Importer une partie</button></div>
    <div id="oIO" hidden><label class="small" for="oCode" id="oLbl"></label><textarea id="oCode" rows="4" spellcheck="false"></textarea>
      <div class="m-row"><button type="button" class="btn sm" id="oCopy">Copier le code</button><button type="button" class="btn go sm" id="oLoad">Charger ce code</button></div><p class="small" id="oMsg"></p></div>
    <h3 class="eyebrow sec">Nouvelle partie</h3>
    <button type="button" class="btn sm" id="oReset">Recommencer depuis zéro</button>`, [{label:'Fermer', cls:'go', fn:closeModal}]);
  $('oSound').onchange = e => { S.muted = !e.target.checked; if (!S.muted) { audioInit(); sfx('click'); } save(); };
  $('oMusic').onchange = e => setMusic(e.target.checked);
  $('oTips').onchange = e => { S.tipsOff = !e.target.checked; if (S.tipsOff && MASCOT) { MASCOT = null; $('mascot').hidden = true; } save(); };
  $('oReplay').onclick = () => { S.tips = {}; S.tipsOff = false; save(); closeModal(); toast('Plume va tout te réexpliquer.'); };
  const io = $('oIO'), code = $('oCode'), msg = $('oMsg');
  let loadArmed = false;
  $('oExport').onclick = () => { io.hidden = false; $('oLbl').textContent = 'Ton code de sauvegarde (garde-le précieusement) :'; code.value = encodeSave(); $('oCopy').hidden = false; $('oLoad').hidden = true; msg.textContent = ''; code.select(); };
  $('oImport').onclick = () => { io.hidden = false; $('oLbl').textContent = 'Colle ici un code de sauvegarde :'; code.value = ''; $('oCopy').hidden = true; $('oLoad').hidden = false; msg.textContent = ''; loadArmed = false; $('oLoad').textContent = 'Charger ce code'; code.focus(); };
  $('oCopy').onclick = () => {
    try { navigator.clipboard.writeText(code.value).then(() => { msg.textContent = 'Code copié.'; }, () => { code.select(); msg.textContent = 'Sélectionné : copie-le avec Ctrl+C.'; }); }
    catch (e) { code.select(); msg.textContent = 'Sélectionné : copie-le avec Ctrl+C.'; }
  };
  $('oLoad').onclick = () => {
    let o; try { o = decodeSave(code.value); } catch (e) { msg.textContent = 'Ce code n’est pas valide. Vérifie qu’il commence par IUTR1: et qu’il est complet.'; return; }
    if (!loadArmed) { loadArmed = true; $('oLoad').textContent = 'Confirmer : remplacer ma partie'; $('oLoad').classList.add('hot'); msg.textContent = 'Ta partie actuelle sera remplacée.'; return; }
    S = sanitize(o); delete S.migrated; walkers.length = 0; closeSheets(); DEFS.forEach(d => d.anim = T); save(); closeModal(); updateObj(); paintMusic(); toast('Partie importée.', 'gold');
  };
  let armed = false;
  $('oReset').onclick = () => { if (!armed) { armed = true; $('oReset').textContent = 'Confirmer : tout effacer'; $('oReset').classList.add('hot'); return; } hardReset(); closeModal(); };
};
function hardReset(){ const mu = S.music, sm = S.muted, ps = S.pseudo; S = freshState(); S.intro = true; S.music = mu; S.muted = sm; S.pseudo = ps; walkers.length = 0; closeSheets(); DEFS.forEach(d => d.anim = T); updateObj(); save(); toast('Nouvelle partie : bienvenue à l’IUT !'); }

function hideHint(){ const h = $('hint'); if (h && !h.classList.contains('gone')) h.classList.add('gone'); }

/* ----- HUD ----- */
let lastHud = '';
function updateHud(){
  const e = S.evt && EV(S.evt.id);
  const m = eur(S.money), r = eur(totalRate()) + '/s', st = fmt(students()), dp = fmt(S.dip), key = m+r+st+dp+S.ects+Math.ceil(S.boost)+(e ? e.id+Math.ceil(S.evt.t) : '');
  if (key === lastHud) return; lastHud = key;
  $('hMoney').textContent = m; $('hRate').textContent = r; $('hStu').textContent = st; $('hDip').textContent = dp; $('hDipSub').textContent = `diplômés · ${fmt(S.ects)} ECTS`;
  $('hBoost').hidden = S.boost <= 0; $('hBoostT').textContent = Math.ceil(S.boost) + ' s'; $('hBoostX').textContent = boostX();
  const he = $('hEvt'); he.hidden = !e;
  if (e) { he.classList.toggle('bad', !e.good); $('hEvtN').textContent = e.n; $('hEvtT').textContent = Math.ceil(S.evt.t) + ' s'; he.title = e.d; }
}

/* ----- Choix de site, décision, Plume, mode décoration ----- */
function renderSites(){
  const el = $('sites'); el.hidden = S.promos < 1 && S.site === 'reims';
  const bs = document.querySelector('.brand small'); if (bs) bs.textContent = SITE_BY[S.site].full;
  el.innerHTML = SITES.map(s => { const open = siteOpen(s.id);
    return `<button type="button" class="site-b${S.site === s.id ? ' on' : ''}${open ? '' : ' lock'}" data-site="${s.id}" aria-pressed="${S.site === s.id}" title="${open ? s.full : `Débloqué après ${s.need} remises des diplômes`}">${s.name}${open ? '' : ` · ${s.need} promos`}</button>`; }).join('');
}
function switchSite(id){
  if (id === S.site) return;
  if (!siteOpen(id)) { toast(`${SITE_BY[id].full} : s’ouvre après ${SITE_BY[id].need} remises des diplômes.`); return; }
  S.site = id; walkers.length = 0; closeSheets(); stopPlacing(); hideTip(); fitCam();
  for (let k = 0; k < Math.min(20, wantWalkers()); k++) spawnWalker(false);
  renderSites(); updRec(); save(); sfx('build'); toast(`Bienvenue : ${SITE_BY[id].full}`, 'gold');
}
$('sites').addEventListener('click', e => { const b = e.target.closest('[data-site]'); if (b) switchSite(b.dataset.site); });
$('decision').addEventListener('click', e => { const b = e.target.closest('[data-dec]'); if (b && !b.disabled) resolveDec(+b.dataset.dec); });
function renderDecButtons(){ $('decision').querySelectorAll('[data-dec]').forEach(b => { b.disabled = decCost(+b.dataset.dec ? DEC.b : DEC.a) > S.money; }); }
$('plumeOk').onclick = () => { dismissMascot(); sfx('click'); };
$('plumeOff').onclick = () => { S.tipsOff = true; dismissMascot(); toast('Conseils coupés. Tu peux les réactiver dans Options.'); };
$('placingX').onclick = () => stopPlacing();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && placing) stopPlacing(); });

/* ----- Infobulles (survol à la souris, appui au doigt) ----- */
const tipEl = $('tip');
let tipKey = null, tipAnchor = null, tipPos = null;
const tr = (a,b,cls) => `<span class="tr${cls ? ' ' + cls : ''}"><span>${a}</span><b>${b}</b></span>`;
const multStr = m => m >= 1 ? '+' + fmtPct((m-1)*100) : '−' + fmtPct((1-m)*100);
function evtEffect(e){
  if (e.id === 'neige') return L('resid') ? 'Revenus −10 % (la Résidence Crous limite les dégâts)' : 'Revenus −30 % (−10 % avec la Résidence Crous)';
  if (e.id === 'partiels') return 'Revenus −20 %, mais le bonus de la BU compte triple';
  if (e.id === 'wifi') return 'Informatique et le labo ne rapportent plus rien';
  if (e.lump) return `+${e.lump/60} min de revenus versés immédiatement`;
  if (e.jpo) return `${e.jpo} visiteurs de la JPO arrivent : clique sur les étoiles`;
  return `Tous les revenus ×${fmtMult(e.m).replace(/,00$/,'')}`;
}
const SEASON_TIP = {
  hiver:'Les arbres sont nus et la neige tombe souvent : l’événement « Neige sur Reims » est 3 fois plus fréquent.',
  printemps:'Les arbres sont en fleurs et il pleut de temps en temps.',
  ete:'Tout est vert. Le « Grand soleil sur Reims » (revenus ×1,25) peut tomber.',
  automne:'Les feuilles jaunissent et la pluie est fréquente. Le « Grand soleil » reste possible.',
};
function tipHtml(key){
  if (key === 'money') {
    const open = SITES.filter(s => siteOpen(s.id));
    let h = `<span class="tt">${eur(totalRate())}/s</span>`;
    if (open.length > 1) for (const s of open) h += tr('Site de ' + s.name, eur(siteRate(s.id)) + '/s');
    let base = 0; for (const d of SITE_DEPTS[S.site]) base += baseRate(d);
    h += tr(`Départements de ${SITE_BY[S.site].name} (base)`, eur(base) + '/s', open.length > 1 ? 'tot' : '');
    for (const [n,m] of SITE_FACTORS()) if (m !== 1) h += tr(n, multStr(m));
    for (const [n,m] of GLOBAL_FACTORS()) if (m !== 1) h += tr(n, multStr(m));
    if (evtMult() !== 1) h += tr('Événement en cours', multStr(evtMult()));
    if (S.boost > 0) h += tr('Journée portes ouvertes', '×' + boostX());
    return h + tr('Multiplicateur du site', '×' + fmtMult(mult()), 'tot') + '<span class="tn">L’argent de tous les sites est commun et versé automatiquement chaque seconde.</span>';
  }
  if (key === 'stu') {
    let h = `<span class="tt">${fmt(students())} étudiants</span>`;
    for (const d of SITE_DEPTS[S.site]) if (L(d.id)) h += tr(d.name, fmt(L(d.id)*d.spl));
    for (const s of SITES) if (s.id !== S.site && siteStudents(s.id)) h += tr('Site de ' + s.name, fmt(siteStudents(s.id)));
    return h + '<span class="tn">Chaque niveau de département accueille de nouveaux étudiants.</span>';
  }
  if (key === 'dip') {
    const g = dipGain();
    return `<span class="tt">${fmt(S.dip)} diplômés</span>` + tr('Bonus permanent', '+' + fmt(S.dip*2) + ' %') + tr('Crédits ECTS', fmt(S.ects)) + tr('Prochaine cérémonie', S.run >= PRESTIGE_MIN ? '+' + fmt(g) : 'dès ' + eur(PRESTIGE_MIN)) + '<span class="tn">Ouvre « Diplômes » pour organiser la cérémonie ou dépenser tes ECTS.</span>';
  }
  if (key === 'evt') {
    const e = S.evt && EV(S.evt.id); if (!e) return null;
    return `<span class="tt">${e.n}</span><span class="te">${e.good ? 'Effet' : 'Malus'} : ${evtEffect(e)}</span>` + tr('Temps restant', Math.ceil(S.evt.t) + ' s', 'tot');
  }
  if (key === 'jpo') {
    if (S.boost <= 0) return null;
    return `<span class="tt">Journée portes ouvertes</span>` + tr('Effet', 'revenus ×' + boostX()) + tr('Temps restant', Math.ceil(S.boost) + ' s') + '<span class="tn">Un visiteur à l’étoile dorée passe de temps en temps : clique dessus.</span>';
  }
  if (key === 'season') return `<span class="tt">${SEASON_NAME[SEASON]} · ${WEATHER_NAME[WEATHER]}</span>${SEASON_TIP[SEASON]}<span class="tn">La saison suit la vraie date. La météo est décorative : seuls les événements changent les revenus.</span>`;
  if (key === 'obj') {
    const o = OBJS[S.obj]; if (!o) return null;
    return `<span class="tt">Objectif ${S.obj+1}/${OBJS.length}</span>${o[0]}` + tr('Récompense', eur(objReward())) + '<span class="tn">La récompense vaut 1 min de revenus et se verse toute seule.</span>';
  }
  if (key === 'jpow') return `<span class="tt">Visiteur de la JPO</span>Clique dessus : tous les revenus ×${boostX()} pendant ${30 + 15*TR('jpo')} s.`;
  if (key.startsWith('b:')) {
    const d = BY[key.slice(2)], s = S.b[d.id];
    if (!s.lvl) return `<span class="tt">${d.name}</span>` + tr('Construction', eur(d.unlock)) + (d.kind === 'dept' ? tr('Revenus au niveau 1', eur(rateAt(d,1)*mult()) + '/s') : tr('Bonus par niveau', '+' + fmtPct(svcPct(d,1)))) + `<span class="tn">${S.money >= d.unlock ? 'Tu peux le construire : clique pour ouvrir la fiche.' : 'Clique pour ouvrir la fiche.'}</span>`;
    let h = `<span class="tt">${d.name}</span>` + tr('Niveau', s.lvl);
    if (d.kind === 'dept') {
      const tot = totalRate(), share = tot > 0 ? rateOf(d)/tot*100 : 0, nm = nextOf(MILES, s.lvl);
      h += tr('Revenus', eur(rateOf(d)) + '/s') + tr('Part des revenus', fmtPct(share)) + tr('Rayonnement', '+' + fmtPct(s.lvl*RAY*100)) + (nm ? tr('Prochain ×2', 'niv. ' + nm) : '') + tr('Responsable', s.mgr ? 'en poste' : eur(mgrCost(d)));
    } else {
      const nt = nextOf(tiersFor(d), s.lvl);
      h += tr('Bonus', '+' + fmtPct(svcPct(d, s.lvl))) + (nt ? tr('Agrandissement', 'niv. ' + nt) : '');
    }
    return h + `<span class="tn">${S.money >= costN(d,1) ? 'Amélioration disponible : clique pour ouvrir.' : 'Clique pour ouvrir la fiche.'}</span>`;
  }
  return null;
}
function renderTip(){
  if (!tipKey) return;
  const h = tipHtml(tipKey); if (!h) { hideTip(); return; }
  if (tipEl.innerHTML !== h) tipEl.innerHTML = h;
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect(); let x, y;
  if (tipPos) { x = tipPos.x + 16; y = tipPos.y + 18; if (y + r.height > innerHeight - 8) y = tipPos.y - r.height - 12; }
  else { const a = tipAnchor.getBoundingClientRect(); x = a.left; y = a.bottom + 8; if (y + r.height > innerHeight - 8) y = a.top - r.height - 8; }
  tipEl.style.left = clamp(x, 8, innerWidth - r.width - 8) + 'px'; tipEl.style.top = clamp(y, 8, innerHeight - r.height - 8) + 'px';
}
function showTip(key, anchor, pos){ tipKey = key; tipAnchor = anchor; tipPos = pos || null; renderTip(); }
function hideTip(){ tipKey = null; tipAnchor = null; tipPos = null; tipEl.hidden = true; }
document.querySelectorAll('[data-tip]').forEach(el => {
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(el.dataset.tip, el); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && tipAnchor === el) hideTip(); });
  el.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { if (tipAnchor === el) hideTip(); else showTip(el.dataset.tip, el); } });
  el.addEventListener('focus', () => showTip(el.dataset.tip, el));
  el.addEventListener('blur', () => { if (tipAnchor === el) hideTip(); });
});
document.addEventListener('pointerdown', e => { if (tipKey && !tipPos && !e.target.closest('[data-tip]')) hideTip(); });

/* =========================================================
   Sauvegarde
   ========================================================= */
const KEY = 'iut-tycoon-reims-v1';
function save(){ S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function loadLocal(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function offline(){
  const el = Math.min(offlineCap(), (Date.now() - S.t)/1000);
  if (!(el > 60)) return;
  let base = 0; for (const s of SITES) { let b = 0; for (const d of SITE_DEPTS[s.id]) b += rateAt(d, L(d.id)) * mgrF(d) * deptCard(d); base += b * siteMult(s.id); }
  const gain = base * permMult() * (hasMgr('gea') ? 1.5 : 1) * el;
  S.boost = 0; S.evt = null;
  if (gain > 0) {
    earn(gain); save();
    openModal('Bon retour !', `<p>Pendant ton absence (${fmtDur(el)}), ton IUT a continué de tourner. Tu as gagné :</p><div class="big-num">${ICON.big}${eur(gain)}</div><p class="small">Les revenus hors ligne sont comptés jusqu’à ${fmtDur(offlineCap())}. La Résidence Crous et le conseil pédagogique augmentent cette durée.</p>`,
      [{label:'Continuer', cls:'go', fn:closeModal}]);
  }
}
function intro(){
  openModal('Bienvenue à l’IUT de Reims !', `
    <p>Tu prends la direction du campus du Moulin de la Housse. Pour l’instant, seul le département Informatique est ouvert.</p>
    <ul>
      <li>L’argent tombe tout seul, chaque seconde : 1 € par seconde au départ, puis de plus en plus.</li>
      <li>Clique sur un bâtiment pour l’améliorer : aux niveaux 10, 25, 50, 100… ses revenus doublent.</li>
      <li>Ouvre 7 départements et 9 lieux de vie. Construire tout le campus prend environ 2 h.</li>
      <li>Recrute des responsables : revenus ×2 et un talent chacun.</li>
      <li>Surveille les événements (rentrée, partiels, neige, gala…) et les saisons, qui suivent la vraie date.</li>
      <li>Organise ensuite une remise des diplômes pour repartir plus fort, et dépense tes crédits ECTS au conseil pédagogique.</li>
    </ul>`, [{label:'Ouvrir l’IUT', cls:'go', fn:() => { S.intro = true; closeModal(); audioInit(); sfx('build'); save(); }}]);
}

/* =========================================================
   Boucle
   ========================================================= */
let last = performance.now(), uiAcc = 0, objAcc = 0;
function frame(now){
  const real = Math.max(0, (now - last)/1000), dt = Math.min(0.1, real); last = now;
  econ(Math.min(real, 43200));
  T += dt;
  const p = (T/300) % 1, sn = Math.sin(p*Math.PI*2);
  NIGHT = clamp((-sn - 0.25)/0.5, 0, 1)*0.85;
  if (cam.tx != null) { const k = RM ? 1 : 1 - Math.pow(0.002, dt); cam.x += (cam.tx - cam.x)*k; cam.y += (cam.ty - cam.y)*k; if (Math.abs(cam.tx-cam.x) + Math.abs(cam.ty-cam.y) < 1) cam.tx = cam.ty = null; clampCam(); }
  updWalkers(dt); updFx(dt); updEvents(dt); updWeather(dt); updDecisions(dt); mascotTick(dt); autoTick(dt); updRecords(dt);
  render();
  updateHud();
  uiAcc += dt; if (uiAcc > 0.15) { uiAcc = 0; updatePanel(); updateCampus(); updateGrad(); if (tipKey) renderTip(); }
  objAcc += dt; if (objAcc > 0.5) { objAcc = 0; updateObj(); checkAch(); updateAch(); pushScore(false); updRec(); refreshChallenges(); Music.setMood(NIGHT > 0.45 ? 'nuit' : SEASON === 'hiver' ? 'hiver' : SEASON === 'ete' ? 'ete' : 'jour'); if (DEC) renderDecButtons(); }
  requestAnimationFrame(frame);
}

function start(data){
  let restored = false;
  if (data && data.save) { try { S = sanitize(JSON.parse(data.save)); restored = true; } catch (e) {} }
  if (!restored) S = sanitize(loadLocal());
  resize();
  if (data && data.cam) { cam.x = data.cam.x; cam.y = data.cam.y; cam.z = data.cam.z; } else fitCam();
  for (let k = 0; k < Math.min(24, wantWalkers()); k++) { spawnWalker(false); const w = walkers[walkers.length-1]; w.a = 1; for (let s = 0; s < 8; s++) nextTile(w); w.x = w.ti+0.5+w.ox; w.y = w.tj+0.5+w.oy; nextTile(w); }
  if (!restored) {
    if (S.migrated) {
      delete S.migrated; save();
      openModal('Nouvelle version du campus !', `<p>Le jeu a été rééquilibré pour une vraie première année d’environ 2 h, avec 4 nouveaux bâtiments (amphithéâtre, labo de recherche, arrêt de bus, Résidence Crous), des événements, des saisons, des talents et un conseil pédagogique.</p><p>Ta partie repart au début, mais <b>tes succès sont conservés</b>.</p>`, [{label:'C’est parti', cls:'go', fn:closeModal}]);
    } else if (S.intro) offline();
  }
  refreshChallenges(); if (!S.hist.length) S.hist.push([Date.now(), totalRate()]);
  updateObj(); updateHud(); paintMusic(); updSeasonChip(); renderSites(); updRec();
  initLB();
  if (document.fonts && document.fonts.load) document.fonts.load(`16px "Lilita One"`).catch(() => {});
  window.addEventListener('resize', resize);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  setTimeout(hideHint, 9000);
  window.claude?.hot?.snapshot?.(() => ({save: JSON.stringify({...S, t:Date.now()}), cam:{x:cam.x, y:cam.y, z:cam.z}}));
  last = performance.now(); requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

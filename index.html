/**
 * Retours au joueur (message, son, confettis) sans que la logique du jeu dépende de l'interface.
 * L'interface et l'audio branchent leurs fonctions au démarrage avec setNotifier().
 */
const handlers = {
  toast: () => {},
  sound: () => {},
  celebrate: () => {},
};

/** Branche l'implémentation d'un type de retour : 'toast', 'sound' ou 'celebrate'. */
function setNotifier(kind, fn) { handlers[kind] = fn; }

const notify = {
  /** Message temporaire ; kind = 'gold' pour une bonne nouvelle. */
  toast: (text, kind) => handlers.toast(text, kind),
  /** Effet sonore : 'coin', 'up', 'build', 'boost' ou 'click'. */
  sound: name => handlers.sound(name),
  /** Pluie de confettis. */
  celebrate: () => handlers.celebrate(),
};


/* ===== js/game/challenges.js ===== */
/** Défis du jour et de la semaine : les mêmes pour tous les joueurs, tirés à partir de la date. */

function pickChallenges(pool, key, count) {
  const rnd = mulberry32(hashStr(key)), rest = pool.slice(), ids = [];
  while (ids.length < count && rest.length) ids.push(rest.splice(Math.floor(rnd() * rest.length), 1)[0].id);
  return ids;
}

/** Tire de nouveaux défis quand le jour ou la semaine change. */
function refreshChallenges() {
  const dk = dayKey(), wk = weekKey();
  if (!state.daily || state.daily.key !== dk) {
    state.daily = { key: dk, ids: pickChallenges(DAILY_POOL, dk, 3), prog: {}, got: {}, base: Math.max(1e4, totalRate() * 7200), all: false };
  }
  if (!state.weekly || state.weekly.key !== wk) {
    state.weekly = { key: wk, ids: pickChallenges(WEEKLY_POOL, wk, 1), prog: {}, got: {}, base: 0, all: false };
  }
}

/** Objectif chiffré d'un défi ('2h' = deux heures de revenus au moment du tirage). */
const challengeGoal = (c, set) => (c.goal === '2h' ? set.base : c.goal);

/** Total d'un compteur depuis le début de la partie (sert aux missions). */
const lifetimeCount = counter => (state.rec && state.rec['n_' + counter]) || 0;

/**
 * Fait progresser un compteur (niveaux achetés, événements vécus…) : total de la partie, défis du jour et de la semaine.
 * Verse les récompenses des défis réussis (ECTS et pépites).
 * @param {'lvl'|'jpo'|'evt'|'dec'|'mgr'|'bld'|'deco'|'earn'|'grad'|'ach'|'abil'|'critter'|'mission'|'chest'} counter
 */
function trackStat(counter, amount = 1) {
  state.rec['n_' + counter] = lifetimeCount(counter) + amount;
  if (!state.daily || !state.weekly) return;
  for (const [set, pool, weekly] of [[state.daily, DAILY_POOL, false], [state.weekly, WEEKLY_POOL, true]]) {
    set.prog[counter] = (set.prog[counter] || 0) + amount;
    for (const id of set.ids) {
      const c = pool.find(x => x.id === id);
      if (!c || c.k !== counter || set.got[id] || set.prog[counter] < challengeGoal(c, set)) continue;
      set.got[id] = 1;
      const ects = weekly ? c.r : DAILY_REWARD, gems = weekly ? GEM_REWARDS.weekly : GEM_REWARDS.daily;
      state.ects += ects;
      state.gems += gems;
      notify.toast(`Défi ${weekly ? 'de la semaine' : 'du jour'} réussi : ${c.n} (+${ects} ECTS, +${gems} pépite${gems > 1 ? 's' : ''})`, 'gold');
      notify.sound('boost');
    }
    if (!weekly && !set.all && set.ids.length && set.ids.every(id => set.got[id])) {
      set.all = true;
      state.ects += DAILY_BONUS;
      state.gems += GEM_REWARDS.dailyAll;
      notify.toast(`Les 3 défis du jour sont réussis : +${DAILY_BONUS} ECTS et +${GEM_REWARDS.dailyAll} pépites de bonus !`, 'gold');
      notify.celebrate();
    }
  }
}


/* ===== js/data/map.js ===== */
/**
 * Plan du campus (identique pour les trois sites) : pelouse, allées, avenues et place centrale.
 * Coordonnées (i, j) en cases ; la case (0, 0) est en haut de l'écran.
 */

const T_GRASS = 0, T_PATH = 1, T_AVE = 2, T_PLAZA = 3;

/** Type de chaque case, indexé par i*N + j. */
const tiles = new Uint8Array(N * N);

/** Cases infranchissables par les piétons (fontaine, totem). */
const blocked = new Uint8Array(N * N);

for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  let t = T_GRASS;
  if (i >= 2 && i <= 23 && j >= 2 && j <= 23) {
    if (i >= 11 && i <= 14 && j >= 11 && j <= 14) t = T_PLAZA;
    else if (i === 2 || i === 23 || j === 2 || j === 23) t = T_PATH;
    else if ((i >= 11 && i <= 14) || (j >= 11 && j <= 14)) t = T_AVE;
    else if (i === 6 || i === 18 || j === 6 || j === 18) t = T_PATH;
  }
  tiles[i * N + j] = t;
}
for (const [i, j] of [[12, 12], [12, 13], [13, 12], [13, 13], [14, 11]]) blocked[i * N + j] = 1;

const tileAt = (i, j) => tiles[i * N + j];

/** Une case sur laquelle les étudiants peuvent marcher. */
const walkable = (i, j) => i >= 0 && j >= 0 && i < N && j < N && tiles[i * N + j] !== T_GRASS && !blocked[i * N + j];

/** Rangs de vigne en bordure de carte (site de Châlons). */
const isVine = (i, j) => (i <= 1 && j >= 3 && j <= 9) || (j <= 1 && i >= 16 && i <= 23);


/* ===== js/game/decisions.js ===== */
/**
 * Décisions : un dilemme apparaît de temps en temps, le joueur a 45 s pour choisir,
 * sinon la deuxième option est appliquée.
 */

const DECISION_TIME = 45;
let nextDecisionIn = 180 + Math.random() * 120;
const decisionListeners = [];

/** Décision en cours, ou null. */
let decision = null;

/** Appelé quand une décision apparaît ou disparaît. */
function onDecisionChange(fn) { decisionListeners.push(fn); }
const notifyDecisionChange = () => decisionListeners.forEach(fn => fn(decision));

/** Prix d'une option (en euros, d'après les revenus actuels). */
const optionCost = option => (option.pay ? totalRate() * option.pay : 0);

function updateDecisions(dt) {
  if (decision) {
    decision.t -= dt;
    if (decision.t <= 0) resolveDecision(1);
    return;
  }
  if (state.evt || !state.intro) return;
  nextDecisionIn -= dt;
  if (nextDecisionIn > 0) return;
  nextDecisionIn = 240 + Math.random() * 180;
  const pool = DECISIONS.filter(x => !x.cond || x.cond());
  if (pool.length) startDecision(pick(pool));
}

/** Propose une décision (tirée au sort, ou choisie depuis le mode admin). */
function startDecision(model) {
  decision = { ...model, t: DECISION_TIME, max: DECISION_TIME };
  notify.sound('click');
  notifyDecisionChange();
}

/** Applique l'option choisie (0 = a, 1 = b). Si l'option n'est plus payable, b est appliquée. */
function resolveDecision(index) {
  if (!decision) return;
  let option = index ? decision.b : decision.a;
  if (optionCost(option) > state.money) option = decision.b;
  state.money -= optionCost(option);
  if (option.gain) earn(totalRate() * option.gain);
  let message = `${decision.n} : « ${option.l} ».`;
  if (option.ev) {
    if (option.gamble && Math.random() > option.gamble) message += ' Défaite en finale, pas de chance cette fois.';
    else startEvent(eventById(option.ev));
  }
  if (option.jpo) for (let n = 0; n < option.jpo; n++) spawnWalker(true);
  state.rec.decs = (state.rec.decs || 0) + 1;
  trackStat('dec');
  notify.toast(message);
  decision = null;
  notifyDecisionChange();
  save();
}

/** Annule la décision en cours (remise des diplômes, nouvelle partie). */
function clearDecision() {
  decision = null;
  notifyDecisionChange();
}


/* ===== js/render/canvas.js ===== */
/** Canvas du jeu, contexte de dessin courant et taille de la fenêtre d'affichage. */

const canvas = document.getElementById('world');
const screenCtx = canvas.getContext('2d');

/**
 * Contexte où dessinent toutes les primitives : l'écran, ou une tuile du décor pendant son rendu (drawInto).
 * Réaffecté seulement par drawInto.
 */
let ctx = screenCtx;

/** Dessine dans un autre contexte (tuile hors écran) le temps de `draw`. */
function drawInto(target, draw) {
  const previous = ctx;
  ctx = target;
  try { draw(); } finally { ctx = previous; }
}

/** Taille affichée (pixels CSS) et densité de pixels de l'écran. */
const view = { w: 0, h: 0, dpr: 1 };

/** Densité de pixels maximale utilisée (baissée par la qualité automatique, voir quality.js). */
let pixelRatioCap = 2;
function setPixelRatioCap(cap) {
  if (cap === pixelRatioCap) return;
  pixelRatioCap = cap;
  resizeCanvas();
}

function resizeCanvas() {
  view.dpr = Math.min(pixelRatioCap, window.devicePixelRatio || 1);
  view.w = canvas.clientWidth;
  view.h = canvas.clientHeight;
  canvas.width = Math.round(view.w * view.dpr);
  canvas.height = Math.round(view.h * view.dpr);
}


/* ===== js/render/palette.js ===== */
/**
 * Couleurs du monde et teinte de nuit.
 * Toutes les couleurs sont des triplets [r, g, b] ; rgb() applique l'éclairage du moment.
 */

const GRASS1 = [130,198,96], GRASS2 = [121,189,89], LAWN = [142,208,104], SOIL = [150,104,72];
const PATHC = [234,220,190], AVEC = [222,215,205], PLAZAC = [238,229,210], DIRT = [204,170,126], CURB = [196,182,158];
const CONCRETE = [214,212,204], GLASS = [118,178,232], GLASS_D = [64,98,146], DARK = [56,64,86], WHITE = [248,248,250];
const ROOF = [176,184,196], WOOD = [150,104,64], WATER = [86,172,222], SNOW = [236,242,248];

const byte = v => (v < 0 ? 0 : v > 255 ? 255 : v | 0);

/** Couleur assombrie et bleutée selon la nuit, multipliée par k (ombrage des faces). */
function tint(c, k = 1) {
  const n = world.night;
  return [c[0] * k * (1 - 0.56 * n) + 14 * n, c[1] * k * (1 - 0.52 * n) + 18 * n, c[2] * k * (1 - 0.34 * n) + 48 * n];
}
/** Triplet en chaîne CSS, avec opacité facultative. */
const css = (a, alpha) => (alpha == null ? `rgb(${byte(a[0])},${byte(a[1])},${byte(a[2])})` : `rgba(${byte(a[0])},${byte(a[1])},${byte(a[2])},${alpha})`);
/** Couleur éclairée selon le moment de la journée. */
const rgb = (c, k = 1, alpha) => css(tint(c, k), alpha);
/** Mélange linéaire de deux couleurs. */
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
/** Vitre : s'allume en jaune la nuit si `on`. */
function windowColor(c, on, k = 1) {
  const t = tint(c, k);
  return on && world.night > 0.02 ? css(mix(t, [255,210,118], world.night * 0.95)) : css(t);
}
/** Couleur lumineuse (enseignes) : garde son éclat la nuit. */
const glow = c => css(mix(tint(c), c, world.night));


/* ===== js/render/iso.js ===== */
/**
 * Primitives de dessin isométrique.
 * Une position du monde (i, j, z) — cases et hauteur en pixels — se projette par iso(i, j, z).
 * Seules les faces visibles sont dessinées : +i (droite, plus sombre), +j (gauche) et le dessus.
 */

/** Projection isométrique : case (i, j) à la hauteur z → point écran [x, y]. */
const iso = (i, j, z = 0) => [(i - j) * HW, (i + j) * HH - z];

function tracePath(points) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let k = 1; k < points.length; k++) ctx.lineTo(points[k][0], points[k][1]);
  ctx.closePath();
}
function fillPoly(points, fill, stroke, lineWidth = 1) {
  tracePath(points);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
/** Segment entre deux points du monde. */
function isoLine(a, b) { line(a[0], a[1], b[0], b[1]); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/** Ajoute au chemin courant le losange d'une zone au sol. */
function diamond(i, j, w = 1, d = 1, z = 0) {
  const a = iso(i, j, z), b = iso(i + w, j, z), c = iso(i + w, j + d, z), e = iso(i, j + d, z);
  ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(e[0], e[1]); ctx.closePath();
}
/** Cercle posé au sol (ellipse isométrique) ajouté au chemin courant. */
function isoRing(ci, cj, r) { const [x, y] = iso(ci, cj, 0); ctx.beginPath(); ctx.ellipse(x, y, r * 45.25, r * 22.63, 0, 0, Math.PI * 2); }
/** Forme arrondie au sol (étang). */
function blob(ci, cj, a, b) {
  ctx.beginPath();
  for (let k = 0; k <= 40; k++) {
    const th = k / 40 * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
    const p = iso(ci + a * Math.sign(c) * Math.pow(Math.abs(c), 0.7), cj + b * Math.sign(s) * Math.pow(Math.abs(s), 0.7), 0);
    if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
  }
  ctx.closePath();
}
function star(x, y, outer, inner) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? inner : outer; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}

/* ----- Volumes ----- */

/** Pavé : coin (i, j), taille (w, d), base z, hauteur h. o.kr / o.kl / o.kt = ombrage des faces. */
function box(i, j, w, d, z, h, c, o = {}) {
  const stroke = o.line === false ? null : rgb(c, 0.62);
  fillPoly([iso(i + w, j, z), iso(i + w, j + d, z), iso(i + w, j + d, z + h), iso(i + w, j, z + h)], rgb(c, o.kr ?? 0.8), stroke);
  fillPoly([iso(i, j + d, z), iso(i + w, j + d, z), iso(i + w, j + d, z + h), iso(i, j + d, z + h)], rgb(c, o.kl ?? 0.93), stroke);
  fillPoly([iso(i, j, z + h), iso(i + w, j, z + h), iso(i + w, j + d, z + h), iso(i, j + d, z + h)], rgb(c, o.kt ?? 1.06), stroke);
}
/** Cylindre vertical de rayon r (en cases). */
function cylinder(ci, cj, r, z, h, c) {
  const [x, yb] = iso(ci, cj, z), yt = yb - h, rx = r * HW * 1.414, ry = r * HH * 1.414;
  const g = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
  g.addColorStop(0, rgb(c, 1.02)); g.addColorStop(0.55, rgb(c, 0.86)); g.addColorStop(1, rgb(c, 0.7));
  ctx.beginPath(); ctx.moveTo(x - rx, yt); ctx.lineTo(x - rx, yb); ctx.ellipse(x, yb, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(x + rx, yt); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = rgb(c, 0.6); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = rgb(c, 1.1); ctx.beginPath(); ctx.ellipse(x, yt, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
/** Quadrilatère sur une façade : face 'i' (plan i = f, de a0 à a1 en j) ou 'j' (plan j = f, de a0 à a1 en i). */
function faceQuad(face, f, a0, a1, z0, z1) {
  return face === 'i'
    ? [iso(f, a0, z0), iso(f, a1, z0), iso(f, a1, z1), iso(f, a0, z1)]
    : [iso(a0, f, z0), iso(a1, f, z0), iso(a1, f, z1), iso(a0, f, z1)];
}
/** Grille de fenêtres sur une façade ; `skip(col, cols)` retire des fenêtres du rez-de-chaussée (porte). */
function windowGrid(face, f, a0, a1, z0, rows, rowH, cols, glass, seed, skip) {
  const span = (a1 - a0) / cols;
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 0.8;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (skip && r === 0 && skip(c, cols)) continue;
    const ua = a0 + span * (c + 0.16), ub = a0 + span * (c + 0.84), za = z0 + r * rowH + rowH * 0.26, zb = z0 + r * rowH + rowH * 0.72;
    const lightOn = hash(seed, r, c) < 0.62;
    tracePath(faceQuad(face, f, ua, ub, za, zb));
    ctx.fillStyle = windowColor(glass, lightOn, face === 'i' ? 0.82 : 0.97); ctx.fill(); ctx.stroke();
  }
}
/** Texte posé à plat sur une façade (enseigne), avec fond facultatif. */
function faceText(face, i, j, z, text, size, fg, bg) {
  const [x, y] = iso(i, j, z);
  ctx.save(); ctx.translate(x, y); ctx.transform(1, face === 'i' ? -0.5 : 0.5, 0, 1, 0, 0);
  ctx.font = `${size}px ${FONT}`;
  const tw = ctx.measureText(text).width, pad = size * 0.45, h = size * 1.25;
  if (bg) { roundRect(-tw / 2 - pad, -h, tw + pad * 2, h, 3); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(20,24,50,.45)'; ctx.stroke(); }
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, -h / 2 + size * 0.06);
  ctx.restore();
}
/** Porte vitrée avec auvent coloré au milieu de la façade d'entrée. */
function door(face, bi, bj, bw, bd, z0, accent) {
  const half = 0.27, h = 14;
  ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1;
  if (face === 'i') {
    const f = bi + bw + 0.005, c = bj + bd / 2;
    fillPoly(faceQuad('i', f, c - half, c + half, z0, z0 + h), windowColor(GLASS_D, true, 0.9), rgb(DARK));
    isoLine(iso(f, c, z0), iso(f, c, z0 + h));
    box(f, c - half - 0.12, 0.3, (half + 0.12) * 2, z0 + h, 3, accent);
  } else {
    const f = bj + bd + 0.005, c = bi + bw / 2;
    fillPoly(faceQuad('j', f, c - half, c + half, z0, z0 + h), windowColor(GLASS_D, true, 1), rgb(DARK));
    isoLine(iso(c, f, z0), iso(c, f, z0 + h));
    box(c - half - 0.12, f, (half + 0.12) * 2, 0.3, z0 + h, 3, accent);
  }
}

/** Toit à deux pans, faîtage parallèle à l'axe i (pignon sur la face +i). */
function gableRoofI(i, j, w, d, z, h, c, gableColor) {
  const jm = j + d / 2, stroke = rgb(c, 0.6);
  fillPoly([iso(i, j, z), iso(i + w, j, z), iso(i + w, jm, z + h), iso(i, jm, z + h)], rgb(c, 0.78), stroke);
  fillPoly([iso(i + w, j, z), iso(i + w, j + d, z), iso(i + w, jm, z + h)], rgb(gableColor, 0.8), rgb(gableColor, 0.62));
  fillPoly([iso(i, jm, z + h), iso(i + w, jm, z + h), iso(i + w, j + d, z), iso(i, j + d, z)], rgb(c, 1.02), stroke);
}
/** Toit à deux pans, faîtage parallèle à l'axe j (pignon sur la face +j). */
function gableRoofJ(i, j, w, d, z, h, c, gableColor) {
  const im = i + w / 2, stroke = rgb(c, 0.6);
  fillPoly([iso(i, j, z), iso(i, j + d, z), iso(im, j + d, z + h), iso(im, j, z + h)], rgb(c, 0.9), stroke);
  fillPoly([iso(im, j, z + h), iso(im, j + d, z + h), iso(i + w, j + d, z), iso(i + w, j, z)], rgb(c, 0.76), stroke);
  fillPoly([iso(i, j + d, z), iso(i + w, j + d, z), iso(im, j + d, z + h)], rgb(gableColor, 0.93), rgb(gableColor, 0.62));
}
/** Verrière pyramidale. */
function glassPyramid(i, j, w, d, z, h, c) {
  const apex = iso(i + w / 2, j + d / 2, z + h), stroke = rgb(c, 0.6);
  fillPoly([iso(i, j, z), iso(i + w, j, z), apex], windowColor(c, true, 0.8), stroke);
  fillPoly([iso(i, j, z), iso(i, j + d, z), apex], windowColor(c, true, 0.9), stroke);
  fillPoly([iso(i + w, j, z), iso(i + w, j + d, z), apex], windowColor(c, true, 0.78), stroke);
  fillPoly([iso(i, j + d, z), iso(i + w, j + d, z), apex], windowColor(c, true, 1.05), stroke);
}

/* ----- Équipements de toit ----- */

function antenna(i, j, z, h) {
  const [x, y] = iso(i, j, z);
  ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1.6; line(x, y, x, y - h); line(x - 4, y - h * 0.6, x + 4, y - h * 0.6 - 2);
  ctx.fillStyle = Math.sin(world.t * 3) > 0 ? '#ff4d4d' : rgb([150,40,40]); circle(x, y - h, 2.2);
}
function airUnit(i, j, z) {
  box(i, j, 0.42, 0.32, z, 7, [204,208,216]);
  const [x, y] = iso(i + 0.21, j + 0.16, z + 7); ctx.fillStyle = rgb([120,126,140]); ellipse(x, y, 5, 2.5);
}
function solarPanel(i, j, w, d, z) {
  fillPoly([iso(i, j, z + 7), iso(i + w, j, z + 7), iso(i + w, j + d, z + 2), iso(i, j + d, z + 2)], rgb([44,74,150]), rgb([200,215,240]), 0.8);
  ctx.strokeStyle = rgb([120,150,210], 1, 0.8); ctx.lineWidth = 0.6;
  for (let k = 1; k < 4; k++) isoLine(iso(i + w * k / 4, j, z + 7), iso(i + w * k / 4, j + d, z + 2));
  isoLine(iso(i, j + d / 2, z + 4.5), iso(i + w, j + d / 2, z + 4.5));
}
function dish(i, j, z) {
  const [x, y] = iso(i, j, z);
  ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1.5; line(x, y, x, y - 8);
  ctx.save(); ctx.translate(x, y - 12); ctx.rotate(-0.5);
  ctx.fillStyle = rgb(WHITE, 0.95); ellipse(0, 0, 8, 4.5); ctx.strokeStyle = rgb([150,156,170]); ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function flag(i, j, z, h, c) {
  const [x, y] = iso(i, j, z);
  ctx.strokeStyle = rgb([90,96,110]); ctx.lineWidth = 1.4; line(x, y, x, y - h);
  const wave = REDUCED_MOTION ? 0 : Math.sin(world.t * 5 + i) * 2;
  ctx.fillStyle = rgb(c); ctx.beginPath(); ctx.moveTo(x, y - h);
  ctx.quadraticCurveTo(x + 7, y - h - 2 + wave, x + 14, y - h + 1 + wave); ctx.lineTo(x + 14, y - h + 9 + wave);
  ctx.quadraticCurveTo(x + 7, y - h + 6 + wave, x, y - h + 8); ctx.closePath(); ctx.fill();
}
/** Panache de fumée ou de vapeur qui monte en boucle. */
function smoke(i, j, z, c, speed = 1) {
  const [x, y] = iso(i, j, z);
  for (let k = 0; k < 5; k++) {
    const p = (world.t * 0.3 * speed + k / 5) % 1;
    ctx.fillStyle = rgb(c, 1, 0.5 * (1 - p));
    circle(x + Math.sin(p * 5 + k) * 3 + p * 12, y - p * 42, 3 + p * 8);
  }
}
function windTurbine(i, j, z, h, phase) {
  const [x, y] = iso(i, j, z);
  ctx.fillStyle = rgb(WHITE, 0.92); ctx.beginPath(); ctx.moveTo(x - 2.2, y); ctx.lineTo(x - 0.9, y - h); ctx.lineTo(x + 0.9, y - h); ctx.lineTo(x + 2.2, y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgb([170,176,190]); ctx.lineWidth = 0.8; ctx.stroke();
  const a0 = (REDUCED_MOTION ? 0 : world.t * 2.4) + phase;
  ctx.strokeStyle = rgb(WHITE); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) { const a = a0 + k * Math.PI * 2 / 3; line(x, y - h, x + Math.cos(a) * 14, y - h + Math.sin(a) * 14); }
  ctx.lineCap = 'butt';
  ctx.fillStyle = rgb([200,206,216]); circle(x, y - h, 2.4);
  if (world.night > 0.2 && Math.sin(world.t * 4 + phase) > 0) { ctx.fillStyle = '#ff5050'; circle(x, y - h - 3, 1.6); }
}
/** Panneau publicitaire sur pieds, affiche tournée vers +j. */
function billboard(i, j, w, z, text, bg) {
  box(i + 0.08, j, 0.06, 0.06, z, 9, DARK); box(i + w - 0.14, j, 0.06, 0.06, z, 9, DARK);
  box(i, j, w, 0.07, z + 9, 15, bg);
  faceText('j', i + w / 2, j + 0.075, z + 10.5, text, 8, glow([28,37,65]), null);
}


/* ===== js/render/camera.js ===== */
/** Caméra : position (x, y) au centre de l'écran en coordonnées monde, zoom z, cible de glissement (tx, ty). */

const camera = { x: 0, y: 330, z: 0.8, tx: null, ty: null };

const ZOOM_MIN = 0.32, ZOOM_MAX = 2.6;

/** Cadre tout le campus selon la taille de l'écran. */
function fitCamera() {
  camera.z = clamp(Math.min(view.w / 1250, view.h / 760), 0.42, 1.15);
  camera.x = 0;
  camera.y = view.w < 640 ? 300 : 360;
  camera.tx = camera.ty = null;
  clampCamera();
}

/**
 * Position écran (pixels réels) de l'origine du monde, arrondie au pixel : le campus et les tuiles du décor
 * (backdrop-tiles.js) sont ainsi alignés exactement.
 */
const worldOrigin = () => [Math.round(view.dpr * (view.w / 2 - camera.x * camera.z)), Math.round(view.dpr * (view.h / 2 - camera.y * camera.z))];

/** Point écran (pixels CSS) → point du monde. */
const screenToWorld = (sx, sy) => [(sx - view.w / 2) / camera.z + camera.x, (sy - view.h / 2) / camera.z + camera.y];

/** Case du plan sous un point écran, ou null. */
function screenToTile(sx, sy) {
  const [wx, wy] = screenToWorld(sx, sy), i = Math.floor((wy / HH + wx / HW) / 2), j = Math.floor((wy / HH - wx / HW) / 2);
  return i >= 0 && j >= 0 && i < N && j < N ? [i, j] : null;
}

/**
 * Le décor couvre les cases [-MAP_MARGIN, N + MAP_MARGIN] : un losange à l'écran, centré sur le campus.
 * Un point du monde (x, y) y est si |x| / HW + |y - CENTER_Y| / HH ≤ REACH.
 */
const CENTER_Y = N * HH, REACH = N + 2 * MAP_MARGIN - 2;

/** Zoom minimal pour que tout l'écran reste dans le décor (sinon on verrait le vide autour). */
const minZoom = () => Math.max(ZOOM_MIN, (view.w / (2 * HW) + view.h / (2 * HH)) / REACH);

/** Garde les quatre coins de l'écran dans le décor, et le campus pas trop loin. */
function clampCamera() {
  camera.z = clamp(camera.z, minZoom(), ZOOM_MAX);
  const slack = Math.max(0, REACH - view.w / (2 * camera.z * HW) - view.h / (2 * camera.z * HH));
  camera.x = clamp(camera.x, Math.max(-1300, -slack * HW), Math.min(1300, slack * HW));
  const dy = (slack - Math.abs(camera.x) / HW) * HH;
  camera.y = clamp(camera.y, Math.max(-400, CENTER_Y - dy), Math.min(1250, CENTER_Y + dy));
}

/** Zoome en gardant fixe le point écran (sx, sy). */
function zoomAt(sx, sy, z) {
  const [wx, wy] = screenToWorld(sx, sy);
  camera.z = clamp(z, minZoom(), ZOOM_MAX);
  camera.x = wx - (sx - view.w / 2) / camera.z;
  camera.y = wy - (sy - view.h / 2) / camera.z;
  clampCamera();
}

function panBy(dx, dy) {
  camera.x -= dx / camera.z;
  camera.y -= dy / camera.z;
  clampCamera();
}

/** Glisse doucement vers un bâtiment en laissant la place à la fiche (à droite sur ordinateur, en bas sur mobile). */
function focusOn(d) {
  const [i0, j0, w, dd] = d.plot, [x, y] = iso(i0 + w / 2, j0 + dd / 2, 30);
  camera.tx = x + (view.w > 640 ? 150 / camera.z : 0);
  camera.ty = y + (view.w <= 640 ? view.h * 0.22 / camera.z : 0);
}

function stopCameraGlide() { camera.tx = camera.ty = null; }

function updateCamera(dt) {
  if (camera.tx == null) return;
  const k = REDUCED_MOTION ? 1 : 1 - Math.pow(0.002, dt);
  camera.x += (camera.tx - camera.x) * k;
  camera.y += (camera.ty - camera.y) * k;
  if (Math.abs(camera.tx - camera.x) + Math.abs(camera.ty - camera.y) < 1) stopCameraGlide();
  clampCamera();
}


/* ===== js/render/effects.js ===== */
/**
 * Effets visuels : étincelles, poussière de chantier, textes flottants, confettis, pluie et neige.
 * Les étincelles et les textes vivent en coordonnées monde ; confettis et météo en coordonnées écran.
 */

const particles = [], floats = [], confetti = [];
const RAIN_DROPS = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), v: 500 + Math.random() * 300 }));
const SNOW_FLAKES = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), v: 25 + Math.random() * 35, f: 0.5 + Math.random(), p: Math.random() * 6, r: 1.2 + Math.random() * 1.8 }));
const CONFETTI_COLORS = ['#ffc233', '#35c46b', '#2f7fe0', '#ff6a3d', '#ec5496', '#ffffff'];

/** Taille des bulles et textes selon le zoom, pour rester lisibles de loin. */
const overlayScale = (max = 2.4) => clamp(0.9 / camera.z, 1, max);

/** Point au-dessus du toit d'un bâtiment (flèches, textes, étincelles). */
function buildingAnchor(d) {
  const [i0, j0, w, dd] = d.plot;
  return iso(i0 + w / 2, j0 + dd / 2, d.top + 12 * overlayScale());
}

function burstAt(x, y, n, color = '#ffc233') {
  if (REDUCED_MOTION) n = Math.min(n, 4);
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, life: 0.9 + Math.random() * 0.4, max: 1.2, color, r: 2 + Math.random() * 2.5 });
  }
}
function burstAtTile(i, j) {
  const [x, y] = iso(i + 0.5, j + 0.5, 10);
  burstAt(x, y, 12, '#35c46b');
}

/** Nuage de poussière sur la parcelle d'un bâtiment qui se construit ou s'agrandit. */
function dustOn(d) {
  const [i0, j0, w, dd] = d.plot;
  for (let k = 0; k < 18; k++) {
    const [x, y] = iso(i0 + Math.random() * w, j0 + Math.random() * dd, 0);
    particles.push({ x, y, vx: (Math.random() - 0.5) * 50, vy: -20 - Math.random() * 40, life: 0.8 + Math.random() * 0.5, max: 1.3, color: 'rgba(235,225,205,.9)', r: 4 + Math.random() * 5, dust: true });
  }
}

/** Texte qui monte et s'efface ; un texte de même `key` remplace le précédent (évite l'empilement). */
function floatAt(x, y, text, color = '#ffc233', size = 1, key = null) {
  if (key) for (let k = floats.length - 1; k >= 0; k--) if (floats[k].key === key) floats.splice(k, 1);
  const life = size < 1 ? 0.95 : 1.3;
  floats.push({ x, y, text, color, life, max: life, size, key });
}

/** Pluie de confettis sur tout l'écran. */
function celebrate() {
  if (REDUCED_MOTION) return;
  for (let k = 0; k < 140; k++) {
    confetti.push({
      x: Math.random() * view.w, y: -20 - Math.random() * view.h * 0.4, vx: (Math.random() - 0.5) * 60, vy: 80 + Math.random() * 120,
      rot: Math.random() * 6, size: 4 + Math.random() * 4, color: pick(CONFETTI_COLORS), life: 4,
    });
  }
}

function updateEffects(dt) {
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.dust ? -10 : p.g ?? 260) * dt;
  }
  for (let k = floats.length - 1; k >= 0; k--) {
    const f = floats[k];
    f.life -= dt;
    if (f.life <= 0) floats.splice(k, 1); else f.y -= 36 * dt;
  }
  for (let k = confetti.length - 1; k >= 0; k--) {
    const c = confetti[k];
    c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += dt * 6;
    if (c.life <= 0 || c.y > view.h + 20) confetti.splice(k, 1);
  }
}

/** Étincelles et textes flottants (repère monde). */
function drawWorldEffects() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1);
    if (p.glow) { // feu d'artifice : halo coloré, cœur lumineux qui s'additionne, sans contour
      const a = ctx.globalAlpha;
      ctx.fillStyle = p.color; ctx.globalAlpha = a * 0.3; circle(p.x, p.y, p.r * 2.2);
      ctx.globalAlpha = a; circle(p.x, p.y, p.r);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.5; circle(p.x, p.y, p.r * 0.6);
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    ctx.fillStyle = p.color; circle(p.x, p.y, p.r);
    if (!p.dust) { ctx.strokeStyle = 'rgba(28,37,65,.6)'; ctx.lineWidth = 0.8; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  const k = overlayScale(2.2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeStyle = INK;
  for (const f of floats) {
    ctx.font = `${16 * k * f.size}px ${FONT}`; ctx.lineWidth = 4 * k * f.size;
    ctx.globalAlpha = clamp(f.life / f.max * 2, 0, 1);
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/** Voile, pluie et neige, puis confettis (repère écran). */
function drawScreenEffects() {
  const { w: W, h: H } = view, t = world.t;
  if (world.weather === 'pluie' || world.weather === 'nuages') {
    ctx.fillStyle = world.weather === 'pluie' ? 'rgba(40,56,90,.16)' : 'rgba(60,70,100,.07)';
    ctx.fillRect(0, 0, W, H);
  }
  if (world.weather === 'pluie' && !REDUCED_MOTION) {
    ctx.strokeStyle = 'rgba(205,222,255,.55)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const p of RAIN_DROPS) {
      const y = (p.y * (H + 40) + t * p.v) % (H + 40) - 20, x = ((p.x * W - t * p.v * 0.25) % W + W) % W;
      ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14);
    }
    ctx.stroke();
  }
  if (world.weather === 'neige') {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const p of SNOW_FLAKES) {
      const y = (p.y * (H + 20) + t * p.v * (REDUCED_MOTION ? 0.3 : 1)) % (H + 20) - 10, x = ((p.x * W + Math.sin(t * p.f + p.p) * 18) % W + W) % W;
      circle(x, y, p.r);
    }
  }
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.restore();
  }
}

/** Efface tous les effets en cours (fin de la cinématique). */
function clearEffects() {
  particles.length = 0;
  floats.length = 0;
  confetti.length = 0;
}


/* ===== js/game/actions.js ===== */
/**
 * Actions du joueur : acheter, construire, recruter, JPO, conseil pédagogique, remise des diplômes,
 * passage à la ville suivante, accréditation nationale, visite des villes, nouvelle partie.
 */

/** Achète des niveaux (selon le mode ×1 / ×10 / Max, ou `count`). Retourne true si l'achat a eu lieu. */
function upgrade(d, { count, silent = false } = {}) {
  const s = state.b[d.id], n = count || buyAmount(d), cost = upgradeCost(d, n);
  if (!isEditable(d) || !s.lvl || state.money < cost) return false;
  const oldMilestones = milestonesReached(s.lvl), oldTier = tierOf(d, s.lvl), oldCampus = campusStepMult(d.site);
  state.money -= cost;
  s.lvl += n;
  trackStat('lvl', n);
  const visible = d.site === state.site, [x, y] = buildingAnchor(d);
  if (visible) burstAt(x, y + 20, silent ? 4 : 8, '#35c46b');
  if (!silent) notify.sound('up');
  if (tierOf(d, s.lvl) > oldTier) {
    d.anim = world.t;
    if (visible) dustOn(d);
    notify.sound('build');
    notify.toast(`${d.name} s’agrandit !`);
  }
  if (d.kind === 'dept' && milestonesReached(s.lvl) > oldMilestones) {
    const factor = fmt(Math.pow(milestoneFactor(), milestonesReached(s.lvl) - oldMilestones));
    if (visible) floatAt(x, y - 10, `Revenus ×${factor}`, '#7ee39f');
    notify.toast(`${d.short} niveau ${s.lvl} : revenus ×${factor} !`, 'gold');
  }
  if (campusStepMult(d.site) > oldCampus) {
    notify.toast(`Palier du campus de ${SITE_BY[d.site].name} : les 7 départements sont au niveau ${prevOf(CAMPUS_STEPS, minDeptLevel(d.site))}, revenus de la ville ×2 !`, 'gold');
    notify.celebrate();
    notify.sound('boost');
  }
  if (!silent) save();
  return true;
}

function build(d, { silent = false } = {}) {
  const s = state.b[d.id];
  if (!isEditable(d) || s.lvl || state.money < d.unlock) return false;
  state.money -= d.unlock;
  s.lvl = 1;
  d.anim = world.t;
  if (d.site === state.site) dustOn(d);
  trackStat('bld');
  notify.sound('build');
  notify.toast(`${d.name} ouvre ses portes !`, 'gold');
  if (d.site === state.site) for (let k = 0; k < 4; k++) spawnWalker(false);
  if (!silent) save();
  return true;
}

function hire(d, { silent = false } = {}) {
  const s = state.b[d.id];
  if (!isEditable(d) || s.mgr || !s.lvl || state.money < managerCost(d)) return false;
  state.money -= managerCost(d);
  s.mgr = true;
  trackStat('mgr');
  notify.sound('build');
  if (d.site === state.site) {
    const [x, y] = buildingAnchor(d);
    burstAt(x, y + 10, 14, '#2f7fe0');
    floatAt(x, y - 10, 'Revenus ×2', '#7fb6ff');
  }
  notify.toast(`${d.boss} prend la responsabilité du département ${d.short} : revenus ×2 !`);
  if (!silent) save();
  return true;
}

/** Visiteur de la Journée portes ouvertes accueilli (clic, ou tout seul avec le nœud « Accueil des visiteurs »). */
function welcomeVisitor(walker, [x, y]) {
  walker.leaving = true;
  state.boost = jpoDuration();
  state.jpo++;
  trackStat('jpo');
  notify.sound('boost');
  burstAt(x, y, 24);
  floatAt(x, y - 10, `Revenus ×${jpoMult()} !`, '#ffc233');
  notify.toast(`Journée portes ouvertes : tous les revenus ×${jpoMult()} pendant ${Math.round(state.boost)} s !`, 'gold');
}

/** Achète un niveau d'un nœud du conseil pédagogique. */
function buyTreeNode(id) {
  const node = TREE.find(x => x.id === id);
  if (!node || !isBranchOpen(node.br)) return false;
  const l = treeLevel(id), cost = node.cost(l);
  if (l >= node.max || state.ects < cost) return false;
  state.ects -= cost;
  state.tree[id] = l + 1;
  if (id === 'open') openAccreditedDepts(l + 1);
  notify.sound('up');
  notify.toast(`${node.n} : niveau ${l + 1}`);
  save();
  return true;
}

/** Ouvre d'office les premiers départements de la ville active (nœud « Accréditations »). */
function openAccreditedDepts(count) {
  for (const model of ACCREDITED_DEPTS.slice(0, count)) {
    const id = cityBuildingId(model);
    if (!state.b[id].lvl) { state.b[id].lvl = 1; DEFS.find(d => d.id === id).anim = world.t; }
  }
}

/** Remet à zéro l'année dans la ville active : argent, bâtiments et responsables de cette ville seulement. */
function resetCityYear() {
  for (const d of SITE_DEFS[state.city]) state.b[d.id] = { lvl: 0, mgr: false };
  state.b[cityBuildingId('info')].lvl = 1;
  Object.assign(state, { money: 0, run: 0, boost: 0, rush: 0, evt: null, runStart: Date.now(), campusDone: false });
  state.money = START_MONEY[Math.min(treeLevel('start'), START_MONEY.length - 1)] * activeCity().cf;
  openAccreditedDepts(treeLevel('open'));
}

/** Tire les anciens élèves qui reviennent à la cérémonie (1 à 4 selon la taille de la promo). */
function drawAlumni(graduates) {
  const count = Math.min(4, 1 + Math.floor(Math.log10(Math.max(1, graduates)))), drawn = [];
  for (let k = 0; k < count; k++) drawn.push(drawAlumnus());
  return drawn;
}
/** Un ancien élève au hasard (5 % légendaire, 25 % rare) ajouté à la collection. */
function drawAlumnus() {
  const r = Math.random(), rarity = r < 0.05 ? 3 : r < 0.3 ? 2 : 1;
  const card = pick(CARDS.filter(c => c.r === rarity));
  const isNew = !state.cards[card.id];
  state.cards[card.id] = Math.min(CARD_MAX, (state.cards[card.id] || 0) + 1);
  return { card, isNew };
}

/** Diplômés et ECTS de l'année écoulée, puis nouvelle année dans la ville active. */
function holdCeremony() {
  const graduates = graduatesGain(), ects = ectsGain(graduates);
  state.dip += graduates;
  state.ects += ects;
  state.promos++;
  state.best = Math.max(state.best, state.run);
  state.bestGain = Math.max(state.bestGain || 0, graduates);
  const alumni = graduates > 0 ? drawAlumni(graduates) : [];
  trackStat('grad');
  return { graduates, ects, alumni };
}

/**
 * Remise des diplômes : l'année repart de zéro dans la ville active, les diplômés donnent un bonus permanent.
 * @returns {null | {graduates: number, ects: number, alumni: Array}}
 */
function graduate() {
  if (graduatesGain() < 1 || state.run < prestigeMin()) return null;
  const result = holdCeremony();
  resetCityYear();
  finishTransition();
  return result;
}

/**
 * Label d'excellence obtenu : cérémonie de clôture puis installation dans la ville suivante.
 * La ville quittée reste visible telle quelle et multiplie désormais tous les revenus.
 * @returns {null | {graduates: number, ects: number, alumni: Array, city: object}}
 */
function moveToNextCity() {
  const next = nextCity();
  if (!next || !cityGoalReached()) return null;
  const result = holdCeremony();
  state.rec['city_' + state.city] = (Date.now() - state.cityStart) / 1000; // durée passée dans la ville
  state.cityStart = Date.now();
  // Chaque ville forme ses propres diplômés : ceux de la ville quittée restent dans son palmarès.
  state.dipDone += state.dip;
  state.dip = 0;
  state.city = next.id;
  state.site = next.id;
  state.gems += GEM_REWARDS.city;
  resetCityYear();
  finishTransition();
  fitCamera();
  return { ...result, city: next };
}

/** Champs conservés par l'accréditation nationale (tout le reste repart de zéro). */
const KEPT_ON_ACCREDITATION = ['total', 'best', 'bestGain', 'promos', 'ach', 'jpo', 'seen', 'cards', 'gems', 'shop', 'chests',
  'daily', 'weekly', 'hist', 'rec', 'tips', 'tipsOff', 'muted', 'music', 'intro', 'cine', 'ended', 'pseudo', 'buy', 'autoOn', 'obj', 'eco', 'musicVol', 'sfxVol'];

/**
 * Accréditation nationale (2ᵉ niveau de prestige) : une fois Charleville labellisée, on repart de Reims
 * sans diplômés, ECTS ni conseil pédagogique, mais avec des palmes académiques (+50 % de revenus chacune).
 * @returns {null | {palmes: number}}
 */
function accredit() {
  if (!canAccredit()) return null;
  const palmes = palmesGain();
  const kept = Object.fromEntries(KEPT_ON_ACCREDITATION.map(k => [k, state[k]]));
  setState({ ...freshState(), ...kept, palmes: state.palmes + palmes, accreds: state.accreds + 1, gems: state.gems + GEM_REWARDS.accreditation });
  finishTransition();
  fitCamera();
  return { palmes };
}

function finishTransition() {
  restartScene();
  clearDecision();
  notify.celebrate();
  notify.sound('boost');
  save();
}

/** Nouvelle partie (garde seulement les réglages et le pseudo). */
function resetGame() {
  const { music, muted, pseudo, eco, musicVol, sfxVol } = state;
  setState({ ...freshState(), intro: true, cine: true, music, muted, pseudo, eco, musicVol, sfxVol });
  restartScene();
  clearDecision();
  fitCamera();
  save();
  notify.toast('Nouvelle partie : bienvenue à l’IUT !');
}

/** Remplace la partie par une sauvegarde importée (déjà décodée). */
function importGame(data) {
  const next = sanitize(data);
  delete next.migrated;
  setState(next);
  restartScene();
  clearDecision();
  fitCamera();
  save();
  notify.toast('Partie importée.', 'gold');
}

/** Affiche une autre ville : la ville active, ou une ville terminée (en vitrine). Retourne false si elle n'est pas atteinte. */
function switchSite(id) {
  if (id === state.site) return true;
  if (!isSiteOpen(id)) {
    notify.toast(`${SITE_BY[id].full} : obtiens d’abord le label d’excellence de la ville précédente.`);
    return false;
  }
  state.site = id;
  resetWalkers(20);
  fitCamera();
  save();
  notify.sound('build');
  notify.toast(id === state.city ? `Retour à ${SITE_BY[id].full}` : `${SITE_BY[id].full} : ville terminée, en vitrine`, 'gold');
  return true;
}

/** Relance l'animation de construction de tous les bâtiments et les piétons. */
function restartScene() {
  for (const d of DEFS) d.anim = world.t;
  resetWalkers(0);
}



/* ===== js/render/walkers.js ===== */
/**
 * Étudiants qui se promènent sur les allées, et visiteurs à l'étoile dorée de la Journée portes ouvertes.
 * Leur nombre suit le nombre d'étudiants du site et les lieux de vie construits.
 */

const walkers = [];

const SHIRTS = [[235,87,87],[47,128,237],[39,174,96],[242,153,74],[155,81,224],[45,156,219],[250,210,60],[240,240,240],[52,58,80],[236,112,160],[120,200,190]];
const SKINS = [[250,218,190],[234,188,152],[200,146,108],[152,104,72],[112,76,54]];
const HAIRS = [[40,30,25],[92,60,36],[182,130,72],[226,196,124],[28,28,38],[146,60,40]];
const STEPS = [[1,0],[-1,0],[0,1],[0,-1]];
const VISITOR_LIFE = 32;
/** Délai avant l'accueil automatique d'un visiteur (nœud « Accueil des visiteurs »). */
const AUTO_WELCOME_DELAY = 8;

let nextVisitorIn = 45 + Math.random() * 40;

const builtDoors = () => currentDefs().filter(d => state.b[d.id].lvl).map(d => d.doorTile);

/** Choisit la prochaine case : tout droit plus souvent, jamais demi-tour sauf impasse. */
function chooseNextTile(w) {
  const options = [];
  for (const [dx, dy] of STEPS) {
    const ni = w.ti + dx, nj = w.tj + dy;
    if (walkable(ni, nj) && !(ni === w.pi && nj === w.pj)) options.push([ni, nj, dx, dy]);
  }
  let next;
  if (!options.length) next = [w.pi, w.pj];
  else {
    const straight = options.find(o => o[2] === w.ti - w.pi && o[3] === w.tj - w.pj);
    next = straight && Math.random() < 0.55 ? straight : pick(options);
  }
  w.pi = w.ti; w.pj = w.tj; w.ti = next[0]; w.tj = next[1];
}

/** Fait sortir un piéton d'un bâtiment construit ; `special` = visiteur de la JPO. */
function spawnWalker(special = false) {
  const doors = builtDoors(), [di, dj] = doors.length ? pick(doors) : [11, 9];
  const w = {
    ti: di, tj: dj, pi: -1, pj: -1, ox: (Math.random() - 0.5) * 0.5, oy: (Math.random() - 0.5) * 0.5, speed: 0.5 + Math.random() * 0.35,
    shirt: special ? [255,194,51] : pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIRS), bag: pick(SHIRTS),
    phase: Math.random() * 6, alpha: 0, dir: 1, special, life: special ? VISITOR_LIFE : 0, leaving: false,
  };
  w.x = di + 0.5 + w.ox; w.y = dj + 0.5 + w.oy;
  chooseNextTile(w);
  walkers.push(w);
  return w;
}

const wantedWalkers = () => Math.min(72, 4 + Math.floor(siteStudents() / 14) + SITE_SVCS[state.site].filter(d => state.b[d.id].lvl).length * 2);

/** Vide le campus puis y place jusqu'à `count` piétons déjà en promenade (chargement, changement de site). */
function resetWalkers(count = 0) {
  walkers.length = 0;
  for (let k = 0; k < Math.min(count, wantedWalkers()); k++) {
    const w = spawnWalker(false);
    w.alpha = 1;
    for (let s = 0; s < 8; s++) chooseNextTile(w);
    w.x = w.ti + 0.5 + w.ox; w.y = w.tj + 0.5 + w.oy;
    chooseNextTile(w);
  }
}

const hasVisitor = () => walkers.some(w => w.special && !w.leaving);

/** Visiteur de la JPO sous le point (coordonnées monde), ou null. */
function visitorAt(wx, wy) {
  for (const w of walkers) if (w.special && !w.leaving) {
    const [x, y] = iso(w.x, w.y, 0);
    if (Math.abs(wx - x) < 16 && wy > y - 44 && wy < y + 8) return w;
  }
  return null;
}

function updateWalkers(dt) {
  const normal = walkers.filter(w => !w.special && !w.leaving).length, want = wantedWalkers();
  if (normal < want && Math.random() < dt * 4) spawnWalker(false);
  if (normal > want + 4) { const w = walkers.find(x => !x.special && !x.leaving); if (w) w.leaving = true; }

  nextVisitorIn -= dt;
  if (nextVisitorIn <= 0) {
    nextVisitorIn = (70 + Math.random() * 90) * (1 - 0.12 * treeLevel('jpo')) * (isBuilt('bus') ? 0.8 : 1);
    if (state.boost <= 0 && state.intro && !walkers.some(w => w.special)) { // pas pendant le tutoriel
      spawnWalker(true);
      notify.toast('Une personne à l’étoile dorée visite le campus pour la Journée portes ouvertes. Clique sur elle !', 'gold');
    }
  }

  for (let k = walkers.length - 1; k >= 0; k--) {
    const w = walkers[k];
    if (w.special) {
      w.life -= dt;
      if (w.life <= 0) w.leaving = true;
      else if (!w.leaving && treeLevel('welcome') && VISITOR_LIFE - w.life > AUTO_WELCOME_DELAY) welcomeVisitor(w, iso(w.x, w.y, 30));
    }
    if (w.leaving) { w.alpha -= dt * 2; if (w.alpha <= 0) { walkers.splice(k, 1); continue; } }
    else w.alpha = Math.min(1, w.alpha + dt * 2);
    const tx = w.ti + 0.5 + w.ox, ty = w.tj + 0.5 + w.oy, dx = tx - w.x, dy = ty - w.y, dist = Math.hypot(dx, dy);
    const step = w.speed * dt * (w.special ? 0.75 : 1);
    if (dx - dy !== 0) w.dir = dx - dy > 0 ? 1 : -1;
    if (dist <= step) {
      w.x = tx; w.y = ty;
      // arrivé devant une porte : 30 % de chances d'entrer
      const atDoor = currentDefs().some(d => state.b[d.id].lvl && d.doorTile[0] === w.ti && d.doorTile[1] === w.tj);
      if (!w.special && !w.leaving && Math.random() < 0.3 && atDoor) w.leaving = true;
      else chooseNextTile(w);
    } else { w.x += dx / dist * step; w.y += dy / dist * step; }
    w.phase += dt * 9 * w.speed;
  }
}

function drawWalker(w) {
  const [x, y] = iso(w.x, w.y, 0), k = w.special ? 1.35 : 1;
  ctx.globalAlpha = w.alpha;
  const step = Math.sin(w.phase) * 1.8 * k, bob = Math.abs(Math.cos(w.phase)) * 0.9 * k;
  if (w.special) { ctx.fillStyle = `rgba(255,210,70,${0.35 + 0.15 * Math.sin(world.t * 6)})`; ellipse(x, y, 11, 5.5); }
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ellipse(x, y, 4.5 * k, 2.2 * k);
  ctx.strokeStyle = rgb([52,60,88]); ctx.lineWidth = 2 * k; ctx.lineCap = 'round';
  line(x - 1.3 * k, y - 5 * k, x - 1.3 * k + step * 0.5, y - 0.6); line(x + 1.3 * k, y - 5 * k, x + 1.3 * k - step * 0.5, y - 0.6);
  ctx.lineCap = 'butt';
  ctx.fillStyle = rgb(w.bag); ctx.fillRect(x + (w.dir > 0 ? -4.7 : 2.3) * k, y - 10.5 * k - bob, 2.4 * k, 5 * k);
  ctx.fillStyle = rgb(w.shirt); roundRect(x - 3.2 * k, y - 11.6 * k - bob, 6.4 * k, 7 * k, 2 * k); ctx.fill();
  ctx.fillStyle = rgb(w.skin); circle(x, y - 14.3 * k - bob, 2.7 * k);
  ctx.fillStyle = rgb(w.hair); ctx.beginPath(); ctx.arc(x, y - 14.7 * k - bob, 2.85 * k, Math.PI, Math.PI * 2); ctx.fill();
  if (w.special) {
    const sy = y - 26 * k - (REDUCED_MOTION ? 0 : Math.sin(world.t * 4) * 2);
    star(x, sy, 7, 3); ctx.fillStyle = '#ffc233'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** Piétons sous forme d'éléments à trier avec le décor. */
const walkerItems = () => walkers.map(w => ({ minI: w.x, maxI: w.x, minJ: w.y, maxJ: w.y, draw: () => drawWalker(w) }));

/** Tirage et déroulement des événements aléatoires du campus. */

let nextEventIn = 100 + Math.random() * 60;

/** Lance un événement (tiré au sort ou conséquence d'une décision). */
function startEvent(e) {
  const duration = e.dur * (e.good && hasManager('gmp') ? 1.5 : 1);
  if (e.lump) earn(totalRate() * e.lump);
  state.evt = { id: e.id, t: duration };
  state.seen[e.id] = 1;
  state.rec.evts = (state.rec.evts || 0) + 1;
  trackStat('evt');
  if (e.jpo) for (let k = 0; k < e.jpo; k++) spawnWalker(true);
  if (e.snow) setWeather('neige', duration);
  if (e.id === 'rentree') for (let k = 0; k < 10; k++) spawnWalker(false);
  if (e.id === 'gala') notify.celebrate();
  notify.toast(`${e.n} : ${e.d}`, e.good ? 'gold' : '');
  notify.sound(e.good ? 'boost' : 'click');
}

/** Poids d'un événement dans le tirage (Bonne étoile, neige plus fréquente en hiver). */
function eventWeight(e) {
  return e.w * (e.good ? 1 + 0.25 * treeLevel('evt') : 1) * (e.id === 'neige' && world.season === 'hiver' ? 3 : 1);
}

function updateEvents(dt) {
  if (state.evt) {
    state.evt.t -= dt;
    if (state.evt.t <= 0) state.evt = null;
    return;
  }
  if (!state.intro) return; // pas d'événement pendant le tutoriel
  nextEventIn -= dt;
  if (nextEventIn > 0) return;
  nextEventIn = 150 + Math.random() * 120;
  const pool = EVENTS.filter(e => e.w > 0 && (!e.cond || e.cond()));
  let r = Math.random() * pool.reduce((sum, e) => sum + eventWeight(e), 0);
  for (const e of pool) {
    r -= eventWeight(e);
    if (r <= 0) { startEvent(e); break; }
  }
}


/* ===== js/game/advisor.js ===== */
/**
 * Conseil de Plume : l'achat qui se rembourse le plus vite (prix ÷ gain de revenus par seconde), dans la ville active.
 * L'assistant de gestion (conseil pédagogique) applique ce conseil automatiquement.
 */

/** Achat conseillé dans la ville active : {id, act: 'up'|'hire'|'build', cost}. */
let advice = { id: null, act: null, cost: 0 };

/** Gain de revenus par seconde apporté par une action. */
function gainOf(d, act) {
  if (d.kind === 'dept') {
    if (act === 'hire') return rateOf(d);
    const l = level(d.id), next = act === 'build' ? 1 : l + 1;
    const own = (rateAtLevel(d, next) - rateAtLevel(d, l)) * managerFactor(d) * outageFactor(d) * cardFactor(d) * siteMult(d.site) * globalMult();
    return own + totalRate() * RADIANCE_PER_LEVEL / radianceMult();
  }
  return siteRate(d.site) * d.bonus * (1 + 0.1 * treeLevel('svc')) * (1 + cardBonus('svc')) / serviceMult(d.site);
}

/** Meilleure option de la ville active. */
function bestOption({ affordableOnly = false, allowBuild = true } = {}) {
  let best = null, bestScore = Infinity;
  for (const d of SITE_DEFS[state.city]) {
    const options = [];
    if (!level(d.id)) { if (allowBuild) options.push(['build', d.unlock]); }
    else {
      options.push(['up', upgradeCost(d, 1)]);
      if (d.kind === 'dept' && !state.b[d.id].mgr) options.push(['hire', managerCost(d)]);
    }
    for (const [act, cost] of options) {
      if (affordableOnly && cost > state.money) continue;
      const gain = gainOf(d, act);
      if (!(gain > 0)) continue;
      const score = cost / gain;
      if (score < bestScore) { bestScore = score; best = { id: d.id, act, cost }; }
    }
  }
  return best;
}

/** Le conseil n'est affiché que dans la ville active. */
function updateAdvice() {
  advice = (state.site === state.city && bestOption()) || { id: null, act: null, cost: 0 };
}

/** Applique une option : amélioration d'un niveau, recrutement ou construction. */
function applyOption(option, silent = true) {
  const d = BY[option.id];
  if (option.act === 'hire') return hire(d, { silent });
  if (option.act === 'build') return build(d, { silent });
  return upgrade(d, { count: 1, silent });
}

let autoTimer = 0;

/** Assistant de gestion : achète le meilleur conseil abordable (et construit avec l'Assistant bâtisseur). */
function updateAutoBuy(dt) {
  const lv = treeLevel('auto');
  if (!lv || !state.autoOn) return;
  autoTimer += dt;
  if (autoTimer < AUTO_INTERVALS[lv]) return;
  autoTimer = 0;
  const best = bestOption({ affordableOnly: true, allowBuild: treeLevel('auto2') > 0 });
  if (best) applyOption(best);
}

/** Récompense d'un objectif : 1 min de revenus (au moins 50 €). */

  let completed = 0;
  for (let o = currentObjective(); o; o = currentObjective()) {

    const reward = objectiveReward();

}

/** Contexte Web Audio partagé. Les navigateurs ne l'autorisent qu'après une interaction de l'utilisateur. */

let audioContext = null;

/** Crée le contexte au premier appel (après un clic ou une touche) et le relance s'il est en pause. */
function openAudioContext() {
  if (!audioContext) {
    try { audioContext = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  return audioContext;
}

/** Contexte existant, ou null s'il n'a pas encore été créé. */
const audioCtx = () => audioContext;


/* ===== js/audio/music.js ===== */
/**
 * Musique « chiptune » générée en direct : une boucle de 8 mesures (Do – La m – Fa – Sol)
 * déclinée en quatre ambiances. Le changement d'ambiance attend le début d'une mesure.
 */

const midiToHz = m => 440 * Math.pow(2, (m - 69) / 12);

const DAY_CHORDS = [[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
const DAY_MELODY = [
  [76,79,84,79,81,79,76,null],[72,76,81,76,79,76,72,null],[77,81,84,81,86,84,81,79],[79,null,83,86,83,79,74,null],
  [84,null,83,79,76,79,81,79],[81,null,79,76,72,76,74,72],[77,79,81,84,81,79,77,81],[79,74,79,83,86,null,null,null],
];
const NIGHT_MELODY = [
  [69,null,72,null,76,null,74,null],[72,null,null,69,null,72,null,null],[76,null,79,null,77,null,76,null],[74,null,null,71,null,74,null,null],
  [81,null,79,null,76,null,74,null],[72,null,74,null,76,null,null,null],[77,null,76,null,72,null,69,null],[71,null,74,null,79,null,null,null],
];

/** Morceaux : tempo, accords, mélodie, basse (décalages), timbre, batterie (pas 0-7), charleston, nappe. */
const TRACKS = {
  jour: { name: 'Journée au campus', bpm: 104, chords: DAY_CHORDS, melody: DAY_MELODY, bass: [0,null,12,null,7,null,12,7], lead: 'square', kick: [0,4], snare: [2,6], hat: 1, pad: 0.03 },
  nuit: { name: 'Nuit sur le campus', bpm: 76, chords: [[45,48,52],[41,45,48],[48,52,55],[43,47,50]], melody: NIGHT_MELODY, bass: [0,null,null,null,7,null,null,null], lead: 'triangle', kick: [], snare: [], hat: 0, pad: 0.05 },
  hiver: { name: 'Neige sur la Champagne', bpm: 96, chords: DAY_CHORDS, melody: DAY_MELODY, bass: [0,null,null,null,7,null,12,null], lead: 'bell', kick: [0], snare: [4], hat: 2, pad: 0.035 },
  ete: { name: 'Été en terrasse', bpm: 118, chords: DAY_CHORDS, melody: DAY_MELODY, bass: [0,12,0,12,7,19,7,12], lead: 'square', kick: [0,2,4,6], snare: [2,6], hat: 1, pad: 0.022 },
};

let playing = false, timer = null, step = 0, nextTime = 0, master = null, noiseBuffer = null, current = 'jour', wanted = 'jour';

function ensureNodes() {
  const ac = audioCtx();
  if (!ac) return null;
  if (!master) {
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 0.3);
    noiseBuffer = ac.createBuffer(1, len, ac.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return ac;
}

function tone(ac, freq, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(ac, t, dur, vol, freq) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuffer; f.type = 'highpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
function kick(ac, t, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
}

/** Programme les notes des 200 prochaines millisecondes. */
function schedule() {
  const ac = audioCtx();
  try {
    while (nextTime < ac.currentTime + 0.2) {
      if (step % 8 === 0 && wanted !== current) current = wanted;
      const track = TRACKS[current], stepLen = 60 / track.bpm / 2;
      const bar = Math.floor(step / 8) % 8, s = step % 8, chord = track.chords[bar % 4], t = nextTime;
      if (s === 0) for (const m of chord) tone(ac, midiToHz(m + 12), t, stepLen * 7.6, 'sine', track.pad);
      const b = track.bass[s];
      if (b != null) tone(ac, midiToHz(chord[0] - 12 + b), t, stepLen * 1.6, 'triangle', current === 'nuit' ? 0.1 : 0.15);
      const m = track.melody[bar][s];
      if (m != null) {
        if (track.lead === 'bell') { tone(ac, midiToHz(m), t, stepLen * 3, 'sine', 0.055); tone(ac, midiToHz(m) * 2.01, t, stepLen * 1.4, 'sine', 0.016); }
        else if (track.lead === 'triangle') tone(ac, midiToHz(m), t, stepLen * 2.6, 'triangle', 0.06);
        else { tone(ac, midiToHz(m), t, stepLen * 1.3, 'square', 0.028); tone(ac, midiToHz(m), t, stepLen * 1.8, 'triangle', 0.05); }
      }
      if (track.kick.includes(s)) kick(ac, t, current === 'hiver' ? 0.18 : 0.32);
      if (track.snare.includes(s)) noise(ac, t, 0.12, 0.08, 1800);
      if (track.hat === 1) noise(ac, t, 0.035, 0.03, 7000);
      if (track.hat === 2) noise(ac, t, 0.06, 0.02, 11000); // grelots
      step++; nextTime += stepLen;
    }
  } catch (e) { /* contexte fermé : on ignore */ }
}

/** Volume de la musique à fond, et réglage du joueur (0 à 1). */
const MUSIC_LEVEL = 0.55;
let musicLevel = 1;

/** Règle le volume de la musique (0 à 1), tout de suite si elle joue. */
function setMusicLevel(level) {
  musicLevel = level;
  const ac = audioCtx();
  if (playing && master && ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(MUSIC_LEVEL * level, ac.currentTime, 0.08); }
}

function startMusic() {
  if (playing) return;
  const ac = ensureNodes();
  if (!ac) return;
  playing = true;
  nextTime = ac.currentTime + 0.1;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(MUSIC_LEVEL * musicLevel, ac.currentTime, 0.5);
  schedule();
  timer = setInterval(schedule, 50);
}

function stopMusic() {
  if (!playing) return;
  playing = false;
  clearInterval(timer);
  const ac = audioCtx();
  if (master && ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(0, ac.currentTime, 0.12); }
}

/** Ambiance voulue : 'jour', 'nuit', 'hiver' ou 'ete'. */
function setMusicMood(mood) { if (TRACKS[mood]) wanted = mood; }
const musicTitle = () => TRACKS[wanted].name;


/* ===== js/audio/audio.js ===== */
/** Bruitages et pilotage de la musique selon les réglages du joueur. */

/** Bruitages : [fréquences jouées en arpège, durée d'une note, forme d'onde, volume]. */
const SOUNDS = {
  coin: [[988,1319], 0.06, 'square', 0.035],
  up: [[523,659,784], 0.06, 'triangle', 0.07],
  build: [[392,523,659,1047], 0.08, 'triangle', 0.08],
  boost: [[659,784,988,1319,1568], 0.07, 'square', 0.04],
  click: [[520], 0.04, 'triangle', 0.04],
};

/** Vrai quand le son a pu démarrer (après une première interaction). */
const isAudioReady = () => !!audioCtx();

/** À appeler sur chaque interaction : crée le contexte si besoin et relance la musique. */
function unlockAudio() {
  if (!audioCtx() && state.muted && !state.music) return;
  if (!openAudioContext()) return;
  if (state.music && !document.hidden && !musicHeld) startMusic();
}

/** Musique du jeu suspendue (la cinématique joue sa propre bande-son). */
let musicHeld = false;
function holdMusic(on) {
  musicHeld = on;
  if (on) stopMusic();
  else if (state.music && audioCtx() && !document.hidden) { setMusicLevel(state.musicVol); startMusic(); }
}

function playSound(name) {
  const ac = audioCtx();
  if (!ac || state.muted || !SOUNDS[name]) return;
  const [freqs, dur, type, base] = SOUNDS[name], vol = Math.max(0.0002, base * state.sfxVol), t0 = ac.currentTime;
  freqs.forEach((f, k) => {
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + k * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 2);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur * 2.2);
    } catch (e) { /* contexte indisponible */ }
  });
}

function setMusicEnabled(on) {
  state.music = on;
  if (on) { setMusicLevel(state.musicVol); unlockAudio(); if (!musicHeld) startMusic(); } else stopMusic();
}

function setSoundEnabled(on) {
  state.muted = !on;
  if (on) { unlockAudio(); playSound('click'); }
}

/** Coupe la musique quand l'onglet est caché, la relance au retour. */
function initAudio() {
  setMusicLevel(state.musicVol);
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopMusic();
    else if (state.music && audioCtx() && !musicHeld) startMusic();
  });
}

/** Volume de la musique (0 à 1) ; à 0 la musique est coupée, au-dessus elle reprend. */
function setMusicVolume(volume) {
  if (volume > 0) state.musicVol = volume;
  setMusicLevel(state.musicVol);
  if ((volume > 0) !== state.music) setMusicEnabled(volume > 0);
}

/** Volume des bruitages (0 à 1) ; à 0 ils sont coupés. */
function setSoundVolume(volume) {
  if (volume > 0) state.sfxVol = volume;
  if ((volume > 0) === state.muted) setSoundEnabled(volume > 0);
}

/** Débloque les succès obtenus. Retourne le nombre de nouveaux succès. */
function checkAchievements() {
  let unlocked = 0;
  for (const a of ACHIEVEMENTS) {
    if (state.ach[a.id] || !a.c()) continue;
    state.ach[a.id] = Date.now();
    unlocked++;
    state.gems += GEM_REWARDS.achievement;
    if (unlocked <= 2) notify.toast(`Succès débloqué : ${a.n} (+${Math.round(achievementBonus() * 100)} % de revenus, +${GEM_REWARDS.achievement} pépite)`, 'gold');
  }
  if (unlocked) { trackStat('ach', unlocked); notify.sound('boost'); save(); }
  return unlocked;
}


/* ===== js/game/records.js ===== */
/** Records personnels et historique des revenus (un point par minute de jeu). */

const HISTORY_STEP = 60, HISTORY_MAX = 360;
let historyTimer = 0;

function updateRecords(dt) {
  const rec = state.rec;
  rec.play = (rec.play || 0) + dt;
  const rate = totalRate();
  if (rate > (rec.maxRate || 0)) rec.maxRate = rate;
  if (state.run > (rec.bestRun || 0)) rec.bestRun = state.run;

  if (state.city === 'reims' && !state.campusDone && SITE_DEFS.reims.every(d => level(d.id))) {
    state.campusDone = true;
    const elapsed = (Date.now() - state.runStart) / 1000;
    if (!rec.fastCampus || elapsed < rec.fastCampus) {
      rec.fastCampus = elapsed;
      notify.toast(`Record : campus de Reims complet en ${fmtDur(elapsed)} !`, 'gold');
    }
  }

  historyTimer += dt;
  if (historyTimer >= HISTORY_STEP) {
    historyTimer = 0;
    state.hist.push([Date.now(), rate]);
    if (state.hist.length > HISTORY_MAX) state.hist.shift();
  }
}


/* ===== js/game/decor.js ===== */
/** Décorations : mode « pose » (choix d'une case de pelouse), achat, retrait. */

/** Décoration en cours de pose (identifiant), 'remove' pour le mode retrait, ou null. */
let placing = null;
/** Case survolée pendant la pose : [i, j] ou null. */
let hoverTile = null;

const placingListeners = [];
function onPlacingChange(fn) { placingListeners.push(fn); }
const notifyPlacingChange = () => placingListeners.forEach(fn => fn(placing));

const decoAt = (i, j, site = state.site) => decoList(site).some(x => x.i === i && x.j === j);

/** Case libre où l'on peut poser une décoration (seulement dans la ville active). */
const canPlaceAt = (i, j) => state.site === state.city && i >= 0 && j >= 0 && i < N && j < N && tileAt(i, j) === T_GRASS
  && !inPlot(i, j) && !decoAt(i, j) && !(SITE_BY[state.site].perk === 'vendanges' && isVine(i, j));

function startPlacing(id) { placing = id; notifyPlacingChange(); }
function stopPlacing() { placing = null; hoverTile = null; notifyPlacingChange(); }
function setHoverTile(t) { hoverTile = t; }

/** Clic sur une case pendant le mode pose ou retrait. */
function placeDecoAt(i, j) {
  if (placing === 'remove') { removeDecoAt(i, j); return; }
  const dc = decoById(placing);
  if (!dc || !canPlaceAt(i, j)) return;
  if (decoList().length >= DECO_MAX) { notify.toast('La ville a déjà le maximum de décorations.'); return; }
  if (dc.gems) {
    if (state.gems < dc.gems) { notify.toast(`Il manque ${dc.gems - state.gems} pépites pour ${dc.n.toLowerCase()}.`); return; }
    state.gems -= dc.gems;
  } else {
    const cost = decoCost(dc);
    if (state.money < cost) { notify.toast(`Il manque ${eur(cost - state.money)} pour ${dc.n.toLowerCase()}.`); return; }
    state.money -= cost;
  }
  state.deco[state.site] = decoList();
  state.deco[state.site].push({ i, j, t: dc.id });
  trackStat('deco');
  burstAtTile(i, j);
  notify.sound('build');
  notify.toast(`${dc.n} posé : +${Math.round(decoBonus(dc) * 100)} % de revenus dans la ville.`);
  save();
  notifyPlacingChange(); // le prix affiché dans la barre de pose change
}

/** Retire une décoration : la moitié du prix est rendue (en euros ou en pépites). */
function removeDecoAt(i, j) {
  if (state.site !== state.city) return;
  const list = decoList(), k = list.findIndex(x => x.i === i && x.j === j);
  if (k < 0) return;
  const dc = decoById(list[k].t);
  list.splice(k, 1);
  if (dc.gems) {
    const refund = Math.floor(dc.gems / 2);
    state.gems += refund;
    notify.toast(`${dc.n} retiré : +${refund} pépites`);
  } else {
    const refund = decoCost(dc) * 0.5;
    earn(refund);
    notify.toast(`${dc.n} retiré : +${eur(refund)}`);
  }
  notify.sound('coin');
  save();
}


/* ===== js/game/abilities.js ===== */
/** Capacités actives : un effet puissant à déclencher au bon moment, puis un temps de recharge. */

/** Temps de recharge réel (le nœud « Énergie » le réduit). */
const abilityCooldown = a => a.cd * (1 - 0.1 * treeLevel('abil'));
/** Secondes avant que la capacité soit prête (0 = prête). */
const cooldownLeft = id => (state.cd && state.cd[id]) || 0;
const isAbilityReady = a => a.unlocked() && cooldownLeft(a.id) <= 0;

function useAbility(id) {
  const a = abilityById(id);
  if (!a || !isAbilityReady(a)) return false;
  if (a.mult) {
    state.rush = a.dur;
    notify.toast(`${a.n} : revenus ×${RUSH_MULT} pendant ${a.dur} s !`, 'gold');
  } else if (a.lump) {
    const gain = totalRate() * a.lump;
    earn(gain);
    notify.toast(`${a.n} : +${eur(gain)}`, 'gold');
  } else if (a.visitors) {
    for (let k = 0; k < a.visitors; k++) spawnWalker(true);
    notify.toast(`${a.n} : ${a.visitors} visiteurs de la JPO arrivent. Clique sur les étoiles !`, 'gold');
  }
  state.cd[id] = abilityCooldown(a);
  state.rec.abil = (state.rec.abil || 0) + 1;
  trackStat('abil');
  notify.sound('boost');
  save();
  return true;
}

/** Rend toutes les capacités disponibles (boutique). */
function reloadAbilities() { state.cd = {}; }

function updateAbilities(dt) {
  for (const a of ABILITIES) if (state.cd[a.id] > 0) state.cd[a.id] = Math.max(0, state.cd[a.id] - dt);
}


/* ===== js/game/chests.js ===== */
/** Colis du campus : gagnés avec les missions et les surprises, ils contiennent une récompense tirée au sort. */

const COFFEE_FROM_CHEST = 180;

function addChests(count = 1) {
  state.chests += count;
  notify.toast(count > 1 ? `+${count} colis du campus à ouvrir !` : 'Un colis du campus t’attend !', 'gold');
}

function pickLoot() {
  const total = CHEST_LOOT.reduce((sum, x) => sum + x.w, 0);
  let r = Math.random() * total;
  for (const loot of CHEST_LOOT) { r -= loot.w; if (r < 0) return loot; }
  return CHEST_LOOT[0];
}

/**
 * Ouvre un colis.
 * @returns {null | {title: string, text: string, alumnus?: {card: object, isNew: boolean}}}
 */
function openChest() {
  if (state.chests <= 0) return null;
  state.chests--;
  const loot = pickLoot();
  let result;
  if (loot.id === 'money') {
    const minutes = 1 + Math.floor(Math.random() * 4), gain = totalRate() * 60 * minutes;
    earn(gain);
    result = { title: loot.n, text: `+${eur(gain)} (${minutes} min de revenus)` };
  } else if (loot.id === 'boost') {
    state.coffee += COFFEE_FROM_CHEST;
    result = { title: loot.n, text: `Revenus ×2 pendant ${fmtDur(COFFEE_FROM_CHEST)}` };
  } else if (loot.id === 'ects') {
    const ects = 1 + Math.floor(Math.random() * 3);
    state.ects += ects;
    result = { title: loot.n, text: `+${ects} ECTS pour le conseil pédagogique` };
  } else if (loot.id === 'gems') {
    const gems = 1 + Math.floor(Math.random() * 3);
    state.gems += gems;
    result = { title: loot.n, text: `+${gems} pépite${gems > 1 ? 's' : ''} pour la boutique` };
  } else {
    const alumnus = drawAlumnus();
    result = { title: loot.n, text: `${alumnus.card.n} vient te voir${alumnus.isNew ? ' pour la première fois' : ''} !`, alumnus };
  }
  state.rec.chests = (state.rec.chests || 0) + 1;
  trackStat('chest');
  notify.sound('boost');
  save();
  return result;
}


/* ===== js/game/missions.js ===== */
/**
 * Missions : de temps en temps, un responsable (ou Plume) propose un petit défi chronométré.
 * Réussie, la mission rapporte un colis du campus et 30 s de revenus ; ratée, rien n'est perdu.
 * Une mission suit un compteur (voir trackStat) : elle est réussie quand il a progressé de `goal` depuis son début.
 */

const FIRST_MISSION_DELAY = 150;
/** Récompense d'une mission réussie, en secondes de revenus, et attente avant la suivante. */
const MISSION_REWARD = 30;
const missionGap = () => 120 + Math.random() * 60;
let nextMissionIn = FIRST_MISSION_DELAY;

const affordableSoon = (cost, seconds) => cost <= state.money + totalRate() * seconds;

/** Modèles de mission : available() = proposable maintenant ; make() = {text, k, goal, time}. */
const MISSION_TYPES = [
  {id:'lvl', available:() => true, make:() => { const n = pick([25, 40, 60]); return { text:`Achète ${n} niveaux de bâtiments`, k:'lvl', goal:n, time:180 }; }},
  {id:'earn', available:() => totalRate() > 0, make:() => { const x = totalRate() * 150; return { text:`Gagne ${eur(x)}`, k:'earn', goal:x, time:150 }; }},
  {id:'critter', available:() => true, make:() => ({ text:'Attrape 2 surprises du campus (livreur, drone, étudiant en retard…)', k:'critter', goal:2, time:240 })},
  {id:'abil', available:() => ABILITIES.filter(a => a.unlocked()).length >= 2, make:() => ({ text:'Utilise 2 capacités', k:'abil', goal:2, time:200 })},
  {id:'jpo', available:() => state.promos > 0, make:() => ({ text:'Accueille un visiteur de la JPO', k:'jpo', goal:1, time:240 })},
  {id:'bld', available:() => currentDefs().some(d => isEditable(d) && !level(d.id) && affordableSoon(d.unlock, 150)),
   make:() => ({ text:'Ouvre un nouveau bâtiment', k:'bld', goal:1, time:210 })},
  {id:'mgr', available:() => currentDefs().some(d => isEditable(d) && d.kind === 'dept' && level(d.id) && !state.b[d.id].mgr && affordableSoon(managerCost(d), 150)),
   make:() => ({ text:'Recrute un responsable de département', k:'mgr', goal:1, time:210 })},
  {id:'deco', available:() => affordableSoon(decoCost(decoById('banc')), 90), make:() => ({ text:'Pose une décoration sur une pelouse', k:'deco', goal:1, time:180 })},
];

/** Qui confie la mission : un responsable en poste, sinon Plume. */
function missionGiver() {
  const bosses = SITE_DEPTS[state.city].filter(d => state.b[d.id].mgr).map(d => d.boss);
  return bosses.length && Math.random() < 0.75 ? pick(bosses) : 'Plume';
}

/** Progression de la mission en cours : {value, goal}. */
function missionProgress() {
  const m = state.mission;
  return { value: Math.min(m.goal, lifetimeCount(m.k) - m.start), goal: m.goal };
}

function startMission() {
  const choices = MISSION_TYPES.filter(t => t.available() && t.id !== state.rec.lastMission);
  if (!choices.length) return;
  const type = pick(choices), m = type.make();
  state.mission = { id: type.id, giver: missionGiver(), ...m, start: lifetimeCount(m.k), t: m.time, max: m.time };
  state.rec.lastMission = type.id;
  notify.sound('click');
}

function completeMission() {
  const reward = totalRate() * MISSION_REWARD;
  earn(reward);
  state.mission = null;
  state.rec.missions = (state.rec.missions || 0) + 1;
  trackStat('mission');
  addChests(1);
  notify.toast(`Mission réussie : +${eur(reward)} et un colis du campus !`, 'gold');
  notify.sound('boost');
  nextMissionIn = missionGap();
  save();
}

/** Abandonne la mission en cours (bouton ou temps écoulé). */
function dropMission(timedOut = false) {
  if (!state.mission) return;
  if (timedOut) notify.toast('Mission ratée, ce n’est que partie remise.');
  state.mission = null;
  nextMissionIn = missionGap();
}

function updateMissions(dt) {
  if (!state.intro) return;
  const m = state.mission;
  if (m) {
    if (missionProgress().value >= m.goal) { completeMission(); return; }
    m.t -= dt;
    if (m.t <= 0) dropMission(true);
    return;
  }
  if (state.city !== state.site) return; // pas de mission pendant la visite d'une ville terminée
  nextMissionIn -= dt;
  if (nextMissionIn <= 0) startMission();
}


/* ===== js/game/surprises.js ===== */
/**
 * Récompenses des surprises du campus et vendanges de Châlons.
 * Les surprises elles-mêmes (déplacement, dessin) sont dans render/critters.js.
 */

/** Chance qu'un drone perdu rapporte des pépites plutôt qu'un colis. */
const DRONE_GEM_CHANCE = 0.3;

/** Récompense d'une surprise attrapée ; retourne le texte à afficher au-dessus. */
function rewardCritter(type) {
  let label;
  if (type.chest) {
    if (Math.random() < DRONE_GEM_CHANCE) { state.gems += 2; label = '+2 pépites'; notify.toast(`${type.text} : +2 pépites !`, 'gold'); }
    else { addChests(1); label = '+1 colis'; }
  } else {
    const gain = totalRate() * type.lump;
    earn(gain);
    label = '+' + eur(gain);
    notify.toast(`${type.text} : +${eur(gain)}`, 'gold');
  }
  state.rec.critters = (state.rec.critters || 0) + 1;
  if (type.id === 'puppet') state.rec.puppets = (state.rec.puppets || 0) + 1;
  trackStat('critter');
  notify.sound('coin');
  save();
  return label;
}

/* ----- Vendanges (Châlons) ----- */

const VINE_TILES = [];
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (isVine(i, j)) VINE_TILES.push([i, j]);

const HARVEST_LENGTH = 35, GRAPE_SECONDS = 12;
let nextHarvestIn = 60, harvestLeft = 0;
const grapes = new Set();

const inVineyardCity = () => SITE_BY[state.city].perk === 'vendanges' && state.site === state.city;
const isHarvesting = () => harvestLeft > 0;
const harvestTimeLeft = () => harvestLeft;
const hasGrapes = (i, j) => grapes.has(i * N + j);
/** Chaque grappe rapporte des secondes de revenus, davantage avec la Cave de champagne. */
const grapeValue = () => totalRate() * GRAPE_SECONDS * (1 + cityLevel('parking') / 25);

function harvestGrape(i, j) {
  if (!grapes.delete(i * N + j)) return null;
  const gain = grapeValue();
  earn(gain);
  state.rec.grapes = (state.rec.grapes || 0) + 1;
  trackStat('critter');
  notify.sound('coin');
  if (!grapes.size) { harvestLeft = 0; notify.toast('Toutes les grappes sont récoltées : belle cuvée !', 'gold'); }
  return '+' + eur(gain);
}

function updateHarvest(dt) {
  if (!inVineyardCity()) { grapes.clear(); harvestLeft = 0; return; }
  if (harvestLeft > 0) {
    harvestLeft -= dt;
    if (harvestLeft <= 0) grapes.clear();
    return;
  }
  nextHarvestIn -= dt;
  if (nextHarvestIn > 0) return;
  startHarvest();
}

/** Lance les vendanges (seulement à Châlons, ville active affichée). */
function startHarvest() {
  if (!inVineyardCity()) return false;
  nextHarvestIn = 200 + Math.random() * 80;
  harvestLeft = HARVEST_LENGTH;
  for (const [i, j] of VINE_TILES) grapes.add(i * N + j);
  notify.toast('Vendanges ! Clique sur les grappes dans les vignes avant qu’elles ne tombent.', 'gold');
  notify.sound('boost');
  return true;
}


/* ===== js/render/buildings.js ===== */
/**
 * Dessin des bâtiments. Chaque modèle (`style`) a sa silhouette ; il grandit selon son palier `tier`
 * (plus d'étages, équipements sur le toit). Les bâtiments non construits deviennent des chantiers.
 */

/** Enseigne posée sur le toit, côté entrée. */
function roofSign(d, g, text, bg, fg, size = 13) {
  const fgc = fg || glow(WHITE), bgc = glow(bg);
  if (d.door === 'i') faceText('i', g.bi + g.bw - 0.1, g.bj + g.bd / 2, g.zt + 1, text, size, fgc, bgc);
  else faceText('j', g.bi + g.bw / 2, g.bj + g.bd - 0.1, g.zt + 1, text, size, fgc, bgc);
}

/**
 * Architecture propre à chaque ville (bâtiments « modernes » des départements) :
 *  - Reims : béton, verre et toits plats ;
 *  - Châlons : pierre de craie, colombages et toit mansardé en tuiles ;
 *  - Charleville : brique et chaînages de pierre façon place Ducale, toit d'ardoise à lucarnes.
 */
const CITY_STYLES = {
  reims: null,
  chalons: { wall: [241,229,204], roof: [194,98,62], roofTop: [170,84,54], timber: [112,74,48], mansard: 10 },
  charle: { wall: [176,86,64], roof: [72,82,104], roofTop: [58,66,86], quoin: [236,226,206], mansard: 14, dormers: true },
};

/** Colombages : poteaux de part et d'autre des fenêtres, sablières à chaque étage, allège en croix sous les fenêtres. */
function drawTimber(face, f, a0, a1, z0, floors, cols, color) {
  const span = (a1 - a0) / cols, z1 = z0 + floors * FH;
  ctx.strokeStyle = rgb(color); ctx.lineWidth = 1.4;
  const post = a => { const q = faceQuad(face, f, a, a, z0, z1); isoLine(q[0], q[3]); };
  post(a0); post(a1);
  for (let c = 0; c < cols; c++) { post(a0 + span * (c + 0.1)); post(a0 + span * (c + 0.9)); }
  for (let r = 0; r <= floors; r++) { const q = faceQuad(face, f, a0, a1, z0 + r * FH, z0 + r * FH); isoLine(q[0], q[1]); }
  for (let r = 0; r < floors; r++) for (let c = 0; c < cols; c++) { // croix de Saint-André sous chaque fenêtre
    const q = faceQuad(face, f, a0 + span * (c + 0.1), a0 + span * (c + 0.9), z0 + r * FH, z0 + r * FH + FH * 0.24);
    isoLine(q[0], q[2]); isoLine(q[1], q[3]);
  }
}

/** Chaînage d'angle : blocs de pierre claire alternés sur l'arête verticale avant. */
function drawQuoins(i, j, z0, H, color) {
  for (let z = z0, k = 0; z < z0 + H - 2; z += 6, k++) {
    const long = k % 2 ? 0.22 : 0.14;
    fillPoly(faceQuad('i', i + 0.004, j - long, j, z, z + 5), rgb(color, 0.86));
    fillPoly(faceQuad('j', j + 0.004, i - long, i, z, z + 5), rgb(color, 0.98));
  }
}

/** Toit mansardé : pans inclinés tout autour et terrasse au sommet ; lucarnes en option. Retourne la hauteur ajoutée. */
function mansardRoof(bi, bj, bw, bd, zt, style) {
  const h = style.mansard, s = 0.28, top = zt + h;
  fillPoly([iso(bi + bw, bj, zt), iso(bi + bw, bj + bd, zt), iso(bi + bw - s, bj + bd - s, top), iso(bi + bw - s, bj + s, top)], rgb(style.roof, 0.82), rgb(style.roof, 0.6));
  fillPoly([iso(bi, bj + bd, zt), iso(bi + bw, bj + bd, zt), iso(bi + bw - s, bj + bd - s, top), iso(bi + s, bj + bd - s, top)], rgb(style.roof, 0.98), rgb(style.roof, 0.6));
  fillPoly([iso(bi + s, bj + s, top), iso(bi + bw - s, bj + s, top), iso(bi + bw - s, bj + bd - s, top), iso(bi + s, bj + bd - s, top)], rgb(style.roofTop, 1.05));
  if (style.dormers) {
    const count = Math.max(1, Math.round(bw * 1.2));
    for (let k = 0; k < count; k++) { // lucarnes sur le pan avant (+j)
      const ci = bi + bw * (k + 0.5) / count, cj = bj + bd - s * 0.5;
      box(ci - 0.12, cj - 0.08, 0.24, 0.12, zt + 2, 8, [236,226,206], { line: false });
      fillPoly(faceQuad('j', cj + 0.045, ci - 0.07, ci + 0.07, zt + 3, zt + 8), windowColor([140,180,220], true, 1));
      fillPoly([iso(ci - 0.14, cj + 0.05, zt + 10), iso(ci + 0.14, cj + 0.05, zt + 10), iso(ci, cj + 0.05, zt + 14)], rgb(style.roof, 0.9));
    }
  }
  return h;
}

/**
 * Bâtiment de département générique (socle, façades, pilier d'angle, bandeau de toit, porte), dans le style de sa ville.
 * Options : fb/fm = étages de base / supplémentaires max, wall, accent, glass, roof, shop (vitrines), noDoor.
 * Retourne la géométrie utile pour poser des équipements sur le toit.
 */
function modernBlock(d, tier, o) {
  const [i0, j0, w, dd] = d.plot, m = 0.4, style = CITY_STYLES[d.site];
  const bi = i0 + m, bj = j0 + m, bw = w - 2 * m, bd = dd - 2 * m, z0 = 4;
  const floors = o.fb + Math.min(tier, o.fm), H = floors * FH;
  let zt = z0 + H;
  box(bi - 0.16, bj - 0.16, bw + 0.32, bd + 0.32, 0, z0, CONCRETE);
  box(bi, bj, bw, bd, z0, H, style ? style.wall : o.wall);
  const glass = o.glass || GLASS, seed = d.id.charCodeAt(0) + d.id.length;
  const skipDoor = face => (c, n) => d.door === face && !o.noDoor && Math.abs(c - (n - 1) / 2) < 0.8;
  const colsI = Math.max(2, Math.round(bd * 1.8)), colsJ = Math.max(2, Math.round(bw * 1.8));
  windowGrid('i', bi + bw + 0.004, bj + 0.12, bj + bd - 0.12, z0, floors, FH, colsI, glass, seed, o.shop ? null : skipDoor('i'));
  windowGrid('j', bj + bd + 0.004, bi + 0.12, bi + bw - 0.12, z0, floors, FH, colsJ, glass, seed + 3, o.shop ? null : skipDoor('j'));
  if (o.shop) {
    fillPoly(faceQuad('i', bi + bw + 0.006, bj + 0.1, bj + bd - 0.1, z0 + 2, z0 + 16), windowColor(glass, true, 0.8), glow([255,255,255]), 1.2);
    fillPoly(faceQuad('j', bj + bd + 0.006, bi + 0.1, bi + bw - 0.1, z0 + 2, z0 + 16), windowColor(glass, true, 0.95), glow([255,255,255]), 1.2);
  }
  if (style && style.timber) {
    drawTimber('i', bi + bw + 0.006, bj + 0.02, bj + bd - 0.02, z0, floors, colsI, style.timber);
    drawTimber('j', bj + bd + 0.006, bi + 0.02, bi + bw - 0.02, z0, floors, colsJ, style.timber);
  }
  if (style && style.quoin) drawQuoins(bi + bw, bj + bd, z0, H, style.quoin);
  else box(bi + bw - 0.2, bj + bd - 0.2, 0.22, 0.22, z0, H, o.accent);   // pilier d'angle
  box(bi - 0.03, bj - 0.03, bw + 0.06, bd + 0.06, zt - 5, 5, o.accent);   // bandeau de toit
  if (style) zt += mansardRoof(bi, bj, bw, bd, zt, style);
  else fillPoly([iso(bi + 0.12, bj + 0.12, zt), iso(bi + bw - 0.12, bj + 0.12, zt), iso(bi + bw - 0.12, bj + bd - 0.12, zt), iso(bi + 0.12, bj + bd - 0.12, zt)], rgb(o.roof || ROOF));
  if (!o.noDoor) door(d.door, bi, bj, bw, bd, z0, o.accent);
  d.top = zt + 16;
  return { bi, bj, bw, bd, z0, zt, floors, H };
}

/** Chantier : palissade, panneau avec le prix, cônes, flèche si le joueur peut construire. */
function drawConstructionSite(d) {
  const [i0, j0, w, dd] = d.plot, m = 0.18;
  const affordable = d.site === state.city && state.money >= d.unlock, orange = [245,140,50];
  const fence = (from, to, fixed, alongI) => {
    const p = (u, z) => (alongI ? iso(u, fixed, z) : iso(fixed, u, z));
    ctx.strokeStyle = rgb(orange); ctx.lineWidth = 1.6; isoLine(p(from, 6), p(to, 6));
    ctx.strokeStyle = rgb(WHITE); isoLine(p(from, 10), p(to, 10));
    ctx.strokeStyle = rgb([130,90,60]); ctx.lineWidth = 1.4;
    const posts = Math.round((to - from) / 0.5);
    for (let k = 0; k <= posts; k++) { const [x, y] = p(from + (to - from) * k / posts, 0); line(x, y, x, y - 12); }
  };
  fence(j0 + m, j0 + dd - m, i0 + m, false);
  fence(i0 + m, i0 + w - m, j0 + m, true);

  const [x, y] = iso(i0 + w / 2, j0 + dd / 2, 0), bob = affordable && !REDUCED_MOTION ? Math.sin(world.t * 4) * 2 : 0;
  ctx.strokeStyle = rgb(WOOD); ctx.lineWidth = 2.4; line(x - 16, y, x - 16, y - 30); line(x + 16, y, x + 16, y - 30);

  const bw = Math.max(72, nameW, priceW + 20) + 18, bh = 40, by = y - 30 - bh + bob;
  roundRect(x - bw / 2, by, bw, bh, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = affordable ? '#1f8a47' : INK; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = INK; ctx.font = `15px ${FONT}`; ctx.fillText(d.short, x, by + 14);
  ctx.fillStyle = affordable ? '#1f8a47' : '#56607f'; ctx.font = `12px ${FONT}`; ctx.fillText(price, x + 8, by + 30);
  ctx.fillStyle = '#ffc233'; circle(x + 8 - priceW / 2 - 9, by + 30, 5); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();

  fence(j0 + m, j0 + dd - m, i0 + w - m, false);
  fence(i0 + m, i0 + w - m, j0 + dd - m, true);
  for (const [ci, cj] of [[i0 + w - 0.45, j0 + dd - 0.6], [i0 + w - 0.75, j0 + dd - 0.35]]) {

    ctx.fillStyle = advice.id === d.id ? '#ffc233' : '#35c46b'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 7, ay - 10); ctx.lineTo(x + 7, ay - 10); ctx.lineTo(x + 7, ay - 2); ctx.lineTo(x + 12, ay - 2);
    ctx.lineTo(x, ay + 8); ctx.lineTo(x - 12, ay - 2); ctx.lineTo(x - 7, ay - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  }

}

/** Dessine un bâtiment (ou son chantier), avec l'animation de construction et les étoiles de prestige. */
function drawBuilding(d) {
  const s = state.b[d.id];

  const tier = tierOf(d, s.lvl), age = world.t - d.anim;
  if (age >= 0 && age < 0.9 && !REDUCED_MOTION) { // pousse du sol avec un léger rebond
    const p = age / 0.9, c1 = 1.70158, c3 = c1 + 1, grow = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    const [i0, j0, w, dd] = d.plot, [bx, by] = iso(i0 + w / 2, j0 + dd / 2, 0);
    ctx.save(); ctx.translate(bx, by); ctx.scale(1 + 0.06 * Math.sin(p * Math.PI), Math.max(0.02, grow)); ctx.translate(-bx, -by);
    MODELS[d.style](d, s, tier);

}

/** Couleurs de feuillage par type (2 = sapin, 3-4 = arbres à fleurs ou d'automne). */
const TREE_COLORS = [[76,166,86],[98,178,72],null,[232,146,52],[214,88,58]];

/** Balancement du feuillage dans le vent, en pixels : 0 dans le jeu, activé par la cinématique (src/dev/trailer.js). */
const treeMotion = { sway: 0 };

function drawTree(i, j, s, kind) {
  const [x0, y] = iso(i, j, 0);

    ctx.strokeStyle = rgb([112,82,60]); ctx.lineWidth = 1.6 * s; ctx.lineCap = 'round';
    line(x, y - 12 * s, x, y - 30 * s); line(x, y - 18 * s, x - 8 * s, y - 27 * s); line(x, y - 21 * s, x + 7 * s, y - 31 * s); line(x, y - 26 * s, x - 4 * s, y - 34 * s);

  } else {

/**
 * Arbres de chaque site, générés une fois : Reims en couleurs d'automne,
 * Châlons entre les vignes, Charleville dans la forêt ardennaise.
 */
const treesBySite = {};
function generateTrees(site) {
  const rnd = mulberry32({ reims: 20260929, chalons: 51000, charle: 8000 }[site]), trees = [];
  const kind = () => {
    const r = rnd();
    if (site === 'charle') return r < 0.6 ? 2 : r < 0.72 ? 3 : r < 0.8 ? 4 : r < 0.9 ? 0 : 1;
    if (site === 'chalons') return r < 0.1 ? 2 : r < 0.25 ? 3 : r < 0.3 ? 4 : r < 0.65 ? 0 : 1;
    return r < 0.18 ? 2 : r < 0.3 ? 3 : r < 0.38 ? 4 : r < 0.7 ? 0 : 1;
  };
  const density = site === 'charle' ? 0.8 : site === 'chalons' ? 0.35 : 0.5;
  const add = (i, j, s, k) => trees.push({
    minI: i - 0.25, maxI: i + 0.25, minJ: j - 0.25, maxJ: j + 0.25, ti: Math.floor(i), tj: Math.floor(j), draw: () => drawTree(i, j, s, k),
  });
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (i >= 2 && i <= 23 && j >= 2 && j <= 23) continue;
    // les tirages sont faits avant les tests pour garder la même forêt d'une partie à l'autre
    const front = i > 23 || j > 23, r = rnd(), a = rnd(), b = rnd(), sc = rnd(), k = kind();
    if (inPlot(i, j) || (site === 'chalons' && isVine(i, j))) continue;
    if (r < (front ? density * 0.4 : density)) add(i + 0.3 + a * 0.4, j + 0.3 + b * 0.4, (front ? 0.7 : 0.85) + sc * 0.4, k);
  }
  add(19.45, 3.4, 0.8, 1); add(22.55, 5.6, 0.85, 4); // arbres du parc
  return trees;
}

const VINE_SPOTS = [];
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (isVine(i, j)) VINE_SPOTS.push([i, j]);

function drawVines() {
  for (const [i, j] of VINE_SPOTS) {
    const alongJ = i <= 1;
    for (let r = 0; r < 2; r++) for (let k = 0; k < 4; k++) {

      ctx.fillStyle = rgb(mix([104,152,62], SNOW, world.snow * 0.6)); circle(x - 1, y - 6, 2.2);
      if (world.season === 'automne' && k % 2) { ctx.fillStyle = rgb([118,40,92]); circle(x + 2, y - 3, 1.4); }
    }
  }
}

const CURBS = [], TUFTS = [], FLOWERS = [];
{

  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {

      if (isGrass(i, j + 1)) CURBS.push([iso(i, j + 1), iso(i + 1, j + 1)]);

/**
 * Sol fixe du campus (pavés, pelouses, parcelles, étang, terrain, vignes) : il est dessiné dans les tuiles du décor
 * (backdrop-tiles.js) et redessiné quand groundVersion() change (bâtiment construit, changement de ville).
 */
function drawGroundStatic() {
  const grass1 = mix(GRASS1, SNOW, world.snow), grass2 = mix(GRASS2, SNOW, world.snow);
  fillTiles(grass1, (i, j, t) => t === T_GRASS && (i + j) % 2 === 0);
  fillTiles(grass2, (i, j, t) => t === T_GRASS && (i + j) % 2 === 1);
  fillTiles(PATHC, (i, j, t) => t === T_PATH);
  fillTiles(AVEC, (i, j, t) => t === T_AVE);
  fillTiles(PLAZAC, (i, j, t) => t === T_PLAZA);
  // joints du pavage
  ctx.beginPath();
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const t = tileAt(i, j); if (t === T_AVE || t === T_PLAZA) diamond(i, j); }
  ctx.strokeStyle = rgb([150,140,128], 1, 0.22); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = rgb([206,196,180]); isoRing(13, 13, 1.75); ctx.fill();
  ctx.fillStyle = rgb(PLAZAC, 1.02); isoRing(13, 13, 1.45); ctx.fill();
  ctx.beginPath(); for (const [a, b] of CURBS) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  ctx.strokeStyle = rgb(CURB); ctx.lineWidth = 2.2; ctx.stroke();

  // parcelles : pelouse si construit, terre sinon
  for (const d of currentDefs()) {
    const [i0, j0, w, dd] = d.plot, built = state.b[d.id].lvl > 0;
    ctx.beginPath(); diamond(i0 + 0.08, j0 + 0.08, w - 0.16, dd - 0.16);
    ctx.fillStyle = rgb(built ? mix(LAWN, SNOW, world.snow) : mix(DIRT, SNOW, world.snow * 0.6)); ctx.fill();
    if (!built) {
      ctx.fillStyle = rgb(DIRT, 0.88);
      for (let k = 0; k < 6; k++) { const [x, y] = iso(i0 + 0.5 + hash(k, i0, j0) * (w - 1), j0 + 0.5 + hash(j0, k, i0) * (dd - 1)); ellipse(x, y, 4, 2); }
    }
  }

  drawPond();
  drawFootballPitch();
  ctx.beginPath(); for (const [x, y] of TUFTS) { ctx.moveTo(x - 2, y - 2.5); ctx.lineTo(x, y); ctx.lineTo(x + 2, y - 3); }
  ctx.strokeStyle = rgb(grass1, 0.78); ctx.lineWidth = 1.1; ctx.stroke();
  for (const [x, y, c] of FLOWERS) { ctx.fillStyle = rgb(c); circle(x, y, 1.5); }
  if (state.site === 'chalons') drawVines();
}

/* ===== js/render/critters.js ===== */
/**
 * Surprises du campus : un livreur, un étudiant en retard, un drone perdu ou une marionnette traverse la carte
 * en ligne droite le long d'une allée. Un clic dessus donne la récompense (game/surprises.js).
 */

/** Allées rectilignes empruntées : coordonnée fixe de la ligne (au milieu de la case). */
const LANES = [2.5, 6.5, 18.5, 23.5];
const SPEED = { pizza: 2.6, late: 1.7, drone: 1.3, puppet: 0.8 };
const DRONE_HEIGHT = 70;
const MAX_CRITTERS = 2;

const critters = [];
let nextCritterIn = 25;
/** Attente entre deux surprises, en secondes (la Bonne étoile la raccourcit). */
const critterGap = () => 50 + Math.random() * 40;

function pickCritterType() {
  const perk = SITE_BY[state.city].perk, night = world.night > 0.45;
  const pool = CRITTERS.filter(c => (!c.perk || c.perk === perk) && (!c.night || night) && (!c.cond || c.cond()));
  const total = pool.reduce((sum, c) => sum + c.w, 0);
  let r = Math.random() * total;
  for (const c of pool) { r -= c.w; if (r < 0) return c; }
  return pool[0];
}

/** Fait passer une surprise (tirée au sort, ou choisie depuis le mode admin). */
function spawnCritter(type = pickCritterType()) {
  if (!type) return;
  const alongI = Math.random() < 0.5, lane = pick(LANES), forward = Math.random() < 0.5;
  const from = forward ? -1.5 : N + 1.5, to = forward ? N + 1.5 : -1.5;
  critters.push({ type, alongI, lane, from, to, u: from, speed: SPEED[type.id], phase: Math.random() * 6, caught: false, fade: 1 });
}

/** Position au sol [i, j] d'une surprise. */
const groundPos = c => (c.alongI ? [c.u, c.lane] : [c.lane, c.u]);
const heightOf = c => (c.type.id === 'drone' ? DRONE_HEIGHT + Math.sin(c.phase * 1.3) * 5 : 0);

function updateCritters(dt) {
  const canSpawn = state.intro && state.site === state.city;
  nextCritterIn -= dt * (1 + 0.2 * treeLevel('luck'));
  if (nextCritterIn <= 0) {
    nextCritterIn = critterGap();
    if (canSpawn && critters.length < MAX_CRITTERS) spawnCritter();
  }
  for (let k = critters.length - 1; k >= 0; k--) {
    const c = critters[k];
    c.phase += dt * 8;
    if (c.caught) { c.fade -= dt * 3; if (c.fade <= 0) critters.splice(k, 1); continue; }
    c.u += Math.sign(c.to - c.from) * c.speed * dt;
    if ((c.to - c.u) * Math.sign(c.to - c.from) <= 0) critters.splice(k, 1);
  }
}

/** Surprise sous un point du monde (hors surprises déjà attrapées), ou null. */
function critterAt(wx, wy) {
  for (const c of critters) {
    if (c.caught) continue;
    const [i, j] = groundPos(c), [x, y] = iso(i, j, heightOf(c));
    if (Math.abs(wx - x) < 20 && wy > y - 40 && wy < y + 10) return c;
  }
  return null;
}

/** Marque la surprise comme attrapée et renvoie sa position à l'écran (pour les effets). */
function catchCritter(c) {
  c.caught = true;
  const [i, j] = groundPos(c);
  return iso(i, j, heightOf(c) + 20);
}

const clearCritters = () => { critters.length = 0; };

/* ----- Dessin ----- */

/** Halo doré qui pulse pour que la surprise se remarque. */
function halo(x, y, r) {
  const p = REDUCED_MOTION ? 0.5 : (Math.sin(world.t * 6) + 1) / 2;
  ctx.fillStyle = `rgba(255,210,70,${0.25 + 0.2 * p})`;
  ellipse(x, y, r, r * 0.5);
}

function drawScooter(x, y, c) {
  const dir = c.to > c.from ? 1 : -1, s = c.alongI ? dir : -dir, bump = Math.abs(Math.sin(c.phase)) * 0.8;
  halo(x, y, 16);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ellipse(x, y, 11, 4);
  ctx.fillStyle = rgb([40, 40, 48]); circle(x - 7 * s, y - 3, 3.2); circle(x + 7 * s, y - 3, 3.2);
  ctx.fillStyle = rgb([226, 60, 60]); roundRect(x - 9, y - 11 - bump, 18, 6, 3); ctx.fill();

  ctx.fillStyle = rgb([250, 250, 250]); ctx.fillRect(x - 10 * s - 5, y - 20 - bump, 10, 8); // boîte à pizza

}

function drawLateStudent(x, y, c) {
  const step = Math.sin(c.phase * 1.6) * 3, bob = Math.abs(Math.cos(c.phase * 1.6)) * 1.5;
  halo(x, y, 13);

  ctx.fillStyle = rgb([250, 196, 50]); ctx.fillRect(x + 2.5, y - 14 - bob, 3, 6); // sac à dos

  ctx.fillStyle = rgb([40, 30, 25]); ctx.beginPath(); ctx.arc(x, y - 17.5 - bob, 3.1, Math.PI, Math.PI * 2); ctx.fill();

function drawDrone(x, y, c) {
  const [i, j] = groundPos(c), [gx, gy] = iso(i, j, 0);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ellipse(gx, gy, 12, 5);

  ctx.fillStyle = rgb([230, 232, 240]); roundRect(x - 5, y - 3, 10, 6, 2); ctx.fill(); ctx.strokeStyle = rgb(DARK); ctx.lineWidth = 1; ctx.stroke();

function drawPuppet(x, y, c) {

  halo(x, y, 14);
  const barY = y - 52;
  ctx.strokeStyle = rgb([120, 80, 50]); ctx.lineWidth = 2; line(x - 9 + sway, barY, x + 9 + sway, barY); line(x + sway, barY - 5, x + sway, barY + 5);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.7;
  line(x - 9 + sway, barY, x - 5, y - 14 - hop); line(x + 9 + sway, barY, x + 5, y - 14 - hop); line(x + sway, barY, x, y - 22 - hop);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ellipse(x, y, 5, 2.4);
  ctx.strokeStyle = rgb([60, 40, 30]); ctx.lineWidth = 2; ctx.lineCap = 'round';
  line(x - 2, y - 7 - hop, x - 3 - sway / 2, y - hop); line(x + 2, y - 7 - hop, x + 3 + sway / 2, y - hop); ctx.lineCap = 'butt';
  ctx.fillStyle = rgb([170, 60, 120]); ctx.beginPath(); ctx.moveTo(x - 6, y - 7 - hop); ctx.lineTo(x + 6, y - 7 - hop); ctx.lineTo(x + 3, y - 17 - hop); ctx.lineTo(x - 3, y - 17 - hop); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgb([250, 218, 190]); circle(x, y - 21 - hop, 4);
  ctx.fillStyle = rgb([255, 194, 51]); ctx.beginPath(); ctx.moveTo(x - 4.5, y - 23 - hop); ctx.lineTo(x, y - 32 - hop); ctx.lineTo(x + 4.5, y - 23 - hop); ctx.closePath(); ctx.fill(); // bonnet
  ctx.fillStyle = rgb([220, 60, 60]); circle(x, y - 20 - hop, 1.2);
}

const DRAWERS = { pizza: drawScooter, late: drawLateStudent, drone: drawDrone, puppet: drawPuppet };

function drawCritter(c) {
  const [i, j] = groundPos(c), [x, y] = iso(i, j, heightOf(c));
  ctx.globalAlpha = c.caught ? Math.max(0, c.fade) : 1;
  DRAWERS[c.type.id](x, y, c);
  if (c.caught) { star(x, y - 34, 8, 3.5); ctx.fillStyle = '#ffc233'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.globalAlpha = 1;
}

/** Surprises au sol, à trier avec le décor. */
const critterItems = () => critters.filter(c => c.type.id !== 'drone').map(c => {
  const [i, j] = groundPos(c);
  return { minI: i, maxI: i, minJ: j, maxJ: j, draw: () => drawCritter(c) };
});

/** Drones en vol, dessinés par-dessus la scène. */
function drawFlyingCritters() {
  for (const c of critters) if (c.type.id === 'drone') drawCritter(c);
}


/* ===== js/render/backdrop.js ===== */
/**
 * Ville décorative autour du campus : une couronne de RING cases avec boulevard, rues, maisons dans le style
 * de la ville, et un monument emblématique (cathédrale de Reims, Notre-Dame-en-Vaux, place Ducale).
 * Au-delà, la campagne (champs, vignes ou forêts) couvre tout ce que la caméra peut montrer.
 * Rien n'y est cliquable et rien n'y bouge, sauf le tramway : le décor est dessiné une fois, par tuiles (backdrop-tiles.js).
 * Les éléments de l'arrière (i < 0 ou j < 0) passent sous le campus, ceux de l'avant (i ≥ N ou j ≥ N) dessus (BACKDROP_LAYERS).
 */

/** Largeur de la couronne de ville autour du campus, en cases. */
const RING = 9;
const LO = -RING, HI = N + RING;
/** Rangée des routes de campagne qui prolongent une rue de la ville dans les quatre directions. */
const ROAD = 12;
/** Limites de la campagne (champs), au-delà de la ville. */
const FAR_LO = -MAP_MARGIN, FAR_HI = N + MAP_MARGIN;

/** Apparence des maisons et du sol selon la ville. */
const TOWN_STYLES = {
  reims: { walls: [[236,224,200], [226,214,190], [214,120,90], [240,232,214]], roofs: [[118,126,140], [104,112,128]], road: [112,116,128], walk: [214,208,196], park: [128,190,98] },
  chalons: { walls: [[242,228,198], [236,220,188], [230,208,178]], roofs: [[192,96,60], [176,86,54]], timber: [110,72,46], road: [122,118,112], walk: [220,210,190], park: [132,192,96] },
  charle: { walls: [[172,82,62], [160,74,58], [184,96,72]], roofs: [[70,80,100], [60,70,90]], quoin: [236,226,206], road: [104,108,120], walk: [206,200,190], park: [110,170,92] },
};

const inCampus = (i, j) => i >= 0 && j >= 0 && i < N && j < N;
const onBoulevard = (i, j) => !inCampus(i, j) && i >= -1 && j >= -1 && i <= N && j <= N;

/* ----- Génération d'une ville (une seule fois par ville) ----- */

/**
 * @returns {{groundByColor: Map<number[], object[]>, water: number[][], under: object[], mid: object[], over: object[]}}
 */
function generateTown(site) {
  const rnd = mulberry32({ reims: 51100, chalons: 51000, charle: 8000 }[site]);
  const style = TOWN_STYLES[site], ground = new Map(), items = [], taken = new Set();
  const key = (i, j) => (i - LO) * 100 + (j - LO);
  const setGround = (i, j, c) => ground.set(key(i, j), c);
  const free = (i, j, w, d) => { for (let a = i; a < i + w; a++) for (let b = j; b < j + d; b++) if (a < LO || b < LO || a >= HI || b >= HI || inCampus(a, b) || onBoulevard(a, b) || taken.has(key(a, b))) return false; return true; };
  const take = (i, j, w, d) => { for (let a = i; a < i + w; a++) for (let b = j; b < j + d; b++) taken.add(key(a, b)); };
  const add = (i, j, w, d, draw) => { take(i, j, w, d); items.push({ minI: i, maxI: i + w, minJ: j, maxJ: j + d, draw }); };

  // sol : boulevard autour du campus, rues transversales, trottoirs
  for (let i = LO; i < HI; i++) for (let j = LO; j < HI; j++) {
    if (inCampus(i, j)) continue;
    if (onBoulevard(i, j)) setGround(i, j, style.road);
    else if ((i < -1 || i > N) && (j - LO) % 6 === 3) setGround(i, j, style.walk);
    else if ((j < -1 || j > N) && (i - LO) % 6 === 3) setGround(i, j, style.walk);
    else setGround(i, j, (i + j) % 2 ? GRASS1 : GRASS2);
  }
  for (let i = LO; i < HI; i++) for (let j = LO; j < HI; j++) if (ground.get(key(i, j)) === style.walk) taken.add(key(i, j));

  const water = [];
  const setWater = (i, j) => { setGround(i, j, WATER); taken.add(key(i, j)); water.push([i, j]); };

  // monument et particularités de chaque ville
  if (site === 'reims') {
    add(9, -6, 7, 4, () => drawCathedral(9, -6));
    for (let i = LO; i < HI; i++) if (!inCampus(i, N + 1)) { taken.add(key(i, N + 1)); setGround(i, N + 1, [150,150,150]); } // ligne du tramway
  } else if (site === 'chalons') {
    add(-6, 9, 4, 6, () => drawNotreDameEnVaux(-6, 9));
    for (let j = LO; j < HI; j++) if (!inCampus(-3, j) && !onBoulevard(-3, j)) setWater(-3, j); // le canal du Mau
    for (let i = N + 1; i < HI; i++) for (let j = LO; j < HI; j++) if (free(i, j, 1, 1) && j > 2) { take(i, j, 1, 1); setGround(i, j, [150,128,86]); }
  } else {
    for (let i = 5; i < 19; i++) for (let j = -6; j < -1; j++) { taken.add(key(i, j)); setGround(i, j, [206,196,178]); } // place Ducale
    add(10.5, -4.8, 3, 2.6, () => drawDucalFountain(12, -3.5));
    for (const pi of [5, 9.5, 14]) add(pi, -6, 4, 1, () => drawArcade(pi, -6, 4, 1));
    for (let j = LO; j < HI; j++) if (!inCampus(N + 2, j)) { setWater(N + 2, j); setWater(N + 3, j); } // la Meuse
    add(N + 4, 10, 2, 2, () => drawOldMill(N + 4, 10));
  }

  // maisons en rangées, le long des rues
  for (let i = LO; i < HI; i += 2) for (let j = LO; j < HI; j += 2) {
    if (!free(i, j, 2, 2) || rnd() < 0.12) continue;
    const front = i >= N || j >= N;
    const wall = style.walls[Math.floor(rnd() * style.walls.length)], roof = style.roofs[Math.floor(rnd() * style.roofs.length)];
    const floors = front && i < N + 4 && j < N + 4 ? 1 : 2 + Math.floor(rnd() * (site === 'reims' ? 3 : 2)), alongI = rnd() < 0.5, seed = Math.floor(rnd() * 1000);
    add(i, j, 2, 2, () => drawHouse(i + 0.2, j + 0.2, 1.6, 1.6, floors, wall, roof, alongI, seed, style));
  }
  // arbres dans les cases restées libres
  for (let i = LO; i < HI; i++) for (let j = LO; j < HI; j++) {
    if (!free(i, j, 1, 1) || rnd() > (site === 'charle' ? 0.8 : 0.5)) continue;
    const kind = site === 'charle' ? (rnd() < 0.7 ? 2 : 0) : rnd() < 0.2 ? 2 : rnd() < 0.5 ? 3 : 0, size = 0.7 + rnd() * 0.4;
    const ti = i + 0.3 + rnd() * 0.4, tj = j + 0.3 + rnd() * 0.4;
    add(i, j, 1, 1, () => drawTree(ti, tj, size, kind));
  }
  // vignes sur les coteaux de Châlons (tuiles brunes)
  if (site === 'chalons') for (const [k, c] of ground) if (c[0] === 150 && c[1] === 128) {
    const i = Math.floor(k / 100) + LO, j = (k % 100) + LO;
    items.push({ minI: i, maxI: i + 1, minJ: j, maxJ: j + 1, draw: () => drawVineRow(i, j) });
  }

  // allées d'arbres le long des routes de campagne, à la sortie de la ville
  const alley = site === 'charle' ? 2 : 0;
  for (let k = 0; k < 16; k += 2) for (const side of [ROAD - 0.35, ROAD + 1.35]) {
    for (const [i, j] of [[LO - 1.5 - k, side], [HI + 0.5 + k, side], [side, LO - 1.5 - k], [side, HI + 0.5 + k]]) {
      items.push({ minI: i - 0.4, maxI: i + 0.4, minJ: j - 0.4, maxJ: j + 0.4, draw: () => drawTree(i, j, 0.85, alley) });
    }
  }

  // couches : l'arrière passe sous le campus ; l'avant passe dessus, en deux parts de chaque côté de la ligne du tramway
  const isBack = it => it.maxI <= 0 || it.maxJ <= 0 || (it.minI < 0 && it.minJ >= N) || (it.minJ < 0 && it.minI >= N);
  const front = items.filter(it => !isBack(it)), behindTram = it => it.maxJ <= N + 1.15;
  const groundByColor = new Map();
  for (const [k, c] of ground) {
    const i = Math.floor(k / 100) + LO, j = (k % 100) + LO;
    if (!groundByColor.has(c)) groundByColor.set(c, []);
    groundByColor.get(c).push({ minI: i, maxI: i + 1, minJ: j, maxJ: j + 1 });
  }
  return {
    groundByColor, water,
    under: sortOnce(items.filter(isBack)), mid: sortOnce(front.filter(behindTram)), over: sortOnce(front.filter(it => !behindTram(it))),
  };
}

/** Tri du peintre simple pour des éléments qui ne se chevauchent pas : de l'arrière vers l'avant. */
const sortOnce = items => items.sort((a, b) => (a.minI + a.maxI + a.minJ + a.maxJ) - (b.minI + b.maxI + b.minJ + b.maxJ));

const towns = {};
const townFor = site => (towns[site] = towns[site] || generateTown(site));

/* ----- Dessin des éléments ----- */

function drawHouse(i, j, w, d, floors, wall, roof, alongI, seed, style) {
  const H = floors * 16;
  box(i, j, w, d, 0, H, wall);
  windowGrid('i', i + w + 0.004, j + 0.1, j + d - 0.1, 0, floors, 16, 3, [150,190,226], seed);
  windowGrid('j', j + d + 0.004, i + 0.1, i + w - 0.1, 0, floors, 16, 3, [150,190,226], seed + 1);
  if (style.timber) {
    ctx.strokeStyle = rgb(style.timber); ctx.lineWidth = 1.2;
    for (let f = 1; f <= floors; f++) { const q = faceQuad('j', j + d + 0.006, i, i + w, f * 16, f * 16); isoLine(q[0], q[1]); const r = faceQuad('i', i + w + 0.006, j, j + d, f * 16, f * 16); isoLine(r[0], r[1]); }
    for (const a of [0.02, w / 2, w - 0.02]) { const q = faceQuad('j', j + d + 0.006, i + a, i + a, 0, H); isoLine(q[0], q[3]); }
  }
  if (style.quoin) for (let z = 0, k = 0; z < H - 2; z += 6, k++) fillPoly(faceQuad('j', j + d + 0.004, i + w - (k % 2 ? 0.2 : 0.12), i + w, z, z + 5), rgb(style.quoin, 0.95));
  if (alongI) gableRoofI(i - 0.06, j - 0.06, w + 0.12, d + 0.12, H, 14, roof, wall);
  else gableRoofJ(i - 0.06, j - 0.06, w + 0.12, d + 0.12, H, 14, roof, wall);
}

/** Cathédrale Notre-Dame de Reims : longue nef, arcs-boutants, deux hautes tours à pinacles, grande rosace. */
function drawCathedral(i, j) {
  const stone = [228,216,192], lead = [92,98,112];
  box(i + 1.2, j + 0.8, 5.4, 2.2, 0, 56, stone);
  gableRoofI(i + 1.1, j + 0.7, 5.6, 2.4, 56, 24, lead, stone);
  for (let k = 0; k < 6; k++) { // arcs-boutants et contreforts
    box(i + 1.4 + k * 0.9, j + 3.0, 0.22, 0.45, 0, 40, stone);
    const a = iso(i + 1.51 + k * 0.9, j + 3.0, 40), b = iso(i + 1.51 + k * 0.9, j + 2.9, 52);
    ctx.strokeStyle = rgb(stone, 0.8); ctx.lineWidth = 2; isoLine(a, b);
  }
  box(i + 1.2, j + 1.6, 0.4, 0.6, 56, 30, stone); // flèche de l'ange au chevet
  for (const tj of [j + 0.4, j + 2.4]) {
    box(i + 6.4, tj, 1.3, 1.2, 0, 108, stone);
    fillPoly(faceQuad('i', i + 7.705, tj + 0.3, tj + 0.9, 64, 96), windowColor([110,110,150], true, 0.7));
    fillPoly(faceQuad('j', tj + 1.205, i + 6.6, i + 7.5, 64, 96), windowColor([110,110,150], true, 0.8));
    for (const [pi, pj] of [[0, 0], [1.2, 0], [0, 1.1], [1.2, 1.1]]) { // pinacles
      const [x, y] = iso(i + 6.45 + pi, tj + 0.05 + pj, 108);
      ctx.fillStyle = rgb(stone, 0.9); ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x, y - 12); ctx.lineTo(x + 2, y); ctx.closePath(); ctx.fill();
    }
  }
  box(i + 6.4, j + 1.6, 1.3, 0.8, 0, 72, stone);
  const [rx, ry] = iso(i + 7.705, j + 2.0, 50);
  ctx.save(); ctx.translate(rx, ry); ctx.transform(1, -0.5, 0, 1, 0, 0);
  ctx.fillStyle = windowColor([190,90,170], true, 1); ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgb([200,188,160]); ctx.lineWidth = 1.3; ctx.stroke();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; line(0, 0, Math.cos(a) * 11, Math.sin(a) * 11); }
  ctx.restore();
  for (const pj of [j + 0.6, j + 1.75, j + 2.7]) fillPoly(faceQuad('i', i + 7.705, pj, pj + 0.35, 0, 22), rgb([80,70,62], 0.85)); // trois portails
}

/** Notre-Dame-en-Vaux (Châlons) : nef et quatre flèches couvertes de plomb vert-de-gris. */
function drawNotreDameEnVaux(i, j) {
  const stone = [232,222,200], lead = [96,140,130];
  box(i + 0.8, j + 1, 2.2, 4, 0, 36, stone);
  gableRoofJ(i + 0.7, j + 0.9, 2.4, 4.2, 36, 14, [120,124,134], stone);
  for (const [ti, tj] of [[i + 0.4, j + 0.5], [i + 2.6, j + 0.5], [i + 0.4, j + 4.6], [i + 2.6, j + 4.6]]) {
    box(ti, tj, 0.8, 0.8, 0, 50, stone);
    const apex = iso(ti + 0.4, tj + 0.4, 84);
    fillPoly([iso(ti + 0.8, tj, 50), iso(ti + 0.8, tj + 0.8, 50), apex], rgb(lead, 0.8));
    fillPoly([iso(ti, tj + 0.8, 50), iso(ti + 0.8, tj + 0.8, 50), apex], rgb(lead, 1));
  }
}

/** Pavillons à arcades de la place Ducale : brique, pierre et hauts toits d'ardoise. */
function drawArcade(i, j, w, d) {
  const brick = [172,82,62], stone = [236,226,206];
  box(i, j, w, d, 0, 34, brick);
  for (let k = 0; k < w * 2; k++) fillPoly(faceQuad('j', j + d + 0.005, i + k * 0.5 + 0.08, i + k * 0.5 + 0.42, 0, 11), rgb([60,44,40]), rgb(stone), 1.5);
  box(i - 0.02, j - 0.02, w + 0.04, d + 0.04, 12, 2, stone);
  windowGrid('j', j + d + 0.005, i + 0.1, i + w - 0.1, 14, 1, 20, w * 2, [150,190,226], i * 7);
  gableRoofI(i - 0.05, j - 0.05, w + 0.1, d + 0.1, 34, 22, [66,76,96], brick);
}

function drawDucalFountain(ci, cj) {
  cylinder(ci, cj, 0.7, 0, 5, CONCRETE);
  const [x, y] = iso(ci, cj, 5); ctx.fillStyle = windowColor(WATER, true, 1); ellipse(x, y, 26, 13);
  cylinder(ci, cj, 0.12, 5, 22, [150,150,160]);
  const [sx, sy] = iso(ci, cj, 27); ctx.fillStyle = rgb([90,100,110]); circle(sx, sy, 4); // statue de Charles de Gonzague
}

/** Le Vieux Moulin de Charleville, posé sur la Meuse. */
function drawOldMill(i, j) {
  box(i, j, 2, 1.6, 0, 26, [172,82,62]);
  windowGrid('j', j + 1.605, i + 0.1, i + 1.9, 0, 2, 13, 3, [150,190,226], 77);
  gableRoofI(i - 0.05, j - 0.05, 2.1, 1.7, 26, 24, [66,76,96], [172,82,62]);
  box(i + 0.8, j + 0.6, 0.4, 0.4, 44, 14, [236,226,206]);
}

function drawVineRow(i, j) {
  for (let k = 0; k < 3; k++) {
    const [x, y] = iso(i + 0.5, j + (k + 0.5) / 3);
    ctx.strokeStyle = rgb([120,90,60]); ctx.lineWidth = 1; line(x, y, x, y - 6);
    ctx.fillStyle = rgb(mix([80,130,56], SNOW, world.snow * 0.6)); ellipse(x, y - 4, 4, 3);
  }
}

/* ----- Campagne autour de la ville ----- */

/** Cultures de chaque région : [type, poids]. Vignoble de Champagne autour de Reims et de Châlons, forêt ardennaise à Charleville. */
const COUNTRY_MIX = {
  reims: [['ble', 3], ['pre', 2], ['labour', 2], ['vigne', 3]],
  chalons: [['ble', 3], ['colza', 2], ['pre', 2], ['labour', 2], ['vigne', 2]],
  charle: [['foret', 5], ['pre', 3], ['labour', 1], ['ble', 1]],
};
const FIELD_COLORS = {
  ble: [226,200,118], colza: [236,214,76], pre: [134,192,90], labour: [176,136,96], vigne: [156,134,92], foret: [72,128,78],
};
const FIELD = 6;

/** Découpe [a, b) en bandes de FIELD cases, coupées aux limites de la ville. */
function bands(a, b) {
  const out = [];
  for (const [s, e] of [[a, LO], [LO, HI], [HI, b]]) for (let x = s; x < e; x += FIELD) out.push([x, Math.min(e, x + FIELD)]);
  return out;
}

/** Parcelles de la campagne (générées une fois par ville) et rivières qui la traversent. */
function generateCountry(site) {
  const rnd = mulberry32({ reims: 777, chalons: 888, charle: 999 }[site]), mixes = COUNTRY_MIX[site];
  const total = mixes.reduce((s, [, w]) => s + w, 0), fields = [];
  for (const [i0, i1] of bands(FAR_LO, FAR_HI)) for (const [j0, j1] of bands(FAR_LO, FAR_HI)) {
    if (i0 >= LO && i1 <= HI && j0 >= LO && j1 <= HI) continue; // la ville
    let r = rnd() * total, kind = mixes[0][0];
    for (const [k, w] of mixes) { if ((r -= w) < 0) { kind = k; break; } }
    fields.push({ minI: i0, maxI: i1, minJ: j0, maxJ: j1, kind, shade: 0.92 + rnd() * 0.12 });
  }
  const rivers = site === 'chalons' ? [[-3, 1]] : site === 'charle' ? [[N + 2, 2]] : [];
  return { fields, rivers };
}
const countries = {};
const countryFor = site => (countries[site] = countries[site] || generateCountry(site));

/** Bande au sol hors de la ville, dans l'axe i (along = 'i') ou j, de la case k sur `width` cases. */
function outerStrip(along, k, width) {
  for (const [a, b] of [[FAR_LO, LO], [HI, FAR_HI]]) {
    if (along === 'i') diamond(a, k, b - a, width); else diamond(k, a, width, b - a);
  }
}

/** Champs, vignes, forêts, routes et rivières de la campagne : tout est au sol, rien ne cache le campus. */
function drawCountryside(site, area) {
  const { rivers } = countryFor(site), snow = world.snow;
  const fields = countryFor(site).fields.filter(f => inArea(f, area));
  for (const f of fields) {
    ctx.beginPath(); diamond(f.minI, f.minJ, f.maxI - f.minI, f.maxJ - f.minJ);
    ctx.fillStyle = rgb(mix(FIELD_COLORS[f.kind], SNOW, f.kind === 'foret' ? snow * 0.5 : snow), f.shade); ctx.fill();
  }
  // haies entre les parcelles
  ctx.beginPath();
  for (const f of fields) diamond(f.minI, f.minJ, f.maxI - f.minI, f.maxJ - f.minJ);
  ctx.strokeStyle = rgb(mix([88,128,70], SNOW, snow * 0.6), 1, 0.55); ctx.lineWidth = 1.6; ctx.stroke();
  // rangs de vigne et sillons
  ctx.beginPath();
  for (const f of fields) {
    if (f.kind !== 'vigne' && f.kind !== 'labour') continue;
    const step = f.kind === 'vigne' ? 0.5 : 1;
    for (let j = f.minJ + step / 2; j < f.maxJ; j += step) isoLine(iso(f.minI + 0.2, j), iso(f.maxI - 0.2, j));
  }
  ctx.strokeStyle = rgb(mix([96,140,64], SNOW, snow * 0.7), 1, 0.8); ctx.lineWidth = 1.4; ctx.stroke();
  // cimes des forêts, vues de haut
  for (const [k, c] of [[0, [52,104,62]], [1, [92,152,90]]]) {
    ctx.beginPath();
    for (const f of fields) {
      if (f.kind !== 'foret') continue;
      for (let n = 0; n < 14; n++) {
        const [x, y] = iso(f.minI + 0.5 + hash(n, f.minI, f.minJ) * (f.maxI - f.minI - 1), f.minJ + 0.5 + hash(f.minJ, n, f.minI) * (f.maxJ - f.minJ - 1));
        ctx.moveTo(x + 13 - k * 3, y - k * 3); ctx.arc(x - k * 3, y - k * 3, 13 - k * 3, 0, Math.PI * 2);
      }
    }
    ctx.fillStyle = rgb(mix(c, SNOW, snow * 0.5)); ctx.fill();
  }
  // rivières, routes de campagne et voie du tramway
  if (rivers.length) { ctx.beginPath(); for (const [k, w] of rivers) outerStrip('j', k, w); ctx.fillStyle = windowColor(WATER, false, 1); ctx.fill(); }
  const style = TOWN_STYLES[site];
  ctx.beginPath(); outerStrip('i', ROAD, 1); outerStrip('j', ROAD, 1); ctx.fillStyle = rgb(style.road); ctx.fill();
  if (site === 'reims') { ctx.beginPath(); outerStrip('i', N + 1, 1); ctx.fillStyle = rgb([150,150,150]); ctx.fill(); }
}

/* ----- Sol de la ville ----- */

/** Tramway de Reims : une rame qui passe en boucle devant le campus. */
const tramPosition = () => (REDUCED_MOTION ? 8 : ((world.t * 1.6) % (HI - LO + 12)) + LO - 6);
function drawTram(u) {
  const j = N + 1.15;
  box(u, j, 4, 0.7, 1, 12, [250,250,252]);
  fillPoly(faceQuad('j', j + 0.705, u + 0.2, u + 3.8, 5, 10), windowColor([120,170,220], true, 1), rgb(DARK), 0.6);
  box(u, j, 4, 0.7, 13, 1.5, [196,40,60]);
}

/** Sol de la couronne de ville (une passe de remplissage par couleur), eau et marquage du boulevard. */
function drawTownGround(site, area) {
  const town = townFor(site);
  for (const [c, tiles] of town.groundByColor) {
    ctx.beginPath();
    for (const t of tiles) if (inArea(t, area)) diamond(t.minI, t.minJ);
    ctx.fillStyle = c === WATER ? windowColor(WATER, false, 1) : rgb(c === GRASS1 || c === GRASS2 ? mix(c, SNOW, world.snow) : c);
    ctx.fill();
  }
  // pointillés au milieu du boulevard
  ctx.strokeStyle = rgb(WHITE, 1, 0.55); ctx.lineWidth = 1.2; ctx.setLineDash([6, 8]); ctx.lineDashOffset = 0;
  isoLine(iso(LO, -0.5), iso(HI, -0.5)); isoLine(iso(-0.5, LO), iso(-0.5, HI)); isoLine(iso(LO, N + 0.5), iso(HI, N + 0.5)); isoLine(iso(N + 0.5, LO), iso(N + 0.5, HI));
  ctx.setLineDash([]);
  if (town.water.length) { // reflets sur l'eau (fixes : le décor est dessiné une fois, voir backdrop-tiles.js)
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    for (let k = 0; k < town.water.length; k += 5) { const [wi, wj] = town.water[k], [x, y] = iso(wi + 0.5, wj + 0.5), p = (k * 0.13) % 1; line(x - 6 + p * 4, y, x + 2 + p * 4, y); }
  }
}

/**
 * Un élément (emprise au sol en cases) peut-il toucher la zone `area` du monde (pixels) ?
 * Marges : les toits et les tours montent jusqu'à 260 px au-dessus de l'emprise, les ombres débordent un peu.
 */
const inArea = (it, a) => (it.minI - it.maxJ) * 32 - 40 < a.x1 && (it.maxI - it.minJ) * 32 + 40 > a.x0
  && (it.minI + it.minJ) * 16 - 260 < a.y1 && (it.maxI + it.maxJ) * 16 + 40 > a.y0;

/**
 * Couches du décor, dessinées dans cet ordre avec la scène du campus :
 * 'under' (campagne, sol, ville de l'arrière) → campus → 'mid' (avant, derrière le tramway) → tramway → 'over' (avant, devant le tramway).
 */
const BACKDROP_LAYERS = ['under', 'mid', 'over'];

/** La zone recouvre-t-elle le campus (dont le sol fixe est aussi mis en cache) ? */
const touchesCampus = a => a.x0 < N * 32 && a.x1 > -N * 32 && a.y0 < N * 32 && a.y1 > 0;

/** La couche contient-elle quelque chose dans la zone ? (le sol remplit toujours 'under') */
const backdropHasContent = (layer, area, site = state.site) => layer === 'under' || townFor(site)[layer].some(it => inArea(it, area));

/** Dessine la partie `area` (monde) d'une couche du décor : c'est le rendu d'une tuile (voir backdrop-tiles.js). */
function drawBackdropArea(layer, area, site = state.site) {
  const town = townFor(site);
  if (layer === 'under') {
    drawCountryside(site, area);
    drawTownGround(site, area);
    if (touchesCampus(area)) drawGroundStatic();
  }
  for (const it of town[layer]) if (inArea(it, area)) it.draw();
}

/** Le tramway de Reims bouge : il est dessiné à chaque image, entre les couches 'mid' et 'over'. */
function drawBackdropTram(site = state.site) {
  if (site === 'reims') drawTram(tramPosition());
}


/* ===== js/render/backdrop-tiles.js ===== */
/**
 * Cache du décor (ville et campagne) en tuiles, comme une carte en ligne.
 *
 * Le décor ne bouge pas (sauf le tramway, dessiné à part) mais coûte cher à dessiner : il est rendu par carrés
 * de TILE pixels écran dans des canvas hors écran, puis simplement recopié à chaque image.
 * - Les tuiles dépendent de la ville, du zoom et de la densité de pixels : un changement de ville ou un zoom
 *   terminé crée un nouveau jeu de tuiles (pendant le geste de zoom, l'ancien est étiré).
 * - L'éclairage (nuit), la neige et la saison forment l'« ambiance » d'une tuile ; le sol fixe du campus en fait aussi partie
 *   (groundVersion : parcelles construites). Quand l'une change, les tuiles sont redessinées petit à petit
 *   (budget de REFRESH_BUDGET ms par image), sans à-coup.
 * - Une tuile visible qui manque est dessinée tout de suite, pour ne jamais laisser de trou.
 */

/** Côté d'une tuile, en pixels réels de l'écran. */
const TILE = 256;
/** Temps de rendu accordé par image aux tuiles à rafraîchir (ms). */
const REFRESH_BUDGET = 4;
/** Délai sans changement de zoom avant de redessiner les tuiles au nouveau zoom (ms). */
const ZOOM_SETTLE = 250;
/** Tuiles gardées autour de l'écran (préchargées quand il reste du temps). */
const PREFETCH = 1;

/** Jeu de tuiles courant : {site, z, dpr, tiles: Map<string, tile>}. */
let tileSet = null;
let lastZoom = 0, lastZoomChange = 0;

/** Ambiance actuelle : une tuile dessinée avec une autre ambiance est à rafraîchir. */
const mood = () => `${Math.round(world.night * 25)}|${Math.round(world.snow * 20)}|${world.season}`;

function newTileSet() {
  tileSet = { site: state.site, z: camera.z, dpr: view.dpr, tiles: new Map() };
}

/** Zone du monde couverte par une tuile (en pixels du monde, avant zoom). */
function tileArea(tx, ty) {
  const k = tileSet.z * tileSet.dpr;
  return { x0: tx * TILE / k, x1: (tx + 1) * TILE / k, y0: ty * TILE / k, y1: (ty + 1) * TILE / k };
}

function newLayerCanvas() {
  const c = document.createElement('canvas');
  c.width = c.height = TILE;
  const g = c.getContext('2d');
  g.lineJoin = 'round';
  return g;
}

/** Dessine (ou redessine) les trois couches d'une tuile. */
function renderTile(tx, ty) {
  const key = tx + ',' + ty, area = tileArea(tx, ty), k = tileSet.z * tileSet.dpr;
  const tile = tileSet.tiles.get(key) || { layers: {} };
  for (const layer of BACKDROP_LAYERS) {
    if (!backdropHasContent(layer, area, tileSet.site)) { delete tile.layers[layer]; continue; }
    const g = tile.layers[layer] || (tile.layers[layer] = newLayerCanvas());
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, TILE, TILE);
    g.setTransform(k, 0, 0, k, -tx * TILE, -ty * TILE);
    drawInto(g, () => drawBackdropArea(layer, area, tileSet.site));
  }
  tile.mood = mood();
  tile.ground = touchesCampus(area) ? groundVersion() : null;
  tileSet.tiles.set(key, tile);
}

/** Tuiles qui couvrent l'écran (plus `pad` autour), dans le repère du jeu de tuiles. */
function tileRange(scale, ox, oy, pad) {
  return {
    tx0: Math.floor(-ox / scale / TILE) - pad, tx1: Math.floor((view.w * view.dpr - ox) / scale / TILE) + pad,
    ty0: Math.floor(-oy / scale / TILE) - pad, ty1: Math.floor((view.h * view.dpr - oy) / scale / TILE) + pad,
  };
}

/** Oublie les tuiles loin de l'écran (mémoire). */
function evict(range) {
  const margin = 4;
  for (const key of tileSet.tiles.keys()) {
    const [tx, ty] = key.split(',').map(Number);
    if (tx < range.tx0 - margin || tx > range.tx1 + margin || ty < range.ty0 - margin || ty > range.ty1 + margin) tileSet.tiles.delete(key);
  }
}

let tileFrame = null;

/**
 * À appeler au début de chaque image : choisit le jeu de tuiles, dessine les tuiles manquantes
 * et rafraîchit celles dont l'ambiance a changé, dans la limite du budget.
 */
function prepareBackdrop() {
  const now = performance.now();
  if (camera.z !== lastZoom) { lastZoom = camera.z; lastZoomChange = now; }
  const stale = !tileSet || tileSet.site !== state.site || tileSet.dpr !== view.dpr;
  const zoomed = tileSet && tileSet.z !== camera.z;
  const ratio = tileSet ? camera.z / tileSet.z : 1;
  if (stale || (zoomed && (now - lastZoomChange > ZOOM_SETTLE || ratio < 0.8 || ratio > 1.6))) newTileSet();

  const scale = camera.z / tileSet.z, [ox, oy] = worldOrigin();
  const visible = tileRange(scale, ox, oy, 0), current = mood(), ground = groundVersion();
  const outdated = tile => tile.mood !== current || (tile.ground !== null && tile.ground !== ground);
  // 1. aucune tuile visible ne doit manquer
  for (let ty = visible.ty0; ty <= visible.ty1; ty++) for (let tx = visible.tx0; tx <= visible.tx1; tx++) {
    if (!tileSet.tiles.has(tx + ',' + ty)) renderTile(tx, ty);
  }
  // 2. puis, dans le budget : tuiles visibles d'une autre ambiance, puis tuiles autour de l'écran
  const around = tileRange(scale, ox, oy, PREFETCH), start = performance.now();
  outer: for (const pass of [visible, around]) {
    for (let ty = pass.ty0; ty <= pass.ty1; ty++) for (let tx = pass.tx0; tx <= pass.tx1; tx++) {
      if (performance.now() - start > REFRESH_BUDGET) break outer;
      const tile = tileSet.tiles.get(tx + ',' + ty);
      if (!tile || outdated(tile)) renderTile(tx, ty);
    }
  }
  evict(around);
  tileFrame = { scale, ox, oy, visible };
}

/** Recopie une couche du décor à l'écran (après prepareBackdrop). */
function drawBackdropLayer(layer) {
  if (!tileFrame) return;
  const { scale, ox, oy, visible } = tileFrame, size = TILE * scale;
  const exact = scale === 1; // au zoom des tuiles : pixel pour pixel, sans raccord visible
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = !exact;
  for (let ty = visible.ty0; ty <= visible.ty1; ty++) for (let tx = visible.tx0; tx <= visible.tx1; tx++) {
    const g = tileSet.tiles.get(tx + ',' + ty)?.layers[layer];
    if (!g) continue;
    if (exact) ctx.drawImage(g.canvas, tx * TILE + ox, ty * TILE + oy);
    else ctx.drawImage(g.canvas, tx * size + ox, ty * size + oy, size + 1, size + 1); // +1 : pas de fente entre tuiles étirées
  }
  ctx.restore();
}

/** Oublie toutes les tuiles : la prochaine image redessine tout le décor visible (coupe de la cinématique). */
function resetBackdropTiles() {
  tileSet = null;
}


/* ===== js/render/renderer.js ===== */
/**
 * Rendu d'une image : décor en tuiles (backdrop-tiles.js), sol, scène triée en profondeur, aperçu de pose, halos, flèches, effets.
 * Fournit aussi le test de clic sur les bâtiments et les flèches.
 */

/**
 * Tri du peintre pour la vue isométrique : un élément est dessiné après tous ceux qu'il recouvre.
 * Chaque élément a une emprise au sol {minI, maxI, minJ, maxJ} ; tri topologique en profondeur.
 */
function isoSort(items) {
  const n = items.length;
  for (const a of items) { a.behind = []; a.visited = false; a.x0 = (a.minI - a.maxJ) * 32 - 14; a.x1 = (a.maxI - a.minJ) * 32 + 14; }
  for (let p = 0; p < n; p++) {
    const a = items[p];
    for (let q = p + 1; q < n; q++) {
      const b = items[q];
      if (a.x1 <= b.x0 || b.x1 <= a.x0) continue; // pas de chevauchement à l'écran
      if (a.maxI <= b.minI || a.maxJ <= b.minJ) b.behind.push(a);
      else if (b.maxI <= a.minI || b.maxJ <= a.minJ) a.behind.push(b);
      else if (a.minI + a.maxI + a.minJ + a.maxJ < b.minI + b.maxI + b.minJ + b.maxJ) b.behind.push(a);
      else a.behind.push(b);
    }
  }
  const sorted = [];
  const visit = a => { if (a.visited) return; a.visited = true; for (const b of a.behind) visit(b); sorted.push(a); };
  for (const a of items) visit(a);
  return sorted;
}

const plotItem = d => ({ minI: d.plot[0], maxI: d.plot[0] + d.plot[2], minJ: d.plot[1], maxJ: d.plot[1] + d.plot[3] });
const BUILDING_ITEMS = Object.fromEntries(SITES.map(s => [s.id, SITE_DEFS[s.id].map(d => ({ ...plotItem(d), draw: () => drawSceneBuilding(d) }))]));

/* ----- Vue en transparence : un bâtiment qui en cache un autre (survolé ou sélectionné) s'efface ----- */

/** Effacement maximal d'un bâtiment qui gêne (0 = opaque, 1 = invisible). */
const GHOST_MAX = 0.72;
/** Part du bâtiment visé qui doit être recouverte pour que celui de devant s'efface. */
const GHOST_OVERLAP = 0.12;
/** Calque hors écran : le bâtiment y est dessiné entier, puis posé en transparence (sans superpositions internes visibles). */
const ghostLayer = document.createElement('canvas');
const ghostCtx = ghostLayer.getContext('2d');

/** Rectangle du monde occupé à l'écran par un bâtiment, toit compris. */
function buildingBox(d) {
  const [i0, j0, w, dd] = d.plot;
  return { x0: (i0 - j0 - dd) * HW, x1: (i0 + w - j0) * HW, y0: (i0 + j0) * HH - d.top, y1: (i0 + w + j0 + dd) * HH };
}

/** `a` est dessiné devant `b` et en recouvre une bonne part (même règle de profondeur que isoSort). */
function hides(a, b) {
  if (!(b.plot[0] + b.plot[2] <= a.plot[0] || b.plot[1] + b.plot[3] <= a.plot[1])) return false;
  const A = buildingBox(a), B = buildingBox(b);
  const w = Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0), h = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0);
  return w > 0 && h > 0 && w * h > GHOST_OVERLAP * (B.x1 - B.x0) * (B.y1 - B.y0);
}

/** À chaque image : les bâtiments construits qui cachent le bâtiment survolé ou sélectionné s'effacent en douceur. */
function updateGhosts(dt) {
  const targets = [highlight.hover, highlight.selected].filter(t => t && t.site === state.site);
  const k = REDUCED_MOTION ? 1 : 1 - Math.pow(0.0004, dt);
  for (const d of currentDefs()) {
    const want = state.b[d.id].lvl > 0 && targets.some(t => t !== d && hides(d, t)) ? 1 : 0;
    d.ghost = (d.ghost || 0) + (want - (d.ghost || 0)) * k;
    if (d.ghost < 0.01) d.ghost = 0;
  }
}

function drawSceneBuilding(d) {
  if (!d.ghost) { drawBuilding(d); return; }
  if (ghostLayer.width !== canvas.width || ghostLayer.height !== canvas.height) { ghostLayer.width = canvas.width; ghostLayer.height = canvas.height; }
  ghostCtx.setTransform(1, 0, 0, 1, 0, 0);
  ghostCtx.clearRect(0, 0, ghostLayer.width, ghostLayer.height);
  ghostCtx.setTransform(ctx.getTransform());
  ghostCtx.lineJoin = 'round';
  drawInto(ghostCtx, () => drawBuilding(d));
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1 - GHOST_MAX * d.ghost;
  ctx.drawImage(ghostLayer, 0, 0);
  ctx.restore();
}
/** Bâtiments du premier plan d'abord, pour le test de clic. */
const HIT_ORDER = Object.fromEntries(SITES.map(s => [s.id, [...SITE_DEFS[s.id]].sort((a, b) =>
  (b.plot[0] + b.plot[2] + b.plot[1] + b.plot[3]) - (a.plot[0] + a.plot[2] + a.plot[1] + a.plot[3]))]));

/** Flèches affichées cette image, pour le test de clic : {id, x, y, r}. */
const arrowBubbles = [];

/** Fond sous le décor (visible seulement si une tuile manque un instant) : la couleur moyenne des champs. */const BACKGROUND = [168,176,104];

/** Pastille avec une flèche vers le haut : verte = amélioration possible, dorée = conseil de Plume. */
function drawArrow(x, y, r, gold) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = gold ? '#ffc233' : '#35c46b'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = r * 0.2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(x, y - r * 0.6); ctx.lineTo(x + r * 0.55, y); ctx.lineTo(x + r * 0.22, y); ctx.lineTo(x + r * 0.22, y + r * 0.55);
  ctx.lineTo(x - r * 0.22, y + r * 0.55); ctx.lineTo(x - r * 0.22, y); ctx.lineTo(x - r * 0.55, y); ctx.closePath(); ctx.fill();
}

function drawUpgradeArrows() {
  arrowBubbles.length = 0;
  if (state.site !== state.city) return; // ville terminée : rien à améliorer
  const k = overlayScale();
  for (const d of currentDefs()) {
    if (!state.b[d.id].lvl) continue;
    let [x, y] = buildingAnchor(d);
    y += REDUCED_MOTION ? 0 : Math.sin(world.t * 2.6 + d.plot[0]) * 1.6 * k;
    const advised = advice.id === d.id && state.money >= advice.cost;
    if (state.money < upgradeCost(d, 1) && !advised) continue;
    const r = (advised ? 11 : 9) * k;
    if (advised && !REDUCED_MOTION) { ctx.fillStyle = 'rgba(255,194,51,.35)'; circle(x, y, r * (1.5 + 0.2 * Math.sin(world.t * 5))); }
    drawArrow(x, y, r, advised);
    arrowBubbles.push({ id: d.id, x, y, r: r + 3 });
  }
}

/** Case survolée pendant la pose d'une décoration : verte si possible, orange sinon, avec aperçu. */
function drawPlacementPreview() {
  if (!placing || !hoverTile) return;
  const [i, j] = hoverTile, ok = placing === 'remove' ? decoAt(i, j) : canPlaceAt(i, j);
  ctx.beginPath(); diamond(i, j);
  ctx.fillStyle = ok ? 'rgba(53,196,107,.35)' : 'rgba(255,106,61,.35)'; ctx.fill();
  ctx.strokeStyle = ok ? '#1f8a47' : '#ff6a3d'; ctx.lineWidth = 2; ctx.stroke();
  if (ok && placing !== 'remove') { ctx.globalAlpha = 0.6; drawDeco(placing, i, j, true); ctx.globalAlpha = 1; }
}

function renderFrame() {
  const { w: W, h: H, dpr } = view;
  prepareBackdrop();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(BACKGROUND); ctx.fillRect(0, 0, W * dpr, H * dpr);
  drawBackdropLayer('under');
  const [ox, oy] = worldOrigin();
  ctx.setTransform(dpr * camera.z, 0, 0, dpr * camera.z, ox, oy);
  ctx.lineJoin = 'round';
  drawGround();
  const items = sceneryItems().concat(BUILDING_ITEMS[state.site], walkerItems(), critterItems());
  for (const item of isoSort(items)) item.draw();
  drawBackdropLayer('mid');
  drawBackdropTram();
  drawBackdropLayer('over');
  drawPlacementPreview();
  drawLampGlows();
  drawFlyingCritters();
  drawUpgradeArrows();
  drawWorldEffects();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawScreenEffects();
}

/** Point dans un polygone (règle pair-impair). */
function insidePolygon(x, y, poly) {
  let inside = false;
  for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
    if ((poly[a][1] > y) !== (poly[b][1] > y) && x < (poly[b][0] - poly[a][0]) * (y - poly[a][1]) / (poly[b][1] - poly[a][1]) + poly[a][0]) inside = !inside;
  }
  return inside;
}

/** Silhouette d'un bâtiment à l'écran (coordonnées du monde), toit compris. */
function outlineOf(d) {
  const [i0, j0, w, dd] = d.plot, h = d.top;
  return [iso(i0, j0, h), iso(i0 + w, j0, h), iso(i0 + w, j0, 0), iso(i0 + w, j0 + dd, 0), iso(i0, j0 + dd, 0), iso(i0, j0 + dd, h)];
}

/** En dessous de cette part visible, un bâtiment est « caché » : sa parcelle au sol devient cliquable à travers ceux de devant. */
const HIDDEN_BELOW = 0.4;

/** Part visible de la silhouette d'un bâtiment, une fois retirés les bâtiments construits dessinés devant lui (échantillonnage). */
function visibleShare(b) {
  const front = currentDefs().filter(a => a !== b && state.b[a.id].lvl > 0
    && (b.plot[0] + b.plot[2] <= a.plot[0] || b.plot[1] + b.plot[3] <= a.plot[1])).map(outlineOf);
  if (!front.length) return 1;
  const own = outlineOf(b), box = buildingBox(b), n = 12;
  let inside = 0, seen = 0;
  for (let u = 0.5; u < n; u++) for (let v = 0.5; v < n; v++) {
    const x = box.x0 + (box.x1 - box.x0) * u / n, y = box.y0 + (box.y1 - box.y0) * v / n;
    if (!insidePolygon(x, y, own)) continue;
    inside++;
    if (!front.some(poly => insidePolygon(x, y, poly))) seen++;
  }
  return inside ? seen / inside : 1;
}

/**
 * Bâtiments sous un point du monde : [celui que vise le clic, l'autre possible ou null].
 * Ordre : flèche d'amélioration, puis ce qui est dessiné devant ; mais si le point du sol visé est la parcelle
 * d'un bâtiment surtout caché par celui de devant, c'est lui qui est visé (celui de devant devient transparent,
 * voir updateGhosts) et celui de devant devient l'autre choix (un second clic au même endroit le sélectionne).
 */
function buildingChoices(wx, wy) {
  for (let k = arrowBubbles.length - 1; k >= 0; k--) {
    const b = arrowBubbles[k];
    if (Math.hypot(wx - b.x, wy - b.y) < b.r + 3) return [BY[b.id], null];
  }
  const front = HIT_ORDER[state.site].find(d => insidePolygon(wx, wy, outlineOf(d))) || null;
  const fi = (wy / HH + wx / HW) / 2, fj = (wy / HH - wx / HW) / 2; // point du sol visé (inverse de iso, z = 0)
  const ground = currentDefs().find(d => { const [i0, j0, w, dd] = d.plot; return fi >= i0 && fi < i0 + w && fj >= j0 && fj < j0 + dd; }) || null;
  if (!ground || !front || ground === front) return [front || ground, null];
  return visibleShare(ground) < HIDDEN_BELOW ? [ground, front] : [front, ground];
}

/** Bâtiment visé sous un point du monde, ou null. */
const buildingAt = (wx, wy) => buildingChoices(wx, wy)[0];


/* ===== js/render/quality.js ===== */
/**
 * Qualité d'affichage : si l'appareil n'arrive pas à suivre, la résolution baisse d'un cran (densité de pixels 2 → 1,5 → 1),
 * puis le rendu passe à 30 images par seconde en dernier recours. Le mode économie (Options) impose directement le plus bas.
 */

const QUALITY_LEVELS = [{ dpr: 2, half: false }, { dpr: 1.5, half: false }, { dpr: 1, half: false }, { dpr: 1, half: true }];
/** Une image « lente » : moins de 40 images par seconde. */
const SLOW_FRAME = 1 / 40;
/** Nombre d'images mesurées avant de décider (la médiane ignore les à-coups isolés). */
const SAMPLE = 90;

let qualityLevel = 0, frameSamples = [], renderedFrames = 0;
const activeQualityLevel = () => (state.eco ? QUALITY_LEVELS.length - 1 : qualityLevel);
const applyQuality = () => setPixelRatioCap(QUALITY_LEVELS[activeQualityLevel()].dpr);

/** À appeler une fois la partie chargée (le mode économie est dans la sauvegarde). */
const initQuality = applyQuality;

/** Mode économie (Options) ; en le quittant, la qualité automatique repart du plus haut. */
function setEcoMode(on) {
  state.eco = on;
  qualityLevel = 0;
  frameSamples = [];
  applyQuality();
}

/**
 * À chaque image : mesure le temps réel écoulé et baisse la qualité si besoin.
 * @returns {boolean} false s'il faut sauter le dessin de cette image (mode 30 images par seconde)
 */
function shouldRender(realDt) {
  renderedFrames++;
  if (!state.eco && realDt > 0 && realDt < 0.25) { // au-delà : onglet en arrière-plan, pas une image lente
    frameSamples.push(realDt);
    if (frameSamples.length >= SAMPLE) {
      frameSamples.sort((a, b) => a - b);
      const median = frameSamples[frameSamples.length >> 1];
      frameSamples = [];
      if (median > SLOW_FRAME && qualityLevel < QUALITY_LEVELS.length - 1) { qualityLevel++; applyQuality(); }
    }
  }
  return !QUALITY_LEVELS[activeQualityLevel()].half || renderedFrames % 2 === 0;
}

/**

const SHEET_IDS = { panel: 'panel', campus: 'campus', ach: 'achSheet', grad: 'gradSheet', shop: 'shopSheet' };

const sheetEl = which => $(SHEET_IDS[which]);
const isSheetOpen = which => !sheetEl(which).hidden;

function openSheet(which) {
  for (const [key, id] of Object.entries(SHEET_IDS)) $(id).hidden = key !== which;
  $('app').classList.toggle('sheet-open', !!which);
  if (which !== 'panel') highlight.selected = null;
}

function closeSheets() { openSheet(null); }

/** Ouvre la fiche `which` avec `build`, ou la ferme si elle est déjà ouverte. */
function toggleSheet(which, build) {
  if (isSheetOpen(which)) { closeSheets(); return false; }

}

/** En-tête commun des fiches Campus, Palmarès et Diplômes. */

/** Sélecteur ×1 / ×10 / Max. */
const buyModeHtml = () => `<div class="seg" role="group" aria-label="Quantité achetée">${[1, 10, 'max'].map(v =>

/** Gère un clic sur le sélecteur ; retourne true si le clic le concernait. */
function handleBuyModeClick(button) {
  if (!button.dataset.buy) return false;
  state.buy = button.dataset.buy === 'max' ? 'max' : +button.dataset.buy;

}

function paintBuyMode(root) {
